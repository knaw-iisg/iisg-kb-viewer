  // ---------- Nightly run history ----------
  // nightly-harvest.sh (triplestore repo, runs on the VPS as a systemd
  // timer at 3am) appends one JSON line per harvest to run-history.jsonl --
  // timing, per-pipeline ok/failed status, the resulting per-graph triple
  // counts, and the authority-interlinking count (see that repo's
  // deploy/record_run_history.py). iisgBrowser.py's /api/run-history reads
  // it across the silk/kbviewer user boundary. Both the "Data science" run
  // list and the "Growth" delta charts read from this one endpoint -- cached
  // here so switching between those two views doesn't re-fetch.
  var runHistoryPromise = null;
  function fetchRunHistory() {
    if (!runHistoryPromise) {
      runHistoryPromise = fetch("/api/run-history").then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      }).catch(function (err) {
        runHistoryPromise = null; // let the next view that needs it retry
        throw err;
      });
    }
    return runHistoryPromise;
  }

  function fmtDuration(seconds) {
    seconds = Math.round(seconds || 0);
    var h = Math.floor(seconds / 3600);
    var m = Math.floor((seconds % 3600) / 60);
    var s = seconds % 60;
    if (h) return h + "h " + m + "m";
    if (m) return m + "m " + s + "s";
    return s + "s";
  }

  function fmtRunDate(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) +
      ", " + d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
  }

  function fmtRunDateShort(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleDateString("en-GB", { day: "numeric", month: "short" });
  }

  function runStatus(run) {
    var pipelines = run.pipelines || [];
    var failed = pipelines.filter(function (p) { return p.status !== "ok"; }).length;
    if (!failed && run.pipelines_exit === 0) return { cls: "ok", text: "OK" };
    if (pipelines.length && failed < pipelines.length) return { cls: "warn", text: failed + " of " + pipelines.length + " failed" };
    return { cls: "crit", text: "failed" };
  }

  // Detail panel content for one run -- always rendered in full (no
  // click-to-expand chevron) since it now lives in its own persistent
  // section next to the calendar, not inline in a list row.
  function runDetailPanelEl(run) {
    var panel = el("div", { class: "run-detail-panel" });
    if (!run) {
      panel.appendChild(el("div", { class: "column-empty", text: "Pick a highlighted day for that run’s detail." }));
      return panel;
    }
    var head = el("div", { class: "run-detail-head" });
    head.appendChild(el("span", { class: "run-date", text: fmtRunDate(run.started_at) }));
    var status = runStatus(run);
    head.appendChild(el("span", { class: "run-badge " + status.cls, text: status.text }));
    panel.appendChild(head);

    var meta = el("div", { class: "run-meta" });
    meta.appendChild(el("span", { text: fmtDuration(run.duration_s) }));
    if (run.graph_counts) {
      var total = Object.keys(run.graph_counts).reduce(function (s, k) { return s + run.graph_counts[k]; }, 0);
      meta.appendChild(el("span", { text: fmtNum(total) + " triples" }));
    }
    panel.appendChild(meta);

    (run.pipelines || []).forEach(function (p) {
      var pr = el("div", { class: "run-pipeline-row" });
      pr.appendChild(el("span", { text: p.name }));
      pr.appendChild(el("span", { class: "status " + (p.status === "ok" ? "ok" : "failed"), text: p.status + " · " + p.duration_s + "s" }));
      panel.appendChild(pr);
    });
    if (typeof run.interlinked_authority_iris === "number") {
      var ir = el("div", { class: "run-pipeline-row" });
      ir.appendChild(el("span", { text: "Authority IRIs interlinked" }));
      ir.appendChild(el("span", { text: fmtNum(run.interlinked_authority_iris) }));
      panel.appendChild(ir);
    }
    return panel;
  }

  function pad2(n) { return n < 10 ? "0" + n : "" + n; }

  // Local-calendar-day key (not UTC) -- a run's started_at is an ISO
  // string with its own offset, so this reflects the viewer's own
  // calendar day, same as any other date display in the app.
  function dateKeyLocal(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return null;
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  }

  var MONTH_NAMES = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  var DOW_LABELS = ["Mo", "Tu", "We", "Th", "Fr", "Sa", "Su"];

  // onPick fires on hover (mouseover) as well as click/focus -- cheap
  // either way, since it only swaps the small detail panel and toggles one
  // CSS class, not a re-render of the grid itself. click/focus stay wired
  // too so a tap (touch) or keyboard tab still works where there's no
  // hover.
  function calendarGridEl(runsByDate, year, month, selectedKey, onPick) {
    var grid = el("div", { class: "cal-grid" });
    DOW_LABELS.forEach(function (d) { grid.appendChild(el("div", { class: "cal-dow", text: d })); });

    var first = new Date(year, month, 1);
    var leading = (first.getDay() + 6) % 7; // Monday-first: JS getDay() is 0=Sun..6=Sat
    var daysInMonth = new Date(year, month + 1, 0).getDate();
    var todayKey = dateKeyLocal(new Date().toISOString());

    for (var i = 0; i < leading; i++) grid.appendChild(el("div", { class: "cal-cell empty" }));

    for (var day = 1; day <= daysInMonth; day++) {
      var key = year + "-" + pad2(month + 1) + "-" + pad2(day);
      var run = runsByDate[key];
      var cls = "cal-cell";
      if (key === todayKey) cls += " today";
      if (key === selectedKey) cls += " selected";
      if (run) {
        // Binary tile color (plain ok/not-ok), even though runStatus's own
        // "warn" (some pipelines failed) vs "crit" (all of them did) stays
        // meaningful in the detail panel's badge text -- a calendar reads
        // better as green/red than a three-way distinction per square.
        cls += " has-run " + (runStatus(run).cls === "ok" ? "ok" : "crit");
        var cell = el("button", { class: cls, text: String(day) });
        var pick = (function (k) { return function (e) { onPick(k, e.currentTarget); }; })(key);
        cell.addEventListener("mouseover", pick);
        cell.addEventListener("focus", pick);
        cell.addEventListener("click", pick);
        grid.appendChild(cell);
      } else {
        grid.appendChild(el("div", { class: cls, text: String(day) }));
      }
    }
    return grid;
  }

  function nightlyRunsCalendarSection() {
    var section = el("div", { class: "dash-section" });
    section.appendChild(el("div", { class: "dash-heading" }, [
      document.createTextNode("Nightly runs"),
      el("span", { text: "green = ok, red = a pipeline failed — hover a day for detail" })
    ]));
    var loading = el("div", { class: "dash-loading", text: "Loading run history…" });
    section.appendChild(loading);
    var body = el("div", { class: "cal-body" });
    section.appendChild(body);

    fetchRunHistory().then(function (runs) {
      section.removeChild(loading);
      if (!runs.length) {
        body.appendChild(el("div", { class: "column-empty", text: "No nightly-run history yet — the next 03:00 harvest will add the first entry here." }));
        return;
      }

      var runsByDate = {};
      runs.forEach(function (r) {
        var k = dateKeyLocal(r.started_at);
        if (k) runsByDate[k] = r; // runs are ascending, so a repeated date keeps the latest
      });

      var latest = runs[runs.length - 1];
      var latestDate = new Date(latest.started_at);
      var viewYear = latestDate.getFullYear(), viewMonth = latestDate.getMonth();
      var selectedKey = dateKeyLocal(latest.started_at);
      var selectedCellEl = null;

      var calWrap = el("div", { class: "cal-wrap" });
      var header = el("div", { class: "cal-header" });
      var prevBtn = el("button", { class: "cal-nav-btn", text: "‹" });
      var monthLabel = el("div", { class: "cal-month-label" });
      var nextBtn = el("button", { class: "cal-nav-btn", text: "›" });
      header.appendChild(prevBtn);
      header.appendChild(monthLabel);
      header.appendChild(nextBtn);
      calWrap.appendChild(header);
      var gridHolder = el("div", {});
      calWrap.appendChild(gridHolder);
      body.appendChild(calWrap);

      var detailHolder = el("div", { class: "run-detail-panel-holder" });
      body.appendChild(detailHolder);

      // Hovering across the grid shouldn't rebuild it on every cell --
      // that's the one thing that would make mouseover noticeably more
      // work than click. This just toggles the "selected" class on two
      // elements and swaps the (small) detail panel; redrawGrid() below,
      // which actually rebuilds the DOM, only runs for month navigation.
      function pick(key, cellEl) {
        if (selectedCellEl && selectedCellEl !== cellEl) selectedCellEl.classList.remove("selected");
        selectedKey = key;
        selectedCellEl = cellEl || null;
        if (selectedCellEl) selectedCellEl.classList.add("selected");
        clear(detailHolder);
        detailHolder.appendChild(runDetailPanelEl(runsByDate[selectedKey] || null));
      }

      function redrawGrid() {
        monthLabel.textContent = MONTH_NAMES[viewMonth] + " " + viewYear;
        clear(gridHolder);
        gridHolder.appendChild(calendarGridEl(runsByDate, viewYear, viewMonth, selectedKey, pick));
        selectedCellEl = gridHolder.querySelector(".cal-cell.selected");
      }

      prevBtn.addEventListener("click", function () {
        viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; }
        redrawGrid();
      });
      nextBtn.addEventListener("click", function () {
        viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; }
        redrawGrid();
      });

      redrawGrid();
      detailHolder.appendChild(runDetailPanelEl(runsByDate[selectedKey] || null));
    }).catch(function (err) {
      section.removeChild(loading);
      body.appendChild(el("div", { class: "column-empty", text: "Couldn’t load run history: " + err.message }));
    });

    return section;
  }

  function renderDataScience() {
    clear(mainEl);
    var wrap = el("div", { class: "home-dash" });
    wrap.appendChild(el("h1", { text: "How the graph is built, run by run." }));
    wrap.appendChild(el("p", { text: "Live triple counts per pipeline, and the history of each nightly harvest that produced them — how long it took, which pipelines succeeded, and how well the result interlinks. See the Delta view for how these counts change night over night." }));
    wrap.appendChild(pipelinesDashSection());
    wrap.appendChild(nightlyRunsCalendarSection());

  // ---------- Growth view: per-graph day-over-day triple deltas ----------
  // Same run-history.jsonl as above, read as a time series instead of a
  // run log: for each graph, how many triples it gained or lost between
  // one nightly snapshot and the next, as a strip of bars (one per run) --
  // and the same for the authority-interlinking count, as a proxy for
  // whether cross-pipeline linking is keeping pace with new data.

  // Each bar is actually two rects: a thin visible one sized to the delta,
  // plus a full-height transparent one behind it that owns the whole
  // column's hover area -- without it a small day-to-day change renders as
  // a 1-2px sliver that's genuinely hard to land a cursor on, which is why
  // hovering "didn't always work" with a single <title>-bearing rect.
  function deltaBarsSvg(deltas, dates) {
    var barW = 6, gap = 2, h = 36, mid = h / 2;
    var w = Math.max(deltas.length * (barW + gap), barW);
    var maxAbs = Math.max.apply(null, deltas.map(function (d) { return Math.abs(d); }).concat([1]));
    var scale = (mid - 2) / maxAbs;
    var bars = deltas.map(function (d, i) {
      var barH = Math.max(Math.abs(d) * scale, d === 0 ? 1 : 2);
      var y = d >= 0 ? mid - barH : mid;
      var color = d > 0 ? "var(--good)" : (d < 0 ? "var(--crit)" : "var(--muted)");
      var x = i * (barW + gap);
      var deltaText = (d >= 0 ? "+" : "") + Number(d).toLocaleString("en-US");
      var dateText = fmtRunDateShort(dates[i + 1]);
      return '<rect x="' + x + '" y="' + y.toFixed(1) + '" width="' + barW + '" height="' + barH.toFixed(1) + '" rx="1" style="fill:' + color + '"/>' +
        '<rect x="' + x + '" y="0" width="' + barW + '" height="' + h + '" fill="transparent" data-delta="' + deltaText + '" data-date="' + dateText + '"/>';
    }).join("");
    return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" height="' + h + '">' +
      '<line x1="0" y1="' + mid + '" x2="' + w + '" y2="' + mid + '" style="stroke:var(--line);stroke-width:1"/>' + bars + '</svg>';
  }

  // A count on its own doesn't say much about a graph's shape -- e.g.
  // whether it's a few entities with lots of properties each, or many
  // entities with sparse ones. breakdown (if given) is that graph's latest
  // subject/predicate/object counts, shown as a hover tooltip on the total
  // figure: each as a share of the S+P+O sum (so the three percentages
  // always add to 100%, reading as "how is this graph's data split between
  // subjects/predicates/objects" rather than against an unrelated total).
  function fmtPct(pct) {
    if (pct === null || pct === undefined || !isFinite(pct)) return null;
    var abs = Math.abs(pct);
    var decimals = abs > 0 && abs < 1 ? 2 : (abs < 10 ? 1 : 0);
    return pct.toFixed(decimals) + "%";
  }

  function breakdownTooltipText(b) {
    if (!b) return null;
    var parts = [["Subjects", b.subjects], ["Predicates", b.predicates], ["Objects", b.objects]]
      .filter(function (pair) { return typeof pair[1] === "number"; });
    var denom = parts.reduce(function (s, pair) { return s + pair[1]; }, 0);
    if (!denom) return null;
    return parts.map(function (pair) {
      var pct = fmtPct(pair[1] / denom * 100);
      return pair[0] + ": " + fmtNum(pair[1]) + (pct ? " (" + pct + ")" : "");
    }).join("\n");
  }

  function growthRowEl(info, counts, dates, breakdown) {
    var deltas = [];
    for (var i = 1; i < counts.length; i++) deltas.push(counts[i] - counts[i - 1]);
    var netChange = counts[counts.length - 1] - counts[0];

    var row = el("div", { class: "growth-row" });

    var label = el("div", { class: "growth-label" });
    var dot = document.createElement("span"); dot.className = "dot"; dot.style.background = info.color;
    label.appendChild(dot);
    var labelText = el("span", { class: "growth-label-text", text: info.label });
    if (info.sub) labelText.setAttribute("data-explain", info.sub);
    label.appendChild(labelText);
    row.appendChild(label);

    var totalEl = el("div", { class: "growth-total", text: fmtNum(counts[counts.length - 1]) });
    var tipText = breakdownTooltipText(breakdown);
    if (tipText) totalEl.setAttribute("data-breakdown", tipText);
    row.appendChild(totalEl);

    row.appendChild(el("div", {
      class: "growth-net " + (netChange >= 0 ? "pos" : "neg"),
      text: (netChange >= 0 ? "+" : "") + fmtNum(netChange)
    }));

    var bars = el("div", { class: "growth-bars" });
    bars.innerHTML = deltaBarsSvg(deltas, dates);
    row.appendChild(bars);
    return row;
  }

  // Most recent run that actually has a triple count for this graph --
  // normally just the latest run, but falls back if that one happened to
  // fail before producing a snapshot for this particular graph.
  function latestBreakdown(runs, iri) {
    for (var i = runs.length - 1; i >= 0; i--) {
      var r = runs[i];
      if (r.graph_counts && typeof r.graph_counts[iri] === "number") {
        return {
          subjects: r.graph_subject_counts ? r.graph_subject_counts[iri] : undefined,
          predicates: r.graph_predicate_counts ? r.graph_predicate_counts[iri] : undefined,
          objects: r.graph_object_counts ? r.graph_object_counts[iri] : undefined
        };
      }
    }
    return null;
  }

  // Same, summed across every graph, for the "all graphs combined" row.
  // Unlike the triple-count combined row (safe to sum -- triples are
  // genuinely partitioned per named graph), summing distinct subject/
  // predicate/object IRIs across graphs can double-count ones shared
  // between pipelines (e.g. archive-etl and findingaid-etl's shared
  // collection: IRIs) -- fine here since this only feeds a rough
  // composition percentage, not a count presented as authoritative.
  function combinedLatestBreakdown(runs, graphIris) {
    var latest = runs[runs.length - 1];
    if (!latest) return null;
    function sumField(field) {
      if (!latest[field]) return undefined;
      var total = 0, any = false;
      graphIris.forEach(function (iri) {
        if (typeof latest[field][iri] === "number") { total += latest[field][iri]; any = true; }
      });
      return any ? total : undefined;
    }
    return {
      subjects: sumField("graph_subject_counts"),
      predicates: sumField("graph_predicate_counts"),
      objects: sumField("graph_object_counts")
    };
  }

  function growthTableHeadEl(sinceDate, noun) {
    var head = el("div", { class: "growth-table-head" });
    head.appendChild(el("div", { text: "Graph" }));
    head.appendChild(el("div", { text: "Current " + noun }));
    head.appendChild(el("div", { text: "Change since " + fmtRunDateShort(sinceDate) }));
    head.appendChild(el("div", { text: "Daily change" }));
    return head;
  }

  // Raw triple count is a shallow growth signal -- a pipeline re-asserting
  // the same records more verbosely looks identical to real growth. These
  // three are alternate lenses over the same per-run snapshot: distinct
  // subjects is the actual entity/record count (new books, new people, not
  // just more facts about existing ones), distinct predicates is how varied
  // the schema usage is (should stay flat day-to-day; a jump means a
  // pipeline started asserting a genuinely new field). Only the triple
  // count is safe to sum into an "all graphs combined" row -- subject/
  // predicate IRIs can be shared across graphs (e.g. archive-etl and
  // findingaid-etl's shared collection: IRIs), so summing distinct counts
  // across graphs would double-count them.
  var GROWTH_METRICS = [
    { key: "graph_counts", label: "Triples", noun: "triples", combined: true },
    { key: "graph_subject_counts", label: "Subjects (entities)", noun: "subjects", combined: false },
    { key: "graph_predicate_counts", label: "Predicates (properties)", noun: "predicates", combined: false }
  ];

  // One tooltip div shared by every bar and every total figure in the
  // view, positioned on mouse move and driven by delegated events on the
  // table so it works for elements added after the initial render too.
  // Two independent sources feed it: a bar's data-delta/data-date (one
  // day's change), or a total's data-breakdown (that graph's S/P/O
  // composition) -- whichever the hovered element carries.
  function growthTooltipText(t) {
    if (!t || !t.getAttribute) return null;
    if (t.hasAttribute("data-delta")) return t.getAttribute("data-delta") + " · " + t.getAttribute("data-date");
    if (t.hasAttribute("data-breakdown")) return t.getAttribute("data-breakdown");
    if (t.hasAttribute("data-explain")) return t.getAttribute("data-explain");
    return null;
  }

  function attachGrowthTooltip(table) {
    var tooltip = el("div", { class: "chart-tooltip" });
    table.parentNode.insertBefore(tooltip, table.nextSibling);
    table.addEventListener("mouseover", function (e) {
      var text = growthTooltipText(e.target);
      if (!text) return;
      tooltip.textContent = text;
      tooltip.classList.add("visible");
    });
    table.addEventListener("mousemove", function (e) {
      if (!tooltip.classList.contains("visible")) return;
      tooltip.style.left = e.clientX + "px";
      tooltip.style.top = (e.clientY - 10) + "px";
    });
    table.addEventListener("mouseout", function (e) {
      if (growthTooltipText(e.target)) tooltip.classList.remove("visible");
    });
  }

  function renderGrowthTable(container, runs, metric) {
    clear(container);
    var withCounts = runs.filter(function (r) { return r[metric.key] && Object.keys(r[metric.key]).length; });
    if (withCounts.length < 2) {
      container.appendChild(el("div", { class: "column-empty", text: "Need at least two nightly runs with recorded " + metric.noun + " counts to show day-over-day change — check back after tomorrow’s 03:00 harvest." }));
      return;
    }

    var table = el("div", { class: "growth-table" });
    var dates = withCounts.map(function (r) { return r.started_at; });
    table.appendChild(growthTableHeadEl(dates[0], metric.noun));

    var graphIris = {};
    withCounts.forEach(function (r) { Object.keys(r[metric.key]).forEach(function (g) { graphIris[g] = true; }); });

    if (metric.combined) {
      var totals = withCounts.map(function (r) {
        return Object.keys(r[metric.key]).reduce(function (s, g) { return s + r[metric.key][g]; }, 0);
      });
      var combinedBreakdown = combinedLatestBreakdown(runs, Object.keys(graphIris));
      table.appendChild(growthRowEl({
        label: "All graphs combined", color: "#294a60",
        sub: "Every pipeline’s named graph, summed together."
      }, totals, dates, combinedBreakdown));
    }

    Object.keys(graphIris).map(graphInfo).sort(function (a, b) {
      return a.label.localeCompare(b.label);
    }).forEach(function (info) {
      var counts = withCounts.map(function (r) { return r[metric.key][info.iri] || 0; });
      table.appendChild(growthRowEl(info, counts, dates, latestBreakdown(runs, info.iri)));
    });

    var withInterlink = runs.filter(function (r) { return typeof r.interlinked_authority_iris === "number"; });
    if (withInterlink.length >= 2) {
      var ilDates = withInterlink.map(function (r) { return r.started_at; });
      var ilCounts = withInterlink.map(function (r) { return r.interlinked_authority_iris; });
      table.appendChild(growthRowEl({
        label: "Authority IRIs interlinked with other graphs", color: "#7c5ba0",
        sub: "Authority-graph IRIs (people, places, terms) that also have data asserted in at least one other pipeline’s graph — the connective tissue between pipelines."
      }, ilCounts, ilDates));
    }

    container.appendChild(table);
    attachGrowthTooltip(table);
  }

  function renderGrowth() {
    clear(mainEl);
    var wrap = el("div", { class: "home-dash" });
    wrap.appendChild(el("h1", { text: "Graph Delta" }));
    wrap.appendChild(el("p", { text: "Day-over-day change per graph, from nightly run history. Green = growth, red = shrinkage. Hover a bar, total, or name for detail; switch metrics below." }));

    var switcher = el("div", { class: "metric-switcher" });
    wrap.appendChild(switcher);
    var tableHolder = el("div", {});
    var loading = el("div", { class: "dash-loading", text: "Loading growth history…" });
    tableHolder.appendChild(loading);
    wrap.appendChild(tableHolder);
    mainEl.appendChild(wrap);

    fetchRunHistory().then(function (runs) {
      clear(tableHolder);
      var activeMetric = GROWTH_METRICS[0];
      GROWTH_METRICS.forEach(function (metric) {
        var chip = el("button", { class: "metric-chip" + (metric === activeMetric ? " active" : ""), text: metric.label });
        chip.addEventListener("click", function () {
          if (metric === activeMetric) return;
          activeMetric = metric;
          Array.prototype.forEach.call(switcher.children, function (c) { c.classList.remove("active"); });
          chip.classList.add("active");
          renderGrowthTable(tableHolder, runs, metric);
        });
        switcher.appendChild(chip);
      });
      renderGrowthTable(tableHolder, runs, activeMetric);
    }).catch(function (err) {
      clear(tableHolder);
      tableHolder.appendChild(el("div", { class: "column-empty", text: "Couldn’t load growth history: " + err.message }));
    });
  }

  // ---------- Rendering: home dashboard ----------

  function renderHome() {
    clear(mainEl);
    var wrap = el("div", { class: "home-dash" });
    wrap.appendChild(el("h1", { text: "Trace a record through the graph." }));
    wrap.appendChild(el("p", { text: "Eight pipelines feed this graph \u2014 biblio-etl, archive-etl, findingaid-etl, authorities-etl, dataverse-etl, orcid-etl, events-etl and identity-etl \u2014 each asserting into its own named graph, but sharing IRIs (or, where they can't, linked by identity-etl's sdo:sameAs crosswalk) wherever their records describe the same person, place, archive or topic. Search for something, or browse by type below." }));

    var ex = el("div", { class: "empty-examples" });
    ["dockworkers", "Rotterdam", "International Institute of Social History", "Jan Lucassen"].forEach(function (term) {
      var b = el("button", { class: "chip-btn", text: term });
      b.addEventListener("click", function () { searchInput.value = term; runSearch(term); });
      ex.appendChild(b);
    });
    wrap.appendChild(ex);

    var typeSection = el("div", { class: "dash-section" });
    typeSection.appendChild(el("div", { class: "dash-heading", text: "Browse by kind of item" }));
    var typeGrid = el("div", { class: "stat-grid" });
    typeSection.appendChild(el("div", { class: "dash-loading", text: "Loading type counts\u2026" }));
    typeSection.appendChild(typeGrid);
    wrap.appendChild(typeSection);
    wrap.appendChild(pipelinesDashSection());

    mainEl.appendChild(wrap);

    sparql(
      "SELECT ?g ?type (COUNT(*) AS ?c) WHERE {\n" +
      "  GRAPH ?g { ?s a ?type }\n" +
      "  FILTER(?g != " + iriRef(IDENTITY_GRAPH) + ")\n" +
      "} GROUP BY ?g ?type"
    ).then(function (rows) {
      typeSection.removeChild(typeSection.querySelector(".dash-loading"));
      var byType = {};
      rows.forEach(function (r) {
        var key = curie(r.type.value) || shortLabel(r.type.value);
        if (!byType[key]) byType[key] = { key: key, uri: r.type.value, total: 0, graphs: {} };
        byType[key].total += parseInt(r.c.value, 10);
        byType[key].graphs[r.g.value] = (byType[key].graphs[r.g.value] || 0) + parseInt(r.c.value, 10);
      });
      var list = Object.keys(byType).map(function (k) { return byType[k]; });
      list.sort(function (a, b) { return b.total - a.total; });
      list.slice(0, 16).forEach(function (t) {
        var mainGraph = Object.keys(t.graphs).sort(function (a, b) { return t.graphs[b] - t.graphs[a]; })[0];
        var info = graphInfo(mainGraph);
        var tile = el("button", { class: "stat-tile" });
        tile.appendChild(el("span", { class: "n", text: fmtNum(t.total) }));
        var lbl = el("span", { class: "lbl" });
        lbl.appendChild(iconSpan(t.key));
        lbl.appendChild(document.createTextNode(pluralType(t.key)));
        tile.appendChild(lbl);
        var sub = el("span", { class: "sub" });
        var dot = document.createElement("span"); dot.className = "dot"; dot.style.background = info.color;
        sub.appendChild(dot);
        sub.appendChild(document.createTextNode(Object.keys(t.graphs).length > 1 ? Object.keys(t.graphs).length + " graphs" : info.label));
        tile.appendChild(sub);
        tile.addEventListener("click", function () { browseType(t.uri, t.key); });
        typeGrid.appendChild(tile);
      });
    }).catch(function (err) {
      typeSection.removeChild(typeSection.querySelector(".dash-loading"));
      typeSection.appendChild(el("div", { class: "column-empty", text: "Couldn\u2019t load type counts: " + err.message }));
    });
  }

  function pluralType(curieStr) {
    var name = curieStr.split(":").pop().replace(/([a-z])([A-Z])/g, "$1 $2");
    var lower = name.toLowerCase();
    if (/s$/.test(lower)) return name;
    return name + "s";
  }

  function renderEmptyState() { renderHome(); }

  function renderError(message, retry) {
    var banner = el("div", { class: "error-banner" });
    banner.appendChild(el("span", { text: message }));
    if (retry) {
      var btn = el("button", { text: "Retry" });
      btn.addEventListener("click", retry);
      banner.appendChild(btn);
    }
    mainEl.insertBefore(banner, mainEl.firstChild);
  }

  // ---------- Browse by graph / by type ----------

  function browseGraph(info) {
    currentUri = null;
    renderTrail();
    clear(mainEl);
    mainEl.appendChild(el("div", { class: "results-heading", text: "Loading \u201c" + info.label + "\u201d\u2026" }));
    var q = "PREFIX sdo: <http://schema.org/>\n" +
      "SELECT ?s (SAMPLE(?lbl) AS ?label) (SAMPLE(?t) AS ?type) WHERE {\n" +
      "  GRAPH " + iriRef(info.iri) + " { ?s a ?t }\n" +
      "  OPTIONAL { GRAPH " + iriRef(info.iri) + " { ?s sdo:name ?n1 } }\n" +
      "  OPTIONAL { GRAPH " + iriRef(info.iri) + " { ?s <https://schema.org/name> ?n2 } }\n" +
      "  OPTIONAL { GRAPH " + iriRef(info.iri) + " { ?s <http://www.w3.org/2000/01/rdf-schema#label> ?n3 } }\n" +
      "  OPTIONAL { GRAPH " + iriRef(info.iri) + " { ?s sdo:roleName ?n4 } }\n" +
      "  OPTIONAL { GRAPH " + iriRef(info.iri) + " { ?s <https://schema.org/roleName> ?n5 } }\n" +
      "  BIND(COALESCE(?n1, ?n2, ?n3, ?n4, ?n5) AS ?lbl)\n" +
      "} GROUP BY ?s ORDER BY ?s";
    sparql(q).then(function (rows) {
      var items = rows.map(function (r) {
        var tc = r.type ? (curie(r.type.value) || shortLabel(r.type.value)) : null;
        return { uri: r.s.value, label: r.label ? r.label.value : shortLabel(r.s.value), typeCurie: tc, extraPills: [] };
      });
      renderResultList("Browsing " + info.label, items);
    }).catch(function (err) {
      clear(mainEl);
      renderError("Couldn\u2019t load list: " + err.message, function () { browseGraph(info); });
    });
  }

  // A type can have hundreds of thousands of instances (Books: ~786K) --
  // fetching them all up front (as this used to) meant a single query
  // joining in labels for every one of them before anything could render,
  // ~7s for Books. Count first (cheap: no label joins), then page the
  // actual rows with LIMIT/OFFSET, same lazy-load shape as loadGroupPage.
  function browseType(typeUri, typeKey) {
    currentUri = null;
    renderTrail();
    clear(mainEl);
    var label = pluralType(typeKey);
    mainEl.appendChild(el("div", { class: "results-heading", text: "Loading " + label.toLowerCase() + "\u2026" }));
    var countQ = "SELECT (COUNT(DISTINCT ?s) AS ?c) WHERE { GRAPH ?g { ?s a " + iriRef(typeUri) + " } FILTER(?g != " + iriRef(IDENTITY_GRAPH) + ") }";
    sparql(countQ).then(function (rows) {
      var total = rows.length ? parseInt(rows[0].c.value, 10) : 0;
      renderPagedTypeList(label, typeUri, typeKey, total);
    }).catch(function (err) {
      clear(mainEl);
      renderError("Couldn\u2019t load list: " + err.message, function () { browseType(typeUri, typeKey); });
    });
  }

  function fetchTypePage(typeUri, typeKey, offset) {
    var q = "SELECT ?s (SAMPLE(?lbl) AS ?label) (SAMPLE(?g) AS ?graph) WHERE {\n" +
      "  GRAPH ?g { ?s a " + iriRef(typeUri) + " }\n" +
      "  FILTER(?g != " + iriRef(IDENTITY_GRAPH) + ")\n" +
      "  OPTIONAL { ?s <http://schema.org/name> ?n1 }\n" +
      "  OPTIONAL { ?s <https://schema.org/name> ?n2 }\n" +
      "  OPTIONAL { ?s <http://www.w3.org/2000/01/rdf-schema#label> ?n3 }\n" +
      "  OPTIONAL { ?s <http://schema.org/roleName> ?n4 }\n" +
      "  OPTIONAL { ?s <https://schema.org/roleName> ?n5 }\n" +
      "  BIND(COALESCE(?n1, ?n2, ?n3, ?n4, ?n5) AS ?lbl)\n" +
      "} GROUP BY ?s ORDER BY ?s LIMIT " + PAGE_SIZE + " OFFSET " + offset;
    return sparql(q).then(function (rows) {
      return rows.map(function (r) {
        var g = r.graph ? graphInfo(r.graph.value).label : null;
        return { uri: r.s.value, label: r.label ? r.label.value : shortLabel(r.s.value), typeCurie: typeKey, extraPills: g ? [g] : [] };
      });
    });
  }

  function renderPagedTypeList(heading, typeUri, typeKey, total) {
    clear(mainEl);
    if (!total) {
      mainEl.appendChild(el("div", { class: "results-heading", text: heading + " \u2014 no results" }));
      return;
    }
    mainEl.appendChild(el("div", { class: "results-heading", text: heading + " \u2014 " + fmtNum(total) + " total" }));
    var wrap = el("div", { class: "cards-wrap" });
    mainEl.appendChild(wrap);
    var loaded = 0;

    function loadPage() {
      fetchTypePage(typeUri, typeKey, loaded).then(function (items) {
        var oldPager = wrap.querySelector(".pager-row");
        if (oldPager) wrap.removeChild(oldPager);
        var cardByUri = {};
        items.forEach(function (it) {
          var card = resultCardEl(it);
          wrap.appendChild(card);
          if (HIERARCHICAL_TYPES[it.typeCurie]) cardByUri[it.uri] = card;
        });
        var hierarchyUris = Object.keys(cardByUri);
        if (hierarchyUris.length) {
          fetchAncestorChains(hierarchyUris).then(function (chains) {
            hierarchyUris.forEach(function (u) {
              if (!chains[u] || !chains[u].length) return;
              var card = cardByUri[u];
              if (!card || !card.isConnected) return;
              var lbl = card.querySelector(".result-label");
              lbl.insertAdjacentElement("afterend", el("div", { class: "result-breadcrumb", text: textBreadcrumb(chains[u]) }));
            });
          });
        }
        loaded += items.length;
        if (loaded < total && items.length) {
          var pager = el("div", { class: "pager-row" });
          var btn = el("button", { class: "pager-btn", text: "Show " + Math.min(PAGE_SIZE, total - loaded) + " more" });
          btn.addEventListener("click", function () { btn.disabled = true; btn.textContent = "Loading\u2026"; loadPage(); });
          pager.appendChild(btn);
          wrap.appendChild(pager);
        }
      }).catch(function (err) {
        var pager = el("div", { class: "pager-row" });
        pager.appendChild(el("div", { class: "group-loading", text: "Couldn\u2019t load more: " + err.message }));
        wrap.appendChild(pager);
      });
    }
    loadPage();
  }

  // ---------- Shared result rendering: cluster by type when the list is mixed ----------

  function renderResultList(heading, items) {
    clear(mainEl);
    if (!items.length) {
      mainEl.appendChild(el("div", { class: "results-heading", text: heading + " \u2014 no results" }));
      return;
    }

    var groups = {}, order = [];
    items.forEach(function (it) {
      var key = it.typeCurie || "other";
      if (!groups[key]) { groups[key] = []; order.push(key); }
      groups[key].push(it);
    });

    if (order.length <= 1) {
      mainEl.appendChild(el("div", { class: "results-heading", text: heading + " \u2014 " + fmtNum(items.length) + " total" }));
      var wrap = el("div", { class: "cards-wrap" });
      mainEl.appendChild(wrap);
      renderCardGroup(wrap, items, 0);
      return;
    }

    order.sort(function (a, b) { return groups[b].length - groups[a].length; });
    if (order.indexOf("other") !== -1) { order = order.filter(function (k) { return k !== "other"; }); order.push("other"); }
    renderResultTiles(heading, items, groups, order);
  }

  // Mixed-type result set: show one compact tile per type (like the home
  // dashboard), and only expand to an actual card list once a tile is
  // picked -- a long list of everything, split into headed clusters, still
  // reads as one long list when most matches are one type buried under a
  // dozen others.
  function renderResultTiles(heading, items, groups, order) {
    clear(mainEl);
    mainEl.appendChild(el("div", { class: "results-heading", text: heading + " \u2014 " + fmtNum(items.length) + " total, " + order.length + " kinds" }));
    var grid = el("div", { class: "stat-grid" });
    order.forEach(function (key) {
      var tile = el("button", { class: "stat-tile" });
      tile.appendChild(el("span", { class: "n", text: fmtNum(groups[key].length) }));
      var lbl = el("span", { class: "lbl" });
      lbl.appendChild(iconSpan(key === "other" ? null : key));
      lbl.appendChild(document.createTextNode(key === "other" ? "Other" : pluralType(key)));
      tile.appendChild(lbl);
      tile.addEventListener("click", function () {
        // Nothing to choose between when there's exactly one -- go straight
        // to it instead of a list-of-one detour.
        if (groups[key].length === 1) { navigate(groups[key][0].uri, { label: groups[key][0].label }); return; }
        renderResultTypeDetail(heading, items, groups, order, key);
      });
      grid.appendChild(tile);
    });
    mainEl.appendChild(grid);
  }

  function renderResultTypeDetail(heading, items, groups, order, key) {
    clear(mainEl);
    var top = el("div", { class: "results-heading" });
    var left = el("span", { style: "display:flex; align-items:center; gap:10px;" });
    var back = el("button", { class: "pager-btn", text: "\u2190 All kinds" });
    back.addEventListener("click", function () { renderResultTiles(heading, items, groups, order); });
    left.appendChild(back);
    var titleWrap = el("span", { style: "display:flex; align-items:center; gap:6px;" });
    titleWrap.appendChild(iconSpan(key === "other" ? null : key));
    titleWrap.appendChild(document.createTextNode((key === "other" ? "Other" : pluralType(key)) + " \u2014 " + fmtNum(groups[key].length)));
    left.appendChild(titleWrap);
    top.appendChild(left);
    mainEl.appendChild(top);
    var wrap = el("div", { class: "cards-wrap" });
    mainEl.appendChild(wrap);
    renderCardGroup(wrap, groups[key], 0);
  }

  // ---------- Hierarchy breadcrumbs ----------
  // findingaid-etl's nested archive components and Dataverse's datasets-in-
  // a-catalog are both real sdo:isPartOf chains, just of different depths.
  // Walk them generically rather than special-casing either shape: resolve
  // one "hop" for every still-active chain at once (a breadth-first sweep,
  // not one query per item), so a whole page of results costs at most a
  // handful of round trips no matter how many cards need a breadcrumb.

  // sdo:Dataset deliberately isn't here: a Dataverse dataset can belong to
  // several catalogs at once via sdo:includedInDataCatalog (a many-to-many
  // membership, not a single-parent chain) -- confirmed on real data, one
  // dataset filed under 3 catalogs simultaneously. A breadcrumb would have
  // to arbitrarily pick one; the existing "In catalog" field already lists
  // all of them correctly.
  var HIERARCHICAL_TYPES = { "sdo:ArchiveComponent": true, "rico:RecordSet": true };

  function fetchAncestorChains(uris) {
    var chains = {};
    var frontier = {};
    uris.forEach(function (u) { chains[u] = []; frontier[u] = u; });

    function step(hopsLeft) {
      var tips = Object.keys(frontier).map(function (k) { return frontier[k]; });
      var uniqueTips = tips.filter(function (v, i) { return tips.indexOf(v) === i; });
      if (!uniqueTips.length || hopsLeft <= 0) return Promise.resolve(chains);

      var values = uniqueTips.map(iriRef).join(" ");
      var q = "SELECT ?child ?parent (SAMPLE(?lbl) AS ?label) WHERE {\n" +
        "  VALUES ?child { " + values + " }\n" +
        "  { ?child <http://schema.org/isPartOf> ?parent } UNION { ?child <https://schema.org/isPartOf> ?parent }\n" +
        "  OPTIONAL { ?parent <http://schema.org/name> ?n1 }\n" +
        "  OPTIONAL { ?parent <https://schema.org/name> ?n2 }\n" +
        "  OPTIONAL { ?parent <http://www.w3.org/2000/01/rdf-schema#label> ?n3 }\n" +
        "  BIND(COALESCE(?n1, ?n2, ?n3) AS ?lbl)\n" +
        "} GROUP BY ?child ?parent";

      return sparql(q).then(function (rows) {
        var byChild = {};
        rows.forEach(function (r) { if (!byChild[r.child.value]) byChild[r.child.value] = { parent: r.parent.value, label: r.label ? r.label.value : null }; });
        var advanced = false;
        Object.keys(frontier).forEach(function (orig) {
          var tip = frontier[orig];
          var info = byChild[tip];
          if (!info) { delete frontier[orig]; return; }
          // Stop at a pipeline's own NDE dataset-registration node
          // (dataset:biblio etc.) -- that's plumbing, not a conceptual
          // ancestor a reader would recognize.
          if ((curie(info.parent) || "").indexOf("dataset:") === 0) { delete frontier[orig]; return; }
          chains[orig].unshift({ uri: info.parent, label: info.label || shortLabel(info.parent) });
          frontier[orig] = info.parent;
          advanced = true;
        });
        return advanced ? step(hopsLeft - 1) : chains;
      }).catch(function () { return chains; });
    }

    return step(15);
  }

  // Siblings (other children of the immediate parent) and this node's own
  // children, in one round trip -- the "where am I in this box, and what's
  // inside it" neighborhood a flat breadcrumb doesn't show. parentUri comes
  // from the ancestor chain already fetched for the breadcrumb above; when
  // null (a top-level node), only the "child" branch runs.
  // Shared by fetchHierarchyNeighborhood and fetchWorksByInversePredicate --
  // both want each row's iisgv:form label (for formIconKey, above) and
  // nothing else needs it, so this is the one place the lookup is written.
  function formLookupFragment(subjectVar) {
    return "  OPTIONAL {\n" +
      "    " + subjectVar + " <https://iisg.amsterdam/vocab/form> ?formNode .\n" +
      "    OPTIONAL { ?formNode <http://schema.org/name> ?fn1 }\n" +
      "    OPTIONAL { ?formNode <https://schema.org/name> ?fn2 }\n" +
      "    BIND(COALESCE(?fn1, ?fn2) AS ?formNameLit)\n" +
      "  }\n";
  }

  function fetchHierarchyNeighborhood(uri, parentUri) {
    var selfBlock = "{ BIND(\"child\" AS ?scope)\n" +
      "  { ?node <http://schema.org/isPartOf> " + iriRef(uri) + " } UNION { ?node <https://schema.org/isPartOf> " + iriRef(uri) + " }\n" +
      "}";
    var blocks = [selfBlock];
    if (parentUri) {
      blocks.push("{ BIND(\"sibling\" AS ?scope)\n" +
        "  { ?node <http://schema.org/isPartOf> " + iriRef(parentUri) + " } UNION { ?node <https://schema.org/isPartOf> " + iriRef(parentUri) + " }\n" +
        "}");
    }
    var q = "SELECT ?scope ?node (SAMPLE(?lbl) AS ?label) (SAMPLE(?type) AS ?typeUri) (GROUP_CONCAT(?formNameLit; separator=\"|\") AS ?formName) WHERE {\n" +
      "  " + blocks.join(" UNION ") + "\n" +
      "  OPTIONAL { ?node <http://schema.org/name> ?n1 }\n" +
      "  OPTIONAL { ?node <https://schema.org/name> ?n2 }\n" +
      "  OPTIONAL { ?node <http://www.w3.org/2000/01/rdf-schema#label> ?n3 }\n" +
      "  BIND(COALESCE(?n1, ?n2, ?n3) AS ?lbl)\n" +
      "  OPTIONAL { ?node a ?type }\n" +
      formLookupFragment("?node") +
      "} GROUP BY ?scope ?node ORDER BY ?scope ?label LIMIT 400";

    return sparql(q).then(function (rows) {
      var children = [], siblings = [];
      rows.forEach(function (r) {
        var item = { uri: r.node.value, label: r.label ? r.label.value : shortLabel(r.node.value), typeCurie: r.typeUri ? curie(r.typeUri.value) : null, formName: r.formName ? r.formName.value : null };
        (r.scope.value === "child" ? children : siblings).push(item);
      });
      return { children: children, siblings: siblings };
    }).catch(function () { return { children: [], siblings: [] }; });
  }

  // Why the siblings are grouped the way they are -- findingaid-etl records
  // this on the *parent* (group) node, not on each child: physical extent
  // ("5 Mappen"), the date range the group covers, and the arrangement rule
  // ("Alphabetisch nach Namen der Korrespondenten") sometimes under
  // iisgv:arrangement, sometimes under sdo:description depending on how the
  // original EAD was authored -- coalesce both rather than picking one.
  function fetchGroupContext(parentUri) {
    var q = "SELECT ?arrangement ?physDesc ?dates WHERE {\n" +
      "  OPTIONAL { " + iriRef(parentUri) + " <https://iisg.amsterdam/vocab/arrangement> ?a1 }\n" +
      "  OPTIONAL { " + iriRef(parentUri) + " <http://schema.org/description> ?a2 }\n" +
      "  OPTIONAL { " + iriRef(parentUri) + " <https://schema.org/description> ?a3 }\n" +
      "  BIND(COALESCE(?a1, ?a2, ?a3) AS ?arrangement)\n" +
      "  OPTIONAL { " + iriRef(parentUri) + " <https://iisg.amsterdam/vocab/physicalDescription> ?physDesc }\n" +
      "  OPTIONAL { " + iriRef(parentUri) + " <http://schema.org/temporalCoverage> ?t1 }\n" +
      "  OPTIONAL { " + iriRef(parentUri) + " <https://schema.org/temporalCoverage> ?t2 }\n" +
      "  BIND(COALESCE(?t1, ?t2) AS ?dates)\n" +
      "} LIMIT 1";
    return sparql(q).then(function (rows) {
      if (!rows.length) return null;
      var r = rows[0];
      var ctx = {
        arrangement: r.arrangement ? r.arrangement.value : null,
        physicalDescription: r.physDesc ? r.physDesc.value : null,
        dates: r.dates ? r.dates.value : null
      };
      return (ctx.arrangement || ctx.physicalDescription || ctx.dates) ? ctx : null;
    }).catch(function () { return null; });
  }

  // ---------- Player panel: Next as a pre-order walk of the finding aid ----------
  // "Next" on an ArchiveComponent, while exploreMode is "archive", doesn't
  // just cycle the immediate sibling group (fetchHierarchyNeighborhood,
  // above -- also alphabetical, for the browse tree's sake, not document
  // order) -- it walks the whole finding aid in sdo:position order, the
  // way you'd flip through a physical folder of folders: into this node's
  // own first child if it has one, else the next sibling, else climb to
  // the parent and take *its* next sibling, and so on up the chain.
  //
  // fetchPreOrderContext re-fetches the ancestor chain itself (a second
  // fetchAncestorChains call, alongside the one the hierarchy-tree slot
  // already makes in renderRecord) rather than threading it through --
  // only runs while the player panel actually needs it, so the duplicate
  // is cheap, and it keeps this self-contained rather than reaching into
  // that already-dense promise chain.
  function fetchPreOrderContext(uri) {
    return fetchAncestorChains([uri]).then(function (chains) {
      var chain = chains[uri] || []; // ascending: root ... immediate parent
      var parents = [uri];
      for (var i = chain.length - 1; i >= 0; i--) parents.push(chain[i].uri);
      // parents[0] = uri (for its own children), parents[1] = immediate
      // parent (for uri's siblings), parents[2] = grandparent, ...

      var values = parents.map(iriRef).join(" ");
      var q = "SELECT ?parent ?child ?pos (SAMPLE(?lbl) AS ?label) WHERE {\n" +
        "  VALUES ?parent { " + values + " }\n" +
        "  { ?child <http://schema.org/isPartOf> ?parent } UNION { ?child <https://schema.org/isPartOf> ?parent }\n" +
        "  OPTIONAL { ?child <http://schema.org/position> ?p1 }\n" +
        "  OPTIONAL { ?child <https://schema.org/position> ?p2 }\n" +
        "  BIND(COALESCE(?p1, ?p2) AS ?pos)\n" +
        "  OPTIONAL { ?child <http://schema.org/name> ?n1 }\n" +
        "  OPTIONAL { ?child <https://schema.org/name> ?n2 }\n" +
        "  BIND(COALESCE(?n1, ?n2) AS ?lbl)\n" +
        "} GROUP BY ?parent ?child ?pos";

      return sparql(q).then(function (rows) {
        var byParent = {};
        rows.forEach(function (r) {
          var p = r.parent.value;
          if (!byParent[p]) byParent[p] = [];
          byParent[p].push({
            uri: r.child.value,
            label: r.label ? r.label.value : shortLabel(r.child.value),
            pos: r.pos ? r.pos.value : null
          });
        });
        Object.keys(byParent).forEach(function (p) {
          byParent[p].sort(function (a, b) {
            var na = a.pos !== null ? parseFloat(a.pos) : NaN;
            var nb = b.pos !== null ? parseFloat(b.pos) : NaN;
            if (!isNaN(na) && !isNaN(nb) && na !== nb) return na - nb;
            if (isNaN(na) !== isNaN(nb)) return isNaN(na) ? 1 : -1; // positioned entries sort first
            return a.label.localeCompare(b.label);
          });
        });
        return { parents: parents, byParent: byParent };
      }).catch(function () { return { parents: parents, byParent: {} }; });
    });
  }

  function computeNextInFindingAid(uri, ctx) {
    var ownChildren = ctx.byParent[uri] || [];
    if (ownChildren.length) return ownChildren[0];

    var parents = ctx.parents;
    for (var i = 0; i < parents.length - 1; i++) {
      var node = parents[i], nodeParent = parents[i + 1];
      var levelSiblings = ctx.byParent[nodeParent] || [];
      for (var j = 0; j < levelSiblings.length; j++) {
        if (levelSiblings[j].uri === node) {
          if (j + 1 < levelSiblings.length) return levelSiblings[j + 1];
          break;
        }
      }
    }
    return null; // end of the whole finding aid
  }

  // Hand-drawn to match the app's existing stroke-icon style (ICONS,
  // above), not emoji -- same 24x24 viewBox, same stroke/fill conventions.
  var PLAYER_ICONS = {
    prev: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 20 9 12l10-8Z"/><line x1="5" y1="19" x2="5" y2="5"/></svg>',
    next: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4l10 8-10 8Z"/><line x1="19" y1="5" x2="19" y2="19"/></svg>',
    random: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h3.3c1.9 0 3.1 1 4.3 2.5"/><path d="M16.4 6.5c1.2-1.5 2.4-2.5 4.3-2.5H21"/><path d="M18 3l3 1.5L18 6"/><path d="M3 17h3.3c1.9 0 3.1-1 4.3-2.5"/><path d="M16.4 17.5c1.2 1.5 2.4 2.5 4.3 2.5H21"/><path d="M18 21l3-1.5L18 18"/></svg>'
  };

  var EXPLORE_MODE_LABELS = { person: "people", archive: "archives", books: "books" };

  function playerPanelEl(mode, uri, preOrderCtx) {
    var panel = el("div", { class: "player-panel" });

    var randomFn = mode === "archive" ? fetchRandomArchiveCandidate
      : mode === "books" ? fetchRandomBookCandidate
      : fetchRandomPersonCandidate;

    function goRandom() {
      randomFn().then(function (candidate) { if (candidate) navigate(candidate.uri); });
    }

    // Previous always steps back exactly one entry in the Trail (a
    // de-duplicated, most-recent-first visit history, already pushed for
    // the current record by the time this renders) -- if you've been
    // clicking Next, that's already the correct reverse order, with no
    // separate "previous in the tree" algorithm needed.
    var prevEntry = null;
    for (var i = 0; i < trail.length; i++) {
      if (trail[i].uri === uri) { prevEntry = trail[i + 1] || null; break; }
    }
    var prevBtn = el("button", { class: "player-btn", title: "Previous" });
    prevBtn.innerHTML = PLAYER_ICONS.prev;
    if (prevEntry) prevBtn.addEventListener("click", function () { navigate(prevEntry.uri); });
    else prevBtn.disabled = true;
    panel.appendChild(prevBtn);

    var randomBtn = el("button", { class: "player-btn player-btn-random", title: "Random" });
    randomBtn.innerHTML = PLAYER_ICONS.random;
    randomBtn.addEventListener("click", goRandom);
    panel.appendChild(randomBtn);

    var nextBtn = el("button", { class: "player-btn", title: "Next" });
    nextBtn.innerHTML = PLAYER_ICONS.next;
    if (preOrderCtx) {
      var nextTarget = computeNextInFindingAid(uri, preOrderCtx);
      if (nextTarget) nextBtn.addEventListener("click", function () { navigate(nextTarget.uri, { preserveScroll: true }); });
      else nextBtn.disabled = true; // genuinely the last item in this finding aid
    } else {
      nextBtn.addEventListener("click", goRandom); // no document order here -- acts like Random
    }
    panel.appendChild(nextBtn);

    panel.appendChild(el("span", { class: "player-mode-label", text: "Exploring " + EXPLORE_MODE_LABELS[mode] }));
    return panel;
  }

  // Cross-system identity expansion: identity-etl mints one hub
  // (https://iisg.amsterdam/id/<n>) per real person/organization and links
  // every external identifier (an authority URI, an ORCID URI, a ROR, ...)
  // to it with sdo:sameAs, in both directions. From any one of those URIs,
  // one hop to the hub then one hop back out reaches every sibling -- "the
  // cluster". The second UNION branch covers landing on the hub URI
  // itself, which has no outgoing sameAs to hop through first. Cached per
  // uri (a record page fires this once; several downstream queries below
  // share the result) and degrades to just [uri] on any failure or when
  // identity-etl simply hasn't linked this entity -- every consumer below
  // already treats a single-element cluster identically to the
  // pre-identity-etl behavior.
  var identityClusterCache = {};
  function fetchIdentityCluster(uri) {
    if (identityClusterCache[uri]) return identityClusterCache[uri];
    var q = "PREFIX sdo: <https://schema.org/>\n" +
      "SELECT DISTINCT ?equiv WHERE {\n" +
      "  GRAPH " + iriRef(IDENTITY_GRAPH) + " {\n" +
      "    { " + iriRef(uri) + " sdo:sameAs ?hub . ?hub sdo:sameAs ?equiv . }\n" +
      "    UNION\n" +
      "    { BIND(" + iriRef(uri) + " AS ?hub) . ?hub sdo:sameAs ?equiv . }\n" +
      "  }\n" +
      "}";
    var p = sparql(q).then(function (rows) {
      var set = {};
      set[uri] = true;
      rows.forEach(function (r) { set[r.equiv.value] = true; });
      return Object.keys(set);
    }).catch(function () { return [uri]; });
    identityClusterCache[uri] = p;
    return p;
  }

  // Shared VALUES-clause fragment for matching any member of an identity
  // cluster -- callers interpolate the same variable into their own triple
  // patterns.
  function valuesClause(varName, uris) {
    return "VALUES " + varName + " { " + uris.map(iriRef).join(" ") + " }\n";
  }

  // Same recognition identity-etl itself uses (URI_SCHEME_FIELDS in that
  // repo) to label a cluster member by external system, checked in order.
  var IDENTIFIER_SCHEMES = [
    { test: /^https:\/\/orcid\.org\//, label: "ORCID" },
    { test: /^https:\/\/ror\.org\//, label: "ROR" },
    { test: /^https:\/\/viaf\.org\//, label: "VIAF" },
    { test: /^https:\/\/isni\.org\//, label: "ISNI" },
    { test: /^https:\/\/d-nb\.info\/gnd\//, label: "GND" },
    { test: /^https:\/\/id\.loc\.gov\//, label: "Library of Congress" },
    { test: /^https:\/\/www\.wikidata\.org\//, label: "Wikidata" },
    { test: /^https:\/\/iisg\.amsterdam\/authority\/(person|organization)\//, label: "IISG Authority" }
  ];
  var IDENTITY_HUB_RE = /^https:\/\/iisg\.amsterdam\/id\/[0-9]+$/;

  // Person portraits: identity-etl's Wikidata sameAs links (see
  // fetchIdentityCluster above) give us a Q-id, which /api/wikidata-image
  // (iisgBrowser.py) resolves to a cached local copy of Wikidata's P18
  // (image) claim -- so the <img> below only ever hits our own origin,
  // same no-hotlinking policy as every other image in this viewer.
  var WIKIDATA_QID_RE = /^https:\/\/www\.wikidata\.org\/wiki\/(Q[1-9][0-9]*)$/;
  function findWikidataQid(cluster) {
    for (var i = 0; i < (cluster || []).length; i++) {
      var m = WIKIDATA_QID_RE.exec(cluster[i]);
      if (m) return m[1];
    }
    return null;
  }

  function classifyIdentifier(uri) {
    for (var i = 0; i < IDENTIFIER_SCHEMES.length; i++) {
      if (IDENTIFIER_SCHEMES[i].test.test(uri)) return IDENTIFIER_SCHEMES[i].label;
    }
    return null;
  }

  // "Known as" row: every other URI in this record's identity-etl cluster
  // (see fetchIdentityCluster above), labeled by external system where
  // recognized. The hub itself (bare id/<n>) is left out -- pure plumbing,
  // nothing a visitor would want to click through to (its own page is just
  // this same list again). Anything identity-etl hasn't classified still
  // gets a generic chip via shortLabel rather than silently vanishing.
  // Same local-vs-external link pattern as heroValueNode: an in-app
  // navigate() for our own URIs (the authority record, the hub), a plain
  // new-tab link for everything else.
  function identifiersRowEl(uri, cluster) {
    var others = (cluster || []).filter(function (u) { return u !== uri && !IDENTITY_HUB_RE.test(u); });
    if (!others.length) return null;
    var wrap = el("div", { class: "identifiers-row" });
    wrap.appendChild(el("span", { class: "identifiers-label", text: "Also known as:" }));
    others.forEach(function (u) {
      var schemeLabel = classifyIdentifier(u);
      var text = schemeLabel || shortLabel(u);
      if (isLocalUri(u)) {
        var btn = el("button", { class: "identifier-chip", title: u, text: text });
        btn.addEventListener("click", function () { navigate(u, { label: null }); });
        wrap.appendChild(btn);
      } else if (isSafeHref(u)) {
        wrap.appendChild(el("a", { class: "identifier-chip", href: u, target: "_blank", rel: "noopener", title: u, text: text }));
      } else {
        wrap.appendChild(el("span", { class: "identifier-chip", title: u, text: text }));
      }
    });
    return wrap;
  }

  // "More by this creator" -- inverse sdo:creator, same mechanism the
  // hierarchy tree's sibling lookup uses, just pointed at a different
  // predicate. sdo:creator is a safe generalization across the MARC
  // relator sub-roles (author/editor/collector/...) BOOK_FIELDS also lists:
  // confirmed on real data that every relator:aut triple has a matching
  // sdo:creator triple on the same (work, person) pair, so reading
  // outByPred["sdo:creator"] alone (already fetched for the current record)
  // is enough to find the creator(s) to look up -- no new query needed for
  // that part. One creator can have thousands of works (corporate creators
  // especially), so this is LIMITed, not a full count like the hierarchy
  // tree's sibling fetch.
  // Shared by "creations" (creator), "more by this creator" (creator, minus
  // the current work), and "written about" (about) -- same one-hop-inverse
  // shape, just a different predicate and an optional self-exclusion.
  function fetchWorksByInversePredicate(pred, targetUris, excludeUri) {
    var q = "SELECT ?work (SAMPLE(?lbl) AS ?label) (SAMPLE(?dateVal) AS ?date) (SAMPLE(?type) AS ?typeUri) (GROUP_CONCAT(?formNameLit; separator=\"|\") AS ?formName) WHERE {\n" +
      valuesClause("?target", targetUris) +
      "  { ?work <http://schema.org/" + pred + "> ?target } UNION { ?work <https://schema.org/" + pred + "> ?target }\n" +
      (excludeUri ? "  FILTER(?work != " + iriRef(excludeUri) + ")\n" : "") +
      "  OPTIONAL { ?work <http://schema.org/name> ?n1 }\n" +
      "  OPTIONAL { ?work <https://schema.org/name> ?n2 }\n" +
      "  BIND(COALESCE(?n1, ?n2) AS ?lbl)\n" +
      "  OPTIONAL { ?work <http://schema.org/datePublished> ?d1 }\n" +
      "  OPTIONAL { ?work <https://schema.org/datePublished> ?d2 }\n" +
      "  BIND(COALESCE(?d1, ?d2) AS ?dateVal)\n" +
      "  OPTIONAL { ?work a ?type }\n" +
      formLookupFragment("?work") +
      "} GROUP BY ?work ORDER BY DESC(?date) LIMIT 12";
    return sparql(q).then(function (rows) {
      return rows.map(function (r) {
        return { uri: r.work.value, label: r.label ? r.label.value : shortLabel(r.work.value), date: r.date ? r.date.value : null, typeCurie: r.typeUri ? curie(r.typeUri.value) : null, formName: r.formName ? r.formName.value : null };
      });
    }).catch(function () { return []; });
  }

  function fetchMoreByCreator(creatorUri, excludeUri) {
    return fetchIdentityCluster(creatorUri).then(function (cluster) {
      return fetchWorksByInversePredicate("creator", cluster, excludeUri);
    });
  }

  function fetchSubjectOf(personUri) {
    return fetchIdentityCluster(personUri).then(function (cluster) {
      return fetchWorksByInversePredicate("about", cluster, null);
    });
  }

  // Shared by every "heading + list of clickable (label, optional date)
  // rows" widget -- creations, more-by-creator, written-about all share
  // this exact shape, just with a different heading and query behind them.
  function workListEl(heading, works) {
    var card = el("div", { class: "hierarchy-tree" });
    card.appendChild(el("div", { class: "hierarchy-context", text: heading }));
    works.forEach(function (w) {
      var row = el("div", { class: "hierarchy-row" });
      row.appendChild(iconSpan(w.typeCurie, w.formName));
      var btn = el("button", { class: "hierarchy-link", text: w.date ? w.label + " (" + w.date + ")" : w.label });
      btn.addEventListener("click", function () { navigate(w.uri, { label: w.label }); });
      row.appendChild(btn);
      card.appendChild(row);
    });
    return card;
  }

  // "Co-authored with" -- people who share an sdo:creator edge to the same
  // work(s) as this person. Same inverse-creator mechanism as "more by this
  // creator" above, just joined on the work instead of the person. Mostly
  // empty for biblio-etl's Persons (avg 1.0 creator per book -- most books
  // have exactly one), but genuinely populated for orcid-etl's Persons,
  // whose research output is multi-author by nature.
  function fetchCoCreators(personUri) {
    return fetchIdentityCluster(personUri).then(function (cluster) {
      var q = "SELECT ?other (SAMPLE(?lbl) AS ?label) (COUNT(DISTINCT ?work) AS ?shared) WHERE {\n" +
        valuesClause("?target", cluster) +
        "  { ?work <http://schema.org/creator> ?target } UNION { ?work <https://schema.org/creator> ?target }\n" +
        "  { ?work <http://schema.org/creator> ?other } UNION { ?work <https://schema.org/creator> ?other }\n" +
        "  FILTER(?other NOT IN (" + cluster.map(iriRef).join(", ") + "))\n" +
        "  OPTIONAL { ?other <http://schema.org/name> ?n1 }\n" +
        "  OPTIONAL { ?other <https://schema.org/name> ?n2 }\n" +
        "  BIND(COALESCE(?n1, ?n2) AS ?lbl)\n" +
        "} GROUP BY ?other ORDER BY DESC(?shared) LIMIT 12";
      return sparql(q).then(function (rows) {
        return rows.map(function (r) {
          return { uri: r.other.value, label: r.label ? r.label.value : shortLabel(r.other.value), shared: parseInt(r.shared.value, 10) };
        });
      });
    }).catch(function () { return []; });
  }

  function coCreatorsEl(coCreators) {
    var card = el("div", { class: "hierarchy-tree" });
    card.appendChild(el("div", { class: "hierarchy-context", text: "Co-authored with" }));
    coCreators.forEach(function (c) {
      var row = el("div", { class: "hierarchy-row" });
      var btn = el("button", { class: "hierarchy-link", text: c.label });
      btn.addEventListener("click", function () { navigate(c.uri, { label: c.label }); });
      row.appendChild(btn);
      row.appendChild(el("span", { class: "pred-count", style: "margin-left: auto;", text: c.shared + (c.shared === 1 ? " shared work" : " shared works") }));
      card.appendChild(row);
    });
    return card;
  }

  // ---------- Explore view: a radial "metro map" for Person records ----------
  // Two relationship types, chosen after checking data density on several
  // candidates: "written about together" (two people covered by the same
  // work -- a real two-hop path, person -about- work -about- person) and
  // "creations" (a person's own one-hop sdo:creator output). Co-authorship
  // was too sparse outside orcid-etl, Person<->Place has no connecting
  // predicate in this graph at all, and a shared-topic hub query ran the
  // server out of memory -- all rejected on evidence, not guessed away.
  // Laid out radially (hub at center, spokes evenly spaced by angle) rather
  // than as a general metro-line router: the data is honestly a star
  // around whichever person you start from, not a connected loop, and a
  // radial placement is the one layout tractable to hand-write without a
  // real graph-drawing library.

  function fetchCoSubjects(personUri) {
    return fetchIdentityCluster(personUri).then(function (cluster) {
      var q = "SELECT ?other (SAMPLE(?lbl) AS ?label) (COUNT(DISTINCT ?work) AS ?shared) (SAMPLE(?work) AS ?viaWork) WHERE {\n" +
        valuesClause("?target", cluster) +
        "  { ?work <http://schema.org/about> ?target } UNION { ?work <https://schema.org/about> ?target }\n" +
        "  { ?work <http://schema.org/about> ?other } UNION { ?work <https://schema.org/about> ?other }\n" +
        "  FILTER(?other NOT IN (" + cluster.map(iriRef).join(", ") + "))\n" +
        "  OPTIONAL { ?other <http://schema.org/name> ?n1 }\n" +
        "  OPTIONAL { ?other <https://schema.org/name> ?n2 }\n" +
        "  BIND(COALESCE(?n1, ?n2) AS ?lbl)\n" +
        "} GROUP BY ?other ORDER BY DESC(?shared) LIMIT 8";
      return sparql(q).then(function (rows) {
        var items = rows.map(function (r) {
          return { uri: r.other.value, label: r.label ? r.label.value : shortLabel(r.other.value), shared: parseInt(r.shared.value, 10), viaUri: r.viaWork.value, viaLabel: null };
        });
        if (!items.length) return items;
        // SAMPLE(?work) above picks one representative connecting work per
        // co-subject, but a second SAMPLE(?label) in the same query isn't
        // guaranteed to come from that same row -- so its label is fetched
        // here, in a separate batched lookup, rather than risking a
        // mismatched via-stop title.
        var values = items.map(function (it) { return iriRef(it.viaUri); }).join(" ");
        var q2 = "SELECT ?w (SAMPLE(?lbl) AS ?label) WHERE {\n" +
          "  VALUES ?w { " + values + " }\n" +
          "  OPTIONAL { ?w <http://schema.org/name> ?n1 }\n" +
          "  OPTIONAL { ?w <https://schema.org/name> ?n2 }\n" +
          "  BIND(COALESCE(?n1, ?n2) AS ?lbl)\n" +
          "} GROUP BY ?w";
        return sparql(q2).then(function (rows2) {
          var labelByUri = {};
          rows2.forEach(function (r) { labelByUri[r.w.value] = r.label ? r.label.value : null; });
          items.forEach(function (it) { it.viaLabel = labelByUri[it.viaUri] || shortLabel(it.viaUri); });
          return items;
        });
      });
    }).catch(function () { return []; });
  }

  function truncateForStation(label, max) {
    if (!label) return "";
    return label.length > max ? label.slice(0, max - 1) + "…" : label;
  }

  // Hover-ghost's "work" branch: the one forward hop a creation station
  // doesn't already carry (who/what it's about) -- deliberately not the
  // work's own creator, since that's almost always the hub itself for a
  // single-author book and would just redraw the center.
  function fetchWorkAbout(workUri) {
    var q = "SELECT ?about (SAMPLE(?lbl) AS ?label) WHERE {\n" +
      "  { " + iriRef(workUri) + " <http://schema.org/about> ?about } UNION { " + iriRef(workUri) + " <https://schema.org/about> ?about }\n" +
      "  OPTIONAL { ?about <http://schema.org/name> ?n1 }\n" +
      "  OPTIONAL { ?about <https://schema.org/name> ?n2 }\n" +
      "  BIND(COALESCE(?n1, ?n2) AS ?lbl)\n" +
      "} GROUP BY ?about LIMIT 3";
    return sparql(q).then(function (rows) {
      return rows.map(function (r) { return { uri: r.about.value, label: r.label ? r.label.value : shortLabel(r.about.value) }; });
    }).catch(function () { return []; });
  }

  // Generic graph for any non-Person record, so clicking a creation/work
  // station never lands on a page with nothing further to explore --
  // every record gets a (possibly sparse) neighborhood instead of only
  // Persons. Outgoing comes free from factRows (already fetched for the
  // record itself, same one-hop data the statement list renders from);
  // incoming needs one more query, since factRows only covers this
  // entity's own outgoing triples, not who points at it. Subtitle is the
  // predicate's curie -- same shortLabel() the "Described as"/"Referenced
  // by" statement columns already use for arbitrary predicates, so the
  // vocabulary matches the rest of the page instead of inventing new
  // wording per predicate.
  function genericOutgoingNeighbors(uri, factRows) {
    var seen = {}, out = [];
    for (var i = 0; i < factRows.length && out.length < 5; i++) {
      var r = factRows[i];
      if (r.o.type !== "uri" || r.o.value === uri) continue;
      if (curie(r.p.value) === "rdf:type") continue;
      if (seen[r.o.value]) continue;
      seen[r.o.value] = true;
      out.push({ uri: r.o.value, label: r.label ? r.label.value : shortLabel(r.o.value), subtitle: shortLabel(r.p.value) });
    }
    return out;
  }

  function fetchGenericIncomingNeighbors(uri) {
    return fetchIdentityCluster(uri).then(function (cluster) {
      var q = "PREFIX schema: <http://schema.org/>\n" +
        "PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>\n" +
        "SELECT ?s ?p (SAMPLE(?lbl) AS ?label) WHERE {\n" +
        valuesClause("?target", cluster) +
        "  GRAPH ?g { ?s ?p ?target }\n" +
        "  FILTER(?s NOT IN (" + cluster.map(iriRef).join(", ") + "))\n" +
        "  OPTIONAL { ?s schema:name ?n1 }\n" +
        "  OPTIONAL { ?s rdfs:label ?n2 }\n" +
        "  BIND(COALESCE(?n1, ?n2) AS ?lbl)\n" +
        "} GROUP BY ?s ?p LIMIT 5";
      return sparql(q).then(function (rows) {
        return rows.map(function (r) { return { uri: r.s.value, label: r.label ? r.label.value : shortLabel(r.s.value), subtitle: shortLabel(r.p.value) }; });
      });
    }).catch(function () { return []; });
  }

  function exploreSvgEl(centerLabel, incoming, outgoing, incomingLegend, outgoingLegend) {
    var svgNS = "http://www.w3.org/2000/svg";
    var cx = 370, cy = 170;
    var svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("viewBox", "0 0 740 340");
    svg.setAttribute("class", "explore-svg");
    svg.setAttribute("role", "img");

    function addLine(x1, y1, x2, y2, color, width) {
      var ln = document.createElementNS(svgNS, "line");
      ln.setAttribute("x1", x1); ln.setAttribute("y1", y1);
      ln.setAttribute("x2", x2); ln.setAttribute("y2", y2);
      ln.setAttribute("stroke", color);
      ln.setAttribute("stroke-width", width);
      ln.setAttribute("stroke-linecap", "round");
      svg.appendChild(ln);
    }

    // Hover-ghost: previews one extra hop off a station without touching
    // the rest of the layout -- a single dashed node sprouting further out
    // along the same spoke, fetched lazily (and cached per uri, so
    // re-hovering the same station is free) and torn down on mouseleave.
    // ghostToken invalidates any fetch still in flight once the pointer has
    // moved elsewhere, so a slow response can't pop in over a station the
    // user already left.
    var ghostToken = 0;
    var ghostGroup = null;
    var ghostHoverTimer = null;
    var ghostCache = {};

    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

    function clearGhost() {
      ghostToken++;
      if (ghostHoverTimer) { clearTimeout(ghostHoverTimer); ghostHoverTimer = null; }
      if (ghostGroup && ghostGroup.parentNode) ghostGroup.parentNode.removeChild(ghostGroup);
      ghostGroup = null;
    }

    function fetchGhostNeighbor(kind, uri) {
      var key = kind + ":" + uri;
      if (!ghostCache[key]) {
        ghostCache[key] = (kind === "person" ? fetchCoSubjects(uri) : fetchWorkAbout(uri)).then(function (items) {
          return items && items.length ? items[0] : null;
        });
      }
      return ghostCache[key];
    }

    function buildGhostGroup(x1, y1, x2, y2, color, neighbor) {
      var g = document.createElementNS(svgNS, "g");
      g.setAttribute("class", "explore-ghost");
      var ln = document.createElementNS(svgNS, "line");
      ln.setAttribute("x1", x1); ln.setAttribute("y1", y1);
      ln.setAttribute("x2", x2); ln.setAttribute("y2", y2);
      ln.setAttribute("stroke", color);
      ln.setAttribute("stroke-width", 2);
      ln.setAttribute("stroke-dasharray", "3 4");
      g.appendChild(ln);
      var circle = document.createElementNS(svgNS, "circle");
      circle.setAttribute("cx", x2); circle.setAttribute("cy", y2); circle.setAttribute("r", 6);
      circle.setAttribute("fill", "var(--surface)");
      circle.setAttribute("stroke", color);
      circle.setAttribute("stroke-width", 1.5);
      circle.setAttribute("stroke-dasharray", "2 3");
      g.appendChild(circle);
      var anchor = x2 > x1 + 2 ? "start" : (x2 < x1 - 2 ? "end" : "middle");
      var dx = x2 > x1 + 2 ? 8 : (x2 < x1 - 2 ? -8 : 0);
      var t = document.createElementNS(svgNS, "text");
      t.setAttribute("x", x2 + dx); t.setAttribute("y", y2 + 4);
      t.setAttribute("text-anchor", anchor);
      t.setAttribute("class", "explore-ghost-label");
      t.textContent = truncateForStation(neighbor.label, 14);
      g.appendChild(t);
      g.addEventListener("click", function (e) { e.stopPropagation(); navigate(neighbor.uri, { label: neighbor.label }); });
      return g;
    }

    function scheduleGhost(x, y, color, ghostKind, ghostUri) {
      clearGhost();
      var token = ghostToken;
      ghostHoverTimer = setTimeout(function () {
        fetchGhostNeighbor(ghostKind, ghostUri).then(function (neighbor) {
          if (token !== ghostToken || !neighbor) return;
          var dx = x - cx, dy = y - cy;
          var len = Math.sqrt(dx * dx + dy * dy) || 1;
          var gx = clamp(x + (dx / len) * 40, 24, 716);
          var gy = clamp(y + (dy / len) * 40, 24, 316);
          ghostGroup = buildGhostGroup(x, y, gx, gy, color, neighbor);
          svg.appendChild(ghostGroup);
          requestAnimationFrame(function () { if (ghostGroup) ghostGroup.classList.add("show"); });
        });
      }, 150);
    }

    function addStation(x, y, r, color, title, subtitle, labelFar, onClick, ghostKind, ghostUri) {
      var g = document.createElementNS(svgNS, "g");
      g.setAttribute("class", "explore-station" + (onClick ? " clickable" : ""));
      var circle = document.createElementNS(svgNS, "circle");
      circle.setAttribute("cx", x); circle.setAttribute("cy", y); circle.setAttribute("r", r);
      circle.setAttribute("fill", "var(--surface)");
      circle.setAttribute("stroke", color);
      circle.setAttribute("stroke-width", 2);
      g.appendChild(circle);

      var anchor = x > cx + 2 ? "start" : (x < cx - 2 ? "end" : "middle");
      var dx = x > cx + 2 ? 9 : (x < cx - 2 ? -9 : 0);
      // Title sits above the station, subtitle below -- kept on opposite
      // sides so they never collide with each other. labelFar pushes the
      // title further up on alternating stations (even/odd by index) so
      // two spokes packed close in angle don't stack their titles on the
      // same line.
      var t1 = document.createElementNS(svgNS, "text");
      t1.setAttribute("x", x + dx); t1.setAttribute("y", y - r - (labelFar ? 20 : 6));
      t1.setAttribute("text-anchor", anchor);
      t1.setAttribute("class", "explore-label");
      t1.textContent = title;
      g.appendChild(t1);

      if (subtitle) {
        var t2 = document.createElementNS(svgNS, "text");
        t2.setAttribute("x", x + dx); t2.setAttribute("y", y + r + 15);
        t2.setAttribute("text-anchor", anchor);
        t2.setAttribute("class", "explore-sublabel");
        t2.textContent = subtitle;
        g.appendChild(t2);
      }
      if (onClick) g.addEventListener("click", onClick);
      if (ghostKind && ghostUri) {
        g.addEventListener("mouseenter", function () { scheduleGhost(x, y, color, ghostKind, ghostUri); });
        g.addEventListener("mouseleave", clearGhost);
      }
      svg.appendChild(g);
    }

    // Capped to keep the map readable -- a station per connection would
    // overwhelm the diagram well before it ran out of real data (Marx
    // alone has dozens of co-subjects); these are the strongest ones,
    // already sorted by shared-work count / most recent date / query LIMIT.
    incoming = incoming.slice(0, 5);
    outgoing = outgoing.slice(0, 5);

    var blueColor = "var(--accent)";
    var n = incoming.length;
    incoming.forEach(function (it, i) {
      var angle = (n === 1 ? 0 : (-80 + (160 * i / (n - 1)))) * Math.PI / 180;
      var x = cx + Math.cos(angle) * 230, y = cy + Math.sin(angle) * 110;
      // Person's co-subjects route through a small via-stop (the shared
      // work); the generic 1-hop neighbor graph has no such intermediate
      // node, so it's a direct spoke -- same drawing code either way, via
      // just an optional extra hop.
      if (it.viaUri || it.viaLabel) {
        var vx = cx + Math.cos(angle) * 110, vy = cy + Math.sin(angle) * 53;
        addLine(cx, cy, vx, vy, blueColor, 3);
        addLine(vx, vy, x, y, blueColor, 3);
        addStation(vx, vy, 4, blueColor, truncateForStation(it.viaLabel, 14), null, false, null);
      } else {
        addLine(cx, cy, x, y, blueColor, 3);
      }
      addStation(x, y, 9, blueColor, truncateForStation(it.label, 16), it.subtitle, i % 2 === 1, (function (it) { return function () { navigate(it.uri, { label: it.label }); }; })(it), it.ghostKind, it.uri);
    });

    var coralColor = "var(--crit)";
    var m = outgoing.length;
    outgoing.forEach(function (it, i) {
      var angle = (180 + (m === 1 ? 0 : (-60 + (120 * i / (m - 1))))) * Math.PI / 180;
      var x = cx + Math.cos(angle) * 230, y = cy + Math.sin(angle) * 110;
      addLine(cx, cy, x, y, coralColor, 3);
      addStation(x, y, 7, coralColor, truncateForStation(it.label, 16), it.subtitle, i % 2 === 1, (function (it) { return function () { navigate(it.uri, { label: it.label }); }; })(it), it.ghostKind, it.uri);
    });

    var hub = document.createElementNS(svgNS, "g");
    var outer = document.createElementNS(svgNS, "circle");
    outer.setAttribute("cx", cx); outer.setAttribute("cy", cy); outer.setAttribute("r", 15);
    outer.setAttribute("fill", "var(--surface)"); outer.setAttribute("stroke", blueColor); outer.setAttribute("stroke-width", 2);
    hub.appendChild(outer);
    var inner = document.createElementNS(svgNS, "circle");
    inner.setAttribute("cx", cx); inner.setAttribute("cy", cy); inner.setAttribute("r", 8);
    inner.setAttribute("fill", coralColor);
    hub.appendChild(inner);
    svg.appendChild(hub);

    var wrap = el("div", { class: "explore-wrap" });
    // The hub's own name used to be SVG text centered over the circle --
    // fine for a short one, but a long title (a book, an event) doesn't
    // wrap in SVG, so it just ran on as one line straight across the
    // diagram, overlapping whatever stations happened to sit under it. A
    // normal HTML heading above the graph wraps properly and never
    // competes with the stations for space.
    wrap.appendChild(el("div", { class: "explore-hub-title", text: centerLabel }));
    wrap.appendChild(svg);
    if (!n && !m) {
      wrap.appendChild(el("div", { class: "hierarchy-row muted", text: "Nothing to explore from here yet" }));
    }
    var legend = el("div", { class: "explore-legend" });
    legend.appendChild(el("span", { class: "explore-legend-item accent", text: "● " + incomingLegend }));
    legend.appendChild(el("span", { class: "explore-legend-item crit", text: "● " + outgoingLegend }));
    wrap.appendChild(legend);
    return wrap;
  }

  // A child row tries to "unfold" in place first, rather than navigating
  // to a whole new page -- clicking it lazily fetches that child's own
  // children (fetchHierarchyNeighborhood again, just without a parentUri
  // so only its "child" scope runs) and nests them right here,
  // recursively, collapsible on a second click. Only once that fetch
  // comes back empty (a genuine leaf -- an actual document, nothing left
  // to reveal) does it fall back to navigate(), since there's nowhere
  // else for an in-place reveal to go.
  function expandableHierarchyRowEl(item) {
