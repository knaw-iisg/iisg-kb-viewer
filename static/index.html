      var row = el("div", { class: "hierarchy-row" });
      row.appendChild(iconSpan(w.typeCurie, w.formName));
      var btn = el("button", { class: "hierarchy-link", text: w.date ? w.label + " (" + w.date + ")" : w.label });
      btn.addEventListener("click", function () { navigate(w.uri, { label: w.label }); });
      row.appendChild(btn);
      card.appendChild(row);
    });
    return card;
  }

  // "Co-authored with" -- people who share an sdo:creator edge to the same
  // work(s) as this person. Same inverse-creator mechanism as "more by this
  // creator" above, just joined on the work instead of the person. Mostly
  // empty for biblio-etl's Persons (avg 1.0 creator per book -- most books
  // have exactly one), but genuinely populated for orcid-etl's Persons,
  // whose research output is multi-author by nature.
  function fetchCoCreators(personUri) {
    return fetchIdentityCluster(personUri).then(function (cluster) {
      var q = "SELECT ?other (SAMPLE(?lbl) AS ?label) (COUNT(DISTINCT ?work) AS ?shared) WHERE {\n" +
        valuesClause("?target", cluster) +
        "  { ?work <http://schema.org/creator> ?target } UNION { ?work <https://schema.org/creator> ?target }\n" +
        "  { ?work <http://schema.org/creator> ?other } UNION { ?work <https://schema.org/creator> ?other }\n" +
        "  FILTER(?other NOT IN (" + cluster.map(iriRef).join(", ") + "))\n" +
        "  OPTIONAL { ?other <http://schema.org/name> ?n1 }\n" +
        "  OPTIONAL { ?other <https://schema.org/name> ?n2 }\n" +
        "  BIND(COALESCE(?n1, ?n2) AS ?lbl)\n" +
        "} GROUP BY ?other ORDER BY DESC(?shared) LIMIT 12";
      return sparql(q).then(function (rows) {
        return rows.map(function (r) {
          return { uri: r.other.value, label: r.label ? r.label.value : shortLabel(r.other.value), shared: parseInt(r.shared.value, 10) };
        });
      });
    }).catch(function () { return []; });
  }

  function coCreatorsEl(coCreators) {
    var card = el("div", { class: "hierarchy-tree" });
    card.appendChild(el("div", { class: "hierarchy-context", text: "Co-authored with" }));
    coCreators.forEach(function (c) {
      var row = el("div", { class: "hierarchy-row" });
      var btn = el("button", { class: "hierarchy-link", text: c.label });
      btn.addEventListener("click", function () { navigate(c.uri, { label: c.label }); });
      row.appendChild(btn);
      row.appendChild(el("span", { class: "pred-count", style: "margin-left: auto;", text: c.shared + (c.shared === 1 ? " shared work" : " shared works") }));
      card.appendChild(row);
    });
    return card;
  }

  // ---------- Explore view: a radial "metro map" for Person records ----------
  // Two relationship types, chosen after checking data density on several
  // candidates: "written about together" (two people covered by the same
  // work -- a real two-hop path, person -about- work -about- person) and
  // "creations" (a person's own one-hop sdo:creator output). Co-authorship
  // was too sparse outside orcid-etl, Person<->Place has no connecting
  // predicate in this graph at all, and a shared-topic hub query ran the
  // server out of memory -- all rejected on evidence, not guessed away.
  // Laid out radially (hub at center, spokes evenly spaced by angle) rather
  // than as a general metro-line router: the data is honestly a star
  // around whichever person you start from, not a connected loop, and a
  // radial placement is the one layout tractable to hand-write without a
  // real graph-drawing library.

  function fetchCoSubjects(personUri) {
    return fetchIdentityCluster(personUri).then(function (cluster) {
      var q = "SELECT ?other (SAMPLE(?lbl) AS ?label) (COUNT(DISTINCT ?work) AS ?shared) (SAMPLE(?work) AS ?viaWork) WHERE {\n" +
        valuesClause("?target", cluster) +
        "  { ?work <http://schema.org/about> ?target } UNION { ?work <https://schema.org/about> ?target }\n" +
        "  { ?work <http://schema.org/about> ?other } UNION { ?work <https://schema.org/about> ?other }\n" +
        "  FILTER(?other NOT IN (" + cluster.map(iriRef).join(", ") + "))\n" +
        "  OPTIONAL { ?other <http://schema.org/name> ?n1 }\n" +
        "  OPTIONAL { ?other <https://schema.org/name> ?n2 }\n" +
        "  BIND(COALESCE(?n1, ?n2) AS ?lbl)\n" +
        "} GROUP BY ?other ORDER BY DESC(?shared) LIMIT 8";
      return sparql(q).then(function (rows) {
        var items = rows.map(function (r) {
          return { uri: r.other.value, label: r.label ? r.label.value : shortLabel(r.other.value), shared: parseInt(r.shared.value, 10), viaUri: r.viaWork.value, viaLabel: null };
        });
        if (!items.length) return items;
        // SAMPLE(?work) above picks one representative connecting work per
        // co-subject, but a second SAMPLE(?label) in the same query isn't
        // guaranteed to come from that same row -- so its label is fetched
        // here, in a separate batched lookup, rather than risking a
        // mismatched via-stop title.
        var values = items.map(function (it) { return iriRef(it.viaUri); }).join(" ");
        var q2 = "SELECT ?w (SAMPLE(?lbl) AS ?label) WHERE {\n" +
          "  VALUES ?w { " + values + " }\n" +
          "  OPTIONAL { ?w <http://schema.org/name> ?n1 }\n" +
          "  OPTIONAL { ?w <https://schema.org/name> ?n2 }\n" +
          "  BIND(COALESCE(?n1, ?n2) AS ?lbl)\n" +
          "} GROUP BY ?w";
        return sparql(q2).then(function (rows2) {
          var labelByUri = {};
          rows2.forEach(function (r) { labelByUri[r.w.value] = r.label ? r.label.value : null; });
          items.forEach(function (it) { it.viaLabel = labelByUri[it.viaUri] || shortLabel(it.viaUri); });
          return items;
        });
      });
    }).catch(function () { return []; });
  }

  function truncateForStation(label, max) {
    if (!label) return "";
    return label.length > max ? label.slice(0, max - 1) + "…" : label;
  }

  // Hover-ghost's "work" branch: the one forward hop a creation station
  // doesn't already carry (who/what it's about) -- deliberately not the
  // work's own creator, since that's almost always the hub itself for a
  // single-author book and would just redraw the center.
  function fetchWorkAbout(workUri) {
    var q = "SELECT ?about (SAMPLE(?lbl) AS ?label) WHERE {\n" +
      "  { " + iriRef(workUri) + " <http://schema.org/about> ?about } UNION { " + iriRef(workUri) + " <https://schema.org/about> ?about }\n" +
      "  OPTIONAL { ?about <http://schema.org/name> ?n1 }\n" +
      "  OPTIONAL { ?about <https://schema.org/name> ?n2 }\n" +
      "  BIND(COALESCE(?n1, ?n2) AS ?lbl)\n" +
      "} GROUP BY ?about LIMIT 3";
    return sparql(q).then(function (rows) {
      return rows.map(function (r) { return { uri: r.about.value, label: r.label ? r.label.value : shortLabel(r.about.value) }; });
    }).catch(function () { return []; });
  }

  // Generic graph for any non-Person record, so clicking a creation/work
  // station never lands on a page with nothing further to explore --
  // every record gets a (possibly sparse) neighborhood instead of only
  // Persons. Outgoing comes free from factRows (already fetched for the
  // record itself, same one-hop data the statement list renders from);
  // incoming needs one more query, since factRows only covers this
  // entity's own outgoing triples, not who points at it. Subtitle is the
  // predicate's curie -- same shortLabel() the "Described as"/"Referenced
  // by" statement columns already use for arbitrary predicates, so the
  // vocabulary matches the rest of the page instead of inventing new
  // wording per predicate.
  // iisg-iiif's links from a record to its own scans: up to hundreds of
  // pages, all already shown in the record's image gallery -- as graph
  // stations they'd just crowd out the record's real neighbours.
  var MEDIA_PREDICATES = { "sdo:image": true, "sdo:thumbnailUrl": true, "iisgv:iiifManifest": true };

  function genericOutgoingNeighbors(uri, factRows) {
    var seen = {}, out = [];
    for (var i = 0; i < factRows.length && out.length < 5; i++) {
      var r = factRows[i];
      if (r.o.type !== "uri" || r.o.value === uri) continue;
      if (curie(r.p.value) === "rdf:type" || MEDIA_PREDICATES[curie(r.p.value)]) continue;
      if (seen[r.o.value]) continue;
      seen[r.o.value] = true;
      out.push({ uri: r.o.value, label: r.label ? r.label.value : shortLabel(r.o.value), subtitle: shortLabel(r.p.value) });
    }
    return out;
  }

  function fetchGenericIncomingNeighbors(uri) {
    return fetchIdentityCluster(uri).then(function (cluster) {
      var q = "PREFIX schema: <http://schema.org/>\n" +
        "PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>\n" +
        "SELECT ?s ?p (SAMPLE(?lbl) AS ?label) WHERE {\n" +
        valuesClause("?target", cluster) +
        "  GRAPH ?g { ?s ?p ?target }\n" +
        "  FILTER(?s NOT IN (" + cluster.map(iriRef).join(", ") + "))\n" +
        "  OPTIONAL { ?s schema:name ?n1 }\n" +
        "  OPTIONAL { ?s rdfs:label ?n2 }\n" +
        "  BIND(COALESCE(?n1, ?n2) AS ?lbl)\n" +
        "} GROUP BY ?s ?p LIMIT 5";
      return sparql(q).then(function (rows) {
        return rows.map(function (r) { return { uri: r.s.value, label: r.label ? r.label.value : shortLabel(r.s.value), subtitle: shortLabel(r.p.value) }; });
      });
    }).catch(function () { return []; });
  }

  function exploreSvgEl(centerLabel, incoming, outgoing, incomingLegend, outgoingLegend) {
    var svgNS = "http://www.w3.org/2000/svg";
    var cx = 370, cy = 170;
    var svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("viewBox", "0 0 740 340");
    svg.setAttribute("class", "explore-svg");
    svg.setAttribute("role", "img");

    function addLine(x1, y1, x2, y2, color, width) {
      var ln = document.createElementNS(svgNS, "line");
      ln.setAttribute("x1", x1); ln.setAttribute("y1", y1);
      ln.setAttribute("x2", x2); ln.setAttribute("y2", y2);
      ln.setAttribute("stroke", color);
      ln.setAttribute("stroke-width", width);
      ln.setAttribute("stroke-linecap", "round");
      svg.appendChild(ln);
    }

    // Hover-ghost: previews one extra hop off a station without touching
    // the rest of the layout -- a single dashed node sprouting further out
    // along the same spoke, fetched lazily (and cached per uri, so
    // re-hovering the same station is free) and torn down on mouseleave.
    // ghostToken invalidates any fetch still in flight once the pointer has
    // moved elsewhere, so a slow response can't pop in over a station the
    // user already left.
    var ghostToken = 0;
    var ghostGroup = null;
    var ghostHoverTimer = null;
    var ghostCache = {};

    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

    function clearGhost() {
      ghostToken++;
      if (ghostHoverTimer) { clearTimeout(ghostHoverTimer); ghostHoverTimer = null; }
      if (ghostGroup && ghostGroup.parentNode) ghostGroup.parentNode.removeChild(ghostGroup);
      ghostGroup = null;
    }

    function fetchGhostNeighbor(kind, uri) {
      var key = kind + ":" + uri;
      if (!ghostCache[key]) {
        ghostCache[key] = (kind === "person" ? fetchCoSubjects(uri) : fetchWorkAbout(uri)).then(function (items) {
          return items && items.length ? items[0] : null;
        });
      }
      return ghostCache[key];
    }

    function buildGhostGroup(x1, y1, x2, y2, color, neighbor) {
      var g = document.createElementNS(svgNS, "g");
      g.setAttribute("class", "explore-ghost");
      var ln = document.createElementNS(svgNS, "line");
      ln.setAttribute("x1", x1); ln.setAttribute("y1", y1);
      ln.setAttribute("x2", x2); ln.setAttribute("y2", y2);
      ln.setAttribute("stroke", color);
      ln.setAttribute("stroke-width", 2);
      ln.setAttribute("stroke-dasharray", "3 4");
      g.appendChild(ln);
      var circle = document.createElementNS(svgNS, "circle");
      circle.setAttribute("cx", x2); circle.setAttribute("cy", y2); circle.setAttribute("r", 6);
      circle.setAttribute("fill", "var(--surface)");
      circle.setAttribute("stroke", color);
      circle.setAttribute("stroke-width", 1.5);
      circle.setAttribute("stroke-dasharray", "2 3");
      g.appendChild(circle);
      var anchor = x2 > x1 + 2 ? "start" : (x2 < x1 - 2 ? "end" : "middle");
      var dx = x2 > x1 + 2 ? 8 : (x2 < x1 - 2 ? -8 : 0);
      var t = document.createElementNS(svgNS, "text");
      t.setAttribute("x", x2 + dx); t.setAttribute("y", y2 + 4);
      t.setAttribute("text-anchor", anchor);
      t.setAttribute("class", "explore-ghost-label");
      t.textContent = truncateForStation(neighbor.label, 14);
      g.appendChild(t);
      g.addEventListener("click", function (e) { e.stopPropagation(); navigate(neighbor.uri, { label: neighbor.label }); });
      return g;
    }

    function scheduleGhost(x, y, color, ghostKind, ghostUri) {
      clearGhost();
      var token = ghostToken;
      ghostHoverTimer = setTimeout(function () {
        fetchGhostNeighbor(ghostKind, ghostUri).then(function (neighbor) {
          if (token !== ghostToken || !neighbor) return;
          var dx = x - cx, dy = y - cy;
          var len = Math.sqrt(dx * dx + dy * dy) || 1;
          var gx = clamp(x + (dx / len) * 40, 24, 716);
          var gy = clamp(y + (dy / len) * 40, 24, 316);
          ghostGroup = buildGhostGroup(x, y, gx, gy, color, neighbor);
          svg.appendChild(ghostGroup);
          requestAnimationFrame(function () { if (ghostGroup) ghostGroup.classList.add("show"); });
        });
      }, 150);
    }

    function addStation(x, y, r, color, title, subtitle, labelFar, onClick, ghostKind, ghostUri) {
      var g = document.createElementNS(svgNS, "g");
      g.setAttribute("class", "explore-station" + (onClick ? " clickable" : ""));
      var circle = document.createElementNS(svgNS, "circle");
      circle.setAttribute("cx", x); circle.setAttribute("cy", y); circle.setAttribute("r", r);
      circle.setAttribute("fill", "var(--surface)");
      circle.setAttribute("stroke", color);
      circle.setAttribute("stroke-width", 2);
      g.appendChild(circle);

      var anchor = x > cx + 2 ? "start" : (x < cx - 2 ? "end" : "middle");
      var dx = x > cx + 2 ? 9 : (x < cx - 2 ? -9 : 0);
      // Title sits above the station, subtitle below -- kept on opposite
      // sides so they never collide with each other. labelFar pushes the
      // title further up on alternating stations (even/odd by index) so
      // two spokes packed close in angle don't stack their titles on the
      // same line.
      var t1 = document.createElementNS(svgNS, "text");
      t1.setAttribute("x", x + dx); t1.setAttribute("y", y - r - (labelFar ? 20 : 6));
      t1.setAttribute("text-anchor", anchor);
      t1.setAttribute("class", "explore-label");
      t1.textContent = title;
      g.appendChild(t1);

      if (subtitle) {
        var t2 = document.createElementNS(svgNS, "text");
        t2.setAttribute("x", x + dx); t2.setAttribute("y", y + r + 15);
        t2.setAttribute("text-anchor", anchor);
        t2.setAttribute("class", "explore-sublabel");
        t2.textContent = subtitle;
        g.appendChild(t2);
      }
      if (onClick) g.addEventListener("click", onClick);
      if (ghostKind && ghostUri) {
        g.addEventListener("mouseenter", function () { scheduleGhost(x, y, color, ghostKind, ghostUri); });
        g.addEventListener("mouseleave", clearGhost);
      }
      svg.appendChild(g);
    }

    // Capped to keep the map readable -- a station per connection would
    // overwhelm the diagram well before it ran out of real data (Marx
    // alone has dozens of co-subjects); these are the strongest ones,
    // already sorted by shared-work count / most recent date / query LIMIT.
    incoming = incoming.slice(0, 5);
    outgoing = outgoing.slice(0, 5);

    var blueColor = "var(--accent)";
    var n = incoming.length;
    incoming.forEach(function (it, i) {
      var angle = (n === 1 ? 0 : (-80 + (160 * i / (n - 1)))) * Math.PI / 180;
      var x = cx + Math.cos(angle) * 230, y = cy + Math.sin(angle) * 110;
      // Person's co-subjects route through a small via-stop (the shared
      // work); the generic 1-hop neighbor graph has no such intermediate
      // node, so it's a direct spoke -- same drawing code either way, via
      // just an optional extra hop.
      if (it.viaUri || it.viaLabel) {
        var vx = cx + Math.cos(angle) * 110, vy = cy + Math.sin(angle) * 53;
        addLine(cx, cy, vx, vy, blueColor, 3);
        addLine(vx, vy, x, y, blueColor, 3);
        addStation(vx, vy, 4, blueColor, truncateForStation(it.viaLabel, 14), null, false, null);
      } else {
        addLine(cx, cy, x, y, blueColor, 3);
      }
      addStation(x, y, 9, blueColor, truncateForStation(it.label, 16), it.subtitle, i % 2 === 1, (function (it) { return function () { navigate(it.uri, { label: it.label }); }; })(it), it.ghostKind, it.uri);
    });

    var coralColor = "var(--crit)";
    var m = outgoing.length;
    outgoing.forEach(function (it, i) {
      var angle = (180 + (m === 1 ? 0 : (-60 + (120 * i / (m - 1))))) * Math.PI / 180;
      var x = cx + Math.cos(angle) * 230, y = cy + Math.sin(angle) * 110;
      addLine(cx, cy, x, y, coralColor, 3);
      addStation(x, y, 7, coralColor, truncateForStation(it.label, 16), it.subtitle, i % 2 === 1, (function (it) { return function () { navigate(it.uri, { label: it.label }); }; })(it), it.ghostKind, it.uri);
    });

    var hub = document.createElementNS(svgNS, "g");
    var outer = document.createElementNS(svgNS, "circle");
    outer.setAttribute("cx", cx); outer.setAttribute("cy", cy); outer.setAttribute("r", 15);
    outer.setAttribute("fill", "var(--surface)"); outer.setAttribute("stroke", blueColor); outer.setAttribute("stroke-width", 2);
    hub.appendChild(outer);
    var inner = document.createElementNS(svgNS, "circle");
    inner.setAttribute("cx", cx); inner.setAttribute("cy", cy); inner.setAttribute("r", 8);
    inner.setAttribute("fill", coralColor);
    hub.appendChild(inner);
    svg.appendChild(hub);

    var wrap = el("div", { class: "explore-wrap" });
    // The hub's own name used to be SVG text centered over the circle --
    // fine for a short one, but a long title (a book, an event) doesn't
    // wrap in SVG, so it just ran on as one line straight across the
    // diagram, overlapping whatever stations happened to sit under it. A
    // normal HTML heading above the graph wraps properly and never
    // competes with the stations for space.
    wrap.appendChild(el("div", { class: "explore-hub-title", text: centerLabel }));
    wrap.appendChild(svg);
    if (!n && !m) {
      wrap.appendChild(el("div", { class: "hierarchy-row muted", text: "Nothing to explore from here yet" }));
    }
    var legend = el("div", { class: "explore-legend" });
    legend.appendChild(el("span", { class: "explore-legend-item accent", text: "● " + incomingLegend }));
    legend.appendChild(el("span", { class: "explore-legend-item crit", text: "● " + outgoingLegend }));
    wrap.appendChild(legend);
    return wrap;
  }

  // A child row tries to "unfold" in place first, rather than navigating
  // to a whole new page -- clicking it lazily fetches that child's own
  // children (fetchHierarchyNeighborhood again, just without a parentUri
  // so only its "child" scope runs) and nests them right here,
  // recursively, collapsible on a second click. Only once that fetch
  // comes back empty (a genuine leaf -- an actual document, nothing left
  // to reveal) does it fall back to navigate(), since there's nowhere
  // else for an in-place reveal to go.
  function expandableHierarchyRowEl(item) {
    var wrap = el("div", {});
    var row = el("div", { class: "hierarchy-row" });
    var chevron = el("span", { class: "hierarchy-chevron", text: "▸" });
    row.appendChild(chevron);
    row.appendChild(iconSpan(item.typeCurie, item.formName));
    var link = el("button", { class: "hierarchy-link", text: item.label });
    row.appendChild(link);
    wrap.appendChild(row);

    var nestedWrap = el("div", { class: "hierarchy-children hierarchy-expand-wrap" });
    wrap.appendChild(nestedWrap);

    var loaded = false, expanded = false, isLeaf = false;

    function setExpanded(v) {
      expanded = v;
      nestedWrap.classList.toggle("expanded", v);
      chevron.classList.toggle("expanded", v);
    }

    function toggle() {
      if (isLeaf) { navigate(item.uri, { label: item.label, preserveScroll: true }); return; }
      if (!loaded) {
        chevron.classList.add("loading");
        fetchHierarchyNeighborhood(item.uri, null).then(function (nbhd) {
          loaded = true;
          chevron.classList.remove("loading");
          if (!nbhd.children.length) {
            isLeaf = true;
            navigate(item.uri, { label: item.label, preserveScroll: true });
            return;
          }
          nbhd.children.forEach(function (gc) { nestedWrap.appendChild(expandableHierarchyRowEl(gc)); });
          setExpanded(true);
        });
        return;
      }
      setExpanded(!expanded);
    }

    link.addEventListener("click", toggle);
    chevron.addEventListener("click", toggle);
    return wrap;
  }

  function hierarchyTreeEl(chain, currentUri, currentLabel, siblings, children, groupContext) {
    var innerRows = el("div", {});
    if (groupContext) {
      var parts = [groupContext.physicalDescription, groupContext.dates, groupContext.arrangement].filter(function (p) { return p; });
      innerRows.appendChild(el("div", { class: "hierarchy-context", text: parts.join(" · ") }));
    }
    var rowsToShow = siblings.length ? siblings : [{ uri: currentUri, label: currentLabel }];

    // Both "+N more" rows below used to be inert text -- siblings and
    // children are already fully in memory (just capped to PAGE_SIZE at
    // render time), so a real "show more" needs no new query, just
    // re-entering these with a larger slice and swapping the old button
    // out for whatever's left.
    function appendChildrenPage(kids, kidsShown) {
      children.slice(kidsShown, kidsShown + PAGE_SIZE).forEach(function (child) {
        kids.appendChild(expandableHierarchyRowEl(child));
      });
      kidsShown += PAGE_SIZE;
      if (kidsShown < children.length) {
        var moreRow = el("div", { class: "hierarchy-row" });
        var moreBtn = el("button", { class: "hierarchy-link", text: "+" + (children.length - kidsShown) + " more" });
        moreBtn.addEventListener("click", function () {
          kids.removeChild(moreRow);
          appendChildrenPage(kids, kidsShown);
        });
        moreRow.appendChild(moreBtn);
        kids.appendChild(moreRow);
      }
    }

    function appendSiblingsPage(shown) {
      rowsToShow.slice(shown, shown + PAGE_SIZE).forEach(function (item) {
        var isCurrent = item.uri === currentUri;
        if (!isCurrent) {
          // Same lazy-expand-in-place row as children (expandableHierarchyRowEl)
          // -- a sibling click used to be a full navigate(), which meant
          // clear(mainEl)'s rebuild always included a gap where the
          // hierarchy-tree box itself was simply gone (its own data is
          // fetched *after* the page swap, not with it) before popping back
          // in -- visibly "disappear, repaint" even once the scroll-position
          // and loading-flash issues were separately fixed. Expanding in
          // place here means a sibling click never touches the page at all
          // unless it turns out to be a leaf with nothing to expand.
          innerRows.appendChild(expandableHierarchyRowEl(item));
          return;
        }
        var row = el("div", { class: "hierarchy-row current" });
        row.appendChild(iconSpan(item.typeCurie, item.formName));
        row.appendChild(el("span", { text: item.label }));
        innerRows.appendChild(row);

        var kids = el("div", { class: "hierarchy-children" });
        if (children.length) {
          appendChildrenPage(kids, 0);
        } else {
          kids.appendChild(el("div", { class: "hierarchy-row muted", text: "Nothing catalogued below this level" }));
        }
        innerRows.appendChild(kids);
      });
      shown += PAGE_SIZE;
      if (shown < rowsToShow.length) {
        var moreRow = el("div", { class: "hierarchy-row" });
        var moreBtn = el("button", { class: "hierarchy-link", text: "+" + (rowsToShow.length - shown) + " more in this series" });
        moreBtn.addEventListener("click", function () {
          innerRows.removeChild(moreRow);
          appendSiblingsPage(shown);
        });
        moreRow.appendChild(moreBtn);
        innerRows.appendChild(moreRow);
      }
    }
    appendSiblingsPage(0);

    // Nest under each ancestor, outermost first, so the full path down to
    // "siblings around here" reads as one continuous tree instead of a flat
    // breadcrumb disconnected from the sibling list below it. Deliberately
    // NOT fanning out every ancestor's own siblings too (each ancestor is
    // one plain row) -- this graph has single levels with thousands of
    // children elsewhere, so a path that happened to pass through one of
    // those would render unboundedly if every level fanned out.
    var content = innerRows;
    for (var i = chain.length - 1; i >= 0; i--) {
      var ancestor = chain[i];
      var wrap = el("div", {});
      var ancestorRow = el("div", { class: "hierarchy-row ancestor" });
      var aBtn = el("button", { class: "hierarchy-link", text: ancestor.label });
      aBtn.addEventListener("click", (function (u, l) { return function () { navigate(u, { label: l, preserveScroll: true }); }; })(ancestor.uri, ancestor.label));
      ancestorRow.appendChild(aBtn);
      wrap.appendChild(ancestorRow);
      var nested = el("div", { class: "hierarchy-children" });
      nested.appendChild(content);
      wrap.appendChild(nested);
      content = wrap;
    }

    var card = el("div", { class: "hierarchy-tree" });
    card.appendChild(content);
    return card;
  }

  function truncateChain(chain) {
    if (chain.length <= 4) return chain;
    return [chain[0], { uri: null, label: "…" }, chain[chain.length - 2], chain[chain.length - 1]];
  }

  function breadcrumbEl(chain, className) {
    var nav = el("div", { class: className });
    truncateChain(chain).forEach(function (node, i) {
      if (i > 0) nav.appendChild(el("span", { class: "breadcrumb-sep", text: "›" }));
      if (!node.uri) { nav.appendChild(el("span", { class: "breadcrumb-ellipsis", text: node.label })); return; }
      var seg = el("button", { class: "breadcrumb-link", text: node.label });
      seg.addEventListener("click", function (e) { e.stopPropagation(); navigate(node.uri, { label: node.label }); });
      nav.appendChild(seg);
    });
    return nav;
  }

  function textBreadcrumb(chain) {
    return truncateChain(chain).map(function (n) { return n.label; }).join(" › ");
  }

  function resultCardEl(it) {
    var card = el("button", { class: "result-card" });
    card.appendChild(el("div", { class: "result-label", text: it.label }));
    var meta = el("div", { class: "result-meta" });
    (it.extraPills || []).slice(0, 3).forEach(function (t) { meta.appendChild(el("span", { class: "type-pill", text: t })); });
    meta.appendChild(el("span", { class: "uri-sub", text: shortLabel(it.uri) }));
    card.appendChild(meta);
    card.addEventListener("click", function () { navigate(it.uri, { label: it.label }); });
    return card;
  }

  function renderCardGroup(container, items, shown) {
    while (container.children.length > 0) {
      container.removeChild(container.lastChild);
    }
    var page = items.slice(0, shown + PAGE_SIZE);
    var cardByUri = {};
    page.forEach(function (it) {
      var card = resultCardEl(it);
      container.appendChild(card);
      if (HIERARCHICAL_TYPES[it.typeCurie]) cardByUri[it.uri] = card;
    });

    // Where it sits in the hierarchy (collection > series > ... for archive
    // components, catalog for datasets) -- read-only text here, since these
    // cards are themselves clickable buttons and a button can't nest
    // another one; the full clickable trail is one click away, on the
    // record page.
    var hierarchyUris = Object.keys(cardByUri);
    if (hierarchyUris.length) {
      fetchAncestorChains(hierarchyUris).then(function (chains) {
        hierarchyUris.forEach(function (u) {
          if (!chains[u] || !chains[u].length) return;
          var card = cardByUri[u];
          if (!card || !card.isConnected) return;
          var label = card.querySelector(".result-label");
          label.insertAdjacentElement("afterend", el("div", { class: "result-breadcrumb", text: textBreadcrumb(chains[u]) }));
        });
      });
    }
    if (page.length < items.length) {
      var pager = el("div", { class: "pager-row" });
      var btn = el("button", { class: "pager-btn", text: "Show " + Math.min(PAGE_SIZE, items.length - page.length) + " more" });
      btn.addEventListener("click", function () { renderCardGroup(container, items, shown + PAGE_SIZE); });
      pager.appendChild(btn);
      container.appendChild(pager);
    }
  }

  // ---------- Search ----------

  var searchDebounce = null;

  searchInput.addEventListener("input", function () {
    var term = searchInput.value.trim();
    clearTimeout(searchDebounce);
    if (term.length < 2) { if (!term) navigateHome(); return; }
    searchDebounce = setTimeout(function () { runSearch(term); }, 380);
  });

  searchInput.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { searchInput.value = ""; navigateHome(); }
    if (e.key === "Enter") { clearTimeout(searchDebounce); runSearch(searchInput.value.trim()); }
  });

  // opts.fromHash: the term came from the URL (back/forward, a shared
  // link), so don't write it back. Otherwise record it as #search:<term>
  // -- replacing, not stacking, while the user is still refining the same
  // search (the rail box searches as you type).
  function runSearch(term, opts) {
    if (term.length < 2) return;
    if (!(opts && opts.fromHash)) {
      var hash = "#search:" + encodeURIComponent(term);
      if (/^#search:/.test(location.hash)) history.replaceState({ search: term }, "", hash);
      else history.pushState({ search: term }, "", hash);
    }
    currentUri = null;
    renderTrail();
    searchSpinner.classList.add("active");
    clear(mainEl);
    mainEl.appendChild(el("div", { class: "results-heading", text: "Searching for \u201c" + term + "\u201d\u2026" }));

    var esc = escLiteral(term.toLowerCase());
    // Excludes identity-etl's bare hub IRIs (https://iisg.amsterdam/id/<n>,
    // no type segment, unlike id/dataset/, id/collection/, ... elsewhere in
    // this graph) -- every one of its 555k+ hubs carries the same sdo:name
    // as the real record(s) it links, so without this every search would
    // surface a redundant, content-free hub hit alongside the real one.
    // Same for iisg-iiif's manifests (https://access.iisg.amsterdam/iiif/...),
    // each named exactly like the record it illustrates.
    var q = "PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>\n" +
      "SELECT DISTINCT ?s ?label ?type WHERE {\n" +
      "  { ?s <http://schema.org/name> ?label }\n" +
      "  UNION { ?s <https://schema.org/name> ?label }\n" +
      "  UNION { ?s rdfs:label ?label }\n" +
      "  FILTER(CONTAINS(LCASE(STR(?label)), \"" + esc + "\"))\n" +
      "  FILTER(!REGEX(STR(?s), \"^https://iisg\\\\.amsterdam/id/[0-9]+$\"))\n" +
      "  FILTER(!STRSTARTS(STR(?s), \"https://access.iisg.amsterdam/iiif/\"))\n" +
      "  OPTIONAL { ?s a ?type }\n" +
      "} LIMIT 300";

    sparql(q).then(function (rows) {
      searchSpinner.classList.remove("active");
      renderSearchResults(term, rows);
    }).catch(function (err) {
      searchSpinner.classList.remove("active");
      clear(mainEl);
      renderError("Search failed: " + err.message, function () { runSearch(term); });
    });
  }

  function primaryTypeCurie(typeCuries) {
    for (var i = 0; i < VIEW_DISPATCH.length; i++) {
      if (typeCuries.indexOf(VIEW_DISPATCH[i].type) !== -1) return VIEW_DISPATCH[i].type;
    }
    return typeCuries[0] || null;
  }

  function renderSearchResults(term, rows) {
    clear(mainEl);
    var byUri = {};
    rows.forEach(function (r) {
      var uri = r.s.value;
      if (!byUri[uri]) byUri[uri] = { uri: uri, label: r.label ? r.label.value : uri, types: [] };
      if (r.type) {
        var t = curie(r.type.value) || shortLabel(r.type.value);
        if (byUri[uri].types.indexOf(t) === -1) byUri[uri].types.push(t);
      }
    });
    var list = Object.keys(byUri).map(function (k) { return byUri[k]; });
    var lower = term.toLowerCase();
    list.sort(function (a, b) {
      var ea = a.label.toLowerCase() === lower ? 0 : a.label.toLowerCase().indexOf(lower) === 0 ? 1 : 2;
      var eb = b.label.toLowerCase() === lower ? 0 : b.label.toLowerCase().indexOf(lower) === 0 ? 1 : 2;
      if (ea !== eb) return ea - eb;
      return a.label.length - b.label.length;
    });
    list = list.slice(0, 150);

    if (!list.length) {
      mainEl.appendChild(el("div", { class: "results-heading", text: "No matches for \u201c" + term + "\u201d" }));
      mainEl.appendChild(el("p", { class: "column-empty", text: "Try a shorter or differently spelled term \u2014 search matches schema:name and rdfs:label exactly as recorded." }));
      return;
    }

    var items = list.map(function (item) {
      var primary = primaryTypeCurie(item.types);
      var extra = item.types.filter(function (t) { return t !== primary; });
      return { uri: item.uri, label: item.label, typeCurie: primary, extraPills: extra };
    });
    renderResultList("Matches for \u201c" + term + "\u201d", items);
  }

  // ---------- Entity record ----------

  // The "Loading record\u2026" wipe used to fire synchronously, the instant
  // loadEntity() was called -- clearing the whole page before a single
  // byte had come back. For a local QLever instance that's usually well
  // under the time it takes to notice, so on every navigation (including
  // a hierarchy-tree sibling click, which has no "unfold" of its own to
  // fall back on) it read as a jarring full-page reload regardless of how
  // fast the actual fetch was. Now the old content just stays on screen
  // while the new one loads in the background, and the swap only happens
  // once renderRecord() is ready to show it in one shot -- for the common
  // fast case there's no intermediate blank state at all. The loading
  // placeholder still shows, but only after a grace period, so a slow
  // query (cold cache, network hiccup) still gives feedback instead of
  // leaving a click looking like it did nothing. That grace period is
  // generous (1200ms, not a snappier-looking few hundred ms) because
  // renderRecord now waits for everything up front, hierarchy-tree data
  // included (see fetchHierarchyTreeData) -- a hierarchy-tree leaf click
  // alone is already two sequential round trips (expandableHierarchyRowEl
  // checking for children first, then the navigation itself), so a
  // shorter threshold was tripping on perfectly normal interactions, not
  // actually slow ones -- clearing the page via this exact timer was
  // itself the remaining cause of a visible "reload" flash.
  function loadEntity(uri) {
    var loadingTimer = setTimeout(function () {
      if (currentUri !== uri) return;
      clear(mainEl);
      mainEl.appendChild(el("div", { class: "results-heading", text: "Loading record\u2026" }));
    }, 1200);

    // Everything the entity itself asserts, fetched in one shot (bounded --
    // this is the record's own fields, not its potentially huge fan-in).
    var factsQuery = "PREFIX schema: <http://schema.org/>\n" +
      "PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>\n" +
      "SELECT ?p ?o (SAMPLE(?lbl) AS ?label) WHERE {\n" +
      "  " + iriRef(uri) + " ?p ?o .\n" +
      "  OPTIONAL { ?o <http://schema.org/name> ?n1 }\n" +
      "  OPTIONAL { ?o <https://schema.org/name> ?n2 }\n" +
      "  OPTIONAL { ?o rdfs:label ?n3 }\n" +
      "  OPTIONAL { ?o <http://schema.org/roleName> ?n4 }\n" +
      "  OPTIONAL { ?o <https://schema.org/roleName> ?n5 }\n" +
      "  BIND(COALESCE(?n1, ?n2, ?n3, ?n4, ?n5) AS ?lbl)\n" +
      "} GROUP BY ?p ?o LIMIT 3000";

    // "Incoming" (sources breakdown + per-predicate counts) merges across
    // this entity's whole identity cluster -- a work pointing at this
    // person's ORCID URI should count as incoming even while looking at
    // their library-authority URI. "Outgoing" (this record's own facts,
    // ?p1 ?o1 above) deliberately stays single-URI: that's this specific
    // node's own asserted data, not something sdo:sameAs should merge.
    return Promise.all([
      sparql(factsQuery),
      fetchIdentityCluster(uri)
    ]).then(function (results) {
      if (currentUri !== uri) return; // navigated elsewhere while this was in flight
      var factRows = results[0], cluster = results[1];
      var valuesFrag = valuesClause("?target", cluster);

      var sourcesQuery = "SELECT ?g (COUNT(*) AS ?c) WHERE {\n" +
        "  { GRAPH ?g { " + iriRef(uri) + " ?p1 ?o1 } }\n" +
        "  UNION { " + valuesFrag + "    GRAPH ?g { ?s1 ?p2 ?target } }\n" +
        "} GROUP BY ?g ORDER BY DESC(?c)";

      var inCountsQuery = "SELECT ?p (COUNT(*) AS ?c) WHERE {\n" +
        valuesFrag +
        "  GRAPH ?g { ?s ?p ?target }\n" +
        "} GROUP BY ?p ORDER BY DESC(?c)";

      // Fetched here, alongside everything else, rather than after
      // renderRecord has already drawn an empty hierarchy-tree box and the
      // player panel -- that gap (the box popping in a few hundred ms
      // after the rest of the page) was the actual cause of a full-page
      // navigation (a hierarchy-tree leaf, an ancestor click, Random,
      // Next) still reading as "it reloaded" even after the scroll-
      // position and sibling/child-expand-in-place fixes. Needs the type
      // to know whether there's a hierarchy tree at all, which needs
      // factRows -- can't start this any earlier than here.
      var view = pickView(extractTypeCuries(factRows));
      var needsHierarchy = !!(view && HIERARCHICAL_TYPES[view.type]);
      var hierarchyPromise = needsHierarchy ? fetchHierarchyTreeData(uri) : Promise.resolve(null);
      var preOrderPromise = (exploreMode === "archive" && needsHierarchy) ? fetchPreOrderContext(uri) : Promise.resolve(null);

      return Promise.all([
        sparql(sourcesQuery),
        sparql(inCountsQuery),
        hierarchyPromise,
        preOrderPromise
      ]).then(function (results2) {
        clearTimeout(loadingTimer);
        if (currentUri !== uri) return;
        renderRecord(uri, factRows, results2[0], results2[1], cluster, results2[2], results2[3]);
      });
    }).catch(function (err) {
      clearTimeout(loadingTimer);
      if (currentUri !== uri) return;
      clear(mainEl);
      renderError("Couldn\u2019t load this record: " + err.message, function () { loadEntity(uri); });
    });
  }

  function buildOutIndex(factRows) {
    var byPred = {}; // curie or raw pred -> array of row {value}
    var byPredRaw = {};
    factRows.forEach(function (r) {
      var key = curie(r.p.value) || r.p.value;
      if (!byPred[key]) byPred[key] = [];
      byPred[key].push(r);
      if (!byPredRaw[r.p.value]) byPredRaw[r.p.value] = [];
      byPredRaw[r.p.value].push(r);
    });
    return byPred;
  }

  function pickView(typeCuries) {
    for (var i = 0; i < VIEW_DISPATCH.length; i++) {
      if (typeCuries.indexOf(VIEW_DISPATCH[i].type) !== -1) return VIEW_DISPATCH[i];
    }
    return null;
  }

  // Just enough of renderRecord's own label/type extraction to call
  // pickView() -- needed a step earlier than renderRecord runs now (see
  // loadEntity), to decide whether to pre-fetch hierarchy data at all.
  function extractTypeCuries(factRows) {
    var typeCuries = [];
    factRows.forEach(function (r) {
      if (curie(r.p.value) === "rdf:type") typeCuries.push(curie(r.o.value) || r.o.value);
    });
    return typeCuries;
  }

  // The {chain, nbhd, groupContext} a hierarchical record's breadcrumb and
  // tree need -- split out of renderRecord so loadEntity can fetch it
  // ahead of the render instead of after.
  function fetchHierarchyTreeData(uri) {
    return fetchAncestorChains([uri]).then(function (chains) {
      var chain = chains[uri] || [];
      var parentUri = chain.length ? chain[chain.length - 1].uri : null;
      return Promise.all([
        fetchHierarchyNeighborhood(uri, parentUri),
        parentUri ? fetchGroupContext(parentUri) : Promise.resolve(null)
      ]).then(function (results) {
        var nbhd = results[0], groupContext = results[1];
        if (!chain.length && !nbhd.children.length) return null; // nothing hierarchical to show
        return { chain: chain, nbhd: nbhd, groupContext: groupContext };
      });
    });
  }

  // ---------- IIIF images (iisg-iiif) ----------
  // A findingaid-etl or biblio-etl record that's been digitized carries
  // iisgv:iiifManifest and a 200px sdo:thumbnailUrl. iisg-iiif's
  // manifest-harvest version also gave one sdo:image per page; each page
  // an sdo:ImageObject with an IIIF Image API base (iisgv:iiifImageService),
  // pixel width/height (QuantitativeValue nodes) and an iisgv:accessLevel.
  // Requiring the image service is what keeps events-etl's plain poster
  // images (sdo:image too, no service) out of this path. Also matches a
  // page itself, so landing on one from the statement list still shows
  // the picture. Without pages (the current iisg-iiif), the record's
  // thumbnail stands in: one preview per manifest (fetchRecordPreviews).
  var IIIF_SIZE_STEPS = [400, 800, 1200, 1600, 2400];
  var IIIF_THUMB_SUFFIX = /\/full\/[^/]+\/0\/default\.jpg$/;
  var UNIVERSAL_VIEWER = "https://access.iisg.amsterdam/universalviewer/#?manifest=";

  // The record's thumbnail is itself an IIIF Image API URL
  // (.../iiif/image/{id}/full/200,/0/default.jpg), so its base serves any
  // other size of that first image too. A record with several manifests
  // (a biblio item with more than one 856) has a thumbnail per manifest,
  // paired up by the {id} both are named after, and shown in the order
  // the catalogue lists them (the manifest's sdo:position: volume 1, 2, ...).
  function fetchRecordPreviews(uri) {
    var q = "PREFIX schema: <https://schema.org/>\n" +
      "PREFIX iisgv: <https://iisg.amsterdam/vocab/>\n" +
      "SELECT ?m ?thumb ?pos WHERE {\n" +
      "  " + iriRef(uri) + " iisgv:iiifManifest ?m ; schema:thumbnailUrl ?thumb .\n" +
      "  OPTIONAL { ?m schema:position ?pos }\n" +
      "} ORDER BY (!BOUND(?pos)) ?pos ?m";
    return sparql(q).then(function (rows) {
      return rows.filter(function (r) {
        var id = r.m.value.match(/\/presentation\/([^/]+)\/manifest$/);
        return id && r.thumb.value.indexOf("/image/" + id[1] + "/") !== -1 && IIIF_THUMB_SUFFIX.test(r.thumb.value);
      }).map(function (r) {
        return {
          canvas: null, manifest: r.m.value, pos: r.pos ? parseInt(r.pos.value, 10) : 0,
          service: r.thumb.value.replace(IIIF_THUMB_SUFFIX, ""),
          thumb: r.thumb.value, full: null, width: null, height: null,
          level: null, conditions: null, credit: null, preview: true
        };
      }).filter(function (img) { return isLocalUri(img.service); });
    });
  }

  function fetchRecordImages(uri) {
    var q = "PREFIX schema: <https://schema.org/>\n" +
      "PREFIX iisgv: <https://iisg.amsterdam/vocab/>\n" +
      "SELECT ?c (SAMPLE(?m0) AS ?m) (SAMPLE(?pos0) AS ?pos) (SAMPLE(?svc0) AS ?svc) (SAMPLE(?thumb0) AS ?thumb)\n" +
      "       (SAMPLE(?full0) AS ?full) (SAMPLE(?w0) AS ?w) (SAMPLE(?h0) AS ?h) (SAMPLE(?level0) AS ?level)\n" +
      "       (SAMPLE(?cond0) AS ?cond) (SAMPLE(?credit0) AS ?credit) WHERE {\n" +
      "  { " + iriRef(uri) + " schema:image ?c } UNION { BIND(" + iriRef(uri) + " AS ?c) }\n" +
      "  ?c iisgv:iiifImageService ?svc0 .\n" +
      "  OPTIONAL { ?c schema:isPartOf ?m0 . OPTIONAL { ?m0 schema:creditText ?credit0 } }\n" +
      "  OPTIONAL { ?c schema:position ?pos0 }\n" +
      "  OPTIONAL { ?c schema:thumbnailUrl ?thumb0 }\n" +
      "  OPTIONAL { ?c schema:contentUrl ?full0 }\n" +
      "  OPTIONAL { ?c schema:width/schema:value ?w0 }\n" +
      "  OPTIONAL { ?c schema:height/schema:value ?h0 }\n" +
      "  OPTIONAL { ?c iisgv:accessLevel ?level0 }\n" +
      "  OPTIONAL { ?c schema:conditionsOfAccess ?cond0 }\n" +
      "} GROUP BY ?c";
    return sparql(q).then(function (rows) {
      var images = rows.map(function (r) {
        var v = function (k) { return r[k] ? r[k].value : null; };
        var level = v("level");
        return {
          canvas: v("c"),
          manifest: v("m"),
          pos: v("pos") ? parseInt(v("pos"), 10) : 0,
          service: v("svc").replace(/\/+$/, ""),
          thumb: v("thumb"),
          full: v("full"),
          width: v("w") ? parseInt(v("w"), 10) : null,
          height: v("h") ? parseInt(v("h"), 10) : null,
          level: level ? level.replace(/^.*\//, "") : null,
          conditions: v("cond"),
          credit: v("credit")
        };
      }).filter(function (img) { return isLocalUri(img.service); });
      // Several manifests on one record (a biblio item with more than one
      // 856) keep their own page order, one manifest after the other.
      images.sort(function (a, b) {
        if (a.manifest !== b.manifest) return (a.manifest || "") < (b.manifest || "") ? -1 : 1;
        return a.pos - b.pos;
      });
      return images.length ? images : fetchRecordPreviews(uri);
    });
  }

  // Never the master scan (contentUrl is full/full -- up to ~6600x9400px):
  // ask the image server for the size this slot actually shows, rounded up
  // to a few fixed steps so the browser cache gets hits across views. A
  // capped image (pictoright/restricted) is handled server-side -- it
  // redirects an oversized request to the largest copy the public may see.
  function iiifSizedUrl(img, cssPx) {
    var want = cssPx * (window.devicePixelRatio || 1);
    var px = IIIF_SIZE_STEPS[IIIF_SIZE_STEPS.length - 1];
    for (var i = 0; i < IIIF_SIZE_STEPS.length; i++) {
      if (IIIF_SIZE_STEPS[i] >= want) { px = IIIF_SIZE_STEPS[i]; break; }
    }
    return img.service + "/full/!" + px + "," + px + "/0/default.jpg";
  }

  // IISG's image server, when down, tends to hang rather than refuse --
  // no error event for minutes. So a slot that's still empty after this
  // long shows imageUnavailableEl's "not reachable" stand-in; the real
  // image still replaces it if it lands later.
  var IMAGE_STALL_MS = 8000;

  var IMAGE_OFF_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 15l-5-5-4 4"/><line x1="3" y1="3" x2="21" y2="21"/></svg>';

  // Returns the stand-in element plus show(reason): "stalled" (server not
  // answering) or "failed" (this one scan errored), or null to hide it.
  function imageUnavailableEl() {
    var icon = el("span", {});
    icon.innerHTML = IMAGE_OFF_ICON;
    var title = el("strong", {});
    var body = el("span", {});
    var box = el("div", { class: "media-unavailable", role: "status", hidden: "" }, [icon.firstChild, title, body]);
    return {
      el: box,
      show: function (reason) {
        if (!reason) { box.hidden = true; return; }
        title.textContent = reason === "stalled" ? "Image server not reachable" : "Image not available";
        body.textContent = reason === "stalled"
          ? "IISG’s image server (access.iisg.amsterdam) isn’t responding right now. The scan will appear here once it’s back."
          : "This scan couldn’t be loaded from IISG’s image server.";
        box.hidden = false;
      }
    };
  }

  function imageAccessNote(img) {
    if (!img.level || img.level === "open") return null;
    return el("span", { class: "media-note", title: img.conditions || "", text: "Reduced size (rights)" });
  }

  function mediaThumbEl(img, i, total, label) {
    var b = el("button", { class: "media-thumb", type: "button", "aria-label": "Image " + (i + 1) + " of " + total });
    var t = el("img", { src: img.thumb || iiifSizedUrl(img, 64), alt: "", loading: "lazy" });
    t.onerror = function () { t.remove(); };
    b.appendChild(t);
    return b;
  }

  // Gallery column of a record page: one large image, a meta line and a
  // scrollable strip of every page. A strip click swaps the large image;
  // clicking the large image opens the lightbox at that page. ctx carries
  // the record's label and its Universal Viewer link (LINKOUT_FIELDS).
  function renderRecordImages(container, images, ctx) {
    clear(container);
    var selected = 0;
    var main = el("button", { class: "media-main", type: "button" });
    var mainImg = el("img", { alt: "" });
    var unavailable = imageUnavailableEl();
    var stallTimer = null;
    main.appendChild(mainImg);
    main.appendChild(unavailable.el);
    container.appendChild(main);

    function showUnavailable(reason) {
      clearTimeout(stallTimer);
      mainImg.hidden = !!reason;
      unavailable.show(reason);
    }

    var meta = el("div", { class: "media-meta" });
    // Previews (fetchRecordPreviews) are each manifest's first image only,
    // not a page count: every page is in the viewer.
    var countText = images[0].preview
      ? (images.length === 1 ? "First image" : "First image of " + fmtNum(images.length) + " scanned items")
      : images.length === 1 ? "1 image" : fmtNum(images.length) + " images";
    meta.appendChild(el("span", { text: countText }));
    var noteSlot = el("span", {});
    meta.appendChild(noteSlot);
    // Follows the selected image (select()), since each preview can be a
    // manifest of its own. The way to every page is the lightbox's
    // Universal Viewer link.
    var manifestLink = el("a", { target: "_blank", rel: "noopener", title: "IIIF Presentation manifest -- open in any IIIF viewer", text: "IIIF manifest ↗" });
    meta.appendChild(manifestLink);
    function linkManifest(m) {
      var ok = !!m && isSafeHref(m);
      manifestLink.hidden = !ok;
      if (ok) manifestLink.href = m;
    }
    container.appendChild(meta);

    var strip = null, thumbs = [];
    if (images.length > 1) {
      strip = el("div", { class: "media-strip" });
      images.forEach(function (img, i) {
        var b = mediaThumbEl(img, i, images.length, ctx.label);
        b.addEventListener("click", function () { select(i); });
        thumbs.push(b);
        strip.appendChild(b);
      });
      container.appendChild(strip);
    }

    function select(i) {
      selected = i;
      var img = images[i];
      showUnavailable(null);
      stallTimer = setTimeout(function () {
        if (!mainImg.naturalWidth) showUnavailable("stalled");
      }, IMAGE_STALL_MS);
      mainImg.src = iiifSizedUrl(img, 420);
      mainImg.alt = ctx.label + (images.length > 1 ? " — image " + (i + 1) + " of " + images.length : "");
      main.setAttribute("aria-label", "Open image " + (i + 1) + " of " + images.length + " full screen");
      clear(noteSlot);
      var note = imageAccessNote(img);
      if (note) noteSlot.appendChild(note);
      linkManifest(img.manifest);
      thumbs.forEach(function (t, j) { t.setAttribute("aria-current", j === i ? "true" : "false"); });
    }
    mainImg.onload = function () { showUnavailable(null); };
    mainImg.onerror = function () {
      // Sized request failed -- fall back to the 200px thumbnail once.
      var img = images[selected];
      if (img.thumb && mainImg.src !== img.thumb) mainImg.src = img.thumb;
      else showUnavailable("failed");
    };
    function openAt(i) {
      openImageLightbox(images, i, ctx, function (lastIndex, leaving) {
        if (leaving) return;
        select(lastIndex);
        if (thumbs[lastIndex]) thumbs[lastIndex].scrollIntoView({ block: "nearest", inline: "nearest" });
        main.focus({ preventScroll: true });
      });
    }
    main.addEventListener("click", function () { openAt(selected); });
    select(0);
    var pending = pendingLightbox;
    pendingLightbox = null;
    if (pending && pending.uri === ctx.uri && Date.now() - pending.at < 15000) {
      openAt(pending.last ? images.length - 1 : 0);
    }
  }

  // ---------- Browsing across digitized records ----------
  // Direct children of an archive node that hold scans somewhere below
  // them, each with one representative thumbnail and a count -- a strip
  // to walk down a collection by, one level at a time, rather than one
  // flat list of up to ~6,700 items that couldn't be sorted sensibly
  // (EAD component IRIs sort as text: 1-1-10 before 1-1-2). Digitized
  // descendants are found first, then mapped to their child-of-uri
  // ancestor: the other way round (per child, walk down) took ~10s on the
  // largest archives, this order ~0.15s.
  var DIGITIZED_CARD_LIMIT = 400;

  function fetchDigitizedChildren(uri) {
    var part = "(<http://schema.org/isPartOf>|<https://schema.org/isPartOf>)";
    var q = "SELECT ?c (SAMPLE(?p0) AS ?pos) (SAMPLE(?n0) AS ?name) (SAMPLE(?t) AS ?thumb) (COUNT(DISTINCT ?d) AS ?n) WHERE {\n" +
      "  { SELECT ?d ?t WHERE { ?d " + part + "+ " + iriRef(uri) + " . ?d <https://schema.org/thumbnailUrl> ?t } }\n" +
      "  { ?c <http://schema.org/isPartOf> " + iriRef(uri) + " } UNION { ?c <https://schema.org/isPartOf> " + iriRef(uri) + " }\n" +
      "  ?d " + part + "* ?c .\n" +
      "  OPTIONAL { { ?c <http://schema.org/position> ?p0 } UNION { ?c <https://schema.org/position> ?p0 } }\n" +
      "  OPTIONAL { { ?c <http://schema.org/name> ?n0 } UNION { ?c <https://schema.org/name> ?n0 } }\n" +
      "} GROUP BY ?c";
    return sparql(q).then(function (rows) {
      var items = rows.map(function (r) {
        return {
          uri: r.c.value,
          pos: r.pos ? parseFloat(r.pos.value) : Infinity,
          label: r.name ? tidyTitle(r.name.value) : shortLabel(r.c.value),
          thumb: r.thumb && isLocalUri(r.thumb.value) ? r.thumb.value : null,
          n: parseInt(r.n.value, 10)
        };
      });
      items.sort(function (a, b) { return a.pos - b.pos || (a.uri < b.uri ? -1 : 1); });
      return items;
    });
  }

  function renderDigitizedChildren(slot, uri) {
    fetchDigitizedChildren(uri).then(function (items) {
      if (currentUri !== uri || !items.length) return;
      var total = items.reduce(function (s, it) { return s + it.n; }, 0);
      var section = el("div", { class: "dig-section" });
      section.appendChild(el("div", { class: "dig-heading" }, [
        document.createTextNode("Digitized in this collection"),
        el("span", { text: fmtNum(total) + (total === 1 ? " item" : " items") +
          (items.length > 1 ? " in " + fmtNum(items.length) + " parts" : "") })
      ]));
      var strip = el("div", { class: "dig-strip" });
      items.slice(0, DIGITIZED_CARD_LIMIT).forEach(function (it) {
        var thumb = el("span", { class: "thumb" });
        if (it.thumb) {
          var img = el("img", { src: it.thumb, alt: "", loading: "lazy" });
          img.onerror = function () { img.remove(); };
          thumb.appendChild(img);
        }
        var card = el("button", { class: "dig-card", type: "button", title: it.label }, [
          thumb,
          el("span", { class: "t", text: it.label }),
          it.n > 1 ? el("span", { class: "m", text: fmtNum(it.n) + " digitized items" }) : null
        ]);
        card.addEventListener("click", function () { navigate(it.uri); });
        strip.appendChild(card);
      });
      section.appendChild(strip);
      if (items.length > DIGITIZED_CARD_LIMIT) {
        section.appendChild(el("div", { class: "column-empty", text: "Showing the first " + fmtNum(DIGITIZED_CARD_LIMIT) + " of " + fmtNum(items.length) + " parts." }));
      }
      slot.appendChild(section);
    }).catch(function () { /* a nice-to-have; ignore failures */ });
  }

  // Previous/next *item* for the lightbox: this record's digitized
  // siblings under the same parent, in sdo:position order -- so a photo
  // series can be paged through photo after photo without closing it.
  function fetchItemNav(uri, parentUri) {
    var q = "PREFIX iisgv: <https://iisg.amsterdam/vocab/>\n" +
      "SELECT ?s (SAMPLE(?p0) AS ?pos) (SAMPLE(?n0) AS ?name) WHERE {\n" +
      "  { ?s <http://schema.org/isPartOf> " + iriRef(parentUri) + " } UNION { ?s <https://schema.org/isPartOf> " + iriRef(parentUri) + " }\n" +
      "  ?s iisgv:iiifManifest ?m .\n" +
      "  OPTIONAL { { ?s <http://schema.org/position> ?p0 } UNION { ?s <https://schema.org/position> ?p0 } }\n" +
      "  OPTIONAL { { ?s <http://schema.org/name> ?n0 } UNION { ?s <https://schema.org/name> ?n0 } }\n" +
      "} GROUP BY ?s";
    return sparql(q).then(function (rows) {
      var items = rows.map(function (r) {
        return { uri: r.s.value, pos: r.pos ? parseFloat(r.pos.value) : Infinity, label: r.name ? tidyTitle(r.name.value) : shortLabel(r.s.value) };
      });
      items.sort(function (a, b) { return a.pos - b.pos || (a.uri < b.uri ? -1 : 1); });
      var i = items.map(function (it) { return it.uri; }).indexOf(uri);
      if (i === -1) return null;
      return { prev: items[i - 1] || null, next: items[i + 1] || null, index: i, total: items.length };
    }).catch(function () { return null; });
  }

  // Set just before navigating from one item's lightbox to the next, so
  // that item's gallery reopens the lightbox straight away (at its first
  // image, or its last when paging backwards). Expires quickly, so a slow
  // or failed load never pops a lightbox open on some later visit.
  var pendingLightbox = null;

  var activeLightbox = null;

  // Full-screen carousel over one record's images: arrow keys / swipe /
  // buttons to page, Esc or a click on the dark surround to close. Shows
  // the 200px thumbnail (blurred) at once and swaps in the screen-sized
  // copy when it lands, preloading both neighbours meanwhile. onClose gets
  // the index last shown, so the record page follows along.
  function openImageLightbox(images, start, ctx, onClose) {
    if (activeLightbox) activeLightbox.close();
    var index = start;
    var loadToken = 0;
    var lastFocus = document.activeElement;
    var prevOverflow = document.body.style.overflow;

    var box = el("div", { class: "lightbox", role: "dialog", "aria-modal": "true", "aria-label": "Images: " + ctx.label });
    var count = el("span", { class: "lb-count", "aria-live": "polite" });
    var closeBtn = el("button", { class: "lb-btn", type: "button", "aria-label": "Close", title: "Close (Esc)", text: "×" });
    var itemPrevBtn = el("button", { class: "lb-item", type: "button", hidden: "", text: "‹ Previous item" });
    var itemNextBtn = el("button", { class: "lb-item", type: "button", hidden: "", text: "Next item ›" });
    box.appendChild(el("div", { class: "lb-top" }, [count, el("span", { class: "lb-title", text: ctx.label }), itemPrevBtn, itemNextBtn, closeBtn]));

    // Neighbouring digitized items in the same series, once known.
    var itemNav = null;
    if (ctx.itemNav) ctx.itemNav.then(function (nav) {
      if (activeLightbox !== handle || !nav) return;
      itemNav = nav;
      if (nav.prev) { itemPrevBtn.hidden = false; itemPrevBtn.title = nav.prev.label; }
      if (nav.next) { itemNextBtn.hidden = false; itemNextBtn.title = nav.next.label; }
      show(index); // refresh the caption's "item n of m"
    });

    function goToItem(item, last) {
      pendingLightbox = { uri: item.uri, last: !!last, at: Date.now() };
      close(true);
      navigate(item.uri, { preserveScroll: true });
    }
    itemPrevBtn.addEventListener("click", function () { goToItem(itemNav.prev, false); });
    itemNextBtn.addEventListener("click", function () { goToItem(itemNav.next, false); });

    // Arrow keys / swipe / ‹ › step through images, and past either end
    // into the neighbouring item when there is one; wrap around otherwise.
    function step(delta) {
      var target = index + delta;
      if (target >= images.length && itemNav && itemNav.next) return goToItem(itemNav.next, false);
      if (target < 0 && itemNav && itemNav.prev) return goToItem(itemNav.prev, true);
      if (images.length > 1) show(target);
    }

    var stage = el("div", { class: "lb-stage" });
    var img = el("img", { class: "lb-img", alt: "", draggable: "false" });
    var prevBtn = el("button", { class: "lb-btn lb-prev", type: "button", "aria-label": "Previous image", text: "‹" });
    var nextBtn = el("button", { class: "lb-btn lb-next", type: "button", "aria-label": "Next image", text: "›" });
    var unavailable = imageUnavailableEl();
    var stallTimer = null;
    stage.appendChild(img);
    stage.appendChild(unavailable.el);
    if (images.length > 1 || ctx.itemNav) { stage.appendChild(prevBtn); stage.appendChild(nextBtn); }
    box.appendChild(stage);

    var caption = el("div", { class: "lb-caption" });
    box.appendChild(caption);

    var thumbs = [];
    if (images.length > 1) {
      var strip = el("div", { class: "lb-strip" });
      images.forEach(function (im, i) {
        var b = mediaThumbEl(im, i, images.length, ctx.label);
        b.addEventListener("click", function () { show(i); });
        thumbs.push(b);
        strip.appendChild(b);
      });
      box.appendChild(strip);
    }

    function stageSize() {
      return Math.max(stage.clientWidth, stage.clientHeight, 400);
    }

    function show(i) {
      index = (i + images.length) % images.length;
      var im = images[index];
      var token = ++loadToken;
      count.textContent = fmtNum(index + 1) + " / " + fmtNum(images.length);
      img.alt = ctx.label + " — image " + (index + 1) + " of " + images.length;
      var large = iiifSizedUrl(im, stageSize());
      clearTimeout(stallTimer);
      unavailable.show(null);
      img.style.visibility = "";
      stallTimer = setTimeout(function () {
        // Only when nothing at all is showing -- a blurred thumbnail
        // waiting on its sharp copy is still worth looking at.
        if (token === loadToken && !img.naturalWidth) {
          img.style.visibility = "hidden";
          unavailable.show("stalled");
        }
      }, IMAGE_STALL_MS);
      if (im.thumb) {
        img.src = im.thumb;
        img.classList.add("loading");
        // Stretch the 200px placeholder to where the real image will sit,
        // so the swap doesn't jump. Only when the scan's own pixel size is
        // known; a capped copy may still land smaller than this.
        if (im.width && im.height) {
          var cs = getComputedStyle(stage);
          var boxW = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
          var scale = Math.min(boxW / im.width, stage.clientHeight / im.height, 1);
          img.style.width = Math.round(im.width * scale) + "px";
          img.style.height = Math.round(im.height * scale) + "px";
        }
      }
      var loader = new Image();
      function settle() {
        img.classList.remove("loading");
        img.style.width = "";
        img.style.height = "";
      }
      loader.onload = function () {
        if (token !== loadToken) return;
        clearTimeout(stallTimer);
        unavailable.show(null);
        img.style.visibility = "";
        img.src = large;
        settle();
      };
      loader.onerror = function () {
        if (token !== loadToken) return;
        settle();
        if (!img.naturalWidth) {
          clearTimeout(stallTimer);
          img.style.visibility = "hidden";
          unavailable.show("failed");
        }
      };
      loader.src = large;
      [index - 1, index + 1].forEach(function (n) {
        if (images.length > 1) new Image().src = iiifSizedUrl(images[(n + images.length) % images.length], stageSize());
      });

      clear(caption);
      if (images.length > 1) caption.appendChild(el("span", { text: "Image " + fmtNum(index + 1) + " of " + fmtNum(images.length) }));
      if (itemNav && itemNav.total > 1) caption.appendChild(el("span", { text: "Item " + fmtNum(itemNav.index + 1) + " of " + fmtNum(itemNav.total) + " in this series" }));
      if (im.width && im.height) caption.appendChild(el("span", { text: "Scan " + fmtNum(im.width) + " × " + fmtNum(im.height) + " px" }));
      var note = imageAccessNote(im);
      if (note) caption.appendChild(note);
      if (im.credit) caption.appendChild(el("span", { text: im.credit }));
      if (im.level === "open" && im.full && isSafeHref(im.full)) {
        caption.appendChild(el("a", { href: im.full, target: "_blank", rel: "noopener", text: "Full-size image ↗" }));
      }
      // The image's own manifest in the Universal Viewer; the record's
      // linkout (often IISG's catalogue page, not a viewer) only without one.
      var viewer = im.manifest && isSafeHref(im.manifest) ? UNIVERSAL_VIEWER + im.manifest : ctx.viewerUrl;
      if (viewer && isSafeHref(viewer)) {
        caption.appendChild(el("a", { href: viewer, target: "_blank", rel: "noopener", text: im.preview ? "All pages in Universal Viewer ↗" : "Universal Viewer ↗" }));
      }
      thumbs.forEach(function (t, j) { t.setAttribute("aria-current", j === index ? "true" : "false"); });
      if (thumbs[index]) thumbs[index].scrollIntoView({ block: "nearest", inline: "nearest" });
    }

    function onKey(e) {
      if (e.key === "Escape") { e.preventDefault(); close(); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); step(-1); }
      else if (e.key === "ArrowRight") { e.preventDefault(); step(1); }
      else if (e.key === "PageUp" && itemNav && itemNav.prev) { e.preventDefault(); goToItem(itemNav.prev, false); }
      else if (e.key === "PageDown" && itemNav && itemNav.next) { e.preventDefault(); goToItem(itemNav.next, false); }
      else if (e.key === "Home") { e.preventDefault(); show(0); }
      else if (e.key === "End") { e.preventDefault(); show(images.length - 1); }
      else if (e.key === "Tab") {
        // Keep focus inside the dialog.
        var f = Array.prototype.filter.call(box.querySelectorAll("button, a[href]"), function (n) { return n.offsetParent !== null; });
        if (!f.length) return;
        var first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    }

    // leaving: true when closing only to open the neighbouring item --
    // the record page underneath is about to be replaced anyway.
    function close(leaving) {
      if (activeLightbox !== handle) return;
      activeLightbox = null;
      clearTimeout(stallTimer);
      document.removeEventListener("keydown", onKey, true);
      window.removeEventListener("hashchange", close);
      window.removeEventListener("popstate", close);
      box.remove();
      document.body.style.overflow = prevOverflow;
      if (onClose) onClose(index, leaving === true);
      else if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
    }

    // Swipe on touch screens; a plain click on the dark surround closes.
    var touchX = null;
    stage.addEventListener("pointerdown", function (e) { if (e.pointerType !== "mouse") touchX = e.clientX; });
    stage.addEventListener("pointerup", function (e) {
      if (touchX === null) return;
      var dx = e.clientX - touchX;
      touchX = null;
      if (Math.abs(dx) > 40) step(dx < 0 ? 1 : -1);
    });
    stage.addEventListener("click", function (e) { if (e.target === stage) close(); });
    closeBtn.addEventListener("click", close);
    prevBtn.addEventListener("click", function () { step(-1); });
    nextBtn.addEventListener("click", function () { step(1); });

    var handle = { close: close };
    activeLightbox = handle;
    document.addEventListener("keydown", onKey, true);
    window.addEventListener("hashchange", close);
    window.addEventListener("popstate", close);
    document.body.style.overflow = "hidden";
    document.body.appendChild(box);
    show(index);
    closeBtn.focus({ preventScroll: true });
  }

  function renderRecord(uri, factRows, sourceRows, inCounts, cluster, hierarchyData, preOrderCtx) {
    clear(mainEl);

    var outByPred = buildOutIndex(factRows);
    var label = null, types = [], typeCuries = [], description = null;
    factRows.forEach(function (r) {
      var pc = curie(r.p.value);
      if ((pc === "sdo:name" || r.p.value === "http://www.w3.org/2000/01/rdf-schema#label") && !label && r.o.type === "literal") label = r.o.value;
      if (pc === "rdf:type") { types.push(r.o.value); var tc = curie(r.o.value); typeCuries.push(tc || r.o.value); }
    });
    // sdo:OrganizationRole (orcid-etl) has no sdo:name of its own -- fall
    // back to its roleName ("Researcher", "Fellow", ...) as a label.
    if (!label && outByPred["sdo:roleName"] && outByPred["sdo:roleName"][0]) {
      label = outByPred["sdo:roleName"][0].o.value;
    }
    if (!label) label = uri;

    var view = pickView(typeCuries);

    pushTrail(uri, label);

    var header = el("div", { class: "record-header" });
    var breadcrumbHolder = el("div", {});
    header.appendChild(breadcrumbHolder);
    // hierarchyData and preOrderCtx (player panel's Next-walk context)
    // both arrive pre-fetched from loadEntity now, resolved alongside the
    // rest of this record's data -- not kicked off here and left to pop
    // in a few hundred ms after the rest of the page, which is what made
    // a full-page navigation still read as "it reloaded" even after the
    // scroll-position and sibling/child-expand-in-place fixes.
    var hierarchyTreeSlot = el("div", {});
    if (hierarchyData) {
      if (hierarchyData.chain.length) breadcrumbHolder.appendChild(breadcrumbEl(hierarchyData.chain, "breadcrumb"));
      hierarchyTreeSlot.appendChild(hierarchyTreeEl(
        hierarchyData.chain, uri, label,
        hierarchyData.nbhd.siblings, hierarchyData.nbhd.children, hierarchyData.groupContext
      ));
    }

    var playerPanelSlot = el("div", {});
    if (exploreMode) playerPanelSlot.appendChild(playerPanelEl(exploreMode, uri, preOrderCtx));

    // "More by this creator" -- books/images/audio/video/articles only
    // (whichever views share BOOK_FIELDS); at most 3 creators, skipping any
    // creator asserted only as a literal string (nothing to look up by).
    var creatorWorksSlot = el("div", {});
    if (view && view.fields === BOOK_FIELDS) {
      var creatorRows = (outByPred["sdo:creator"] || []).filter(function (r) { return r.o.type === "uri"; }).slice(0, 3);
      creatorRows.forEach(function (r) {
        var creatorUri = r.o.value;
        var creatorLabel = r.label ? r.label.value : shortLabel(creatorUri);
        fetchMoreByCreator(creatorUri, uri).then(function (works) {
          if (currentUri !== uri || !works.length) return;
          creatorWorksSlot.appendChild(workListEl("More by " + creatorLabel, works));
        });
      });
    }

    // Person views get the rich Explore graph (co-subjects/creations, with
    // shared-work counts and hover-ghost previews) plus the Creations/
    // Co-authored/Written-about lists below it -- the graph and the
    // Creations list need the same data, so that fetch is shared (not
    // re-issued) rather than paid for twice. Every other type still gets a
    // graph (see the else branch below), just the generic 1-hop version.
    var creationsSlot = el("div", {});
    var coCreatorsSlot = el("div", {});
    var subjectOfSlot = el("div", {});
    var graphSlot = el("div", { class: "graph-slot" });
    // Skipped entirely during an active explore session (exploreMode set)
    // -- the player panel is already the primary way to move to another
    // record there (Archive's Next even walks real isPartOf edges, same
    // as this graph would show), so the two competed for the same job.
    // Still built as normal for anything reached outside an explore
    // session (search, an outside link) -- there it's the only
    // "what's connected to this" affordance on the page.
    if (exploreMode) {
      // graphSlot stays empty -- no fetch, no card, nothing to compete
      // with the player panel.
    } else if (view && view.type === "sdo:Person") {
      var creationsPromise = fetchMoreByCreator(uri, null);
      creationsPromise.then(function (works) {
        if (currentUri !== uri || !works.length) return;
        creationsSlot.appendChild(workListEl("Creations", works));
      });
      fetchCoCreators(uri).then(function (coCreators) {
        if (currentUri !== uri || !coCreators.length) return;
        coCreatorsSlot.appendChild(coCreatorsEl(coCreators));
      });
      fetchSubjectOf(uri).then(function (works) {
        if (currentUri !== uri || !works.length) return;
        subjectOfSlot.appendChild(workListEl("Written about", works));
      });
      Promise.all([fetchCoSubjects(uri), creationsPromise]).then(function (results) {
        if (currentUri !== uri) return;
        var incoming = results[0].map(function (cs) {
          return { uri: cs.uri, label: cs.label, subtitle: cs.shared + (cs.shared === 1 ? " shared work" : " shared works"), viaUri: cs.viaUri, viaLabel: cs.viaLabel, ghostKind: "person" };
        });
        var outgoing = results[1].map(function (w) {
          return { uri: w.uri, label: w.label, subtitle: w.date, ghostKind: "work" };
        });
        graphSlot.appendChild(exploreSvgEl(label, incoming, outgoing, "written about together", "creations"));
      });
    } else {
      // Every other type: no "written about together"/"creations" concept,
      // but still a graph -- otherwise clicking a creation/work station
      // from a Person's map lands on a page with nothing further to
      // explore. See genericOutgoingNeighbors/fetchGenericIncomingNeighbors.
      var genericOutgoing = genericOutgoingNeighbors(uri, factRows);
      fetchGenericIncomingNeighbors(uri).then(function (genericIncoming) {
        if (currentUri !== uri) return;
        graphSlot.appendChild(exploreSvgEl(label, genericIncoming, genericOutgoing, "links here", "links to"));
      });
    }
    var eyebrow = el("div", { class: "record-eyebrow" });
    if (view) {
      var kindPill = el("span", { class: "view-kind-pill" });
      kindPill.appendChild(iconSpan(view.type));
      kindPill.appendChild(document.createTextNode(view.kind));
      eyebrow.appendChild(kindPill);
    }
    types.slice(0, 4).forEach(function (t) {
      var tc = curie(t) || shortLabel(t);
      if (view && tc === view.type) return;
      eyebrow.appendChild(typePillEl(tc));
    });
    // Archive/Dataset/File/research-work views already give sdo:isPartOf its
    // own hero card (often the more important "parent" relationship there);
    // everywhere else (Person and the rest of the authority family, Books,
    // the generic fallback) it's just one fact, so a compact eyebrow pill
    // next to the type pills is enough -- no need for both.
    var viewHandlesIsPartOf = view && view.fields.some(function (f) { return f.pred === "sdo:isPartOf"; });
    (viewHandlesIsPartOf ? [] : (outByPred["sdo:isPartOf"] || [])).slice(0, 2).forEach(function (r) {
      if (r.o.type !== "uri") return;
      var partOfLabel = r.label ? r.label.value : shortLabel(r.o.value);
      var pill = el("button", { class: "type-pill", title: "Part of " + partOfLabel });
      pill.appendChild(document.createTextNode("Part of: " + partOfLabel));
      pill.addEventListener("click", function () { navigate(r.o.value, { label: partOfLabel }); });
      eyebrow.appendChild(pill);
    });
    header.appendChild(eyebrow);
    if (view && view.type === "sdo:Person") {
      header.appendChild(personIdentityRowEl(label, outByPred));
      var identityFacts = personIdentityFactsEl(outByPred);
      if (identityFacts) header.appendChild(identityFacts);
    } else {
      header.appendChild(el("h1", { class: "record-title", text: label }));
    }

    // Archive components: the same place in the finding aid, as boxes and
    // folders on a reading-room desk (renderReading).
    if (view && HIERARCHICAL_TYPES[view.type] && /\/id\/collection\//.test(uri)) {
      var rrBtn = el("button", { type: "button", class: "rr-open-btn", text: "Open in the reading room" });
      rrBtn.addEventListener("click", function () { readingNavigate(uri); });
      header.appendChild(rrBtn);
    }

    var uriLine = el("div", { class: "record-uri" });
    if (isSafeHref(uri)) {
      uriLine.appendChild(el("a", { href: uri, target: "_blank", rel: "noopener", text: uri }));
    } else {
      uriLine.textContent = uri;
    }
    header.appendChild(uriLine);

    var idRow = identifiersRowEl(uri, cluster);
    if (idRow) header.appendChild(idRow);

    if (sourceRows.length) {
      var srcRow = el("div", { class: "source-row" });
      sourceRows.forEach(function (r) {
        var info = graphInfo(r.g.value);
        var chip = el("span", { class: "source-chip", title: info.sub });
        var b = document.createElement("b");
        b.textContent = info.label;
        chip.appendChild(b);
        chip.appendChild(document.createTextNode(" \u00b7 " + r.c.value));
        chip.addEventListener("click", function () { browseGraph(info); });
        srcRow.appendChild(chip);
      });
      header.appendChild(srcRow);
    }

    var totalOut = factRows.length;
    var totalIn = inCounts.reduce(function (a, r) { return a + parseInt(r.c.value, 10); }, 0);
    var statementsSection; // assigned below; the toggle button (built now) closes over it
    var statsToggle = el("button", { class: "stats-toggle", "aria-expanded": view ? "false" : "true" });
    statsToggle.appendChild(el("span", { class: "stats-toggle-chevron", text: "▸" }));
    statsToggle.appendChild(statLine(totalOut + " statements describing it"));
    statsToggle.appendChild(statLine(totalIn + " statements pointing to it"));
    statsToggle.addEventListener("click", function () {
      var expanded = statsToggle.getAttribute("aria-expanded") === "true";
      statsToggle.setAttribute("aria-expanded", expanded ? "false" : "true");
      statementsSection.classList.toggle("collapsed", expanded);
      if (!expanded) scrollToWhenStable(statementsSection, 3000);
    });
    header.appendChild(statsToggle);

    mainEl.appendChild(header);
    mainEl.appendChild(playerPanelSlot);
    mainEl.appendChild(graphSlot);

    // Event records: title bar goes right under the graph, above the
    // image/description row below it.
    var isEventView = view && view.type === "sdo:Event";
    if (isEventView) mainEl.appendChild(el("div", { class: "event-title-box", text: label }));

    // ---- sdo:image, when the entity has one (events-etl asserts an
    // sdo:ImageObject, optionally with a smaller sdo:thumbnail nested under
    // it -- see that repo's pipeline.py). The image/thumbnail nodes are
    // blank, so their contentUrl isn't in factRows (those only cover this
    // entity's own one-hop statements); fetched with one follow-up query
    // scoped to this entity's own URI, same pattern as renderFileListBlock's
    // format/url lookup below. Same iisg.amsterdam-only policy as the
    // DataDownload thumbnail just below: never hotlink a third-party host.
    var heroImageSlot = el("div", {});
    if (isEventView) {
      heroImageSlot.classList.add("event-hero-img");
      var eventHeroRow = el("div", { class: "event-hero-row" });
