      eventHeroRow.appendChild(heroImageSlot);
      var eventDescRows = outByPred["sdo:description"];
      if (eventDescRows && eventDescRows.length) {
        var eventHeroDesc = el("div", { class: "event-hero-desc" });
        eventDescRows.forEach(function (r) {
          // Same HTML-stripping as the generic DESC_FIELDS loop below --
          // never render harvested literals as HTML (stored-XSS risk).
          var text = r.o.value.replace(/<br\s*\/?>/gi, "\n").replace(/<\/?[a-z][^>]*>/gi, "");
          eventHeroDesc.appendChild(el("p", { text: text }));
        });
        eventHeroRow.appendChild(eventHeroDesc);
      }
      mainEl.appendChild(eventHeroRow);
    } else {
      mainEl.appendChild(heroImageSlot);
    }

    // ---- IIIF scans (iisg-iiif): gallery on the left, this record's hero
    // facts moved into the column beside it (factsTarget, below). Laid out
    // up front, with a placeholder, so the facts don't jump sideways when
    // the image query lands; on a miss the gallery column is dropped and
    // the facts simply take the full width again.
    var hasIiif = !isEventView && !!(outByPred["iisgv:iiifManifest"] || outByPred["iisgv:iiifImageService"]);
    var factsTarget = mainEl;
    if (hasIiif) {
      var mediaGallery = el("div", { class: "media-gallery" }, [el("div", { class: "media-main", "aria-hidden": "true" })]);
      var mediaFacts = el("div", { class: "media-facts" });
      heroImageSlot.appendChild(el("div", { class: "media-row" }, [mediaGallery, mediaFacts]));
      factsTarget = mediaFacts;
      var viewerUrl = null;
      for (var vi = 0; vi < LINKOUT_FIELDS.length && !viewerUrl; vi++) {
        var vrows = outByPred[LINKOUT_FIELDS[vi]];
        viewerUrl = vrows && vrows.length && (vrows[0].o.type === "uri" ? vrows[0].o.value : literalUrl(vrows[0].o));
      }
      fetchRecordImages(uri).then(function (images) {
        if (currentUri !== uri) return;
        if (!images.length) { mediaGallery.remove(); return; }
        var parentRow = (outByPred["sdo:isPartOf"] || []).filter(function (r) { return r.o.type === "uri"; })[0];
        renderRecordImages(mediaGallery, images, {
          uri: uri,
          label: label,
          viewerUrl: viewerUrl || null,
          itemNav: parentRow ? fetchItemNav(uri, parentRow.o.value) : null
        });
      }).catch(function () { if (currentUri === uri) mediaGallery.remove(); });
    }

    if (outByPred["sdo:image"] && !hasIiif) {
      var imageQuery = "PREFIX schema: <https://schema.org/>\n" +
        "SELECT ?url ?thumbUrl WHERE {\n" +
        "  " + iriRef(uri) + " schema:image ?img .\n" +
        "  ?img schema:contentUrl ?url .\n" +
        "  OPTIONAL { ?img schema:thumbnail ?t . ?t schema:contentUrl ?thumbUrl }\n" +
        "} LIMIT 1";
      sparql(imageQuery).then(function (rows) {
        if (currentUri !== uri || !rows.length) return;
        var row = rows[0];
        var displayUrl = row.thumbUrl && isLocalUri(row.thumbUrl.value) ? row.thumbUrl.value
          : (row.url && isLocalUri(row.url.value) ? row.url.value : null);
        if (!displayUrl) return;
        var img = el("img", { class: "file-thumb", src: displayUrl, alt: label, loading: "lazy" });
        img.onerror = function () { img.remove(); };
        heroImageSlot.appendChild(img);
      }).catch(function () { /* thumbnails are a nice-to-have; ignore failures */ });
    }

    // ---- Person portraits, via identity-etl's Wikidata link (see
    // findWikidataQid above): one from Wikidata itself (P18), and --
    // alongside it -- one from RKDartists, matched through Wikidata's own
    // P650 (RKDartists ID) claim on that same Q-id (iisgBrowser.py's
    // /api/rkd-artist, /api/rkd-image). Every <img> src here is our own
    // backend proxy, never Wikidata/Commons/RKD directly -- same
    // fetch-once-cache-forever, same-origin-only pattern as the rest of
    // this viewer's images.
    //
    // Most persons have neither portrait, and the RKD lookup in particular
    // is a slow chain on a cold cache (Wikidata, then RKD's detail API,
    // then IIIF) -- building the <img> up front and letting onerror remove
    // it on a miss used to leave a pending/broken-image placeholder
    // visible in the layout for that whole stretch, which read as "an
    // image appears, then disappears". probeImage() below loads into a
    // detached Image() first and only builds the visible, badged frame
    // once we positively know the request succeeds -- a miss never paints
    // anything, a hit appears once, fully formed (the real <img> then
    // loads instantly, same URL already sitting in the browser's cache).
    if (view && view.type === "sdo:Person") {
      var wikidataQid = findWikidataQid(cluster);
      if (wikidataQid) {
        var portraitsRow = el("div", { class: "portraits-row" });
        heroImageSlot.appendChild(portraitsRow);

        var wikidataImgUrl = "/api/wikidata-image/" + wikidataQid;
        probeImage(wikidataImgUrl, function () {
          if (currentUri !== uri) return;
          var wikidataHref = "https://www.wikidata.org/wiki/" + wikidataQid;
          var portraitLink = el("a", {
            class: "person-portrait-link",
            href: wikidataHref,
            target: "_blank",
            rel: "noopener",
            title: "View " + label + " on Wikidata"
          });
          portraitLink.appendChild(el("img", { class: "file-thumb person-portrait", src: wikidataImgUrl, alt: label }));
          portraitLink.appendChild(el("span", { class: "portrait-badge portrait-badge-rdf", title: "Linked data (RDF)" }, [rdfIconEl()]));
          portraitLink.appendChild(el("span", { class: "portrait-badge portrait-badge-wikidata", title: "Wikidata" }, [wikidataIconEl()]));
          portraitsRow.appendChild(portraitCardEl(portraitLink, wikidataHref, "Wikidata"));
        });

        // RKDartists: a second lookup off the same Q-id. Only fired once
        // we know whether there's even an RKD id to chase, so a non-artist
        // (the overwhelming majority of persons) costs one small cached
        // JSON fetch, not a wasted image request.
        fetch("/api/rkd-artist/" + wikidataQid).then(function (resp) {
          if (!resp.ok) return null;
          return resp.json();
        }).then(function (data) {
          if (currentUri !== uri || !data || !data.rkd_id) return;
          var rkdId = data.rkd_id;
          var rkdImgUrl = "/api/rkd-image/" + rkdId;
          var rkdHref = "https://rkd.nl/explore/artists/" + rkdId;
          probeImage(rkdImgUrl, function () {
            if (currentUri !== uri) return;
            var rkdLink = el("a", {
              class: "person-portrait-link",
              href: rkdHref,
              target: "_blank",
              rel: "noopener",
              title: "View " + label + " on RKDartists"
            });
            rkdLink.appendChild(el("img", { class: "file-thumb person-portrait", src: rkdImgUrl, alt: label }));
            rkdLink.appendChild(el("span", { class: "portrait-badge portrait-badge-rkd", title: "RKDartists" }, [rkdIconEl()]));
            portraitsRow.appendChild(portraitCardEl(rkdLink, rkdHref, "RKDartists"));
          });
        }).catch(function () { /* RKD match is a nice-to-have; ignore failures */ });
      }
    }

    // ---- Real thumbnail, when the file itself is an image (e.g. Dataverse
    // DataDownload with an image/* encodingFormat) -- some files genuinely
    // are pictures. Only ever fetched from iisg.amsterdam itself: hotlinking
    // a third-party host (dataverse.nl, worldcat.org, ...) from every record
    // view isn't ours to do, and dataverse.nl in particular currently sits
    // behind a bot-challenge wall that would just return an HTML page
    // instead of the image anyway.
    if (view && view.type === "sdo:DataDownload") {
      var fmtRows = outByPred["sdo:encodingFormat"];
      var urlRows = outByPred["sdo:contentUrl"];
      var fmt = fmtRows && fmtRows[0] && fmtRows[0].o.value;
      if (fmt && /^image\//i.test(fmt) && urlRows && urlRows[0] && urlRows[0].o.type === "uri" && isLocalUri(urlRows[0].o.value)) {
        var thumb = el("img", { class: "file-thumb", src: urlRows[0].o.value, alt: label, loading: "lazy" });
        thumb.onerror = function () { thumb.remove(); };
        mainEl.appendChild(thumb);
      }
    }

    // ---- Primary download link, for file-like views (DataDownload) ----
    if (view && view.linkOutPrimary) {
      for (var li = 0; li < LINKOUT_FIELDS.length; li++) {
        var rows = outByPred[LINKOUT_FIELDS[li]];
        var linkoutUrl = rows && rows.length && (rows[0].o.type === "uri" ? rows[0].o.value : literalUrl(rows[0].o));
        if (linkoutUrl) {
          mainEl.appendChild(el("a", { class: "download-btn", href: linkoutUrl, target: "_blank", rel: "noopener", text: "\u2193 Open / download file" }));
          break;
        }
      }
    }

    // ---- Type-specific hero facts ---- (Person's own AUTHORITY_FIELDS
    // already rendered above as the identity header -- skip the generic
    // grid for it so nothing repeats.)
    if (view && view.type !== "sdo:Person") {
      if (view.type === "sdo:Dataset") {
        factsTarget.appendChild(renderDcatDatasetFacts(outByPred));
      } else {
        var grid = el("div", { class: "hero-grid" });
        var any = false;
        view.fields.forEach(function (f) {
          var rows = outByPred[f.pred];
          if (!rows || !rows.length) return;
          any = true;
          grid.appendChild(renderHeroGroup(f, rows));
        });
        if (any) factsTarget.appendChild(grid);
      }

      if (!view.linkOutPrimary) {
        for (var lo = 0; lo < LINKOUT_FIELDS.length; lo++) {
          var lrows = outByPred[LINKOUT_FIELDS[lo]];
          var origUrl = lrows && lrows.length && (lrows[0].o.type === "uri" ? lrows[0].o.value : literalUrl(lrows[0].o));
          if (origUrl) {
            var wrap = el("div", { style: "margin: 4px 0 4px;" });
            wrap.appendChild(el("a", { class: "download-btn", href: origUrl, target: "_blank", rel: "noopener", text: "\u2197 View original / digitized copy" }));
            factsTarget.appendChild(wrap);
            break;
          }
        }
      }

      // Special-cased list facts that don't fit the "one row per fact" shape.
      if (view.type === "sdo:Dataset" && outByPred["sdo:distribution"]) {
        mainEl.appendChild(renderFileListBlock("Files", outByPred["sdo:distribution"]));
      }
      if (view.type === "sdo:DataCatalog" && outByPred["sdo:dataset"]) {
        mainEl.appendChild(renderLinkListBlock("Datasets in this catalog", outByPred["sdo:dataset"]));
      }
    }

    // ---- Description / abstract / biography text blocks ----
    var textWrap = el("div", { class: "hero-textblocks" });
    var anyText = false;
    DESC_FIELDS.forEach(function (f) {
      if (isEventView && f.pred === "sdo:description") return; // already shown beside the hero image above
      var rows = outByPred[f.pred];
      if (!rows || !rows.length) return;
      anyText = true;
      var block = el("div", { class: "hero-textblock" });
      block.appendChild(el("h3", { text: f.heading }));
      rows.forEach(function (r) {
        // Some harvested literals (e.g. Dataverse descriptions) embed HTML
        // markup as plain text. Never render it as HTML (stored-XSS risk from
        // external metadata) -- just normalize <br> to newlines, which
        // white-space:pre-wrap already displays.
        var text = r.o.value.replace(/<br\s*\/?>/gi, "\n").replace(/<\/?[a-z][^>]*>/gi, "");
        block.appendChild(el("p", { text: text }));
      });
      textWrap.appendChild(block);
    });
    if (anyText) mainEl.appendChild(textWrap);
    else if (!view && description) {
      mainEl.appendChild(el("p", { class: "record-desc", text: description }));
    }

    // ---- Where this sits in the hierarchy: siblings + children. Placed
    // after the record's own facts/description (not before) so a sparse
    // leaf -- which may have nothing but a name and a handful of siblings --
    // still leads with what it actually asserts about itself, not with a
    // list of its neighbors' names.
    if (view && HIERARCHICAL_TYPES[view.type]) {
      var digitizedSlot = el("div", {});
      mainEl.appendChild(digitizedSlot);
      renderDigitizedChildren(digitizedSlot, uri);
    }
    mainEl.appendChild(hierarchyTreeSlot);
    mainEl.appendChild(creatorWorksSlot);
    mainEl.appendChild(creationsSlot);
    mainEl.appendChild(coCreatorsSlot);
    mainEl.appendChild(subjectOfSlot);

    // ---- Full statement list -- toggled by the stats line in the header
    // above, not a separate control (see statsToggle).
    statementsSection = el("div", { class: "statements-section" + (view ? " collapsed" : "") });

    var columns = el("div", { class: "columns" });
    var outCol = el("div", {});
    var outHeading = el("div", { class: "column-heading", text: "↗ Described as" });
    outHeading.appendChild(el("span", { text: "outgoing — what this asserts" }));
    outCol.appendChild(outHeading);
    columns.appendChild(outCol);

    var inCol = el("div", {});
    var inHeading = el("div", { class: "column-heading", text: "↙ Referenced by" });
    inHeading.appendChild(el("span", { text: "incoming — what points here" }));
    inCol.appendChild(inHeading);
    columns.appendChild(inCol);

    statementsSection.appendChild(columns);
    mainEl.appendChild(statementsSection);

    renderOutColumnFromMemory(outCol, factRows);
    renderInColumn(inCol, uri, inCounts);
  }

  function statLine(text) {
    var parts = text.match(/^(\d+)(.*)$/);
    var s = el("span", { class: "stat" });
    var b = document.createElement("b");
    b.textContent = parts[1];
    s.appendChild(b);
    s.appendChild(document.createTextNode(parts[2]));
    return s;
  }

  function heroValueNode(r, kind) {
    if (kind === "extlink" || (kind === "auto" && r.o.type === "uri" && !isLocalUri(r.o.value))) {
      var a = el("a", { class: "value-literal", href: r.o.value, target: "_blank", rel: "noopener", text: r.label ? r.label.value : shortLabel(r.o.value) });
      return a;
    }
    if ((kind === "link" || kind === "auto") && r.o.type === "uri") {
      var wrap = document.createDocumentFragment();
      var btn = el("button", { class: "hero-link", text: r.label ? r.label.value : shortLabel(r.o.value) });
      btn.addEventListener("click", function () { navigate(r.o.value, { label: r.label ? r.label.value : null }); });
      wrap.appendChild(btn);
      if (!isLocalUri(r.o.value) && isSafeHref(r.o.value)) {
        wrap.appendChild(el("a", { class: "hero-ext", href: r.o.value, target: "_blank", rel: "noopener", text: "\u2197" }));
      }
      return wrap;
    }
    var asUrl = literalUrl(r.o);
    if (asUrl) {
      return el("a", { class: "value-literal", href: asUrl, target: "_blank", rel: "noopener", text: asUrl });
    }

    // literal (or a URI we're told to treat as text)
    var val = r.o.value;
    var tag = "";
    if (r.o["xml:lang"]) tag = r.o["xml:lang"];
    var span = el("span", { text: val });
    if (tag) {
      var t = document.createElement("span");
      t.className = "lit-tag";
      t.textContent = tag;
      span.appendChild(t);
    }
    return span;
  }

  // "Donkers, J." (MARC/catalog surname-first convention, the common case
  // here) -> "DJ"; falls back to first-two-words initials for anything not
  // comma-formatted.
  function personInitials(label) {
    var parts = label.split(",");
    var a = "", b = "";
    if (parts.length > 1 && parts[0].trim() && parts[1].trim()) {
      a = parts[0].trim()[0];
      b = parts[1].trim()[0];
    } else {
      var words = label.trim().split(/\s+/).filter(function (w) { return w.length; });
      a = words[0] ? words[0][0] : "";
      b = words[1] ? words[1][0] : "";
    }
    return (a + b).toUpperCase() || "?";
  }

  function personIdentityRowEl(label, outByPred) {
    var row = el("div", { class: "identity-row" });
    row.appendChild(el("div", { class: "identity-avatar", text: personInitials(label) }));
    var nameWrap = el("div", {});
    nameWrap.appendChild(el("h1", { class: "record-title", text: label }));
    var akaRows = outByPred["sdo:alternateName"];
    if (akaRows && akaRows.length) {
      var names = akaRows.slice(0, 4).map(function (r) { return r.o.value; }).join(" · ");
      nameWrap.appendChild(el("div", { class: "identity-subtitle", text: "also known as " + names }));
    }
    row.appendChild(nameWrap);
    return row;
  }

  // Everything AUTHORITY_FIELDS lists except alternateName (already used as
  // the identity row's subtitle, not repeated down here).
  function personIdentityFactsEl(outByPred) {
    var fields = AUTHORITY_FIELDS.filter(function (f) { return f.pred !== "sdo:alternateName"; });
    var present = fields.filter(function (f) { return outByPred[f.pred] && outByPred[f.pred].length; });
    if (!present.length) return null;
    var wrap = el("div", { class: "identity-facts" });
    present.forEach(function (f) {
      var row = el("div", { class: "identity-fact-row" });
      row.appendChild(el("span", { class: "identity-fact-label", text: f.heading }));
      var valueWrap = el("span", { class: "identity-fact-value" });
      outByPred[f.pred].slice(0, 6).forEach(function (r, i) {
        if (i > 0) valueWrap.appendChild(document.createTextNode(", "));
        valueWrap.appendChild(heroValueNode(r, f.kind));
      });
      row.appendChild(valueWrap);
      wrap.appendChild(row);
    });
    return wrap;
  }

  function renderHeroGroup(field, rows) {
    var group = el("div", { class: "hero-group" });
    group.appendChild(el("h3", { text: field.heading }));
    rows.slice(0, 12).forEach(function (r) {
      var row = el("div", { class: "hero-fact-val" });
      row.appendChild(heroValueNode(r, field.kind));
      group.appendChild(row);
    });
    if (rows.length > 12) group.appendChild(el("div", { class: "hero-fact-val", text: "+ " + (rows.length - 12) + " more" }));
    return group;
  }

  function renderLinkListBlock(heading, rows) {
    var wrap = el("div", { class: "dash-section" });
    wrap.appendChild(el("div", { class: "dash-heading", text: heading + " (" + rows.length + ")" }));
    var shown = rows.slice(0, 10);
    shown.forEach(function (r) {
      if (r.o.type !== "uri") return;
      var card = el("button", { class: "result-card" });
      card.appendChild(el("div", { class: "result-label", text: r.label ? r.label.value : shortLabel(r.o.value) }));
      card.appendChild(el("div", { class: "uri-sub", text: shortLabel(r.o.value) }));
      card.addEventListener("click", function () { navigate(r.o.value, { label: r.label ? r.label.value : null }); });
      wrap.appendChild(card);
    });
    if (rows.length > shown.length) wrap.appendChild(el("div", { class: "column-empty", text: "+ " + (rows.length - shown.length) + " more \u2014 see the statement counts above" }));
    return wrap;
  }

  // Like renderLinkListBlock, but for a Dataset's own distribution: fires one
  // small follow-up query for the shown files' format + URL so image/* files
  // (Dataverse hosts plenty of real image/jpeg scans) get an actual <img>
  // thumbnail instead of just a filename row.
  function renderFileListBlock(heading, rows) {
    var wrap = el("div", { class: "dash-section" });
    wrap.appendChild(el("div", { class: "dash-heading", text: heading + " (" + rows.length + ")" }));
    var shown = rows.filter(function (r) { return r.o.type === "uri"; }).slice(0, 10);
    var rowEls = {};
    shown.forEach(function (r) {
      var uri = r.o.value;
      var card = el("button", { class: "result-card result-card-row" });
      var body = el("div", { class: "result-body" });
      body.appendChild(el("div", { class: "result-label", text: r.label ? r.label.value : shortLabel(uri) }));
      body.appendChild(el("div", { class: "uri-sub", text: shortLabel(uri) }));
      card.appendChild(body);
      card.addEventListener("click", function () { navigate(uri, { label: r.label ? r.label.value : null }); });
      rowEls[uri] = card;
      wrap.appendChild(card);
    });
    if (rows.length > shown.length) wrap.appendChild(el("div", { class: "column-empty", text: "+ " + (rows.length - shown.length) + " more \u2014 see the statement counts above" }));

    if (shown.length) {
      var values = shown.map(function (r) { return iriRef(r.o.value); }).join(" ");
      var q = "PREFIX schema: <https://schema.org/>\n" +
        "SELECT ?f ?fmt ?url WHERE {\n" +
        "  VALUES ?f { " + values + " }\n" +
        "  ?f schema:encodingFormat ?fmt .\n" +
        "  OPTIONAL { ?f schema:contentUrl ?url }\n" +
        "}";
      sparql(q).then(function (frows) {
        frows.forEach(function (fr) {
          var fmt = fr.fmt.value;
          if (!/^image\//i.test(fmt) || !fr.url || !isLocalUri(fr.url.value)) return;
          var card = rowEls[fr.f.value];
          if (!card) return;
          var img = el("img", { class: "result-thumb", src: fr.url.value, alt: "", loading: "lazy" });
          img.onerror = function () { img.remove(); };
          card.insertBefore(img, card.firstChild);
        });
      }).catch(function () { /* thumbnails are a nice-to-have; ignore failures */ });
    }

    return wrap;
  }

  // ---- Generic "Described as" column, rendered from already-fetched data ----

  function renderOutColumnFromMemory(colEl, factRows) {
    var byPred = {};
    factRows.forEach(function (r) {
      var key = r.p.value;
      if (!byPred[key]) byPred[key] = [];
      byPred[key].push(r);
    });
    var preds = Object.keys(byPred).sort(function (a, b) { return byPred[b].length - byPred[a].length; });
    if (!preds.length) {
      colEl.appendChild(el("div", { class: "column-empty", text: "No outgoing statements recorded." }));
      return;
    }
    preds.forEach(function (pred) {
      var rows = byPred[pred];
      var group = el("div", { class: "pred-group" });
      var labelWrap = el("div", { class: "pred-label" });
      labelWrap.appendChild(document.createTextNode(shortLabel(pred)));
      var countEl = document.createElement("span");
      countEl.className = "pred-count";
      countEl.textContent = rows.length;
      labelWrap.appendChild(countEl);
      group.appendChild(labelWrap);

      var rowsWrap = el("div", { class: "pred-rows" });
      rows.forEach(function (r) { rowsWrap.appendChild(buildValueRow({ item: r.o, label: r.label })); });
      group.appendChild(rowsWrap);
      colEl.appendChild(group);
    });
  }

  // ---- Generic "Referenced by" column: paginated, since fan-in can be huge ----

  function renderInColumn(colEl, uri, counts) {
    if (!counts.length) {
      colEl.appendChild(el("div", { class: "column-empty", text: "Nothing in the graph points to this record." }));
      return;
    }
    counts.forEach(function (row) {
      var pred = row.p.value;
      var total = parseInt(row.c.value, 10);
      var group = el("div", { class: "pred-group" });
      var labelWrap = el("div", { class: "pred-label" });
      labelWrap.appendChild(document.createTextNode(shortLabel(pred)));
      var countEl = document.createElement("span");
      countEl.className = "pred-count";
      countEl.textContent = total;
      labelWrap.appendChild(countEl);
      group.appendChild(labelWrap);

      var rowsWrap = el("div", { class: "pred-rows" });
      rowsWrap.appendChild(el("div", { class: "group-loading", text: "Loading\u2026" }));
      group.appendChild(rowsWrap);
      colEl.appendChild(group);

      loadGroupPage(uri, pred, 0, total, rowsWrap, true);
    });
  }

  function loadGroupPage(uri, pred, offset, total, rowsWrap, isFirst) {
    var pattern = "?item " + iriRef(pred) + " " + iriRef(uri);

    var q = "PREFIX schema: <http://schema.org/>\n" +
      "PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>\n" +
      "SELECT ?item (SAMPLE(?lbl) AS ?label) (SAMPLE(?g) AS ?graph) WHERE {\n" +
      "  GRAPH ?g { " + pattern + " }\n" +
      "  OPTIONAL { ?item <http://schema.org/name> ?n1 }\n" +
      "  OPTIONAL { ?item <https://schema.org/name> ?n2 }\n" +
      "  OPTIONAL { ?item rdfs:label ?n3 }\n" +
      "  OPTIONAL { ?item <http://schema.org/roleName> ?n4 }\n" +
      "  OPTIONAL { ?item <https://schema.org/roleName> ?n5 }\n" +
      "  BIND(COALESCE(?n1, ?n2, ?n3, ?n4, ?n5) AS ?lbl)\n" +
      "} GROUP BY ?item ORDER BY ?item LIMIT " + PAGE_SIZE + " OFFSET " + offset;

    sparql(q).then(function (rows) {
      if (isFirst) clear(rowsWrap);
      rows.forEach(function (r) { rowsWrap.appendChild(buildValueRow(r)); });

      var loadedSoFar = offset + rows.length;
      var oldFooter = rowsWrap.querySelector(".load-more-row");
      if (oldFooter) rowsWrap.removeChild(oldFooter);

      if (loadedSoFar < total) {
        var footer = el("div", { class: "load-more-row" });
        var btn = el("button", { class: "load-more-btn", text: "Show " + Math.min(PAGE_SIZE, total - loadedSoFar) + " more of " + total });
        btn.addEventListener("click", function () {
          btn.disabled = true;
          btn.textContent = "Loading\u2026";
          loadGroupPage(uri, pred, loadedSoFar, total, rowsWrap, false);
        });
        footer.appendChild(btn);
        rowsWrap.appendChild(footer);
      }
    }).catch(function (err) {
      if (isFirst) clear(rowsWrap);
      rowsWrap.appendChild(el("div", { class: "group-loading", text: "Couldn\u2019t load: " + err.message }));
    });
  }

  function buildValueRow(r) {
    var row = el("div", { class: "value-row" });
    var main = el("div", { class: "value-main" });

    if (r.item.type === "uri") {
      var uri = r.item.value;
      var label = r.label ? r.label.value : null;
      var btn = el("button", { class: "value-link", text: label || shortLabel(uri) });
      btn.addEventListener("click", function () { navigate(uri, { label: label }); });
      main.appendChild(btn);
      if (label) main.appendChild(el("div", { class: "value-curie", text: shortLabel(uri) }));
      row.appendChild(main);

      if (!isLocalUri(uri) && isSafeHref(uri)) {
        var ext = el("a", { class: "ext-link", href: uri, target: "_blank", rel: "noopener", title: "Open source", text: "\u2197" });
        row.appendChild(ext);
      }
    } else if (literalUrl(r.item)) {
      var lurl = literalUrl(r.item);
      var linkEl = el("a", { class: "value-literal", href: lurl, target: "_blank", rel: "noopener", text: lurl });
      main.appendChild(linkEl);
      row.appendChild(main);
    } else {
      var val = r.item.value;
      var tag = "";
      if (r.item["xml:lang"]) tag = r.item["xml:lang"];
      else if (r.item.datatype && !/string$/.test(r.item.datatype)) tag = shortLabel(r.item.datatype);
      var litWrap = el("span", { class: "value-literal", text: val });
      if (tag) {
        var tagEl = document.createElement("span");
        tagEl.className = "lit-tag";
        tagEl.textContent = tag;
        litWrap.appendChild(tagEl);
      }
      main.appendChild(litWrap);
      row.appendChild(main);
    }

    if (r.graph) row.appendChild(el("span", { class: "graph-tag", text: graphInfo(r.graph.value).label }));
    return row;
  }

  // ---------- Reading room: a finding aid as boxes, folders and pages ----------
  // A second way into findingaid-etl's hierarchy, next to the record page,
  // modelled on what a visitor to IISG's actual reading room does (see
  // "Plan uw bezoek" on iisg.amsterdam): the collection arrives on a
  // trolley as boxes (its top-level series), a box opens onto the folders
  // standing in it, and a folder is laid open on the desk to read its
  // scanned pages one by one, then put back. The finding aid records no
  // physical box numbers, so what gets drawn as what comes from a node's
  // place in the tree and, where present, its iisgv:physicalDescription
  // ("1 map", "3 Briefe", "1 doos", ...). Pages come from the item's own
  // IIIF manifest (access.iisg.amsterdam serves it with open CORS); the
  // graph itself only holds the first page's thumbnail.
  //
  // Hash: #reading:<uri> for a place in an archive; #view:readingroom is
  // the request desk where you pick one.

  var RR_PART = "(<http://schema.org/isPartOf>|<https://schema.org/isPartOf>)";
  // Folders per drawn box. A series with 2,289 letters (Kautsky's "Briefe
  // an Karl Kautsky") becomes a row of numbered boxes to pick from, the
  // way it would fill a shelf, rather than one endless box.
  var RR_PER_BOX = 24;
  var RR_ON_TROLLEY = 12;

  // Earliest match wins, so "1 omslag met 3 brieven" is a folder.
  var RR_PHYS_KINDS = [
    ["audio", /\b(audio|sound|geluid\w*|tonband\w*|cassettes?|audiotapes?|\d+\s*min|minuten)\b/i],
    ["box", /\b(doos|dozen|box(es)?|pak(ken)?|kartons?|bo[iî]tes?|cajas?|schachteln?)\b/i],
    ["volume", /\b(deel|delen|vols?|volumes?|b[äa]nde?|registers?|cahiers?|notebooks?|tomes?|schriften?)\b/i],
    ["photo", /\b(foto'?s?|photos?|photographs?|fotografi\w*|negatie\w*|dia'?s)\b/i],
    ["letter", /\b(brie[fv]e?n?|letters?|lettres?|cartas?|stuk(ken)?|st[üu]cke?|pieces?|pi[eè]ces?|feuillets?|bl[äa]tter|blatt|telegram\w*|postcards?|briefkaart\w*)\b/i],
    ["folder", /\b(maps?|mappen?|folders?|omslag(en)?|umschl[äa]ge?|umschlag|covers?|chemises?|carpetas?|portefeuilles?|dossiers?)\b/i]
  ];

  var RR_KIND_NAMES = {
    box: "box", bundle: "bundle", folder: "folder", letter: "letter",
    photo: "photo", volume: "volume", audio: "recording", collection: "archive"
  };

  function rrPhysKind(phys) {
    if (!phys) return null;
    var best = null, bestAt = Infinity;
    RR_PHYS_KINDS.forEach(function (k) {
      var m = k[1].exec(phys);
      if (m && m.index < bestAt) { best = k[0]; bestAt = m.index; }
    });
    return best;
  }

  // What a child is drawn as inside its parent's scene.
  function rrItemKind(it) {
    var pk = rrPhysKind(it.phys);
    if (it.kids > 0) return pk === "box" ? "box" : "bundle";
    return pk === "box" ? "folder" : (pk || "folder");
  }

  function rrRootOf(uri) { return uri.split("#")[0]; }
  function rrCallNumber(uri) { return rrRootOf(uri).replace(/^.*\//, ""); }

  // Desk number for the reservation card: stable per archive, purely
  // decorative.
  function rrDeskNo(uri) {
    var h = 0, s = rrRootOf(uri);
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return 1 + (h % 24);
  }

  // Items you've opened, ticked in pencil wherever they show up again.
  // Per browser only (a convenience, not a record); fine if it's empty.
  var RR_HANDLED_KEY = "rr-handled";
  var rrHandled = {};
  try {
    (JSON.parse(localStorage.getItem(RR_HANDLED_KEY) || "[]") || []).forEach(function (u) { rrHandled[u] = true; });
  } catch (e) { /* storage blocked: ticks just don't persist */ }

  function rrMarkHandled(uri) {
    if (rrHandled[uri]) return;
    rrHandled[uri] = true;
    try {
      var all = Object.keys(rrHandled);
      localStorage.setItem(RR_HANDLED_KEY, JSON.stringify(all.slice(-3000)));
    } catch (e) { /* ignore */ }
  }

  function rrHandledIn(rootUri) {
    var prefix = rootUri + "#";
    return Object.keys(rrHandled).filter(function (u) { return u.indexOf(prefix) === 0; }).length;
  }

  // Per-session caches: walking back up to a box you just came from
  // shouldn't refetch it.
  var rrNodeCache = {}, rrKidsCache = {}, rrChainCache = {}, rrManifestCache = {};
  var rrDigitizedRoots = null;

  function rrCached(cache, key, fetcher) {
    if (!cache[key]) cache[key] = fetcher().catch(function (e) { delete cache[key]; throw e; });
    return cache[key];
  }

  function rrFetchNode(uri) {
    return rrCached(rrNodeCache, uri, function () {
      var q = "SELECT (SAMPLE(?n0) AS ?name) (SAMPLE(?pd0) AS ?phys) (SAMPLE(?t0) AS ?dates) (SAMPLE(?id0) AS ?ident)\n" +
        "       (SAMPLE(?m0) AS ?manifest) (SAMPLE(?th0) AS ?thumb) (SAMPLE(?ab0) AS ?abstract) (SAMPLE(?nv0) AS ?native) WHERE {\n" +
        "  VALUES ?s { " + iriRef(uri) + " }\n" +
        "  OPTIONAL { ?s (<http://schema.org/name>|<https://schema.org/name>) ?n0 }\n" +
        "  OPTIONAL { ?s <https://iisg.amsterdam/vocab/physicalDescription> ?pd0 }\n" +
        "  OPTIONAL { ?s (<http://schema.org/temporalCoverage>|<https://schema.org/temporalCoverage>) ?t0 }\n" +
        "  OPTIONAL { ?s (<http://schema.org/identifier>|<https://schema.org/identifier>) ?id0 }\n" +
        "  OPTIONAL { ?s <https://iisg.amsterdam/vocab/iiifManifest> ?m0 }\n" +
        "  OPTIONAL { ?s <https://schema.org/thumbnailUrl> ?th0 }\n" +
        "  OPTIONAL { ?s (<http://schema.org/abstract>|<https://schema.org/abstract>) ?ab0 }\n" +
        "  OPTIONAL { ?s <https://iisg.amsterdam/vocab/nativeViewer> ?nv0 }\n" +
        "} GROUP BY ?s";
      return sparql(q).then(function (rows) {
        var r = rows[0] || {};
        var v = function (k) { return r[k] ? r[k].value : null; };
        return {
          uri: uri, label: v("name") ? tidyTitle(v("name")) : shortLabel(uri),
          phys: v("phys"), dates: v("dates"), ident: v("ident"), manifest: v("manifest"),
          thumb: v("thumb") && isLocalUri(v("thumb")) ? v("thumb") : null,
          abstract: v("abstract"), native: v("native")
        };
      });
    });
  }

  // Children with what each is drawn from, plus a count of its own
  // children (to tell a bundle from a single folder) and, in a second
  // query, how many scanned items sit anywhere below it (same
  // descendants-first order as fetchDigitizedChildren, for speed).
  function rrFetchKids(uri) {
    return rrCached(rrKidsCache, uri, function () {
      var q = "SELECT ?c (SAMPLE(?n0) AS ?name) (SAMPLE(?p0) AS ?pos) (SAMPLE(?pd0) AS ?phys) (SAMPLE(?t0) AS ?dates)\n" +
        "       (SAMPLE(?id0) AS ?ident) (SAMPLE(?th0) AS ?thumb) (SAMPLE(?m0) AS ?manifest) (COUNT(DISTINCT ?g) AS ?kids) WHERE {\n" +
        "  ?c " + RR_PART + " " + iriRef(uri) + " .\n" +
        "  OPTIONAL { ?c (<http://schema.org/name>|<https://schema.org/name>) ?n0 }\n" +
        "  OPTIONAL { ?c (<http://schema.org/position>|<https://schema.org/position>) ?p0 }\n" +
        "  OPTIONAL { ?c <https://iisg.amsterdam/vocab/physicalDescription> ?pd0 }\n" +
        "  OPTIONAL { ?c (<http://schema.org/temporalCoverage>|<https://schema.org/temporalCoverage>) ?t0 }\n" +
        "  OPTIONAL { ?c (<http://schema.org/identifier>|<https://schema.org/identifier>) ?id0 }\n" +
        "  OPTIONAL { ?c <https://schema.org/thumbnailUrl> ?th0 }\n" +
        "  OPTIONAL { ?c <https://iisg.amsterdam/vocab/iiifManifest> ?m0 }\n" +
        "  OPTIONAL { ?g " + RR_PART + " ?c }\n" +
        "} GROUP BY ?c LIMIT 5000";
      var dq = "SELECT ?c (COUNT(DISTINCT ?d) AS ?n) WHERE {\n" +
        "  { SELECT ?d WHERE { ?d " + RR_PART + "+ " + iriRef(uri) + " . ?d <https://iisg.amsterdam/vocab/iiifManifest> ?m } }\n" +
        "  ?c " + RR_PART + " " + iriRef(uri) + " .\n" +
        "  ?d " + RR_PART + "* ?c .\n" +
        "} GROUP BY ?c";
      return Promise.all([sparql(q), sparql(dq).catch(function () { return []; })]).then(function (res) {
        var scanned = {};
        res[1].forEach(function (r) { scanned[r.c.value] = parseInt(r.n.value, 10); });
        var items = res[0].map(function (r) {
          var v = function (k) { return r[k] ? r[k].value : null; };
          var pos = v("pos") !== null ? parseFloat(v("pos")) : NaN;
          var it = {
            uri: r.c.value, label: v("name") ? tidyTitle(v("name")) : shortLabel(r.c.value),
            pos: isNaN(pos) ? Infinity : pos, phys: v("phys"), dates: v("dates"), ident: v("ident"),
            thumb: v("thumb") && isLocalUri(v("thumb")) ? v("thumb") : null,
            manifest: v("manifest"), kids: parseInt(v("kids") || "0", 10),
            scanned: scanned[r.c.value] || 0
          };
          it.kind = rrItemKind(it);
          return it;
        });
        items.sort(function (a, b) { return a.pos - b.pos || a.label.localeCompare(b.label); });
        return items;
      });
    });
  }

  function rrFetchChain(uri) {
    return rrCached(rrChainCache, uri, function () {
      return fetchAncestorChains([uri]).then(function (chains) { return chains[uri] || []; });
    });
  }

  // Everything on an item's IIIF manifest (Presentation 3, with a
  // fallback for 2): its pages, shaped like fetchRecordImages' output so
  // the shared lightbox (openImageLightbox) can show them full screen,
  // and its sound recordings (one Sound canvas per tape side), for the
  // tape recorder (rrRecorderEl).
  function rrFetchMedia(manifestUrl) {
    if (!manifestUrl || !isSafeHref(manifestUrl) || !isLocalUri(manifestUrl)) return Promise.resolve({ pages: [], sounds: [] });
    return rrCached(rrManifestCache, manifestUrl, function () {
      return fetch(manifestUrl).then(function (r) {
        if (!r.ok) throw new Error("manifest " + r.status);
        return r.json();
      }).then(function (m) {
        var pages = [], sounds = [];
        function svcId(s) { s = Array.isArray(s) ? s[0] : s; return s ? (s["@id"] || s.id) : null; }
        if (Array.isArray(m.items)) {
          m.items.forEach(function (canvas, i) {
            var body = null;
            try { body = canvas.items[0].items[0].body; } catch (e) { body = null; }
            if (body && (body.type === "Sound" || /^audio\//.test(body.format || ""))) {
              // IIIF Auth on the file: listening needs a login at IISG.
              var auth = (Array.isArray(body.service) ? body.service : []).filter(function (sv) {
                return /auth/i.test((sv["@type"] || sv.type || "") + " " + (sv.profile || ""));
              })[0];
              if (body.id && isSafeHref(body.id) && isLocalUri(body.id)) sounds.push({
                url: body.id, duration: body.duration || canvas.duration || null,
                restricted: !!auth,
                failureHeader: auth ? auth.failureHeader : null,
                failureDescription: auth ? auth.failureDescription : null
              });
              return;
            }
            var svc = body ? svcId(body.service) : null;
            if (!svc && canvas.thumbnail) svc = svcId(canvas.thumbnail[0] && canvas.thumbnail[0].service);
            if (svc) pages.push({ canvas: canvas.id, svc: svc, w: canvas.width, h: canvas.height });
          });
        } else if (m.sequences && m.sequences[0]) {
          (m.sequences[0].canvases || []).forEach(function (canvas) {
            var res = canvas.images && canvas.images[0] && canvas.images[0].resource;
            var svc = res ? svcId(res.service) : null;
            if (svc) pages.push({ canvas: canvas["@id"], svc: svc, w: canvas.width, h: canvas.height });
          });
        }
        pages = pages.filter(function (p) { return isLocalUri(p.svc); }).map(function (p, i) {
          var service = p.svc.replace(/\/+$/, "");
          return {
            canvas: p.canvas, manifest: manifestUrl, pos: i, service: service,
            thumb: service + "/full/200,/0/default.jpg", full: null,
            width: p.w || null, height: p.h || null, level: null, conditions: null, credit: null
          };
        });
        // A sound canvas's thumbnail is only a stand-in picture, not a page.
        return { pages: sounds.length ? [] : pages, sounds: sounds };
      });
    });
  }

  // The 520-odd archives with anything scanned, biggest first -- the
  // trolley on the request desk and "Surprise me" draw from these.
  function rrFetchDigitizedRoots() {
    if (rrDigitizedRoots) return rrDigitizedRoots;
    var q = "SELECT ?root (COUNT(?d) AS ?n) (SAMPLE(?nm) AS ?name) (SAMPLE(?dt) AS ?dates) WHERE {\n" +
      "  ?d <https://iisg.amsterdam/vocab/iiifManifest> ?m ; " + RR_PART + " ?x .\n" +
      "  BIND(IRI(STRBEFORE(STR(?d), \"#\")) AS ?root)\n" +
      "  ?root (<http://schema.org/name>|<https://schema.org/name>) ?nm .\n" +
      "  OPTIONAL { ?root (<http://schema.org/temporalCoverage>|<https://schema.org/temporalCoverage>) ?dt }\n" +
      "} GROUP BY ?root ORDER BY DESC(?n)";
    rrDigitizedRoots = sparql(q).then(function (rows) {
      return rows.map(function (r) {
        return { uri: r.root.value, label: tidyTitle(r.name.value), dates: r.dates ? r.dates.value : null, scanned: parseInt(r.n.value, 10) };
      });
    }).catch(function (e) { rrDigitizedRoots = null; throw e; });
    return rrDigitizedRoots;
  }

  function rrSearchCollections(term) {
    var t = term.trim();
    var callNo = /^(ARCH|COLL)\s*0*(\d+)$/i.exec(t);
    var filter = callNo
      ? "FILTER(STRENDS(STR(?c), \"/" + callNo[1].toUpperCase() + ("00000" + callNo[2]).slice(-5) + "\"))"
      : "FILTER(CONTAINS(LCASE(?nm), \"" + escLiteral(t.toLowerCase()) + "\"))";
    var q = "SELECT ?c (SAMPLE(?nm) AS ?name) (SAMPLE(?dt) AS ?dates) (SAMPLE(?pd) AS ?phys) WHERE {\n" +
      "  ?c <https://schema.org/additionalType> <https://www.ica.org/standards/RiC/vocabularies/recordSetTypes#Collection> ;\n" +
      "     (<http://schema.org/name>|<https://schema.org/name>) ?nm .\n" +
      "  " + filter + "\n" +
      "  OPTIONAL { ?c (<http://schema.org/temporalCoverage>|<https://schema.org/temporalCoverage>) ?dt }\n" +
      "  OPTIONAL { ?c <https://iisg.amsterdam/vocab/physicalDescription> ?pd }\n" +
      "} GROUP BY ?c ORDER BY ?name LIMIT 40";
    return sparql(q).then(function (rows) {
      return rows.map(function (r) {
        return { uri: r.c.value, label: tidyTitle(r.name.value), dates: r.dates ? r.dates.value : null, phys: r.phys ? r.phys.value : null };
      });
    });
  }

  // ---- Navigation ----

  var rrLastUri = null;   // where we were, to tell "put back" from "take out"
  var rrKeys = null;      // the current scene's keyboard handlers
  var rrGen = 0;

  function readingNavigate(uri) {
    currentUri = null;
    history.pushState({ reading: uri }, "", "#reading:" + encodeURIComponent(uri));

  }

  function rrUp(uri, chain) {
    if (chain.length) readingNavigate(chain[chain.length - 1].uri);
    else navigateToView("readingroom");
  }

  // One listener for the whole app; only acts while a reading-room scene
  // is showing and nothing else (the lightbox, a text field) wants keys.
  document.addEventListener("keydown", function (e) {
    if (!rrKeys || !document.querySelector(".rr")) return;
    if (activeLightbox || e.altKey || e.ctrlKey || e.metaKey) return;
    var t = e.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
    var fn = rrKeys[e.key];
    if (fn) { e.preventDefault(); fn(); }
  });

  // ---- The room: window, desk, reservation card and notepad ----

  var RR_ICONS = {
    box: '<svg viewBox="0 0 24 24"><path d="M3 8h18v12H3Z"/><path d="M2 4h20v4H2Z"/><path d="M9 12h6"/></svg>',
    bundle: '<svg viewBox="0 0 24 24"><path d="M3 6h18v13H3Z"/><path d="M12 6v13"/><path d="M3 12h18"/></svg>',
    folder: '<svg viewBox="0 0 24 24"><path d="M3 7a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/></svg>',
    letter: '<svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6Z"/><path d="M9 10h7M9 14h7M9 18h4"/></svg>',
    photo: '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16"/><path d="M4 16l5-5 4 4 2-2 5 5"/></svg>',
    volume: '<svg viewBox="0 0 24 24"><path d="M6 3h12v18H6Z"/><path d="M9 3v18"/></svg>',
    audio: '<svg viewBox="0 0 24 24"><circle cx="7" cy="11" r="4"/><circle cx="17" cy="11" r="4"/><path d="M3 19h18M7 15l2 4M17 15l-2 4"/></svg>',
    collection: '<svg viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M5 20V8h4v12M10 20V5h4v15M15 20v-9h4v9"/></svg>'
  };

  function rrIcon(kind) {
    var s = el("span", { class: "rr-ic", "aria-hidden": "true" });
    s.innerHTML = RR_ICONS[kind] || RR_ICONS.folder;
    return s;
  }

  // The view out of the reading-room windows: IISG looks out over the
  // water at the Cruquiuskade -- brick houses and trees along the far
  // quay, houseboats moored in front, mooring posts and a floating jetty
  // close by, a taller block behind. Drawn once from a fixed seed (the
  // same street every visit); colours come from CSS, so the evening
  // version (dark mode) lights a share of the windows and lets them
  // reflect in the water.
  var rrWindowSvg = null;

  function rrWindowEl() {
    var w = el("div", { class: "rr-window", "aria-hidden": "true" });
    if (!rrWindowSvg) rrWindowSvg = rrHarbourSvg();
    w.innerHTML = rrWindowSvg + '<div class="rr-mullions"></div>';
    return w;
  }

  function rrHarbourSvg() {
    var W = 1200, H = 170, QUAY = 100;
    var seed = 20231;
    function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
    function r(a, b) { return a + rnd() * (b - a); }
    function n(v) { return Math.round(v * 10) / 10; }
    function rect(x, y, w, h, cls, extra) {
      return '<rect x="' + n(x) + '" y="' + n(y) + '" width="' + n(w) + '" height="' + n(h) + '" class="' + cls + '"' + (extra || "") + '/>';
    }
    var out = [];
    out.push('<defs>' +
      '<linearGradient id="rr-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--rr-sky-top)"/><stop offset="1" style="stop-color:var(--rr-sky-bottom)"/></linearGradient>' +
      '<linearGradient id="rr-wat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--rr-water-far)"/><stop offset="1" style="stop-color:var(--rr-water)"/></linearGradient>' +
      '</defs>');
    out.push(rect(0, 0, W, QUAY + 2, "", ' fill="url(#rr-sky)"'));
    out.push('<circle cx="1010" cy="26" r="9" class="rr-moon"/>');
    for (var st = 0; st < 40; st++) out.push('<circle cx="' + n(r(0, W)) + '" cy="' + n(r(4, 60)) + '" r="' + n(r(0.5, 1.2)) + '" class="rr-star"/>');

    // Far: hazy blocks, and the tall flats (left in the IISG photo).
    var x = 0;
    while (x < W) {
      var fw = r(30, 90), fh = r(14, 34);
      out.push(rect(x, QUAY - 26 - fh, fw, fh + 30, "rr-far"));
      x += fw + r(-6, 10);
    }
    var lit = [];
    function tower(tx, tw, th) {
      out.push(rect(tx, QUAY - th, tw, th, "rr-tower"));
      for (var ty = QUAY - th + 5; ty < QUAY - 12; ty += 6)
        for (var tx2 = tx + 3; tx2 < tx + tw - 4; tx2 += 6) {
          var on = rnd() < 0.35;
          out.push(rect(tx2, ty, 3, 3, "rr-win" + (on ? " lit" : "")));
        }
    }
    tower(70, 46, 86);
    tower(860, 34, 70);

    // Mid: the row of canal houses along the far quay.
    x = -10;
    while (x < W) {
      var hw = r(24, 58), hh = r(24, 50), top = QUAY - hh;
      var tone = "rr-house" + (1 + Math.floor(rnd() * 4));
      out.push(rect(x, top, hw, hh, tone));
      if (rnd() < 0.45) {
        // pitched roof / gable
        out.push('<path d="M' + n(x - 1) + ' ' + n(top) + 'L' + n(x + hw / 2) + ' ' + n(top - r(8, 14)) + 'L' + n(x + hw + 1) + ' ' + n(top) + 'Z" class="rr-roof"/>');
      } else {
        out.push(rect(x - 1, top - 2, hw + 2, 2.5, "rr-roof"));
      }
      var litHere = 0;
      for (var wy = top + 5; wy < QUAY - 8; wy += 9)
        for (var wx = x + 4; wx < x + hw - 5; wx += 8) {
          var on2 = rnd() < 0.42;
          if (on2) litHere++;
          out.push(rect(wx, wy, 4, 5.5, "rr-win" + (on2 ? " lit" : "")));
        }
      if (litHere) lit.push([x + hw / 2, Math.min(3, litHere)]);
      x += hw + r(0, 2);
    }

    // Trees along the quay, in front of the houses.
    for (var t = 0; t < 26; t++) {
      var cx = r(0, W), cy = QUAY - r(6, 14);
      out.push('<circle cx="' + n(cx) + '" cy="' + n(cy) + '" r="' + n(r(7, 13)) + '" class="rr-tree"/>');
      out.push('<circle cx="' + n(cx + r(-8, 8)) + '" cy="' + n(cy + r(-5, 3)) + '" r="' + n(r(5, 9)) + '" class="rr-tree rr-tree2"/>');
    }
    out.push(rect(0, QUAY, W, 4, "rr-quay"));

    // Water, ripples and the lights' reflections.
    out.push(rect(0, QUAY + 4, W, H - QUAY - 4, "", ' fill="url(#rr-wat)"'));
    for (var rp = 0; rp < 90; rp++) {
      var ry = r(QUAY + 8, H - 4);
      out.push(rect(r(0, W), ry, r(12, 60) * (ry - QUAY) / 40, 0.9, "rr-ripple"));
    }
    lit.forEach(function (l) {
      for (var k = 0; k < l[1]; k++) out.push(rect(l[0] + r(-10, 10), QUAY + r(6, 12), r(2, 4), r(14, 30), "rr-refl"));
    });

    // Houseboats moored along the far quay.
    x = r(10, 40);
    while (x < W - 60) {
      var bw = r(46, 84), by = QUAY + 3;
      var hull = "rr-hull" + (1 + Math.floor(rnd() * 3));
      out.push('<path d="M' + n(x) + ' ' + n(by + 4) + 'h' + n(bw) + 'l-4 6h' + n(-bw + 8) + 'Z" class="rr-hullbase"/>');
      out.push(rect(x + 6, by - 6, bw - 14, 10, hull));
      out.push(rect(x + 4, by - 8, bw - 10, 2.5, "rr-roof"));
      for (var bx = x + 10; bx < x + bw - 12; bx += 9) out.push(rect(bx, by - 3, 5, 4, "rr-win" + (rnd() < 0.5 ? " lit" : "")));
      x += bw + r(14, 90);
    }

    // Mooring posts in the water and the near floating jetty.
    [[300, 132], [318, 133], [690, 128], [705, 129], [1080, 136]].forEach(function (pp) {
      out.push(rect(pp[0], pp[1] - 16, 4, 18, "rr-post"));
      out.push(rect(pp[0], pp[1] + 2, 4, 6, "rr-post rr-postrefl"));
    });
    out.push('<path d="M0 152L470 148L478 160L0 166Z" class="rr-jetty"/>');
    for (var pl = 0; pl < 470; pl += 14) out.push(rect(pl, 148, 1, 14, "rr-plank"));
    out.push(rect(0, 160, 480, 3, "rr-jettyedge"));

    // A boat passing by.
    out.push('<g class="rr-passing"><path d="M520 136h70l-8 8h-56Z" class="rr-hull2"/><rect x="538" y="128" width="26" height="8" class="rr-cabin"/></g>');

    return '<svg class="rr-harbour" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMax slice">' + out.join("") + "</svg>";
  }

  // ctx: { root, chain (root-first ancestors), node, here (label of the
  // current scene's object kind) }
  function rrShell(ctx) {
    var section = el("section", { class: "rr", "aria-label": "Reading room" });

    // Plain trail above the scene: the same path as the notepad, for
    // quick jumps and screen readers.
    var crumbs = el("nav", { class: "rr-crumbs", "aria-label": "Where you are" });
    var deskBtn = el("button", { type: "button", class: "rr-crumb", text: "Reading room" });
    deskBtn.addEventListener("click", function () { navigateToView("readingroom"); });
    crumbs.appendChild(deskBtn);
    var path = ctx.node ? ctx.chain.concat([{ uri: ctx.node.uri, label: ctx.node.label }]) : [];
    path.forEach(function (p, i) {
      crumbs.appendChild(el("span", { class: "rr-crumb-sep", "aria-hidden": "true", text: "›" }));
      var last = i === path.length - 1;
      var b = el("button", { type: "button", class: "rr-crumb" + (last ? " current" : ""), title: p.label,
        text: i === 0 ? rrCallNumber(p.uri) + " · " + p.label : p.label });
      if (last) b.setAttribute("aria-current", "location");
      else b.addEventListener("click", function () { readingNavigate(p.uri); });
      crumbs.appendChild(b);
    });
    if (ctx.node) {
      var rec = el("button", { type: "button", class: "rr-record-link", text: "Catalogue record" });
      rec.addEventListener("click", function () { navigate(ctx.node.uri); });
      crumbs.appendChild(rec);

    var room = el("div", { class: "rr-room" });

    }

    // Notepad: the hierarchy, jotted down as you go in.
    var pad = el("div", { class: "rr-notepad" });

      pad.appendChild(el("div", { class: "rr-pad-head", text: "Where I am" }));
      var list = el("ol", { class: "rr-pad-path" });
      path.forEach(function (p, i) {
        var last = i === path.length - 1;
        var kind = i === 0 ? "collection" : (last ? ctx.kind : (i === 1 ? "box" : "bundle"));
        var li = el("li", { style: "--d:" + Math.min(i, 6) });
        var b = el("button", { type: "button", class: last ? "current" : "" }, [rrIcon(kind), el("span", { text: i === 0 ? rrCallNumber(p.uri) : p.label })]);
        b.title = p.label;
        if (!last) b.addEventListener("click", function () { readingNavigate(p.uri); });
        li.appendChild(b);
        list.appendChild(li);
      });
      pad.appendChild(list);
      var handled = rrHandledIn(ctx.root.uri);
      pad.appendChild(el("div", { class: "rr-pad-tally", text: handled ? "✓ " + handled + " handled in this archive" : "Nothing handled yet" }));
      pad.appendChild(el("div", { class: "rr-pad-keys", text: ctx.keysHint || "Esc  put back" }));
    } else {
      pad.appendChild(el("div", { class: "rr-pad-head", text: "House rules" }));

        rules.appendChild(el("li", { text: t }));
      });
      pad.appendChild(rules);
      var total = Object.keys(rrHandled).length;

    desk.appendChild(props);
    room.appendChild(desk);
    section.appendChild(room);
    return { section: section, stage: stage };
  }

  function rrCaption(text, sub) {

  function rrCount(n, one, many) { return fmtNum(n) + " " + (n === 1 ? one : many); }

  function rrItemMeta(it) {

    if (it.phys) bits.push(it.phys);

  // ---- Scene: archive boxes on a trolley ----

  function rrBoxEl(it, i, opts) {

  // A book trolley: side posts, a push handle, shelves and four casters.
  // The boxes are spread evenly over as few shelves as fit across (6
  // boxes three-and-three, not four-and-two), re-spread when the width
  // changes.
  var RR_BOX_W = 132, RR_BOX_MIN_W = 104, RR_BOX_GAP = 12;

  function rrTrolleyEl(boxes) {
    var trolley = el("div", { class: "rr-trolley" });
    trolley.appendChild(el("span", { class: "rr-trolley-handle", "aria-hidden": "true" }));
    var shelves = el("div", { class: "rr-shelves" });
