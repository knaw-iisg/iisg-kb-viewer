<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IISG Knowledge Base Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef2f5;
    --surface: #ffffff;
    --surface-alt: #e2e9ee;
    --ink: #172329;
    --ink-soft: #47565e;
    --muted: #758790;
    --accent: #406e8c;
    --accent-strong: #294a60;
    --accent-soft: #dbe7ee;
    --line: #ccd7de;
    --good: #3c7a4c;
    --warn: #a9761f;
    --crit: #a1392f;
    --shadow: 0 1px 2px rgba(15, 26, 33, 0.07), 0 4px 16px rgba(15, 26, 33, 0.06);

    --font-display: "IBM Plex Serif", Georgia, "Times New Roman", serif;
    --font-body: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10161a;
      --surface: #182126;
      --surface-alt: #1f2a31;
      --ink: #e7edf1;
      --ink-soft: #b6c5cc;
      --muted: #7c8b93;
      --accent: #86b3ce;
      --accent-strong: #bcdaea;
      --accent-soft: #203342;
      --line: #2b3841;
      --good: #6cb87e;
      --warn: #d6a44e;
      --crit: #d97a6c;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.25), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }

  :root[data-theme="dark"] {
    --bg: #10161a;
    --surface: #182126;
    --surface-alt: #1f2a31;
    --ink: #e7edf1;
    --ink-soft: #b6c5cc;
    --muted: #7c8b93;
    --accent: #86b3ce;
    --accent-strong: #bcdaea;
    --accent-soft: #203342;
    --line: #2b3841;
    --good: #6cb87e;
    --warn: #d6a44e;
    --crit: #d97a6c;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.25), 0 8px 24px rgba(0, 0, 0, 0.3);
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; }

  ::selection { background: var(--accent-soft); }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 3px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  .app {
    display: grid;
    grid-template-columns: 300px 1fr;
    min-height: 100vh;
  }

  /* ---------- Rail ---------- */

  .rail {
    background: var(--surface-alt);
    border-right: 1px solid var(--line);
    padding: 22px 18px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }

  .brand-mark {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 19px;
    letter-spacing: -0.01em;
    cursor: pointer;
  }

  .brand-sub {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .search-box {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .search-box label {
    font-family: var(--font-mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--muted);
  }

  .search-input-wrap {
    position: relative;
  }

  #search-input {
    width: 100%;
    padding: 10px 34px 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 14px;
  }

  #search-input::placeholder { color: var(--muted); }

  .search-spinner {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    width: 13px;
    height: 13px;
    border-radius: 50%;
    border: 2px solid var(--line);
    border-top-color: var(--accent);
    animation: spin 0.7s linear infinite;
    opacity: 0;
  }
  .search-spinner.active { opacity: 1; }
  @keyframes spin { to { transform: translateY(-50%) rotate(360deg); } }

  .rail-section {
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 0;
  }

  .rail-heading {
    font-family: var(--font-mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
  }

  .rail-graphs {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .rail-graph-btn {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    width: 100%;
    text-align: left;
    padding: 6px 9px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: var(--ink-soft);
    font-size: 12.5px;
    cursor: pointer;
  }
  .rail-graph-btn:hover { background: var(--surface); }
  .rail-graph-btn .dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    margin-right: 7px;
    flex-shrink: 0;
  }
  .rail-graph-btn .n {
    font-family: var(--font-mono);
    color: var(--muted);
    font-size: 11px;
    flex-shrink: 0;
  }

  .trail-list {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow-y: auto;
  }

  .trail-item {
    display: block;
    width: 100%;
    text-align: left;
    padding: 7px 9px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: var(--ink-soft);
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .trail-item:hover { background: var(--surface); }
  .trail-item.current {
    background: var(--accent-soft);
    color: var(--accent-strong);
    font-weight: 500;
  }

  .rail-empty {
    color: var(--muted);
    font-size: 13px;
    font-style: italic;
  }

  .rail-endpoint {
    margin-top: auto;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--muted);
    line-height: 1.6;
  }
  .rail-endpoint a { color: var(--muted); text-decoration: underline; text-decoration-color: var(--line); }

  /* ---------- Main ---------- */

  .main {
    padding: 34px 40px 60px;
    max-width: 960px;
  }

  .empty-state, .home-dash {
    max-width: 720px;
  }

  .empty-state h1, .home-dash h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 30px;
    margin: 0 0 12px;
    text-wrap: balance;
  }

  .empty-state p, .home-dash > p {
    color: var(--ink-soft);
    margin: 0 0 8px;
  }

  .empty-examples {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 18px;
  }

  .chip-btn {
    font-family: var(--font-mono);
    font-size: 12.5px;
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--accent-strong);
    padding: 6px 11px;
    border-radius: 20px;
    cursor: pointer;
  }
  .chip-btn:hover { border-color: var(--accent); }

  .error-banner {
    background: var(--accent-soft);
    border: 1px solid var(--crit);
    color: var(--crit);
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 13.5px;
    margin-bottom: 18px;
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: center;
  }
  .error-banner button {
    font-family: var(--font-mono);
    font-size: 12px;
    background: none;
    border: 1px solid var(--crit);
    color: var(--crit);
    border-radius: 6px;
    padding: 4px 9px;
    cursor: pointer;
    flex-shrink: 0;
  }

  /* ---------- Home dashboard ---------- */

  .dash-section { margin: 26px 0 32px; }
  .dash-heading {
    font-family: var(--font-mono);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 0 0 12px;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .dash-heading span { color: var(--ink-soft); font-family: var(--font-body); text-transform: none; letter-spacing: 0; font-size: 11.5px; }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 10px;
  }

  .stat-tile {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    cursor: pointer;
    text-align: left;
    font-family: var(--font-body);
    color: var(--ink);
  }
  .stat-tile:hover { border-color: var(--accent); box-shadow: var(--shadow); }
  .stat-tile .n {
    font-family: var(--font-mono);
    font-size: 19px;
    font-weight: 600;
    display: block;
    font-variant-numeric: tabular-nums;
  }
  .stat-tile .lbl { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; display: flex; align-items: center; gap: 5px; }
  .stat-tile .sub {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
    margin-top: 5px;
    display: flex;
    align-items: center;
  }
  .stat-tile .sub .dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 5px; flex-shrink: 0;
  }
  .dash-loading { color: var(--muted); font-size: 13px; font-style: italic; }

  /* results list */

  .results-heading {
    font-family: var(--font-mono);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 0 0 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .result-card {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 13px 16px;
    margin-bottom: 8px;
    cursor: pointer;
    font-family: var(--font-body);
    color: var(--ink);
  }
  .result-card:hover { border-color: var(--accent); box-shadow: var(--shadow); }

  .result-label {
    font-weight: 500;
    font-size: 15px;
  }

  .result-meta {
    margin-top: 4px;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }

  .type-pill {
    font-family: var(--font-mono);
    font-size: 11px;
    background: var(--accent-soft);
    color: var(--accent-strong);
    padding: 3px 8px 3px 6px;
    border-radius: 20px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  button.type-pill { border: none; cursor: pointer; }
  button.type-pill:hover { background: var(--accent-strong); color: var(--surface); }
  .type-icon { display: inline-flex; flex-shrink: 0; }

  .file-thumb {
    max-width: 220px;
    max-height: 140px;
    border-radius: 8px;
    border: 1px solid var(--line);
    display: block;
    margin-bottom: 14px;
    object-fit: contain;
    background: var(--surface-alt);
  }
  .result-thumb {
    width: 44px;
    height: 44px;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid var(--line);
    flex-shrink: 0;
  }
  .result-card-row { display: flex; gap: 12px; align-items: center; }
  .result-card-row .result-body { min-width: 0; flex: 1; }

  .event-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
    margin-bottom: 16px;
  }
  .event-card {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    padding: 0;
    cursor: pointer;
    font-family: var(--font-body);
    color: var(--ink);
  }
  .event-card:hover { border-color: var(--accent); box-shadow: var(--shadow); }
  .event-card-img {
    width: 100%;
    aspect-ratio: 12 / 7;
    object-fit: cover;
    display: block;
    background: var(--surface-alt);
  }
  .event-card-body { padding: 12px 14px 14px; }
  .event-card-title { font-weight: 500; font-size: 14px; line-height: 1.35; }
  .event-card-date { margin-top: 6px; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }

  .uri-sub {
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--muted);
    overflow-wrap: anywhere;
  }

  .result-breadcrumb {
    font-size: 12px;
    color: var(--muted);
    margin: 3px 0 4px;
  }

  .breadcrumb {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 5px;
    margin-bottom: 12px;
    font-size: 13px;
  }
  .breadcrumb-link {
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    font-family: var(--font-body);
    color: var(--accent-strong);
    font-size: 13px;
  }
  .breadcrumb-link:hover { text-decoration: underline; }
  .breadcrumb-sep, .breadcrumb-ellipsis { color: var(--muted); }

  .hierarchy-tree {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 22px;
    font-size: 13px;
  }
  .hierarchy-context {
    font-size: 12px;
    color: var(--muted);
    padding-bottom: 10px;
    margin-bottom: 4px;
    border-bottom: 1px solid var(--line);
  }
  .hierarchy-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 0;
  }
  .hierarchy-row.current {
    background: var(--accent-soft);
    color: var(--accent-strong);
    font-weight: 600;
    border-radius: 8px;
    padding: 6px 10px;
  }
  .hierarchy-row.muted { color: var(--muted); }
  .hierarchy-row.ancestor .hierarchy-link { color: var(--muted); }
  .hierarchy-row.ancestor .hierarchy-link:hover { color: var(--accent-strong); }
  .hierarchy-children {
    margin-left: 10px;
    padding-left: 14px;
    border-left: 1px solid var(--line);
  }
  .hierarchy-link {
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    font-family: var(--font-body);
    color: var(--ink);
    font-size: 13px;
    text-align: left;
  }
  .hierarchy-link:hover { color: var(--accent-strong); text-decoration: underline; }

  .pager-row { display: flex; gap: 8px; margin-top: 14px; }
  .pager-btn {
    font-family: var(--font-mono);
    font-size: 11.5px;
    background: none;
    border: 1px dashed var(--line);
    color: var(--accent-strong);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
  }
  .pager-btn:hover { border-color: var(--accent); }
  .pager-btn:disabled { opacity: 0.4; cursor: default; }

  /* record view */

  .record-header {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 22px 24px;
    box-shadow: var(--shadow);
    margin-bottom: 22px;
  }

  .record-eyebrow {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 10px;
    align-items: center;
  }
  .view-kind-pill {
    font-family: var(--font-mono);
    font-size: 11px;
    background: var(--accent-strong);
    color: var(--surface);
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 9px 3px 7px;
    border-radius: 20px;
  }

  .record-title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 25px;
    margin: 0 0 6px;
    text-wrap: balance;
  }

  /* ---------- Person identity header ---------- */
  .identity-row {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 14px;
  }
  .identity-avatar {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--accent-soft);
    color: var(--accent-strong);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 16px;
    flex-shrink: 0;
  }
  .identity-row .record-title { margin: 0 0 4px; }
  .identity-subtitle {
    font-size: 13px;
    color: var(--ink-soft);
  }
  .identity-facts {
    border-top: 1px solid var(--line);
    padding-top: 12px;
    margin-bottom: 14px;
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .identity-fact-row {
    display: flex;
    gap: 10px;
    font-size: 13px;
  }
  .identity-fact-label {
    color: var(--muted);
    min-width: 90px;
    flex-shrink: 0;
  }
  .identity-fact-value { min-width: 0; }

  .explore-toggle {
    font-family: var(--font-mono);
    font-size: 11px;
    background: none;
    border: 1px solid var(--line);
    color: var(--accent-strong);
    padding: 5px 11px;
    border-radius: 20px;
    cursor: pointer;
    margin: 4px 0 14px;
  }
  .explore-toggle:hover { border-color: var(--accent); background: var(--accent-soft); }

  .explore-wrap {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 16px;
  }
  .explore-svg { width: 100%; height: auto; display: block; }
  .explore-label { font-family: var(--font-body); font-size: 12px; font-weight: 700; fill: var(--ink); }
  .explore-sublabel { font-family: var(--font-mono); font-size: 10px; fill: var(--ink-soft); }
  .explore-hub-title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 17px;
    color: var(--ink);
    text-align: center;
    margin: 0 0 10px;
  }
  .explore-station.clickable { cursor: pointer; }
  .explore-station.clickable:hover .explore-label { fill: var(--accent-strong); }
  .explore-legend { display: flex; gap: 18px; margin-top: 8px; font-size: 12px; color: var(--ink-soft); }
  .explore-legend-item.accent { color: var(--accent-strong); }
  .explore-legend-item.crit { color: var(--crit); }
  .explore-ghost { opacity: 0; transition: opacity 150ms ease; cursor: pointer; }
  .explore-ghost.show { opacity: 1; }
  .explore-ghost:hover .explore-ghost-label { fill: var(--accent-strong); }
  .explore-ghost-label { font-family: var(--font-body); font-size: 11px; fill: var(--ink-soft); }

  .record-uri {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
    overflow-wrap: anywhere;
    margin-bottom: 12px;
  }
  .record-uri a { text-decoration: none; border-bottom: 1px dotted var(--line); }
  .record-uri a:hover { border-bottom-color: var(--accent); }

  .record-desc {
    color: var(--ink-soft);
    font-size: 14px;
    margin: 10px 0 0;
    max-width: 68ch;
  }

  .source-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 14px;
  }

  .source-chip {
    font-family: var(--font-mono);
    font-size: 11px;
    background: var(--surface-alt);
    border: 1px solid var(--line);
    color: var(--ink-soft);
    padding: 3px 9px;
    border-radius: 20px;
    cursor: pointer;
  }
  .source-chip b { color: var(--ink); font-weight: 600; }

  .stats-toggle {
    display: flex;
    align-items: center;
    gap: 18px;
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    background: none;
    border-left: none;
    border-right: none;
    border-bottom: none;
    width: 100%;
    text-align: left;
    cursor: pointer;
    font-family: var(--font-body);
  }
  .stats-toggle:hover .stat { color: var(--accent-strong); }
  .stats-toggle-chevron {
    color: var(--muted);
    font-size: 12px;
    transition: transform 0.15s;
    flex-shrink: 0;
  }
  .stats-toggle[aria-expanded="true"] .stats-toggle-chevron { transform: rotate(90deg); }

  .stat {
    font-size: 13px;
    color: var(--ink-soft);
  }
  .stat b {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    font-weight: 600;
  }

  /* ---------- Type-specific hero facts ---------- */

  .hero-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));

    margin-bottom: 8px;
  }

    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 11px 14px;
  }
  .hero-group h3 {
    font-family: var(--font-mono);
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 0 0 7px;
  }
  .hero-fact-val {
    font-size: 13.5px;
    margin-bottom: 3px;
    overflow-wrap: anywhere;
  }
  .hero-fact-val:last-child { margin-bottom: 0; }
  button.hero-link {
    background: none; border: none; padding: 0; cursor: pointer;
    font-family: var(--font-body); color: var(--accent-strong); font-size: 13.5px;
    text-align: left; font-weight: 500;
  }
  button.hero-link:hover { text-decoration: underline; }
  .hero-ext { color: var(--muted); text-decoration: none; margin-left: 4px; }
  .hero-ext:hover { color: var(--accent); }

  .hero-textblocks { margin: 18px 0 22px; display: flex; flex-direction: column; gap: 14px; }
  .hero-textblock h3 {
    font-family: var(--font-mono);
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 0 0 6px;
  }
  .hero-textblock p {
    font-size: 14px;
    color: var(--ink-soft);
    margin: 0;
    white-space: pre-wrap;
    max-width: 74ch;
  }

  /* Event records only: image left, description directly to its right,
     full-width title bar below the pair -- see renderRecord's Event
     branch, which builds this instead of the generic stacked
     image-then-facts-then-description layout every other type gets. */
  .event-hero-row { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; margin-bottom: 16px; }
  .event-hero-img { flex: 0 0 auto; }
  .event-hero-desc { flex: 1 1 260px; min-width: 0; }
  .event-hero-desc p { font-size: 14px; line-height: 1.6; color: var(--ink-soft); margin: 0 0 10px; white-space: pre-wrap; }
  .event-title-box {
    width: 100%;
    box-sizing: border-box;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 18px;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 20px;
    color: var(--ink);
    margin-bottom: 16px;
  }

  .download-btn {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 13px;
    background: var(--accent);
    color: var(--surface);
    padding: 9px 16px;
    border-radius: 8px;
    text-decoration: none;
    margin-bottom: 18px;
  }
  .download-btn:hover { background: var(--accent-strong); }

  .statements-section { margin-top: 6px; }
  .statements-section.collapsed { display: none; }

  .columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 28px;
  }

  @media (max-width: 860px) {
    .columns { grid-template-columns: 1fr; }
  }

  .column-heading {
    font-family: var(--font-mono);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 0 0 12px;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .column-heading span { color: var(--ink-soft); font-family: var(--font-body); text-transform: none; letter-spacing: 0; font-size: 11px; }

  .pred-group {
    margin-bottom: 16px;
  }

  .pred-label {
    font-family: var(--font-mono);
    font-size: 12.5px;
    color: var(--accent-strong);
    background: var(--accent-soft);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 9px 3px 9px;
    border-radius: 6px 6px 0 0;
    border: 1px solid var(--line);
    border-bottom: none;
  }
  .pred-count {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    font-size: 11px;
  }

  .pred-rows {
    border: 1px solid var(--line);
    border-radius: 0 8px 8px 8px;
    background: var(--surface);
    overflow: hidden;
  }

  .value-row {
    padding: 9px 12px;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: flex-start;
  }
  .value-row:last-child { border-bottom: none; }

  .value-main { min-width: 0; flex: 1; }

  button.value-link {
    display: block;
    background: none;
    border: none;
    padding: 0;
    text-align: left;
    cursor: pointer;
    font-family: var(--font-body);
    color: var(--ink);
    font-size: 13.5px;
    font-weight: 500;
  }
  button.value-link:hover { color: var(--accent-strong); text-decoration: underline; }

  .value-curie {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    overflow-wrap: anywhere;
  }

  .value-literal {
    font-size: 13.5px;
    color: var(--ink);
    overflow-wrap: anywhere;
  }
  .lit-tag {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
    margin-left: 6px;
  }

  .graph-tag {
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--muted);
    white-space: nowrap;
    flex-shrink: 0;
    padding-top: 2px;
  }

  .ext-link {
    color: var(--muted);
    text-decoration: none;
    flex-shrink: 0;
    padding-top: 1px;
  }
  .ext-link:hover { color: var(--accent); }

  .load-more-row {
    padding: 8px 12px;
  }
  .load-more-btn {
    font-family: var(--font-mono);
    font-size: 11.5px;
    background: none;
    border: 1px dashed var(--line);
    color: var(--accent-strong);
    padding: 5px 10px;
    border-radius: 6px;
    cursor: pointer;
    width: 100%;
  }
  .load-more-btn:hover { border-color: var(--accent); }
  .load-more-btn:disabled { opacity: 0.5; cursor: default; }

  .group-loading, .column-empty {
    padding: 10px 12px;
    color: var(--muted);
    font-size: 13px;
    font-style: italic;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface);
  }

  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    .rail {
      position: relative;
      height: auto;
      border-right: none;
      border-bottom: 1px solid var(--line);
    }
    .main { padding: 26px 20px 50px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <span class="brand-mark" id="brand-home" title="Home">IISG Knowledge Base Explorer</span>
    </div>
    <div class="brand-sub">IISH knowledge graph</div>

    <div class="search-box">
      <label for="search-input">Search the graph</label>
      <div class="search-input-wrap">
        <input id="search-input" type="text" placeholder="A person, union, place, book…" autocomplete="off" spellcheck="false" />
        <div class="search-spinner" id="search-spinner"></div>
      </div>
    </div>

    <div class="rail-section">
      <div class="rail-heading"><span>Views</span></div>
      <ul class="rail-graphs" id="rail-views">
        <li><button class="rail-graph-btn" data-view="archive"><span>Archive</span></button></li>
        <li><button class="rail-graph-btn" data-view="books"><span>Books</span></button></li>
        <li><button class="rail-graph-btn" data-view="person"><span>Person</span></button></li>
        <li><button class="rail-graph-btn" data-view="datascience"><span>Data science</span></button></li>
        <li><button class="rail-graph-btn" data-view="events"><span>Events@IISG</span></button></li>
      </ul>
    </div>

    <div class="rail-section" style="flex: 1;">
      <div class="rail-heading"><span>Trail</span></div>
      <ul class="trail-list" id="trail-list"></ul>
    </div>

    <div class="rail-endpoint" id="rail-endpoint">
      Live SPARQL query against<br />
      <a id="rail-endpoint-link" href="#" target="_blank" rel="noopener"></a>
    </div>
  </aside>

  <main class="main" id="main"></main>
</div>

<script>
(function () {

    "sdo:DefinedTerm": '<path d="M2 12 12 2h8v8L10 20a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8Z"/><circle cx="15.5" cy="7.5" r="1.6"/>',

    if (!formName) return null;

  // ---------- SPARQL plumbing ----------

  function sparql(query) {
    return fetch(ENDPOINT, {
      method: "POST",
      headers: {
        "Content-Type": "application/x-www-form-urlencoded",
        "Accept": "application/sparql-results+json"
      },
      body: "query=" + encodeURIComponent(query)
    }).then(function (res) {
      if (!res.ok) return res.text().then(function (t) { throw new Error("Query failed (HTTP " + res.status + "): " + t.slice(0, 200)); });
      return res.json();
    }).then(function (json) {
      return json.results.bindings;
    });
  }

  function escLiteral(s) {
    return String(s).replace(/\\/g, "\\\\").replace(/"/g, '\\"').replace(/[\r\n]/g, " ");

  function iriRef(uri) {
    return "<" + String(uri).replace(/[<>\s"]/g, "") + ">";

  function curie(uri) {
    var bestPrefix = null, bestLen = 0;
    for (var iri in PREFIXES) {
      if (uri.indexOf(iri) === 0 && iri.length > bestLen) { bestPrefix = PREFIXES[iri]; bestLen = iri.length; }
    }
    if (bestPrefix) return bestPrefix + ":" + uri.slice(bestLen);
    return null;
  }

  function shortLabel(uri) {
    var c = curie(uri);
    if (c) return c;
    var m = uri.match(/([^/#]+)\/?$/);
    return m ? decodeURIComponent(m[1]) : uri;
  }

  function isLocalUri(uri) {
    try {
      var host = new URL(uri).host;
      return LOCAL_HOSTS.some(function (h) { return host === h || host.endsWith("." + h); });
    } catch (e) { return true; }
  }

  function isSafeHref(uri) {
    return /^https?:\/\//i.test(uri);
  }

  var XSD_ANYURI = "http://www.w3.org/2001/XMLSchema#anyURI";

  // Several MARC-derived predicates (nativeViewer above all -- 1.3M+ of its
  // 1.33M values) are asserted as xsd:anyURI-typed *literals* rather than
  // real RDF URI nodes, so a plain `o.type === "uri"` check misses almost
  // all of them. Treat any literal that's URI-typed or simply looks like an
  // absolute http(s) URL as a link too, just not a graph node to navigate()
  // into -- there's nothing in this store to browse at that address.
  function literalUrl(o) {
    if (o.type !== "literal") return null;
    if (o.datatype === XSD_ANYURI || isSafeHref(o.value)) return o.value;
    return null;
  }

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === "class") node.className = attrs[k];
      else if (k === "text") node.textContent = attrs[k];
      else node.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(function (c) { if (c) node.appendChild(c); });
    return node;
  }

  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

  function graphInfo(iri) {

    return { iri: iri, label: shortLabel(iri), sub: "", color: "#758790" };
  }

  // The "statements" section's incoming column streams in via several
  // parallel, paginated loadGroupPage() calls -- for a heavily-referenced
  // entity (thousands of incoming statements across many predicates) that
  // can keep growing the page for a couple of seconds after it's expanded.
  // A plain scrollIntoView() called once at click time lands wherever the
  // section was at that instant, then gets left behind as more rows stream
  // in above the fold -- confirmed on a real record where the document
  // grew from ~3000px to ~8000px over 2.5s after expanding. This waits for
  // the page to stop growing (two unchanged height checks in a row) before
  // scrolling, instead of guessing a fixed delay.
  function scrollToWhenStable(target, maxWaitMs) {
    var lastHeight = -1, stableCount = 0, start = Date.now();
    function check() {
      var h = document.documentElement.scrollHeight;
      stableCount = h === lastHeight ? stableCount + 1 : 0;
      lastHeight = h;
      if (stableCount >= 2 || Date.now() - start > maxWaitMs) {
        // window.scrollTo with a manually computed target and NO smooth
        // behavior -- confirmed both scrollIntoView (any block value) and
        // scrollTo's smooth-behavior form silently do nothing in some
        // automated/CDP-driven browser contexts; only the plain instant
        // jump reliably moves the scroll position. An instant jump also
        // just guarantees the user actually lands in the right place,
        // which is the actual bug here, not the lack of animation.
        window.scrollTo(0, target.getBoundingClientRect().top + window.scrollY);
      } else {
        setTimeout(check, 150);
      }
    }
    check();
  }

  function pushTrail(uri, label) {
    trail = trail.filter(function (t) { return t.uri !== uri; });
    trail.unshift({ uri: uri, label: label });

  function renderTrail() {
    clear(trailListEl);
    if (!trail.length) {

  function navigate(uri, opts) {
    opts = opts || {};

    currentUri = uri;

  function navigateToView(viewName) {

  // whatever the user navigated to in the meantime.

    viewGeneration++;

    else if (viewName === "books") renderBooksLanding();

  // ---------- Person view: randomly-centered Explore landing ----------
  // The new default experience (see init, below, and navigateHome()).
  // Picks a real person weighted toward being reasonably well-connected
  // (sampling from sdo:about edges, not a uniform pick over all Persons,
  // most of whom have zero "written about together" connections) and
  // jumps straight into their Explore map rather than the flat record
  // page -- reuses loadEntity()/renderRecord() as-is, then simulates a
  // click on the Explore toggle those already build, instead of
  // duplicating that rendering path.

  var aboutPersonTripleCount = null;

  function fetchAboutPersonTripleCount() {
    if (aboutPersonTripleCount !== null) return Promise.resolve(aboutPersonTripleCount);
    var q = "SELECT (COUNT(*) AS ?n) WHERE {\n" +
      "  { ?w <http://schema.org/about> ?p } UNION { ?w <https://schema.org/about> ?p }\n" +
      "  ?p a <https://schema.org/Person> .\n" +
      "}";
    return sparql(q).then(function (rows) {
      aboutPersonTripleCount = rows.length ? parseInt(rows[0].n.value, 10) : 50000;
      return aboutPersonTripleCount;
    }).catch(function () { return 50000; });
  }

  function fetchRandomPersonCandidate() {
    return fetchAboutPersonTripleCount().then(function (total) {
      var offset = Math.floor(Math.random() * Math.max(total - 1, 1));
      // No GROUP BY, deliberately: this samples raw (work, person) rows,
      // not distinct persons, so someone asserted as sdo:about on many
      // works is proportionally more likely to come up -- a cheap stand-in
      // for "pick someone well-connected" without a separate degree
      // computation. Each row already resolves to at most one ?lbl via
      // COALESCE, so no aggregate is needed to make this valid SPARQL.
      var q = "SELECT ?p ?lbl WHERE {\n" +
        "  { ?w <http://schema.org/about> ?p } UNION { ?w <https://schema.org/about> ?p }\n" +
        "  ?p a <https://schema.org/Person> .\n" +
        "  OPTIONAL { ?p <http://schema.org/name> ?n1 }\n" +
        "  OPTIONAL { ?p <https://schema.org/name> ?n2 }\n" +
        "  BIND(COALESCE(?n1, ?n2) AS ?lbl)\n" +
        "} LIMIT 1 OFFSET " + offset;
      return sparql(q);
    }).then(function (rows) {
      if (!rows.length) return null;
      return { uri: rows[0].p.value, label: rows[0].lbl ? rows[0].lbl.value : shortLabel(rows[0].p.value) };
    }).catch(function () { return null; });
  }

  function renderPersonLanding() {
    var gen = viewGeneration;
    clear(mainEl);
    mainEl.appendChild(el("div", { class: "results-heading", text: "Finding someone to explore…" }));
    fetchRandomPersonCandidate().then(function (candidate) {
      if (gen !== viewGeneration) return;
      if (!candidate) {
        clear(mainEl);
        renderError("Couldn’t find a starting point.", renderPersonLanding);
        return;
      }
      currentUri = candidate.uri;
      history.replaceState({ uri: candidate.uri }, "", "#" + encodeURIComponent(candidate.uri));
      loadEntity(candidate.uri).then(function () {
        if (gen !== viewGeneration) return;
        var graphSlot = mainEl.querySelector(".graph-slot");
        if (!graphSlot) return; // shouldn't happen for a Person, but don't break if it does
        var reroll = el("button", { class: "explore-toggle", text: "↻ Show me someone else" });
        reroll.addEventListener("click", function () { navigateToView("person"); });
        graphSlot.insertBefore(reroll, graphSlot.firstChild);

    });
  }

  // ---------- Archive / Books views: curated entry points ----------
  // v1: the existing "browse by type" list, same as the home dashboard's
  // tiles already offer -- a real, working landing page, not a dead end,
  // with a more deliberately designed entry (e.g. starting from a specific
  // top-level collection, or a notable book) as a follow-up.

  function renderArchiveLanding() {
    browseType("https://schema.org/ArchiveComponent", "sdo:ArchiveComponent");
  }

  function renderBooksLanding() {
    browseType("https://schema.org/Book", "sdo:Book");

  // ---------- Events view: image-forward showcase, not a plain list ----------
  // sdo:Event is also asserted by authorities-etl's meeting-name headings
  // (see EVENT_FIELDS above) -- scoped to events-etl's own named graph so
  // this only ever shows real calendar events (the ones with a startDate
  // and usually a poster image), not those unrelated subject headings.
  // Only ~170 of them, so one query fetches everything; no COUNT+LIMIT/
  // OFFSET paging like browseType's huge single-type lists need.
  function fmtEventDate(iso) {
    if (!iso) return null;
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
  }

  function renderEventsLanding() {
    currentUri = null;
    renderTrail();
    clear(mainEl);
    mainEl.appendChild(el("div", { class: "results-heading", text: "Loading events…" }));
    var q = "PREFIX schema: <https://schema.org/>\n" +
      "SELECT ?e (SAMPLE(?nm) AS ?name) (SAMPLE(?start) AS ?startDate) (SAMPLE(?url) AS ?imgUrl) WHERE {\n" +
      "  GRAPH <https://iisg.amsterdam/graph/events> { ?e a schema:Event }\n" +
      "  OPTIONAL { ?e schema:name ?nm }\n" +
      "  OPTIONAL { ?e schema:startDate ?start }\n" +
      "  OPTIONAL { ?e schema:image ?img . ?img schema:contentUrl ?url }\n" +
      "} GROUP BY ?e ORDER BY DESC(?startDate)";
    sparql(q).then(function (rows) {
      var items = rows.map(function (r) {
        return {
          uri: r.e.value,
          label: r.name ? r.name.value : shortLabel(r.e.value),
          startDate: r.startDate ? r.startDate.value : null,
          imgUrl: r.imgUrl && isLocalUri(r.imgUrl.value) ? r.imgUrl.value : null
        };
      });
      renderEventsGrid(items);
    }).catch(function (err) {
      clear(mainEl);
      renderError("Couldn’t load events: " + err.message, renderEventsLanding);
    });
  }

  function renderEventsGrid(items) {
    clear(mainEl);
    if (!items.length) {
      mainEl.appendChild(el("div", { class: "results-heading", text: "Events — no results" }));
      return;
    }
    mainEl.appendChild(el("div", { class: "results-heading", text: "Events — " + fmtNum(items.length) + " total" }));
    var grid = el("div", { class: "event-grid" });
    mainEl.appendChild(grid);
    var shown = 0;

    function renderPage() {
      items.slice(shown, shown + PAGE_SIZE).forEach(function (it) {
        var card = el("button", { class: "event-card" });
        if (it.imgUrl) {
          var img = el("img", { class: "event-card-img", src: it.imgUrl, alt: it.label, loading: "lazy" });
          img.onerror = function () { img.remove(); };
          card.appendChild(img);
        }
        var body = el("div", { class: "event-card-body" });
        body.appendChild(el("div", { class: "event-card-title", text: it.label }));
        var dateText = fmtEventDate(it.startDate);
        if (dateText) body.appendChild(el("div", { class: "event-card-date", text: dateText }));
        card.appendChild(body);
        card.addEventListener("click", function () { navigate(it.uri, { label: it.label }); });
        grid.appendChild(card);
      });
      shown += PAGE_SIZE;
      var oldPager = mainEl.querySelector(".pager-row");
      if (oldPager) oldPager.parentNode.removeChild(oldPager);
      if (shown < items.length) {
        var pager = el("div", { class: "pager-row" });
        var btn = el("button", { class: "pager-btn", text: "Show " + Math.min(PAGE_SIZE, items.length - shown) + " more" });
        btn.addEventListener("click", renderPage);
        pager.appendChild(btn);
        mainEl.appendChild(pager);
      }
    }
    renderPage();
  }

  // Brand/logo click -- goes to the new default experience (Person,
  // randomly centered), same as landing on the bare site with no hash.
  function navigateHome() { navigateToView("person"); }

  function syncFromHash() {
    var raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (raw === currentUri) return;
    if (raw.indexOf("view:") === 0) { currentUri = null; renderTrail(); renderView(raw.slice(5)); return; }
    if (raw && /^https?:\/\//i.test(raw)) { currentUri = raw; loadEntity(raw); }
    else { currentUri = null; renderTrail(); renderView("person"); }
  }

  window.addEventListener("popstate", syncFromHash);
  window.addEventListener("hashchange", syncFromHash);

  Array.prototype.forEach.call(document.querySelectorAll("#rail-views [data-view]"), function (btn) {
    btn.addEventListener("click", function () { navigateToView(btn.getAttribute("data-view")); });
  });

  // ---------- Rendering: pipelines section (now part of the "Data
  // science" view's dashboard, not a permanent sidebar fixture) ----------

  function pipelinesDashSection() {
    var section = el("div", { class: "dash-section" });
    section.appendChild(el("div", { class: "dash-heading", text: "Pipelines" }));
    var grid = el("div", { class: "stat-grid" });
    var loading = el("div", { class: "dash-loading", text: "Loading pipeline counts…" });
    section.appendChild(loading);
    section.appendChild(grid);
    sparql("SELECT ?g (COUNT(*) AS ?c) WHERE { GRAPH ?g { ?s ?p ?o } } GROUP BY ?g ORDER BY DESC(?c)").then(function (rows) {
      section.removeChild(loading);
      rows.forEach(function (r) {
        var info = graphInfo(r.g.value);
        var tile = el("button", { class: "stat-tile" });
        tile.appendChild(el("span", { class: "n", text: fmtNum(r.c.value) }));
        tile.appendChild(el("span", { class: "lbl", text: info.label }));
        var sub = el("span", { class: "sub" });
        var dot = document.createElement("span"); dot.className = "dot"; dot.style.background = info.color;
        sub.appendChild(dot);
        sub.appendChild(document.createTextNode(info.sub));
        tile.appendChild(sub);
        tile.addEventListener("click", function () { browseGraph(info); });
        grid.appendChild(tile);
      });
    }).catch(function () {
      section.removeChild(loading);
      grid.appendChild(el("div", { class: "column-empty", text: "Store unreachable." }));
    });
    return section;
  }

  // ---------- Rendering: home dashboard ----------

  function renderHome() {
    clear(mainEl);
    var wrap = el("div", { class: "home-dash" });
    wrap.appendChild(el("h1", { text: "Trace a record through the graph." }));
    wrap.appendChild(el("p", { text: "Eight pipelines feed this graph \u2014 biblio-etl, archive-etl, findingaid-etl, authorities-etl, dataverse-etl, orcid-etl, events-etl and identity-etl \u2014 each asserting into its own named graph, but sharing IRIs (or, where they can't, linked by identity-etl's sdo:sameAs crosswalk) wherever their records describe the same person, place, archive or topic. Search for something, or browse by type below." }));

    var ex = el("div", { class: "empty-examples" });
    ["dockworkers", "Rotterdam", "International Institute of Social History", "Jan Lucassen"].forEach(function (term) {
      var b = el("button", { class: "chip-btn", text: term });
      b.addEventListener("click", function () { searchInput.value = term; runSearch(term); });
      ex.appendChild(b);
    });
    wrap.appendChild(ex);

    var typeSection = el("div", { class: "dash-section" });
    typeSection.appendChild(el("div", { class: "dash-heading", text: "Browse by kind of item" }));
    var typeGrid = el("div", { class: "stat-grid" });
    typeSection.appendChild(el("div", { class: "dash-loading", text: "Loading type counts\u2026" }));
    typeSection.appendChild(typeGrid);
    wrap.appendChild(typeSection);
    wrap.appendChild(pipelinesDashSection());

    mainEl.appendChild(wrap);

    sparql(
      "SELECT ?g ?type (COUNT(*) AS ?c) WHERE {\n" +
      "  GRAPH ?g { ?s a ?type }\n" +
      "  FILTER(?g != " + iriRef(IDENTITY_GRAPH) + ")\n" +
      "} GROUP BY ?g ?type"
    ).then(function (rows) {
      typeSection.removeChild(typeSection.querySelector(".dash-loading"));
      var byType = {};
      rows.forEach(function (r) {
        var key = curie(r.type.value) || shortLabel(r.type.value);
        if (!byType[key]) byType[key] = { key: key, uri: r.type.value, total: 0, graphs: {} };
        byType[key].total += parseInt(r.c.value, 10);
        byType[key].graphs[r.g.value] = (byType[key].graphs[r.g.value] || 0) + parseInt(r.c.value, 10);
      });
      var list = Object.keys(byType).map(function (k) { return byType[k]; });
      list.sort(function (a, b) { return b.total - a.total; });
      list.slice(0, 16).forEach(function (t) {
        var mainGraph = Object.keys(t.graphs).sort(function (a, b) { return t.graphs[b] - t.graphs[a]; })[0];
        var info = graphInfo(mainGraph);
        var tile = el("button", { class: "stat-tile" });
        tile.appendChild(el("span", { class: "n", text: fmtNum(t.total) }));
        var lbl = el("span", { class: "lbl" });
        lbl.appendChild(iconSpan(t.key));
        lbl.appendChild(document.createTextNode(pluralType(t.key)));
        tile.appendChild(lbl);
        var sub = el("span", { class: "sub" });
        var dot = document.createElement("span"); dot.className = "dot"; dot.style.background = info.color;
        sub.appendChild(dot);
        sub.appendChild(document.createTextNode(Object.keys(t.graphs).length > 1 ? Object.keys(t.graphs).length + " graphs" : info.label));
        tile.appendChild(sub);
        tile.addEventListener("click", function () { browseType(t.uri, t.key); });
        typeGrid.appendChild(tile);
      });
    }).catch(function (err) {
      typeSection.removeChild(typeSection.querySelector(".dash-loading"));
      typeSection.appendChild(el("div", { class: "column-empty", text: "Couldn\u2019t load type counts: " + err.message }));
    });
  }

  function pluralType(curieStr) {
    var name = curieStr.split(":").pop().replace(/([a-z])([A-Z])/g, "$1 $2");
    var lower = name.toLowerCase();
    if (/s$/.test(lower)) return name;
    return name + "s";
  }

  function renderEmptyState() { renderHome(); }

  function renderError(message, retry) {
    var banner = el("div", { class: "error-banner" });
    banner.appendChild(el("span", { text: message }));
    if (retry) {
      var btn = el("button", { text: "Retry" });
      btn.addEventListener("click", retry);
      banner.appendChild(btn);
    }
    mainEl.insertBefore(banner, mainEl.firstChild);
  }

  // ---------- Browse by graph / by type ----------

  function browseGraph(info) {
    currentUri = null;
    renderTrail();
    clear(mainEl);
    mainEl.appendChild(el("div", { class: "results-heading", text: "Loading \u201c" + info.label + "\u201d\u2026" }));
    var q = "PREFIX sdo: <http://schema.org/>\n" +
      "SELECT ?s (SAMPLE(?lbl) AS ?label) (SAMPLE(?t) AS ?type) WHERE {\n" +
      "  GRAPH " + iriRef(info.iri) + " { ?s a ?t }\n" +
      "  OPTIONAL { GRAPH " + iriRef(info.iri) + " { ?s sdo:name ?n1 } }\n" +
      "  OPTIONAL { GRAPH " + iriRef(info.iri) + " { ?s <https://schema.org/name> ?n2 } }\n" +
      "  OPTIONAL { GRAPH " + iriRef(info.iri) + " { ?s <http://www.w3.org/2000/01/rdf-schema#label> ?n3 } }\n" +
      "  OPTIONAL { GRAPH " + iriRef(info.iri) + " { ?s sdo:roleName ?n4 } }\n" +
      "  OPTIONAL { GRAPH " + iriRef(info.iri) + " { ?s <https://schema.org/roleName> ?n5 } }\n" +
      "  BIND(COALESCE(?n1, ?n2, ?n3, ?n4, ?n5) AS ?lbl)\n" +
      "} GROUP BY ?s ORDER BY ?s";
    sparql(q).then(function (rows) {
      var items = rows.map(function (r) {
        var tc = r.type ? (curie(r.type.value) || shortLabel(r.type.value)) : null;
        return { uri: r.s.value, label: r.label ? r.label.value : shortLabel(r.s.value), typeCurie: tc, extraPills: [] };
      });
      renderResultList("Browsing " + info.label, items);
    }).catch(function (err) {
      clear(mainEl);
      renderError("Couldn\u2019t load list: " + err.message, function () { browseGraph(info); });
    });
  }

  // A type can have hundreds of thousands of instances (Books: ~786K) --
  // fetching them all up front (as this used to) meant a single query
  // joining in labels for every one of them before anything could render,
  // ~7s for Books. Count first (cheap: no label joins), then page the
  // actual rows with LIMIT/OFFSET, same lazy-load shape as loadGroupPage.
  function browseType(typeUri, typeKey) {
    currentUri = null;
    renderTrail();
    clear(mainEl);
    var label = pluralType(typeKey);
    mainEl.appendChild(el("div", { class: "results-heading", text: "Loading " + label.toLowerCase() + "\u2026" }));
    var countQ = "SELECT (COUNT(DISTINCT ?s) AS ?c) WHERE { GRAPH ?g { ?s a " + iriRef(typeUri) + " } FILTER(?g != " + iriRef(IDENTITY_GRAPH) + ") }";
    sparql(countQ).then(function (rows) {
      var total = rows.length ? parseInt(rows[0].c.value, 10) : 0;
      renderPagedTypeList(label, typeUri, typeKey, total);
    }).catch(function (err) {
      clear(mainEl);
      renderError("Couldn\u2019t load list: " + err.message, function () { browseType(typeUri, typeKey); });
    });
  }

  function fetchTypePage(typeUri, typeKey, offset) {
    var q = "SELECT ?s (SAMPLE(?lbl) AS ?label) (SAMPLE(?g) AS ?graph) WHERE {\n" +
      "  GRAPH ?g { ?s a " + iriRef(typeUri) + " }\n" +
      "  FILTER(?g != " + iriRef(IDENTITY_GRAPH) + ")\n" +
      "  OPTIONAL { ?s <http://schema.org/name> ?n1 }\n" +
      "  OPTIONAL { ?s <https://schema.org/name> ?n2 }\n" +
      "  OPTIONAL { ?s <http://www.w3.org/2000/01/rdf-schema#label> ?n3 }\n" +
      "  OPTIONAL { ?s <http://schema.org/roleName> ?n4 }\n" +
      "  OPTIONAL { ?s <https://schema.org/roleName> ?n5 }\n" +
      "  BIND(COALESCE(?n1, ?n2, ?n3, ?n4, ?n5) AS ?lbl)\n" +
      "} GROUP BY ?s ORDER BY ?s LIMIT " + PAGE_SIZE + " OFFSET " + offset;
    return sparql(q).then(function (rows) {
      return rows.map(function (r) {
        var g = r.graph ? graphInfo(r.graph.value).label : null;
        return { uri: r.s.value, label: r.label ? r.label.value : shortLabel(r.s.value), typeCurie: typeKey, extraPills: g ? [g] : [] };
      });
    });
  }

  function renderPagedTypeList(heading, typeUri, typeKey, total) {
    clear(mainEl);
    if (!total) {
      mainEl.appendChild(el("div", { class: "results-heading", text: heading + " \u2014 no results" }));
      return;
    }
    mainEl.appendChild(el("div", { class: "results-heading", text: heading + " \u2014 " + fmtNum(total) + " total" }));
    var wrap = el("div", { class: "cards-wrap" });
    mainEl.appendChild(wrap);
    var loaded = 0;

    function loadPage() {
      fetchTypePage(typeUri, typeKey, loaded).then(function (items) {
        var oldPager = wrap.querySelector(".pager-row");
        if (oldPager) wrap.removeChild(oldPager);
        var cardByUri = {};
        items.forEach(function (it) {
          var card = resultCardEl(it);
          wrap.appendChild(card);
          if (HIERARCHICAL_TYPES[it.typeCurie]) cardByUri[it.uri] = card;
        });
        var hierarchyUris = Object.keys(cardByUri);
        if (hierarchyUris.length) {
          fetchAncestorChains(hierarchyUris).then(function (chains) {
            hierarchyUris.forEach(function (u) {
              if (!chains[u] || !chains[u].length) return;
              var card = cardByUri[u];
              if (!card || !card.isConnected) return;
              var lbl = card.querySelector(".result-label");
              lbl.insertAdjacentElement("afterend", el("div", { class: "result-breadcrumb", text: textBreadcrumb(chains[u]) }));
            });
          });
        }
        loaded += items.length;
        if (loaded < total && items.length) {
          var pager = el("div", { class: "pager-row" });
          var btn = el("button", { class: "pager-btn", text: "Show " + Math.min(PAGE_SIZE, total - loaded) + " more" });
          btn.addEventListener("click", function () { btn.disabled = true; btn.textContent = "Loading\u2026"; loadPage(); });
          pager.appendChild(btn);
          wrap.appendChild(pager);
        }
      }).catch(function (err) {
        var pager = el("div", { class: "pager-row" });
        pager.appendChild(el("div", { class: "group-loading", text: "Couldn\u2019t load more: " + err.message }));
        wrap.appendChild(pager);
      });
    }
    loadPage();
  }

  // ---------- Shared result rendering: cluster by type when the list is mixed ----------

  function renderResultList(heading, items) {
    clear(mainEl);
    if (!items.length) {
      mainEl.appendChild(el("div", { class: "results-heading", text: heading + " \u2014 no results" }));
      return;
    }

    var groups = {}, order = [];
    items.forEach(function (it) {
      var key = it.typeCurie || "other";
      if (!groups[key]) { groups[key] = []; order.push(key); }
      groups[key].push(it);
    });

    if (order.length <= 1) {
      mainEl.appendChild(el("div", { class: "results-heading", text: heading + " \u2014 " + fmtNum(items.length) + " total" }));
      var wrap = el("div", { class: "cards-wrap" });
      mainEl.appendChild(wrap);
      renderCardGroup(wrap, items, 0);
      return;
    }

    order.sort(function (a, b) { return groups[b].length - groups[a].length; });
    if (order.indexOf("other") !== -1) { order = order.filter(function (k) { return k !== "other"; }); order.push("other"); }
    renderResultTiles(heading, items, groups, order);
  }

  // Mixed-type result set: show one compact tile per type (like the home
  // dashboard), and only expand to an actual card list once a tile is
  // picked -- a long list of everything, split into headed clusters, still
  // reads as one long list when most matches are one type buried under a
  // dozen others.
  function renderResultTiles(heading, items, groups, order) {
    clear(mainEl);
    mainEl.appendChild(el("div", { class: "results-heading", text: heading + " \u2014 " + fmtNum(items.length) + " total, " + order.length + " kinds" }));
    var grid = el("div", { class: "stat-grid" });
    order.forEach(function (key) {
      var tile = el("button", { class: "stat-tile" });
      tile.appendChild(el("span", { class: "n", text: fmtNum(groups[key].length) }));
      var lbl = el("span", { class: "lbl" });
      lbl.appendChild(iconSpan(key === "other" ? null : key));
      lbl.appendChild(document.createTextNode(key === "other" ? "Other" : pluralType(key)));
      tile.appendChild(lbl);
      tile.addEventListener("click", function () {
        // Nothing to choose between when there's exactly one -- go straight
        // to it instead of a list-of-one detour.
        if (groups[key].length === 1) { navigate(groups[key][0].uri, { label: groups[key][0].label }); return; }
        renderResultTypeDetail(heading, items, groups, order, key);
      });
      grid.appendChild(tile);
    });
    mainEl.appendChild(grid);
  }

  function renderResultTypeDetail(heading, items, groups, order, key) {
    clear(mainEl);
    var top = el("div", { class: "results-heading" });
    var left = el("span", { style: "display:flex; align-items:center; gap:10px;" });
    var back = el("button", { class: "pager-btn", text: "\u2190 All kinds" });
    back.addEventListener("click", function () { renderResultTiles(heading, items, groups, order); });
    left.appendChild(back);
    var titleWrap = el("span", { style: "display:flex; align-items:center; gap:6px;" });
    titleWrap.appendChild(iconSpan(key === "other" ? null : key));
    titleWrap.appendChild(document.createTextNode((key === "other" ? "Other" : pluralType(key)) + " \u2014 " + fmtNum(groups[key].length)));
    left.appendChild(titleWrap);
    top.appendChild(left);
    mainEl.appendChild(top);
    var wrap = el("div", { class: "cards-wrap" });
    mainEl.appendChild(wrap);
    renderCardGroup(wrap, groups[key], 0);
  }

  // ---------- Hierarchy breadcrumbs ----------
  // findingaid-etl's nested archive components and Dataverse's datasets-in-
  // a-catalog are both real sdo:isPartOf chains, just of different depths.
  // Walk them generically rather than special-casing either shape: resolve
  // one "hop" for every still-active chain at once (a breadth-first sweep,
  // not one query per item), so a whole page of results costs at most a
  // handful of round trips no matter how many cards need a breadcrumb.

  // sdo:Dataset deliberately isn't here: a Dataverse dataset can belong to
  // several catalogs at once via sdo:includedInDataCatalog (a many-to-many
  // membership, not a single-parent chain) -- confirmed on real data, one
  // dataset filed under 3 catalogs simultaneously. A breadcrumb would have
  // to arbitrarily pick one; the existing "In catalog" field already lists
  // all of them correctly.
  var HIERARCHICAL_TYPES = { "sdo:ArchiveComponent": true, "rico:RecordSet": true };

  function fetchAncestorChains(uris) {
    var chains = {};
    var frontier = {};
    uris.forEach(function (u) { chains[u] = []; frontier[u] = u; });

    function step(hopsLeft) {
      var tips = Object.keys(frontier).map(function (k) { return frontier[k]; });
      var uniqueTips = tips.filter(function (v, i) { return tips.indexOf(v) === i; });
      if (!uniqueTips.length || hopsLeft <= 0) return Promise.resolve(chains);

      var values = uniqueTips.map(iriRef).join(" ");
      var q = "SELECT ?child ?parent (SAMPLE(?lbl) AS ?label) WHERE {\n" +
        "  VALUES ?child { " + values + " }\n" +
        "  { ?child <http://schema.org/isPartOf> ?parent } UNION { ?child <https://schema.org/isPartOf> ?parent }\n" +
        "  OPTIONAL { ?parent <http://schema.org/name> ?n1 }\n" +
        "  OPTIONAL { ?parent <https://schema.org/name> ?n2 }\n" +
        "  OPTIONAL { ?parent <http://www.w3.org/2000/01/rdf-schema#label> ?n3 }\n" +
        "  BIND(COALESCE(?n1, ?n2, ?n3) AS ?lbl)\n" +
        "} GROUP BY ?child ?parent";

      return sparql(q).then(function (rows) {
        var byChild = {};
        rows.forEach(function (r) { if (!byChild[r.child.value]) byChild[r.child.value] = { parent: r.parent.value, label: r.label ? r.label.value : null }; });
        var advanced = false;
        Object.keys(frontier).forEach(function (orig) {
          var tip = frontier[orig];
          var info = byChild[tip];
          if (!info) { delete frontier[orig]; return; }
          // Stop at a pipeline's own NDE dataset-registration node
          // (dataset:biblio etc.) -- that's plumbing, not a conceptual
          // ancestor a reader would recognize.
          if ((curie(info.parent) || "").indexOf("dataset:") === 0) { delete frontier[orig]; return; }
          chains[orig].unshift({ uri: info.parent, label: info.label || shortLabel(info.parent) });
          frontier[orig] = info.parent;
          advanced = true;
        });
        return advanced ? step(hopsLeft - 1) : chains;
      }).catch(function () { return chains; });
    }

    return step(15);
  }

  // Siblings (other children of the immediate parent) and this node's own
  // children, in one round trip -- the "where am I in this box, and what's
  // inside it" neighborhood a flat breadcrumb doesn't show. parentUri comes
  // from the ancestor chain already fetched for the breadcrumb above; when
  // null (a top-level node), only the "child" branch runs.
  // Shared by fetchHierarchyNeighborhood and fetchWorksByInversePredicate --
  // both want each row's iisgv:form label (for formIconKey, above) and
  // nothing else needs it, so this is the one place the lookup is written.
  function formLookupFragment(subjectVar) {
    return "  OPTIONAL {\n" +
      "    " + subjectVar + " <https://iisg.amsterdam/vocab/form> ?formNode .\n" +
      "    OPTIONAL { ?formNode <http://schema.org/name> ?fn1 }\n" +
      "    OPTIONAL { ?formNode <https://schema.org/name> ?fn2 }\n" +
      "    BIND(COALESCE(?fn1, ?fn2) AS ?formNameLit)\n" +
      "  }\n";
  }

  function fetchHierarchyNeighborhood(uri, parentUri) {
    var selfBlock = "{ BIND(\"child\" AS ?scope)\n" +
      "  { ?node <http://schema.org/isPartOf> " + iriRef(uri) + " } UNION { ?node <https://schema.org/isPartOf> " + iriRef(uri) + " }\n" +
      "}";
    var blocks = [selfBlock];
    if (parentUri) {
      blocks.push("{ BIND(\"sibling\" AS ?scope)\n" +
        "  { ?node <http://schema.org/isPartOf> " + iriRef(parentUri) + " } UNION { ?node <https://schema.org/isPartOf> " + iriRef(parentUri) + " }\n" +
        "}");
    }
    var q = "SELECT ?scope ?node (SAMPLE(?lbl) AS ?label) (SAMPLE(?type) AS ?typeUri) (GROUP_CONCAT(?formNameLit; separator=\"|\") AS ?formName) WHERE {\n" +
      "  " + blocks.join(" UNION ") + "\n" +
      "  OPTIONAL { ?node <http://schema.org/name> ?n1 }\n" +
      "  OPTIONAL { ?node <https://schema.org/name> ?n2 }\n" +
      "  OPTIONAL { ?node <http://www.w3.org/2000/01/rdf-schema#label> ?n3 }\n" +
      "  BIND(COALESCE(?n1, ?n2, ?n3) AS ?lbl)\n" +
      "  OPTIONAL { ?node a ?type }\n" +
      formLookupFragment("?node") +
      "} GROUP BY ?scope ?node ORDER BY ?scope ?label LIMIT 400";

    return sparql(q).then(function (rows) {
      var children = [], siblings = [];
      rows.forEach(function (r) {
        var item = { uri: r.node.value, label: r.label ? r.label.value : shortLabel(r.node.value), typeCurie: r.typeUri ? curie(r.typeUri.value) : null, formName: r.formName ? r.formName.value : null };
        (r.scope.value === "child" ? children : siblings).push(item);
      });
      return { children: children, siblings: siblings };
    }).catch(function () { return { children: [], siblings: [] }; });
  }

  // Why the siblings are grouped the way they are -- findingaid-etl records
  // this on the *parent* (group) node, not on each child: physical extent
  // ("5 Mappen"), the date range the group covers, and the arrangement rule
  // ("Alphabetisch nach Namen der Korrespondenten") sometimes under
  // iisgv:arrangement, sometimes under sdo:description depending on how the
  // original EAD was authored -- coalesce both rather than picking one.
  function fetchGroupContext(parentUri) {
    var q = "SELECT ?arrangement ?physDesc ?dates WHERE {\n" +
      "  OPTIONAL { " + iriRef(parentUri) + " <https://iisg.amsterdam/vocab/arrangement> ?a1 }\n" +
      "  OPTIONAL { " + iriRef(parentUri) + " <http://schema.org/description> ?a2 }\n" +
      "  OPTIONAL { " + iriRef(parentUri) + " <https://schema.org/description> ?a3 }\n" +
      "  BIND(COALESCE(?a1, ?a2, ?a3) AS ?arrangement)\n" +
      "  OPTIONAL { " + iriRef(parentUri) + " <https://iisg.amsterdam/vocab/physicalDescription> ?physDesc }\n" +
      "  OPTIONAL { " + iriRef(parentUri) + " <http://schema.org/temporalCoverage> ?t1 }\n" +
      "  OPTIONAL { " + iriRef(parentUri) + " <https://schema.org/temporalCoverage> ?t2 }\n" +
      "  BIND(COALESCE(?t1, ?t2) AS ?dates)\n" +
      "} LIMIT 1";
    return sparql(q).then(function (rows) {
      if (!rows.length) return null;
      var r = rows[0];
      var ctx = {
        arrangement: r.arrangement ? r.arrangement.value : null,
        physicalDescription: r.physDesc ? r.physDesc.value : null,
        dates: r.dates ? r.dates.value : null
      };
      return (ctx.arrangement || ctx.physicalDescription || ctx.dates) ? ctx : null;
    }).catch(function () { return null; });
  }

  // Cross-system identity expansion: identity-etl mints one hub
  // (https://iisg.amsterdam/id/<n>) per real person/organization and links
  // every external identifier (an authority URI, an ORCID URI, a ROR, ...)
  // to it with sdo:sameAs, in both directions. From any one of those URIs,
  // one hop to the hub then one hop back out reaches every sibling -- "the
  // cluster". The second UNION branch covers landing on the hub URI
  // itself, which has no outgoing sameAs to hop through first. Cached per
  // uri (a record page fires this once; several downstream queries below
  // share the result) and degrades to just [uri] on any failure or when
  // identity-etl simply hasn't linked this entity -- every consumer below
  // already treats a single-element cluster identically to the
  // pre-identity-etl behavior.
  var identityClusterCache = {};
  function fetchIdentityCluster(uri) {
    if (identityClusterCache[uri]) return identityClusterCache[uri];
    var q = "PREFIX sdo: <https://schema.org/>\n" +
      "SELECT DISTINCT ?equiv WHERE {\n" +
      "  GRAPH " + iriRef(IDENTITY_GRAPH) + " {\n" +
      "    { " + iriRef(uri) + " sdo:sameAs ?hub . ?hub sdo:sameAs ?equiv . }\n" +
      "    UNION\n" +
      "    { BIND(" + iriRef(uri) + " AS ?hub) . ?hub sdo:sameAs ?equiv . }\n" +
      "  }\n" +
      "}";
    var p = sparql(q).then(function (rows) {
      var set = {};
      set[uri] = true;
      rows.forEach(function (r) { set[r.equiv.value] = true; });
      return Object.keys(set);
    }).catch(function () { return [uri]; });
    identityClusterCache[uri] = p;
    return p;
  }

  // Shared VALUES-clause fragment for matching any member of an identity
  // cluster -- callers interpolate the same variable into their own triple
  // patterns.
  function valuesClause(varName, uris) {
    return "VALUES " + varName + " { " + uris.map(iriRef).join(" ") + " }\n";
  }

  // "More by this creator" -- inverse sdo:creator, same mechanism the
  // hierarchy tree's sibling lookup uses, just pointed at a different
  // predicate. sdo:creator is a safe generalization across the MARC
  // relator sub-roles (author/editor/collector/...) BOOK_FIELDS also lists:
  // confirmed on real data that every relator:aut triple has a matching
  // sdo:creator triple on the same (work, person) pair, so reading
  // outByPred["sdo:creator"] alone (already fetched for the current record)
  // is enough to find the creator(s) to look up -- no new query needed for
  // that part. One creator can have thousands of works (corporate creators
  // especially), so this is LIMITed, not a full count like the hierarchy
  // tree's sibling fetch.
  // Shared by "creations" (creator), "more by this creator" (creator, minus
  // the current work), and "written about" (about) -- same one-hop-inverse
  // shape, just a different predicate and an optional self-exclusion.
  function fetchWorksByInversePredicate(pred, targetUris, excludeUri) {
    var q = "SELECT ?work (SAMPLE(?lbl) AS ?label) (SAMPLE(?dateVal) AS ?date) (SAMPLE(?type) AS ?typeUri) (GROUP_CONCAT(?formNameLit; separator=\"|\") AS ?formName) WHERE {\n" +
      valuesClause("?target", targetUris) +
      "  { ?work <http://schema.org/" + pred + "> ?target } UNION { ?work <https://schema.org/" + pred + "> ?target }\n" +
      (excludeUri ? "  FILTER(?work != " + iriRef(excludeUri) + ")\n" : "") +
      "  OPTIONAL { ?work <http://schema.org/name> ?n1 }\n" +
      "  OPTIONAL { ?work <https://schema.org/name> ?n2 }\n" +
      "  BIND(COALESCE(?n1, ?n2) AS ?lbl)\n" +
      "  OPTIONAL { ?work <http://schema.org/datePublished> ?d1 }\n" +
      "  OPTIONAL { ?work <https://schema.org/datePublished> ?d2 }\n" +
      "  BIND(COALESCE(?d1, ?d2) AS ?dateVal)\n" +
      "  OPTIONAL { ?work a ?type }\n" +
      formLookupFragment("?work") +
      "} GROUP BY ?work ORDER BY DESC(?date) LIMIT 12";
    return sparql(q).then(function (rows) {
      return rows.map(function (r) {
        return { uri: r.work.value, label: r.label ? r.label.value : shortLabel(r.work.value), date: r.date ? r.date.value : null, typeCurie: r.typeUri ? curie(r.typeUri.value) : null, formName: r.formName ? r.formName.value : null };
      });
    }).catch(function () { return []; });
  }

  function fetchMoreByCreator(creatorUri, excludeUri) {
    return fetchIdentityCluster(creatorUri).then(function (cluster) {
      return fetchWorksByInversePredicate("creator", cluster, excludeUri);
    });
  }

  function fetchSubjectOf(personUri) {
    return fetchIdentityCluster(personUri).then(function (cluster) {
      return fetchWorksByInversePredicate("about", cluster, null);
    });
  }

  // Shared by every "heading + list of clickable (label, optional date)
  // rows" widget -- creations, more-by-creator, written-about all share
  // this exact shape, just with a different heading and query behind them.
  function workListEl(heading, works) {
    var card = el("div", { class: "hierarchy-tree" });
    card.appendChild(el("div", { class: "hierarchy-context", text: heading }));
    works.forEach(function (w) {
      var row = el("div", { class: "hierarchy-row" });
      row.appendChild(iconSpan(w.typeCurie, w.formName));
      var btn = el("button", { class: "hierarchy-link", text: w.date ? w.label + " (" + w.date + ")" : w.label });
      btn.addEventListener("click", function () { navigate(w.uri, { label: w.label }); });
      row.appendChild(btn);
      card.appendChild(row);
    });
    return card;
  }

  // "Co-authored with" -- people who share an sdo:creator edge to the same
  // work(s) as this person. Same inverse-creator mechanism as "more by this
  // creator" above, just joined on the work instead of the person. Mostly
  // empty for biblio-etl's Persons (avg 1.0 creator per book -- most books
  // have exactly one), but genuinely populated for orcid-etl's Persons,
  // whose research output is multi-author by nature.
  function fetchCoCreators(personUri) {
    return fetchIdentityCluster(personUri).then(function (cluster) {
      var q = "SELECT ?other (SAMPLE(?lbl) AS ?label) (COUNT(DISTINCT ?work) AS ?shared) WHERE {\n" +
        valuesClause("?target", cluster) +
        "  { ?work <http://schema.org/creator> ?target } UNION { ?work <https://schema.org/creator> ?target }\n" +
        "  { ?work <http://schema.org/creator> ?other } UNION { ?work <https://schema.org/creator> ?other }\n" +
        "  FILTER(?other NOT IN (" + cluster.map(iriRef).join(", ") + "))\n" +
        "  OPTIONAL { ?other <http://schema.org/name> ?n1 }\n" +
        "  OPTIONAL { ?other <https://schema.org/name> ?n2 }\n" +
        "  BIND(COALESCE(?n1, ?n2) AS ?lbl)\n" +
        "} GROUP BY ?other ORDER BY DESC(?shared) LIMIT 12";
      return sparql(q).then(function (rows) {
        return rows.map(function (r) {
          return { uri: r.other.value, label: r.label ? r.label.value : shortLabel(r.other.value), shared: parseInt(r.shared.value, 10) };
        });
      });
    }).catch(function () { return []; });
  }

  function coCreatorsEl(coCreators) {
    var card = el("div", { class: "hierarchy-tree" });
    card.appendChild(el("div", { class: "hierarchy-context", text: "Co-authored with" }));
    coCreators.forEach(function (c) {
      var row = el("div", { class: "hierarchy-row" });
      var btn = el("button", { class: "hierarchy-link", text: c.label });
      btn.addEventListener("click", function () { navigate(c.uri, { label: c.label }); });
      row.appendChild(btn);
      row.appendChild(el("span", { class: "pred-count", style: "margin-left: auto;", text: c.shared + (c.shared === 1 ? " shared work" : " shared works") }));
      card.appendChild(row);
    });
    return card;
  }

  // ---------- Explore view: a radial "metro map" for Person records ----------
  // Two relationship types, chosen after checking data density on several
  // candidates: "written about together" (two people covered by the same
  // work -- a real two-hop path, person -about- work -about- person) and
  // "creations" (a person's own one-hop sdo:creator output). Co-authorship
  // was too sparse outside orcid-etl, Person<->Place has no connecting
  // predicate in this graph at all, and a shared-topic hub query ran the
  // server out of memory -- all rejected on evidence, not guessed away.
  // Laid out radially (hub at center, spokes evenly spaced by angle) rather
  // than as a general metro-line router: the data is honestly a star
  // around whichever person you start from, not a connected loop, and a
  // radial placement is the one layout tractable to hand-write without a
  // real graph-drawing library.

  function fetchCoSubjects(personUri) {
    return fetchIdentityCluster(personUri).then(function (cluster) {
      var q = "SELECT ?other (SAMPLE(?lbl) AS ?label) (COUNT(DISTINCT ?work) AS ?shared) (SAMPLE(?work) AS ?viaWork) WHERE {\n" +
        valuesClause("?target", cluster) +
        "  { ?work <http://schema.org/about> ?target } UNION { ?work <https://schema.org/about> ?target }\n" +
        "  { ?work <http://schema.org/about> ?other } UNION { ?work <https://schema.org/about> ?other }\n" +
        "  FILTER(?other NOT IN (" + cluster.map(iriRef).join(", ") + "))\n" +
        "  OPTIONAL { ?other <http://schema.org/name> ?n1 }\n" +
        "  OPTIONAL { ?other <https://schema.org/name> ?n2 }\n" +
        "  BIND(COALESCE(?n1, ?n2) AS ?lbl)\n" +
        "} GROUP BY ?other ORDER BY DESC(?shared) LIMIT 8";
      return sparql(q).then(function (rows) {
        var items = rows.map(function (r) {
          return { uri: r.other.value, label: r.label ? r.label.value : shortLabel(r.other.value), shared: parseInt(r.shared.value, 10), viaUri: r.viaWork.value, viaLabel: null };
        });
        if (!items.length) return items;
        // SAMPLE(?work) above picks one representative connecting work per
        // co-subject, but a second SAMPLE(?label) in the same query isn't
        // guaranteed to come from that same row -- so its label is fetched
        // here, in a separate batched lookup, rather than risking a
        // mismatched via-stop title.
        var values = items.map(function (it) { return iriRef(it.viaUri); }).join(" ");
        var q2 = "SELECT ?w (SAMPLE(?lbl) AS ?label) WHERE {\n" +
          "  VALUES ?w { " + values + " }\n" +
          "  OPTIONAL { ?w <http://schema.org/name> ?n1 }\n" +
          "  OPTIONAL { ?w <https://schema.org/name> ?n2 }\n" +
          "  BIND(COALESCE(?n1, ?n2) AS ?lbl)\n" +
          "} GROUP BY ?w";
        return sparql(q2).then(function (rows2) {
          var labelByUri = {};
          rows2.forEach(function (r) { labelByUri[r.w.value] = r.label ? r.label.value : null; });
          items.forEach(function (it) { it.viaLabel = labelByUri[it.viaUri] || shortLabel(it.viaUri); });
          return items;
        });
      });
    }).catch(function () { return []; });
  }

  function truncateForStation(label, max) {
    if (!label) return "";
    return label.length > max ? label.slice(0, max - 1) + "…" : label;
  }

  // Hover-ghost's "work" branch: the one forward hop a creation station
  // doesn't already carry (who/what it's about) -- deliberately not the
  // work's own creator, since that's almost always the hub itself for a
  // single-author book and would just redraw the center.
  function fetchWorkAbout(workUri) {
    var q = "SELECT ?about (SAMPLE(?lbl) AS ?label) WHERE {\n" +
      "  { " + iriRef(workUri) + " <http://schema.org/about> ?about } UNION { " + iriRef(workUri) + " <https://schema.org/about> ?about }\n" +
      "  OPTIONAL { ?about <http://schema.org/name> ?n1 }\n" +
      "  OPTIONAL { ?about <https://schema.org/name> ?n2 }\n" +
      "  BIND(COALESCE(?n1, ?n2) AS ?lbl)\n" +
      "} GROUP BY ?about LIMIT 3";
    return sparql(q).then(function (rows) {
      return rows.map(function (r) { return { uri: r.about.value, label: r.label ? r.label.value : shortLabel(r.about.value) }; });
    }).catch(function () { return []; });
  }

  // Generic graph for any non-Person record, so clicking a creation/work
  // station never lands on a page with nothing further to explore --
  // every record gets a (possibly sparse) neighborhood instead of only
  // Persons. Outgoing comes free from factRows (already fetched for the
  // record itself, same one-hop data the statement list renders from);
  // incoming needs one more query, since factRows only covers this
  // entity's own outgoing triples, not who points at it. Subtitle is the
  // predicate's curie -- same shortLabel() the "Described as"/"Referenced
  // by" statement columns already use for arbitrary predicates, so the
  // vocabulary matches the rest of the page instead of inventing new
  // wording per predicate.
  function genericOutgoingNeighbors(uri, factRows) {
    var seen = {}, out = [];
    for (var i = 0; i < factRows.length && out.length < 5; i++) {
      var r = factRows[i];
      if (r.o.type !== "uri" || r.o.value === uri) continue;
      if (curie(r.p.value) === "rdf:type") continue;
      if (seen[r.o.value]) continue;
      seen[r.o.value] = true;
      out.push({ uri: r.o.value, label: r.label ? r.label.value : shortLabel(r.o.value), subtitle: shortLabel(r.p.value) });
    }
    return out;
  }

  function fetchGenericIncomingNeighbors(uri) {
    return fetchIdentityCluster(uri).then(function (cluster) {
      var q = "PREFIX schema: <http://schema.org/>\n" +
        "PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>\n" +
        "SELECT ?s ?p (SAMPLE(?lbl) AS ?label) WHERE {\n" +
        valuesClause("?target", cluster) +
        "  GRAPH ?g { ?s ?p ?target }\n" +
        "  FILTER(?s NOT IN (" + cluster.map(iriRef).join(", ") + "))\n" +
        "  OPTIONAL { ?s schema:name ?n1 }\n" +
        "  OPTIONAL { ?s rdfs:label ?n2 }\n" +
        "  BIND(COALESCE(?n1, ?n2) AS ?lbl)\n" +
        "} GROUP BY ?s ?p LIMIT 5";
      return sparql(q).then(function (rows) {
        return rows.map(function (r) { return { uri: r.s.value, label: r.label ? r.label.value : shortLabel(r.s.value), subtitle: shortLabel(r.p.value) }; });
      });
    }).catch(function () { return []; });
  }

  function exploreSvgEl(centerLabel, incoming, outgoing, incomingLegend, outgoingLegend) {
    var svgNS = "http://www.w3.org/2000/svg";
    var cx = 370, cy = 170;
    var svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("viewBox", "0 0 740 340");
    svg.setAttribute("class", "explore-svg");
    svg.setAttribute("role", "img");

    function addLine(x1, y1, x2, y2, color, width) {
      var ln = document.createElementNS(svgNS, "line");
      ln.setAttribute("x1", x1); ln.setAttribute("y1", y1);
      ln.setAttribute("x2", x2); ln.setAttribute("y2", y2);
      ln.setAttribute("stroke", color);
      ln.setAttribute("stroke-width", width);
      ln.setAttribute("stroke-linecap", "round");
      svg.appendChild(ln);
    }

    // Hover-ghost: previews one extra hop off a station without touching
    // the rest of the layout -- a single dashed node sprouting further out
    // along the same spoke, fetched lazily (and cached per uri, so
    // re-hovering the same station is free) and torn down on mouseleave.
    // ghostToken invalidates any fetch still in flight once the pointer has
    // moved elsewhere, so a slow response can't pop in over a station the
    // user already left.
    var ghostToken = 0;
    var ghostGroup = null;
    var ghostHoverTimer = null;
    var ghostCache = {};

    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

    function clearGhost() {
      ghostToken++;
      if (ghostHoverTimer) { clearTimeout(ghostHoverTimer); ghostHoverTimer = null; }
      if (ghostGroup && ghostGroup.parentNode) ghostGroup.parentNode.removeChild(ghostGroup);
      ghostGroup = null;
    }

    function fetchGhostNeighbor(kind, uri) {
      var key = kind + ":" + uri;
      if (!ghostCache[key]) {
        ghostCache[key] = (kind === "person" ? fetchCoSubjects(uri) : fetchWorkAbout(uri)).then(function (items) {
          return items && items.length ? items[0] : null;
        });
      }
      return ghostCache[key];
    }

    function buildGhostGroup(x1, y1, x2, y2, color, neighbor) {
