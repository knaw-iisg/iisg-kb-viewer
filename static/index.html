<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IISG Knowledge Base Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef2f5;
    --surface: #ffffff;
    --surface-alt: #e2e9ee;
    --ink: #172329;
    --ink-soft: #47565e;
    --muted: #758790;
    --accent: #406e8c;
    --accent-strong: #294a60;
    --accent-soft: #dbe7ee;
    --line: #ccd7de;
    --good: #3c7a4c;
    --warn: #a9761f;
    --crit: #a1392f;
    --shadow: 0 1px 2px rgba(15, 26, 33, 0.07), 0 4px 16px rgba(15, 26, 33, 0.06);

    --font-display: "IBM Plex Serif", Georgia, "Times New Roman", serif;
    --font-body: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10161a;
      --surface: #182126;
      --surface-alt: #1f2a31;
      --ink: #e7edf1;
      --ink-soft: #b6c5cc;
      --muted: #7c8b93;
      --accent: #86b3ce;
      --accent-strong: #bcdaea;
      --accent-soft: #203342;
      --line: #2b3841;
      --good: #6cb87e;
      --warn: #d6a44e;
      --crit: #d97a6c;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.25), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }

  :root[data-theme="dark"] {
    --bg: #10161a;
    --surface: #182126;
    --surface-alt: #1f2a31;
    --ink: #e7edf1;
    --ink-soft: #b6c5cc;
    --muted: #7c8b93;
    --accent: #86b3ce;
    --accent-strong: #bcdaea;
    --accent-soft: #203342;
    --line: #2b3841;
    --good: #6cb87e;
    --warn: #d6a44e;
    --crit: #d97a6c;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.25), 0 8px 24px rgba(0, 0, 0, 0.3);
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; }

  ::selection { background: var(--accent-soft); }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 3px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  .app {
    display: grid;
    grid-template-columns: 300px 1fr;
    min-height: 100vh;
  }

  /* ---------- Rail ---------- */

  .rail {
    background: var(--surface-alt);
    border-right: 1px solid var(--line);
    padding: 22px 18px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }

  .brand-mark {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 19px;
    letter-spacing: -0.01em;
    cursor: pointer;
  }

  .brand-sub {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .search-box {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .search-box label {
    font-family: var(--font-mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--muted);
  }

  .search-input-wrap {
    position: relative;
  }

  #search-input {
    width: 100%;
    padding: 10px 34px 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 14px;
  }

  #search-input::placeholder { color: var(--muted); }

  .search-spinner {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    width: 13px;
    height: 13px;
    border-radius: 50%;
    border: 2px solid var(--line);
    border-top-color: var(--accent);
    animation: spin 0.7s linear infinite;
    opacity: 0;
  }
  .search-spinner.active { opacity: 1; }
  @keyframes spin { to { transform: translateY(-50%) rotate(360deg); } }

  .rail-section {
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 0;
  }

  .rail-heading {
    font-family: var(--font-mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
  }

  .rail-graphs {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .rail-graph-btn {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    width: 100%;
    text-align: left;
    padding: 6px 9px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: var(--ink-soft);
    font-size: 12.5px;
    cursor: pointer;
  }
  .rail-graph-btn:hover { background: var(--surface); }
  .rail-graph-btn .dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    margin-right: 7px;
    flex-shrink: 0;
  }
  .rail-graph-btn .n {
    font-family: var(--font-mono);
    color: var(--muted);
    font-size: 11px;
    flex-shrink: 0;
  }

  .trail-list {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow-y: auto;
  }

  .trail-item {
    display: block;
    width: 100%;
    text-align: left;
    padding: 7px 9px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: var(--ink-soft);
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .trail-item:hover { background: var(--surface); }
  .trail-item.current {
    background: var(--accent-soft);
    color: var(--accent-strong);
    font-weight: 500;
  }

  .rail-empty {
    color: var(--muted);
    font-size: 13px;
    font-style: italic;
  }

  .rail-endpoint {
    margin-top: auto;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--muted);
    line-height: 1.6;
  }
  .rail-endpoint a { color: var(--muted); text-decoration: underline; text-decoration-color: var(--line); }

  /* ---------- Main ---------- */

  .main {
    padding: 34px 40px 60px;
    max-width: 960px;
  }

  .empty-state, .home-dash {
    max-width: 720px;
  }

  .empty-state h1, .home-dash h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 30px;
    margin: 0 0 12px;
    text-wrap: balance;
  }

  .empty-state p, .home-dash > p {
    color: var(--ink-soft);
    margin: 0 0 8px;
  }

  .empty-examples {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 18px;
  }

  .chip-btn {
    font-family: var(--font-mono);
    font-size: 12.5px;
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--accent-strong);
    padding: 6px 11px;
    border-radius: 20px;
    cursor: pointer;
  }
  .chip-btn:hover { border-color: var(--accent); }

  .error-banner {
    background: var(--accent-soft);
    border: 1px solid var(--crit);
    color: var(--crit);
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 13.5px;
    margin-bottom: 18px;
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: center;
  }
  .error-banner button {
    font-family: var(--font-mono);
    font-size: 12px;
    background: none;
    border: 1px solid var(--crit);
    color: var(--crit);
    border-radius: 6px;
    padding: 4px 9px;
    cursor: pointer;
    flex-shrink: 0;
  }

  /* ---------- Home dashboard ---------- */

  .dash-section { margin: 26px 0 32px; }
  .dash-heading {
    font-family: var(--font-mono);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 0 0 12px;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .dash-heading span { color: var(--ink-soft); font-family: var(--font-body); text-transform: none; letter-spacing: 0; font-size: 11.5px; }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 10px;
  }

  .stat-tile {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    cursor: pointer;
    text-align: left;
    font-family: var(--font-body);
    color: var(--ink);
  }
  .stat-tile:hover { border-color: var(--accent); box-shadow: var(--shadow); }
  .stat-tile .n {
    font-family: var(--font-mono);
    font-size: 19px;
    font-weight: 600;
    display: block;
    font-variant-numeric: tabular-nums;
  }
  .stat-tile .lbl { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; display: flex; align-items: center; gap: 5px; }
  .stat-tile .sub {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
    margin-top: 5px;
    display: flex;
    align-items: center;
  }
  .stat-tile .sub .dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 5px; flex-shrink: 0;
  }
  .dash-loading { color: var(--muted); font-size: 13px; font-style: italic; }

  /* results list */

  .results-heading {
    font-family: var(--font-mono);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 0 0 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .result-card {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 13px 16px;
    margin-bottom: 8px;
    cursor: pointer;
    font-family: var(--font-body);
    color: var(--ink);
  }
  .result-card:hover { border-color: var(--accent); box-shadow: var(--shadow); }

  .result-label {
    font-weight: 500;
    font-size: 15px;
  }

  .result-meta {
    margin-top: 4px;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }

  .type-pill {
    font-family: var(--font-mono);
    font-size: 11px;
    background: var(--accent-soft);
    color: var(--accent-strong);
    padding: 3px 8px 3px 6px;
    border-radius: 20px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .type-icon { display: inline-flex; flex-shrink: 0; }

  .file-thumb {
    max-width: 220px;
    max-height: 140px;
    border-radius: 8px;
    border: 1px solid var(--line);
    display: block;
    margin-bottom: 14px;
    object-fit: contain;
    background: var(--surface-alt);
  }
  .result-thumb {
    width: 44px;
    height: 44px;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid var(--line);
    flex-shrink: 0;
  }
  .result-card-row { display: flex; gap: 12px; align-items: center; }
  .result-card-row .result-body { min-width: 0; flex: 1; }

  .uri-sub {
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--muted);
    overflow-wrap: anywhere;
  }

  .pager-row { display: flex; gap: 8px; margin-top: 14px; }
  .pager-btn {
    font-family: var(--font-mono);
    font-size: 11.5px;
    background: none;
    border: 1px dashed var(--line);
    color: var(--accent-strong);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
  }
  .pager-btn:hover { border-color: var(--accent); }
  .pager-btn:disabled { opacity: 0.4; cursor: default; }

  /* record view */

  .record-header {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 22px 24px;
    box-shadow: var(--shadow);
    margin-bottom: 22px;
  }

  .record-eyebrow {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 10px;
    align-items: center;
  }
  .view-kind-pill {
    font-family: var(--font-mono);
    font-size: 11px;
    background: var(--accent-strong);
    color: var(--surface);
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 9px 3px 7px;
    border-radius: 20px;
  }

  .record-title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 25px;
    margin: 0 0 6px;
    text-wrap: balance;
  }

  .record-uri {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
    overflow-wrap: anywhere;
    margin-bottom: 12px;
  }
  .record-uri a { text-decoration: none; border-bottom: 1px dotted var(--line); }
  .record-uri a:hover { border-bottom-color: var(--accent); }

  .record-desc {
    color: var(--ink-soft);
    font-size: 14px;
    margin: 10px 0 0;
    max-width: 68ch;
  }

  .source-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 14px;
  }

  .source-chip {
    font-family: var(--font-mono);
    font-size: 11px;
    background: var(--surface-alt);
    border: 1px solid var(--line);
    color: var(--ink-soft);
    padding: 3px 9px;
    border-radius: 20px;
    cursor: pointer;
  }
  .source-chip b { color: var(--ink); font-weight: 600; }

  .record-stats {
    display: flex;
    gap: 18px;
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
  }

  .stat {
    font-size: 13px;
    color: var(--ink-soft);
  }
  .stat b {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    font-weight: 600;
  }

  /* ---------- Type-specific hero facts ---------- */

  .hero-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 14px;
    margin-bottom: 8px;
  }

  .hero-group {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 11px 14px;
  }
  .hero-group h3 {
    font-family: var(--font-mono);
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 0 0 7px;
  }
  .hero-fact-val {
    font-size: 13.5px;
    margin-bottom: 3px;
    overflow-wrap: anywhere;
  }
  .hero-fact-val:last-child { margin-bottom: 0; }
  button.hero-link {
    background: none; border: none; padding: 0; cursor: pointer;
    font-family: var(--font-body); color: var(--accent-strong); font-size: 13.5px;
    text-align: left; font-weight: 500;
  }
  button.hero-link:hover { text-decoration: underline; }
  .hero-ext { color: var(--muted); text-decoration: none; margin-left: 4px; }
  .hero-ext:hover { color: var(--accent); }

  .hero-textblocks { margin: 18px 0 22px; display: flex; flex-direction: column; gap: 14px; }
  .hero-textblock h3 {
    font-family: var(--font-mono);
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 0 0 6px;
  }
  .hero-textblock p {
    font-size: 14px;
    color: var(--ink-soft);
    margin: 0;
    white-space: pre-wrap;
    max-width: 74ch;
  }

  .download-btn {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 13px;
    background: var(--accent);
    color: var(--surface);
    padding: 9px 16px;
    border-radius: 8px;
    text-decoration: none;
    margin-bottom: 18px;
  }
  .download-btn:hover { background: var(--accent-strong); }

  .details-toggle {
    margin-top: 6px;
  }
  .details-toggle > summary {
    cursor: pointer;
    font-family: var(--font-mono);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    padding: 10px 0;
    list-style: none;
  }
  .details-toggle > summary::-webkit-details-marker { display: none; }
  .details-toggle > summary::before { content: "\25B8  "; }
  .details-toggle[open] > summary::before { content: "\25BE  "; }

  .columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 28px;
  }

  @media (max-width: 860px) {
    .columns { grid-template-columns: 1fr; }
  }

  .column-heading {
    font-family: var(--font-mono);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 0 0 12px;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .column-heading span { color: var(--ink-soft); font-family: var(--font-body); text-transform: none; letter-spacing: 0; font-size: 11px; }

  .pred-group {
    margin-bottom: 16px;
  }

  .pred-label {
    font-family: var(--font-mono);
    font-size: 12.5px;
    color: var(--accent-strong);
    background: var(--accent-soft);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 9px 3px 9px;
    border-radius: 6px 6px 0 0;
    border: 1px solid var(--line);
    border-bottom: none;
  }
  .pred-count {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    font-size: 11px;
  }

  .pred-rows {
    border: 1px solid var(--line);
    border-radius: 0 8px 8px 8px;
    background: var(--surface);
    overflow: hidden;
  }

  .value-row {
    padding: 9px 12px;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: flex-start;
  }
  .value-row:last-child { border-bottom: none; }

  .value-main { min-width: 0; flex: 1; }

  button.value-link {
    display: block;
    background: none;
    border: none;
    padding: 0;
    text-align: left;
    cursor: pointer;
    font-family: var(--font-body);
    color: var(--ink);
    font-size: 13.5px;
    font-weight: 500;
  }
  button.value-link:hover { color: var(--accent-strong); text-decoration: underline; }

  .value-curie {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    overflow-wrap: anywhere;
  }

  .value-literal {
    font-size: 13.5px;
    color: var(--ink);
    overflow-wrap: anywhere;
  }
  .lit-tag {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
    margin-left: 6px;
  }

  .graph-tag {
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--muted);
    white-space: nowrap;
    flex-shrink: 0;
    padding-top: 2px;
  }

  .ext-link {
    color: var(--muted);
    text-decoration: none;
    flex-shrink: 0;
    padding-top: 1px;
  }
  .ext-link:hover { color: var(--accent); }

  .load-more-row {
    padding: 8px 12px;
  }
  .load-more-btn {
    font-family: var(--font-mono);
    font-size: 11.5px;
    background: none;
    border: 1px dashed var(--line);
    color: var(--accent-strong);
    padding: 5px 10px;
    border-radius: 6px;
    cursor: pointer;
    width: 100%;
  }
  .load-more-btn:hover { border-color: var(--accent); }
  .load-more-btn:disabled { opacity: 0.5; cursor: default; }

  .group-loading, .column-empty {
    padding: 10px 12px;
    color: var(--muted);
    font-size: 13px;
    font-style: italic;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface);
  }

  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    .rail {
      position: relative;
      height: auto;
      border-right: none;
      border-bottom: 1px solid var(--line);
    }
    .main { padding: 26px 20px 50px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <span class="brand-mark" id="brand-home" title="Home">IISG Knowledge Base Explorer</span>

  var railGraphsEl = document.getElementById("rail-graphs");
  var searchInput = document.getElementById("search-input");
  var searchSpinner = document.getElementById("search-spinner");

  document.getElementById("rail-endpoint-link").textContent = ENDPOINT;
  document.getElementById("rail-endpoint-link").href = ENDPOINT.replace(/^http/, "http") + "/";
  document.getElementById("brand-home").addEventListener("click", function () { navigateHome(); });

  function pushTrail(uri, label) {
    trail = trail.filter(function (t) { return t.uri !== uri; });
    trail.unshift({ uri: uri, label: label });
    if (trail.length > 25) trail.length = 25;
    renderTrail();
  }

  function renderTrail() {
    clear(trailListEl);
    if (!trail.length) {
      trailListEl.appendChild(el("li", { class: "rail-empty", text: "Nothing viewed yet." }));
      return;
    }
    trail.forEach(function (t) {
      var li = document.createElement("li");
      var btn = el("button", {
        class: "trail-item" + (t.uri === currentUri ? " current" : ""),
        text: t.label || shortLabel(t.uri),
        title: t.uri
      });
      btn.addEventListener("click", function () { navigate(t.uri); });
      li.appendChild(btn);
      trailListEl.appendChild(li);
    });
  }

  function navigate(uri, opts) {
    opts = opts || {};
    if (!/^https?:\/\//i.test(uri)) { renderError("Not a browsable URI: " + uri); return; }
    currentUri = uri;
    history.pushState({ uri: uri }, "", "#" + encodeURIComponent(uri));
    loadEntity(uri);
  }

  function navigateHome() {
    currentUri = null;
    searchInput.value = "";
    history.pushState({}, "", location.pathname);
    renderTrail();
    renderHome();
  }

  function syncFromHash() {
    var hashUri = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (hashUri === currentUri) return;
    if (hashUri && /^https?:\/\//i.test(hashUri)) { currentUri = hashUri; loadEntity(hashUri); }
    else { currentUri = null; renderTrail(); renderHome(); }
  }

  window.addEventListener("popstate", syncFromHash);
  window.addEventListener("hashchange", syncFromHash);

  // ---------- Rendering: rail graph list ----------

  function loadRailGraphs() {
    sparql("SELECT ?g (COUNT(*) AS ?c) WHERE { GRAPH ?g { ?s ?p ?o } } GROUP BY ?g ORDER BY DESC(?c)").then(function (rows) {
      clear(railGraphsEl);
      rows.forEach(function (r) {
        var info = graphInfo(r.g.value);
        var li = document.createElement("li");
        var btn = el("button", { class: "rail-graph-btn", title: info.sub });
        var left = document.createElement("span");
        var dot = document.createElement("span");
        dot.className = "dot";
        dot.style.background = info.color;
        left.appendChild(dot);
        left.appendChild(document.createTextNode(info.label));
        btn.appendChild(left);
        btn.appendChild(el("span", { class: "n", text: fmtNum(r.c.value) }));
        btn.addEventListener("click", function () { browseGraph(info); });
        li.appendChild(btn);
        railGraphsEl.appendChild(li);
      });
    }).catch(function () {
      clear(railGraphsEl);
      railGraphsEl.appendChild(el("li", { class: "rail-empty", text: "Store unreachable." }));
    });
  }

  // ---------- Rendering: home dashboard ----------

  function renderHome() {
    clear(mainEl);
    var wrap = el("div", { class: "home-dash" });
    wrap.appendChild(el("h1", { text: "Trace a record through the graph." }));
    wrap.appendChild(el("p", { text: "Five pipelines feed this graph \u2014 biblio-etl, archive-etl, findingaid-etl, authorities-etl and dataverse-etl \u2014 each asserting into its own named graph, but sharing IRIs wherever their records describe the same person, place, archive or topic. Search for something, or browse by type below." }));

    var ex = el("div", { class: "empty-examples" });
    ["dockworkers", "Rotterdam", "International Institute of Social History", "Jan Lucassen"].forEach(function (term) {
      var b = el("button", { class: "chip-btn", text: term });
      b.addEventListener("click", function () { searchInput.value = term; runSearch(term); });
      ex.appendChild(b);
    });
    wrap.appendChild(ex);

    var typeSection = el("div", { class: "dash-section" });
    typeSection.appendChild(el("div", { class: "dash-heading", text: "Browse by kind of item" }));
    var typeGrid = el("div", { class: "stat-grid" });
    typeSection.appendChild(el("div", { class: "dash-loading", text: "Loading type counts\u2026" }));
    typeSection.appendChild(typeGrid);
    wrap.appendChild(typeSection);

    mainEl.appendChild(wrap);

    sparql(
      "SELECT ?g ?type (COUNT(*) AS ?c) WHERE {\n" +
      "  GRAPH ?g { ?s a ?type }\n" +
      "} GROUP BY ?g ?type"
    ).then(function (rows) {
      typeSection.removeChild(typeSection.querySelector(".dash-loading"));
      var byType = {};
      rows.forEach(function (r) {
        var key = curie(r.type.value) || shortLabel(r.type.value);
        if (!byType[key]) byType[key] = { key: key, uri: r.type.value, total: 0, graphs: {} };
        byType[key].total += parseInt(r.c.value, 10);
        byType[key].graphs[r.g.value] = (byType[key].graphs[r.g.value] || 0) + parseInt(r.c.value, 10);
      });
      var list = Object.keys(byType).map(function (k) { return byType[k]; });
      list.sort(function (a, b) { return b.total - a.total; });
      list.slice(0, 16).forEach(function (t) {
        var mainGraph = Object.keys(t.graphs).sort(function (a, b) { return t.graphs[b] - t.graphs[a]; })[0];
        var info = graphInfo(mainGraph);
        var tile = el("button", { class: "stat-tile" });
        tile.appendChild(el("span", { class: "n", text: fmtNum(t.total) }));
        var lbl = el("span", { class: "lbl" });
        lbl.appendChild(iconSpan(t.key));
        lbl.appendChild(document.createTextNode(pluralType(t.key)));
        tile.appendChild(lbl);
        var sub = el("span", { class: "sub" });
        var dot = document.createElement("span"); dot.className = "dot"; dot.style.background = info.color;
        sub.appendChild(dot);
        sub.appendChild(document.createTextNode(Object.keys(t.graphs).length > 1 ? Object.keys(t.graphs).length + " graphs" : info.label));
        tile.appendChild(sub);
        tile.addEventListener("click", function () { browseType(t.uri, t.key); });
        typeGrid.appendChild(tile);
      });
    }).catch(function (err) {
      typeSection.removeChild(typeSection.querySelector(".dash-loading"));
      typeSection.appendChild(el("div", { class: "column-empty", text: "Couldn\u2019t load type counts: " + err.message }));
    });
  }

  function pluralType(curieStr) {
    var name = curieStr.split(":").pop().replace(/([a-z])([A-Z])/g, "$1 $2");
    var lower = name.toLowerCase();
    if (/s$/.test(lower)) return name;
    return name + "s";
  }

  function renderEmptyState() { renderHome(); }

  function renderError(message, retry) {
    var banner = el("div", { class: "error-banner" });
    banner.appendChild(el("span", { text: message }));
    if (retry) {
      var btn = el("button", { text: "Retry" });
      btn.addEventListener("click", retry);
      banner.appendChild(btn);
    }
    mainEl.insertBefore(banner, mainEl.firstChild);
  }

  // ---------- Browse by graph / by type ----------

  function browseGraph(info) {
    currentUri = null;
    renderTrail();
    clear(mainEl);
    mainEl.appendChild(el("div", { class: "results-heading", text: "Loading \u201c" + info.label + "\u201d\u2026" }));
    var q = "PREFIX sdo: <http://schema.org/>\n" +
      "SELECT ?s (SAMPLE(?lbl) AS ?label) (SAMPLE(?t) AS ?type) WHERE {\n" +
      "  GRAPH " + iriRef(info.iri) + " { ?s a ?t }\n" +
      "  OPTIONAL { GRAPH " + iriRef(info.iri) + " { ?s sdo:name ?n1 } }\n" +
      "  OPTIONAL { GRAPH " + iriRef(info.iri) + " { ?s <https://schema.org/name> ?n2 } }\n" +
      "  OPTIONAL { GRAPH " + iriRef(info.iri) + " { ?s <http://www.w3.org/2000/01/rdf-schema#label> ?n3 } }\n" +
      "  BIND(COALESCE(?n1, ?n2, ?n3) AS ?lbl)\n" +
      "} GROUP BY ?s ORDER BY ?s";
    sparql(q).then(function (rows) {
      var items = rows.map(function (r) {
        var tc = r.type ? (curie(r.type.value) || shortLabel(r.type.value)) : null;
        return { uri: r.s.value, label: r.label ? r.label.value : shortLabel(r.s.value), typeCurie: tc, extraPills: [] };
      });
      renderResultList("Browsing " + info.label, items);
    }).catch(function (err) {
      clear(mainEl);
      renderError("Couldn\u2019t load list: " + err.message, function () { browseGraph(info); });
    });
  }

  function browseType(typeUri, typeKey) {
    currentUri = null;
    renderTrail();
    clear(mainEl);
    var label = pluralType(typeKey);
    mainEl.appendChild(el("div", { class: "results-heading", text: "Loading " + label.toLowerCase() + "\u2026" }));
    var q = "SELECT ?s (SAMPLE(?lbl) AS ?label) (SAMPLE(?g) AS ?graph) WHERE {\n" +
      "  GRAPH ?g { ?s a " + iriRef(typeUri) + " }\n" +
      "  OPTIONAL { ?s <http://schema.org/name> ?n1 }\n" +
      "  OPTIONAL { ?s <https://schema.org/name> ?n2 }\n" +
      "  OPTIONAL { ?s <http://www.w3.org/2000/01/rdf-schema#label> ?n3 }\n" +
      "  BIND(COALESCE(?n1, ?n2, ?n3) AS ?lbl)\n" +
      "} GROUP BY ?s ORDER BY ?s";
    sparql(q).then(function (rows) {
      var items = rows.map(function (r) {
        var g = r.graph ? graphInfo(r.graph.value).label : null;
        return { uri: r.s.value, label: r.label ? r.label.value : shortLabel(r.s.value), typeCurie: typeKey, extraPills: g ? [g] : [] };
      });
      renderResultList(label, items);
    }).catch(function (err) {
      clear(mainEl);
      renderError("Couldn\u2019t load list: " + err.message, function () { browseType(typeUri, typeKey); });
    });
  }

  // ---------- Shared result rendering: cluster by type when the list is mixed ----------

  function renderResultList(heading, items) {
    clear(mainEl);
    if (!items.length) {
      mainEl.appendChild(el("div", { class: "results-heading", text: heading + " \u2014 no results" }));
      return;
    }

    var groups = {}, order = [];
    items.forEach(function (it) {
      var key = it.typeCurie || "other";
      if (!groups[key]) { groups[key] = []; order.push(key); }
      groups[key].push(it);
    });

    if (order.length <= 1) {
      mainEl.appendChild(el("div", { class: "results-heading", text: heading + " \u2014 " + fmtNum(items.length) + " total" }));
      var wrap = el("div", { class: "cards-wrap" });
      mainEl.appendChild(wrap);
      renderCardGroup(wrap, items, 0);
      return;
    }

    order.sort(function (a, b) { return groups[b].length - groups[a].length; });
    if (order.indexOf("other") !== -1) { order = order.filter(function (k) { return k !== "other"; }); order.push("other"); }
    renderResultTiles(heading, items, groups, order);
  }

  // Mixed-type result set: show one compact tile per type (like the home
  // dashboard), and only expand to an actual card list once a tile is
  // picked -- a long list of everything, split into headed clusters, still
  // reads as one long list when most matches are one type buried under a
  // dozen others.
  function renderResultTiles(heading, items, groups, order) {
    clear(mainEl);
    mainEl.appendChild(el("div", { class: "results-heading", text: heading + " \u2014 " + fmtNum(items.length) + " total, " + order.length + " kinds" }));
    var grid = el("div", { class: "stat-grid" });
    order.forEach(function (key) {
      var tile = el("button", { class: "stat-tile" });
      tile.appendChild(el("span", { class: "n", text: fmtNum(groups[key].length) }));
      var lbl = el("span", { class: "lbl" });
      lbl.appendChild(iconSpan(key === "other" ? null : key));
      lbl.appendChild(document.createTextNode(key === "other" ? "Other" : pluralType(key)));
      tile.appendChild(lbl);
      tile.addEventListener("click", function () { renderResultTypeDetail(heading, items, groups, order, key); });
      grid.appendChild(tile);
    });
    mainEl.appendChild(grid);
  }

  function renderResultTypeDetail(heading, items, groups, order, key) {
    clear(mainEl);
    var top = el("div", { class: "results-heading" });
    var left = el("span", { style: "display:flex; align-items:center; gap:10px;" });
    var back = el("button", { class: "pager-btn", text: "\u2190 All kinds" });
    back.addEventListener("click", function () { renderResultTiles(heading, items, groups, order); });
    left.appendChild(back);
    var titleWrap = el("span", { style: "display:flex; align-items:center; gap:6px;" });
    titleWrap.appendChild(iconSpan(key === "other" ? null : key));
    titleWrap.appendChild(document.createTextNode((key === "other" ? "Other" : pluralType(key)) + " \u2014 " + fmtNum(groups[key].length)));
    left.appendChild(titleWrap);
    top.appendChild(left);
    mainEl.appendChild(top);
    var wrap = el("div", { class: "cards-wrap" });
    mainEl.appendChild(wrap);
    renderCardGroup(wrap, groups[key], 0);
  }

  function renderCardGroup(container, items, shown) {
    while (container.children.length > 0) {
      container.removeChild(container.lastChild);
    }
    var page = items.slice(0, shown + PAGE_SIZE);
    page.forEach(function (it) {
      var card = el("button", { class: "result-card" });
      card.appendChild(el("div", { class: "result-label", text: it.label }));
      var meta = el("div", { class: "result-meta" });
      (it.extraPills || []).slice(0, 3).forEach(function (t) { meta.appendChild(el("span", { class: "type-pill", text: t })); });
      meta.appendChild(el("span", { class: "uri-sub", text: shortLabel(it.uri) }));
      card.appendChild(meta);
      card.addEventListener("click", function () { navigate(it.uri, { label: it.label }); });
      container.appendChild(card);
    });
    if (page.length < items.length) {
      var pager = el("div", { class: "pager-row" });
      var btn = el("button", { class: "pager-btn", text: "Show " + Math.min(PAGE_SIZE, items.length - page.length) + " more" });
      btn.addEventListener("click", function () { renderCardGroup(container, items, shown + PAGE_SIZE); });
      pager.appendChild(btn);
      container.appendChild(pager);
    }
  }

  // ---------- Search ----------

  var searchDebounce = null;

  searchInput.addEventListener("input", function () {
    var term = searchInput.value.trim();
    clearTimeout(searchDebounce);
    if (term.length < 2) { if (!term) renderHome(); return; }
    searchDebounce = setTimeout(function () { runSearch(term); }, 380);
  });

  searchInput.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { searchInput.value = ""; renderHome(); }
    if (e.key === "Enter") { clearTimeout(searchDebounce); runSearch(searchInput.value.trim()); }
  });

  function runSearch(term) {
    if (term.length < 2) return;
    currentUri = null;
    renderTrail();
    searchSpinner.classList.add("active");
    clear(mainEl);
    mainEl.appendChild(el("div", { class: "results-heading", text: "Searching for \u201c" + term + "\u201d\u2026" }));

    var esc = escLiteral(term.toLowerCase());
    var q = "PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>\n" +
      "SELECT DISTINCT ?s ?label ?type WHERE {\n" +
      "  { ?s <http://schema.org/name> ?label }\n" +
      "  UNION { ?s <https://schema.org/name> ?label }\n" +
      "  UNION { ?s rdfs:label ?label }\n" +
      "  FILTER(CONTAINS(LCASE(STR(?label)), \"" + esc + "\"))\n" +
      "  OPTIONAL { ?s a ?type }\n" +
      "} LIMIT 300";

    sparql(q).then(function (rows) {
      searchSpinner.classList.remove("active");
      renderSearchResults(term, rows);
    }).catch(function (err) {
      searchSpinner.classList.remove("active");
      clear(mainEl);
      renderError("Search failed: " + err.message, function () { runSearch(term); });
    });
  }

  function primaryTypeCurie(typeCuries) {
    for (var i = 0; i < VIEW_DISPATCH.length; i++) {
      if (typeCuries.indexOf(VIEW_DISPATCH[i].type) !== -1) return VIEW_DISPATCH[i].type;
    }
    return typeCuries[0] || null;
  }

  function renderSearchResults(term, rows) {
    clear(mainEl);
    var byUri = {};
    rows.forEach(function (r) {
      var uri = r.s.value;
      if (!byUri[uri]) byUri[uri] = { uri: uri, label: r.label ? r.label.value : uri, types: [] };
      if (r.type) {
        var t = curie(r.type.value) || shortLabel(r.type.value);
        if (byUri[uri].types.indexOf(t) === -1) byUri[uri].types.push(t);
      }
    });
    var list = Object.keys(byUri).map(function (k) { return byUri[k]; });
    var lower = term.toLowerCase();
    list.sort(function (a, b) {
      var ea = a.label.toLowerCase() === lower ? 0 : a.label.toLowerCase().indexOf(lower) === 0 ? 1 : 2;
      var eb = b.label.toLowerCase() === lower ? 0 : b.label.toLowerCase().indexOf(lower) === 0 ? 1 : 2;
      if (ea !== eb) return ea - eb;
      return a.label.length - b.label.length;
    });
    list = list.slice(0, 150);

    if (!list.length) {
      mainEl.appendChild(el("div", { class: "results-heading", text: "No matches for \u201c" + term + "\u201d" }));
      mainEl.appendChild(el("p", { class: "column-empty", text: "Try a shorter or differently spelled term \u2014 search matches schema:name and rdfs:label exactly as recorded." }));
      return;
    }

    var items = list.map(function (item) {
      var primary = primaryTypeCurie(item.types);
      var extra = item.types.filter(function (t) { return t !== primary; });
      return { uri: item.uri, label: item.label, typeCurie: primary, extraPills: extra };
    });
    renderResultList("Matches for \u201c" + term + "\u201d", items);
  }

  // ---------- Entity record ----------

  function loadEntity(uri) {
    clear(mainEl);
    mainEl.appendChild(el("div", { class: "results-heading", text: "Loading record\u2026" }));

    // Everything the entity itself asserts, fetched in one shot (bounded --
    // this is the record's own fields, not its potentially huge fan-in).
    var factsQuery = "PREFIX schema: <http://schema.org/>\n" +
      "PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>\n" +
      "SELECT ?p ?o (SAMPLE(?lbl) AS ?label) WHERE {\n" +
      "  " + iriRef(uri) + " ?p ?o .\n" +
      "  OPTIONAL { ?o <http://schema.org/name> ?n1 }\n" +
      "  OPTIONAL { ?o <https://schema.org/name> ?n2 }\n" +
      "  OPTIONAL { ?o rdfs:label ?n3 }\n" +
      "  BIND(COALESCE(?n1, ?n2, ?n3) AS ?lbl)\n" +
      "} GROUP BY ?p ?o LIMIT 3000";

    var sourcesQuery = "SELECT ?g (COUNT(*) AS ?c) WHERE {\n" +
      "  { GRAPH ?g { " + iriRef(uri) + " ?p1 ?o1 } } UNION { GRAPH ?g { ?s1 ?p2 " + iriRef(uri) + " } }\n" +
      "} GROUP BY ?g ORDER BY DESC(?c)";

    var inCountsQuery = "SELECT ?p (COUNT(*) AS ?c) WHERE {\n" +
      "  GRAPH ?g { ?s ?p " + iriRef(uri) + " }\n" +
      "} GROUP BY ?p ORDER BY DESC(?c)";

    Promise.all([
      sparql(factsQuery),
      sparql(sourcesQuery),
      sparql(inCountsQuery)
    ]).then(function (results) {
      renderRecord(uri, results[0], results[1], results[2]);
    }).catch(function (err) {
      clear(mainEl);
      renderError("Couldn\u2019t load this record: " + err.message, function () { loadEntity(uri); });
    });
  }

  function buildOutIndex(factRows) {
    var byPred = {}; // curie or raw pred -> array of row {value}
    var byPredRaw = {};
    factRows.forEach(function (r) {
      var key = curie(r.p.value) || r.p.value;
      if (!byPred[key]) byPred[key] = [];
      byPred[key].push(r);
      if (!byPredRaw[r.p.value]) byPredRaw[r.p.value] = [];
      byPredRaw[r.p.value].push(r);
    });
    return byPred;
  }

  function pickView(typeCuries) {
    for (var i = 0; i < VIEW_DISPATCH.length; i++) {
      if (typeCuries.indexOf(VIEW_DISPATCH[i].type) !== -1) return VIEW_DISPATCH[i];
    }
    return null;
  }

  function renderRecord(uri, factRows, sourceRows, inCounts) {
    clear(mainEl);

    var outByPred = buildOutIndex(factRows);
    var label = null, types = [], typeCuries = [], description = null;
    factRows.forEach(function (r) {
      var pc = curie(r.p.value);
      if ((pc === "sdo:name" || r.p.value === "http://www.w3.org/2000/01/rdf-schema#label") && !label && r.o.type === "literal") label = r.o.value;
      if (pc === "rdf:type") { types.push(r.o.value); var tc = curie(r.o.value); typeCuries.push(tc || r.o.value); }
    });
    if (!label) label = uri;

    var view = pickView(typeCuries);

    pushTrail(uri, label);

    var header = el("div", { class: "record-header" });
    var eyebrow = el("div", { class: "record-eyebrow" });
    if (view) {
      var kindPill = el("span", { class: "view-kind-pill" });
      kindPill.appendChild(iconSpan(view.type));
      kindPill.appendChild(document.createTextNode(view.kind));
      eyebrow.appendChild(kindPill);
    }
    types.slice(0, 4).forEach(function (t) {
      var tc = curie(t) || shortLabel(t);
      if (view && tc === view.type) return;
      eyebrow.appendChild(typePillEl(tc));
    });
    header.appendChild(eyebrow);
    header.appendChild(el("h1", { class: "record-title", text: label }));

    var uriLine = el("div", { class: "record-uri" });
    if (isSafeHref(uri)) {
      uriLine.appendChild(el("a", { href: uri, target: "_blank", rel: "noopener", text: uri }));
    } else {
      uriLine.textContent = uri;
    }
    header.appendChild(uriLine);

    if (sourceRows.length) {
      var srcRow = el("div", { class: "source-row" });
      sourceRows.forEach(function (r) {
        var info = graphInfo(r.g.value);
        var chip = el("span", { class: "source-chip", title: info.sub });
        var b = document.createElement("b");
        b.textContent = info.label;
        chip.appendChild(b);
        chip.appendChild(document.createTextNode(" \u00b7 " + r.c.value));
        chip.addEventListener("click", function () { browseGraph(info); });
        srcRow.appendChild(chip);
      });
      header.appendChild(srcRow);
    }

    var totalOut = factRows.length;
    var totalIn = inCounts.reduce(function (a, r) { return a + parseInt(r.c.value, 10); }, 0);
    var stats = el("div", { class: "record-stats" });
    stats.appendChild(statLine(totalOut + " statements describing it"));
    stats.appendChild(statLine(totalIn + " statements pointing to it"));
    header.appendChild(stats);

    mainEl.appendChild(header);

    // ---- Real thumbnail, when the file itself is an image (e.g. Dataverse
    // DataDownload with an image/* encodingFormat) -- no sdo:image anywhere
    // in the graph yet, but some files genuinely are pictures. Only ever
    // fetched from iisg.amsterdam itself: hotlinking a third-party host
    // (dataverse.nl, worldcat.org, ...) from every record view isn't ours to
    // do, and dataverse.nl in particular currently sits behind a bot-challenge
    // wall that would just return an HTML page instead of the image anyway.
    if (view && view.type === "sdo:DataDownload") {
      var fmtRows = outByPred["sdo:encodingFormat"];
      var urlRows = outByPred["sdo:contentUrl"];
      var fmt = fmtRows && fmtRows[0] && fmtRows[0].o.value;
      if (fmt && /^image\//i.test(fmt) && urlRows && urlRows[0] && urlRows[0].o.type === "uri" && isLocalUri(urlRows[0].o.value)) {
        var thumb = el("img", { class: "file-thumb", src: urlRows[0].o.value, alt: label, loading: "lazy" });
        thumb.onerror = function () { thumb.remove(); };
        mainEl.appendChild(thumb);
      }
    }

    // ---- Primary download link, for file-like views (DataDownload) ----
    if (view && view.linkOutPrimary) {
      for (var li = 0; li < LINKOUT_FIELDS.length; li++) {
        var rows = outByPred[LINKOUT_FIELDS[li]];
        var linkoutUrl = rows && rows.length && (rows[0].o.type === "uri" ? rows[0].o.value : literalUrl(rows[0].o));
        if (linkoutUrl) {
          mainEl.appendChild(el("a", { class: "download-btn", href: linkoutUrl, target: "_blank", rel: "noopener", text: "\u2193 Open / download file" }));
          break;
        }
      }
    }

    // ---- Type-specific hero facts ----
    if (view) {
      var grid = el("div", { class: "hero-grid" });
      var any = false;
      view.fields.forEach(function (f) {
        var rows = outByPred[f.pred];
        if (!rows || !rows.length) return;
        any = true;
        grid.appendChild(renderHeroGroup(f, rows));
      });
      if (any) mainEl.appendChild(grid);

      if (!view.linkOutPrimary) {
        for (var lo = 0; lo < LINKOUT_FIELDS.length; lo++) {
          var lrows = outByPred[LINKOUT_FIELDS[lo]];
          var origUrl = lrows && lrows.length && (lrows[0].o.type === "uri" ? lrows[0].o.value : literalUrl(lrows[0].o));
          if (origUrl) {
            var wrap = el("div", { style: "margin: 4px 0 4px;" });
            wrap.appendChild(el("a", { class: "download-btn", href: origUrl, target: "_blank", rel: "noopener", text: "\u2197 View original / digitized copy" }));
            mainEl.appendChild(wrap);
            break;
          }
        }
      }

      // Special-cased list facts that don't fit the "one row per fact" shape.
      if (view.type === "sdo:Dataset" && outByPred["sdo:distribution"]) {
        mainEl.appendChild(renderFileListBlock("Files", outByPred["sdo:distribution"]));
      }
      if (view.type === "sdo:DataCatalog" && outByPred["sdo:dataset"]) {
        mainEl.appendChild(renderLinkListBlock("Datasets in this catalog", outByPred["sdo:dataset"]));
      }
    }

    // ---- Description / abstract / biography text blocks ----
    var textWrap = el("div", { class: "hero-textblocks" });
    var anyText = false;
    DESC_FIELDS.forEach(function (f) {
      var rows = outByPred[f.pred];
      if (!rows || !rows.length) return;
      anyText = true;
      var block = el("div", { class: "hero-textblock" });
      block.appendChild(el("h3", { text: f.heading }));
      rows.forEach(function (r) {
        // Some harvested literals (e.g. Dataverse descriptions) embed HTML
        // markup as plain text. Never render it as HTML (stored-XSS risk from
        // external metadata) -- just normalize <br> to newlines, which
        // white-space:pre-wrap already displays.
        var text = r.o.value.replace(/<br\s*\/?>/gi, "\n").replace(/<\/?[a-z][^>]*>/gi, "");
        block.appendChild(el("p", { text: text }));
      });
      textWrap.appendChild(block);
    });
    if (anyText) mainEl.appendChild(textWrap);
    else if (!view && description) {
      mainEl.appendChild(el("p", { class: "record-desc", text: description }));
    }

    // ---- Full statement list, collapsible ----
    var details = el("details", { class: "details-toggle" });
    if (!view) details.setAttribute("open", "");
    details.appendChild(el("summary", { text: "All statements" }));

    var columns = el("div", { class: "columns" });
    var outCol = el("div", {});
    outCol.appendChild(el("div", { class: "column-heading", text: "Described as" }));
    columns.appendChild(outCol);

    var inCol = el("div", {});
    inCol.appendChild(el("div", { class: "column-heading", text: "Referenced by" }));
    columns.appendChild(inCol);

    details.appendChild(columns);
    mainEl.appendChild(details);

    renderOutColumnFromMemory(outCol, factRows);
    renderInColumn(inCol, uri, inCounts);
  }

  function statLine(text) {
    var parts = text.match(/^(\d+)(.*)$/);
    var s = el("span", { class: "stat" });
    var b = document.createElement("b");
    b.textContent = parts[1];
    s.appendChild(b);
    s.appendChild(document.createTextNode(parts[2]));
    return s;
  }

  function heroValueNode(r, kind) {
    if (kind === "extlink" || (kind === "auto" && r.o.type === "uri" && !isLocalUri(r.o.value))) {
      var a = el("a", { class: "value-literal", href: r.o.value, target: "_blank", rel: "noopener", text: r.label ? r.label.value : shortLabel(r.o.value) });
      return a;
    }
    if ((kind === "link" || kind === "auto") && r.o.type === "uri") {
      var wrap = document.createDocumentFragment();
      var btn = el("button", { class: "hero-link", text: r.label ? r.label.value : shortLabel(r.o.value) });
      btn.addEventListener("click", function () { navigate(r.o.value, { label: r.label ? r.label.value : null }); });
      wrap.appendChild(btn);
      if (!isLocalUri(r.o.value) && isSafeHref(r.o.value)) {
        wrap.appendChild(el("a", { class: "hero-ext", href: r.o.value, target: "_blank", rel: "noopener", text: "\u2197" }));
      }
      return wrap;
    }
    var asUrl = literalUrl(r.o);
    if (asUrl) {
      return el("a", { class: "value-literal", href: asUrl, target: "_blank", rel: "noopener", text: asUrl });
    }

    // literal (or a URI we're told to treat as text)
    var val = r.o.value;
    var tag = "";
    if (r.o["xml:lang"]) tag = r.o["xml:lang"];
    var span = el("span", { text: val });
    if (tag) {
      var t = document.createElement("span");
      t.className = "lit-tag";
      t.textContent = tag;
      span.appendChild(t);
    }
    return span;
  }

  function renderHeroGroup(field, rows) {
    var group = el("div", { class: "hero-group" });
    group.appendChild(el("h3", { text: field.heading }));
    rows.slice(0, 12).forEach(function (r) {
      var row = el("div", { class: "hero-fact-val" });
      row.appendChild(heroValueNode(r, field.kind));
      group.appendChild(row);
    });
    if (rows.length > 12) group.appendChild(el("div", { class: "hero-fact-val", text: "+ " + (rows.length - 12) + " more" }));
    return group;
  }

  function renderLinkListBlock(heading, rows) {
    var wrap = el("div", { class: "dash-section" });
    wrap.appendChild(el("div", { class: "dash-heading", text: heading + " (" + rows.length + ")" }));
    var shown = rows.slice(0, 10);
    shown.forEach(function (r) {
      if (r.o.type !== "uri") return;
      var card = el("button", { class: "result-card" });
      card.appendChild(el("div", { class: "result-label", text: r.label ? r.label.value : shortLabel(r.o.value) }));
      card.appendChild(el("div", { class: "uri-sub", text: shortLabel(r.o.value) }));
      card.addEventListener("click", function () { navigate(r.o.value, { label: r.label ? r.label.value : null }); });
      wrap.appendChild(card);
    });
    if (rows.length > shown.length) wrap.appendChild(el("div", { class: "column-empty", text: "+ " + (rows.length - shown.length) + " more \u2014 see \u201cAll statements\u201d below" }));
    return wrap;
  }

  // Like renderLinkListBlock, but for a Dataset's own distribution: fires one
  // small follow-up query for the shown files' format + URL so image/* files
  // (Dataverse hosts plenty of real image/jpeg scans) get an actual <img>
  // thumbnail instead of just a filename row.
  function renderFileListBlock(heading, rows) {
    var wrap = el("div", { class: "dash-section" });
    wrap.appendChild(el("div", { class: "dash-heading", text: heading + " (" + rows.length + ")" }));
    var shown = rows.filter(function (r) { return r.o.type === "uri"; }).slice(0, 10);
    var rowEls = {};
    shown.forEach(function (r) {
      var uri = r.o.value;
      var card = el("button", { class: "result-card result-card-row" });
      var body = el("div", { class: "result-body" });
      body.appendChild(el("div", { class: "result-label", text: r.label ? r.label.value : shortLabel(uri) }));
      body.appendChild(el("div", { class: "uri-sub", text: shortLabel(uri) }));
      card.appendChild(body);
      card.addEventListener("click", function () { navigate(uri, { label: r.label ? r.label.value : null }); });
      rowEls[uri] = card;
      wrap.appendChild(card);
    });
    if (rows.length > shown.length) wrap.appendChild(el("div", { class: "column-empty", text: "+ " + (rows.length - shown.length) + " more \u2014 see \u201cAll statements\u201d below" }));

    if (shown.length) {
      var values = shown.map(function (r) { return iriRef(r.o.value); }).join(" ");
      var q = "PREFIX schema: <https://schema.org/>\n" +
        "SELECT ?f ?fmt ?url WHERE {\n" +
        "  VALUES ?f { " + values + " }\n" +
        "  ?f schema:encodingFormat ?fmt .\n" +
        "  OPTIONAL { ?f schema:contentUrl ?url }\n" +
        "}";
      sparql(q).then(function (frows) {
        frows.forEach(function (fr) {
          var fmt = fr.fmt.value;
          if (!/^image\//i.test(fmt) || !fr.url || !isLocalUri(fr.url.value)) return;
          var card = rowEls[fr.f.value];
          if (!card) return;
          var img = el("img", { class: "result-thumb", src: fr.url.value, alt: "", loading: "lazy" });
          img.onerror = function () { img.remove(); };
          card.insertBefore(img, card.firstChild);
        });
      }).catch(function () { /* thumbnails are a nice-to-have; ignore failures */ });
    }

    return wrap;
  }

  // ---- Generic "Described as" column, rendered from already-fetched data ----

  function renderOutColumnFromMemory(colEl, factRows) {
    var byPred = {};
    factRows.forEach(function (r) {
      var key = r.p.value;
      if (!byPred[key]) byPred[key] = [];
      byPred[key].push(r);
    });
    var preds = Object.keys(byPred).sort(function (a, b) { return byPred[b].length - byPred[a].length; });
    if (!preds.length) {
      colEl.appendChild(el("div", { class: "column-empty", text: "No outgoing statements recorded." }));
      return;
    }
    preds.forEach(function (pred) {
      var rows = byPred[pred];
      var group = el("div", { class: "pred-group" });
      var labelWrap = el("div", { class: "pred-label" });
      labelWrap.appendChild(document.createTextNode(shortLabel(pred)));
      var countEl = document.createElement("span");
      countEl.className = "pred-count";
      countEl.textContent = rows.length;
      labelWrap.appendChild(countEl);
      group.appendChild(labelWrap);

      var rowsWrap = el("div", { class: "pred-rows" });
      rows.forEach(function (r) { rowsWrap.appendChild(buildValueRow({ item: r.o, label: r.label })); });
      group.appendChild(rowsWrap);
      colEl.appendChild(group);
    });
  }

  // ---- Generic "Referenced by" column: paginated, since fan-in can be huge ----

  function renderInColumn(colEl, uri, counts) {
    if (!counts.length) {
      colEl.appendChild(el("div", { class: "column-empty", text: "Nothing in the graph points to this record." }));
      return;
    }
    counts.forEach(function (row) {
      var pred = row.p.value;
      var total = parseInt(row.c.value, 10);
      var group = el("div", { class: "pred-group" });
      var labelWrap = el("div", { class: "pred-label" });
      labelWrap.appendChild(document.createTextNode(shortLabel(pred)));
      var countEl = document.createElement("span");
      countEl.className = "pred-count";
      countEl.textContent = total;
      labelWrap.appendChild(countEl);
      group.appendChild(labelWrap);

      var rowsWrap = el("div", { class: "pred-rows" });
      rowsWrap.appendChild(el("div", { class: "group-loading", text: "Loading\u2026" }));
      group.appendChild(rowsWrap);
      colEl.appendChild(group);

      loadGroupPage(uri, pred, 0, total, rowsWrap, true);
    });
  }

  function loadGroupPage(uri, pred, offset, total, rowsWrap, isFirst) {
    var pattern = "?item " + iriRef(pred) + " " + iriRef(uri);

    var q = "PREFIX schema: <http://schema.org/>\n" +
      "PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>\n" +
      "SELECT ?item (SAMPLE(?lbl) AS ?label) (SAMPLE(?g) AS ?graph) WHERE {\n" +
      "  GRAPH ?g { " + pattern + " }\n" +
      "  OPTIONAL { ?item <http://schema.org/name> ?n1 }\n" +
      "  OPTIONAL { ?item <https://schema.org/name> ?n2 }\n" +
      "  OPTIONAL { ?item rdfs:label ?n3 }\n" +
      "  BIND(COALESCE(?n1, ?n2, ?n3) AS ?lbl)\n" +
      "} GROUP BY ?item ORDER BY ?item LIMIT " + PAGE_SIZE + " OFFSET " + offset;

    sparql(q).then(function (rows) {
      if (isFirst) clear(rowsWrap);
      rows.forEach(function (r) { rowsWrap.appendChild(buildValueRow(r)); });

      var loadedSoFar = offset + rows.length;
      var oldFooter = rowsWrap.querySelector(".load-more-row");
      if (oldFooter) rowsWrap.removeChild(oldFooter);

      if (loadedSoFar < total) {
        var footer = el("div", { class: "load-more-row" });
        var btn = el("button", { class: "load-more-btn", text: "Show " + Math.min(PAGE_SIZE, total - loadedSoFar) + " more of " + total });
        btn.addEventListener("click", function () {
          btn.disabled = true;
          btn.textContent = "Loading\u2026";
          loadGroupPage(uri, pred, loadedSoFar, total, rowsWrap, false);
        });
        footer.appendChild(btn);
        rowsWrap.appendChild(footer);
      }
    }).catch(function (err) {
      if (isFirst) clear(rowsWrap);
      rowsWrap.appendChild(el("div", { class: "group-loading", text: "Couldn\u2019t load: " + err.message }));
    });
  }

  function buildValueRow(r) {
    var row = el("div", { class: "value-row" });
    var main = el("div", { class: "value-main" });

    if (r.item.type === "uri") {
      var uri = r.item.value;
      var label = r.label ? r.label.value : null;
      var btn = el("button", { class: "value-link", text: label || shortLabel(uri) });
      btn.addEventListener("click", function () { navigate(uri, { label: label }); });
      main.appendChild(btn);
      if (label) main.appendChild(el("div", { class: "value-curie", text: shortLabel(uri) }));
      row.appendChild(main);

      if (!isLocalUri(uri) && isSafeHref(uri)) {
        var ext = el("a", { class: "ext-link", href: uri, target: "_blank", rel: "noopener", title: "Open source", text: "\u2197" });
        row.appendChild(ext);
      }
    } else if (literalUrl(r.item)) {
      var lurl = literalUrl(r.item);
      var linkEl = el("a", { class: "value-literal", href: lurl, target: "_blank", rel: "noopener", text: lurl });
      main.appendChild(linkEl);
      row.appendChild(main);
    } else {
      var val = r.item.value;
      var tag = "";
      if (r.item["xml:lang"]) tag = r.item["xml:lang"];
      else if (r.item.datatype && !/string$/.test(r.item.datatype)) tag = shortLabel(r.item.datatype);
      var litWrap = el("span", { class: "value-literal", text: val });
      if (tag) {
        var tagEl = document.createElement("span");
        tagEl.className = "lit-tag";
        tagEl.textContent = tag;
        litWrap.appendChild(tagEl);
      }
      main.appendChild(litWrap);
      row.appendChild(main);
    }

    if (r.graph) row.appendChild(el("span", { class: "graph-tag", text: graphInfo(r.graph.value).label }));
    return row;
  }

  // ---------- Init ----------

  loadRailGraphs();

  var initialHash = decodeURIComponent(location.hash.replace(/^#/, ""));
  if (initialHash && /^https?:\/\//i.test(initialHash)) {
    currentUri = initialHash;
    history.replaceState({ uri: initialHash }, "", "#" + encodeURIComponent(initialHash));
    loadEntity(initialHash);
  } else {
    renderHome();
  }
  searchInput.focus();
})();
</script>
</body>
</html>
