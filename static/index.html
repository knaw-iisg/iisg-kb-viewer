    for (var w = 0; w < 4; w++) base.appendChild(el("span", { class: "rr-wheel" }));
    trolley.appendChild(base);

    var cols = 0;
    function layout() {
      // Frame around the boxes: the trolley's padding (handle side
      // included), the two uprights and the shelves' own padding.
      var cs = getComputedStyle(trolley);
      var frame = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight) + 18 + 20;
      var room = (trolley.parentNode ? trolley.parentNode.clientWidth : 0) - frame;
      if (room <= 0) return;
      var fit = Math.floor((room + RR_BOX_GAP) / (RR_BOX_W + RR_BOX_GAP));
      // Narrow desks (phones): slimmer boxes, two to a shelf, rather than
      // a tower of one.
      if (fit < 2) fit = Math.max(1, Math.floor((room + RR_BOX_GAP) / (RR_BOX_MIN_W + RR_BOX_GAP)));
      var rows = Math.ceil(boxes.length / fit);
      var c = Math.ceil(boxes.length / rows);
      if (c === cols) return;
      cols = c;
      // The trolley is as wide as its widest shelf, not the whole desk.
      trolley.style.maxWidth = (c * (RR_BOX_W + RR_BOX_GAP) - RR_BOX_GAP + frame) + "px";
      clear(shelves);
      for (var r = 0; r < rows; r++) {
        var shelf = el("div", { class: "rr-shelf" });
        boxes.slice(r * cols, (r + 1) * cols).forEach(function (b) { shelf.appendChild(b); });
        shelves.appendChild(shelf);
      }
    }
    // Lay out once it's in the page (needs a width), then on resize.
    requestAnimationFrame(layout);
    // Watch the desk, not the trolley: the trolley's own width follows
    // the layout.
    requestAnimationFrame(function () {
      if (window.ResizeObserver && trolley.parentNode) new ResizeObserver(layout).observe(trolley.parentNode);
      else window.addEventListener("resize", layout);
    });
    return trolley;
  }

  function rrTrolleyScene(stage, node, kids, cameFrom) {
    var scanned = kids.reduce(function (s, k) { return s + k.scanned; }, 0);
    stage.appendChild(rrCaption(
      "Your archive has arrived: " + rrCount(kids.length, "box", "boxes") + " on the trolley.",
      [node.dates, node.phys, scanned ? fmtNum(scanned) + " items scanned" : "nothing scanned yet"].filter(Boolean).join(" · ") + ". Take a box to your desk."
    ));
    var boxes = kids.map(function (it, i) {
      var b = rrBoxEl(it, i, { cls: it.uri === cameFrom ? "rr-returned" : "" });
      b.addEventListener("click", function () { readingNavigate(it.uri); });
      return b;
    });
    // The inventory comes first, the way you'd read it before taking a box.
    if (node.abstract) {
      stage.appendChild(el("details", { class: "rr-inventory" }, [
        el("summary", { text: "Read the inventory’s introduction" }),
        el("p", { text: node.abstract })
      ]));
    }
    stage.appendChild(rrTrolleyEl(boxes));
  }

  // ---- Scene: an open box, folders standing in it ----

  function rrFileEl(it, i) {
    var kind = it.kind;
    var no = it.ident || (isFinite(it.pos) ? String(it.pos) : "");
    var b = el("button", { type: "button", class: "rr-file kind-" + kind, style: "--i:" + i + ";--tab:" + (i % 3),
      "aria-label": RR_KIND_NAMES[kind] + " " + no + ": " + it.label + (it.dates ? ", " + it.dates : "") }, [
      el("span", { class: "rr-tab", "aria-hidden": "true", text: no || "·" }),
      el("span", { class: "rr-file-body" }, [
        el("span", { class: "rr-file-title", text: it.label }),
        el("span", { class: "rr-file-meta", text: rrItemMeta(it) })
      ])
    ]);
    if (kind === "bundle") b.appendChild(el("span", { class: "rr-string", "aria-hidden": "true" }));
    var badge = rrScanBadge(it);
    if (badge) b.appendChild(badge);
    var tick = rrTick(it.uri);
    if (tick) b.appendChild(tick);
    return b;
  }

  // Remembered per box, so coming back from a folder reopens the same
  // numbered box of a long series.
  var rrChunkOf = {};

  function rrBoxScene(stage, node, kids, chain, cameFrom) {
    var isBundle = chain.length > 1;
    var chunks = Math.ceil(kids.length / RR_PER_BOX);
    var chunk = rrChunkOf[node.uri] || 0;
    if (cameFrom) {
      var at = kids.map(function (k) { return k.uri; }).indexOf(cameFrom);
      if (at >= 0) chunk = Math.floor(at / RR_PER_BOX);
    }
    if (chunk >= chunks) chunk = 0;

    var sheets = kids.filter(function (k) { return k.kind === "letter" || k.kind === "photo"; }).length;
    var tapes = kids.filter(function (k) { return k.kind === "audio"; }).length;
    var noun = tapes * 2 > kids.length ? ["recording", "recordings"]
      : sheets * 2 > kids.length ? ["letter or sheet", "letters and sheets"] : ["folder", "folders"];
    var scanned = kids.reduce(function (s, k) { return s + k.scanned; }, 0);
    stage.appendChild(rrCaption(
      (isBundle ? "You untie the bundle: " : "You lift the lid: ") + rrCount(kids.length, noun[0], noun[1]) +
        (chunks > 1 ? ", packed in " + chunks + " boxes" : "") + ".",
      [node.dates, scanned ? fmtNum(scanned) + " scanned" : "none of it scanned yet"].filter(Boolean).join(" · ") + ". Pull one out to read it."
    ));

    var area = el("div", { class: "rr-boxarea" });
    stage.appendChild(area);

    var shelf = null;
    if (chunks > 1) {
      shelf = el("div", { class: "rr-boxrow", role: "tablist", "aria-label": "Boxes in this series" });
      stage.insertBefore(shelf, area);
    }

    function draw(c, animate) {
      chunk = c;
      rrChunkOf[node.uri] = c;
      clear(area);
      if (shelf) {
        clear(shelf);
        for (var k = 0; k < chunks; k++) (function (k) {
          var part = kids.slice(k * RR_PER_BOX, (k + 1) * RR_PER_BOX);
          var first = part[0], last = part[part.length - 1];
          // Positions, not inventory numbers: those can run to "D_I_A_1_276".
          var range = isFinite(first.pos) && isFinite(last.pos) ? first.pos + "–" + last.pos : (k * RR_PER_BOX + 1) + "–" + (k * RR_PER_BOX + part.length);
          var sc = part.reduce(function (s, x) { return s + x.scanned; }, 0);
          var end = el("button", { type: "button", role: "tab", class: "rr-boxend" + (k === c ? " current" : ""),
            "aria-selected": k === c ? "true" : "false", title: first.label + " … " + last.label }, [
            el("strong", { text: String(k + 1) }), el("span", { text: range }),
            sc ? el("i", { text: sc + " scans" }) : null
          ]);
          end.addEventListener("click", function () { draw(k, true); });
          shelf.appendChild(end);
        })(k);
        var cur = shelf.children[c];
        if (cur) cur.scrollIntoView({ block: "nearest", inline: "center" });
      }

      var box = el("div", { class: "rr-openbox" + (isBundle ? " is-bundle" : "") + (animate ? " opening" : "") });
      box.appendChild(el("div", { class: "rr-lid", "aria-hidden": "true" }));
      var inner = el("div", { class: "rr-openbox-inner" });
      var part = kids.slice(c * RR_PER_BOX, (c + 1) * RR_PER_BOX);
      part.forEach(function (it, i) {
        var f = rrFileEl(it, i);
        if (it.uri === cameFrom) f.classList.add("rr-returned");
        f.addEventListener("click", function () { readingNavigate(it.uri); });
        inner.appendChild(f);
      });
      box.appendChild(inner);
      box.appendChild(el("div", { class: "rr-openbox-front" }, [
        el("span", { class: "rr-box-label small" }, [
          el("span", { class: "rr-box-no", text: rrCallNumber(node.uri) + (chunks > 1 ? " · box " + (c + 1) + "/" + chunks : "") }),
          el("span", { class: "rr-box-title", text: node.label })
        ])
      ]));
      area.appendChild(box);
      var ret = inner.querySelector(".rr-returned");
      if (ret) setTimeout(function () { ret.scrollIntoView({ block: "nearest" }); }, 50);
    }
    draw(chunk, true);

    return {
      ArrowRight: function () { if (chunk < chunks - 1) draw(chunk + 1, true); },
      ArrowLeft: function () { if (chunk > 0) draw(chunk - 1, true); }
    };
  }

  // ---- Scene: a folder open on the desk ----

  function rrDeskScene(stage, node, kind, siblings, chain) {
    var folder = el("div", { class: "rr-openfolder kind-" + kind });
    var left = el("div", { class: "rr-leaf rr-leaf-left" });
    var right = el("div", { class: "rr-leaf rr-leaf-right" });
    folder.appendChild(left);
    folder.appendChild(right);

    // Inside cover: the archivist's slip.
    var slip = el("div", { class: "rr-slip" });
    slip.appendChild(el("div", { class: "rr-slip-head" }, [
      el("span", { text: rrCallNumber(node.uri) }),
      el("span", { text: node.ident ? "inv. no. " + node.ident : RR_KIND_NAMES[kind] })
    ]));
    slip.appendChild(el("div", { class: "rr-slip-title", text: node.label }));
    var facts = [node.dates, node.phys].filter(Boolean);
    if (facts.length) slip.appendChild(el("div", { class: "rr-slip-meta", text: facts.join(" · ") }));
    left.appendChild(slip);
    var pagesStrip = el("div", { class: "rr-pages", role: "list", "aria-label": "Pages" });
    left.appendChild(pagesStrip);
    var links = el("div", { class: "rr-slip-links" });
    left.appendChild(links);
    if (node.manifest && isSafeHref(node.manifest)) {
      links.appendChild(el("a", { href: UNIVERSAL_VIEWER + node.manifest, target: "_blank", rel: "noopener", text: "Universal Viewer ↗" }));
    }
    var native = node.native && isSafeHref(node.native) ? node.native : null;
    if (native) links.appendChild(el("a", { href: native, target: "_blank", rel: "noopener", text: "IISG catalogue ↗" }));

    var caption = rrCaption(
      "On your desk: " + RR_KIND_NAMES[kind] + (node.ident ? " " + node.ident : "") + ", " + node.label,
      node.manifest ? (kind === "audio" ? "Threading the tape…" : "Turn the pages with ← →, click a page to look closer.") : null
    );
    stage.appendChild(caption);
    stage.appendChild(folder);

    // Desk controls: previous / put back / next, through the box's order.
    var idx = siblings.map(function (s) { return s.uri; }).indexOf(node.uri);
    var prev = idx > 0 ? siblings[idx - 1] : null;
    var next = idx >= 0 && idx < siblings.length - 1 ? siblings[idx + 1] : null;
    var bar = el("div", { class: "rr-deskbar" });
    function navBtn(text, item, cls) {
      var b = el("button", { type: "button", class: "rr-btn " + (cls || ""), text: text });
      if (item) { b.title = item.label; b.addEventListener("click", function () { readingNavigate(item.uri); }); }
      else b.disabled = true;
      return b;
    }
    bar.appendChild(navBtn("‹ Previous " + RR_KIND_NAMES[prev ? prev.kind : kind], prev, ""));
    var putBack = el("button", { type: "button", class: "rr-btn primary", text: "Put back" });
    putBack.addEventListener("click", function () { rrUp(node.uri, chain); });
    bar.appendChild(putBack);
    bar.appendChild(navBtn(next ? "Next " + RR_KIND_NAMES[next.kind] + " ›" : "End of the box", next, ""));
    if (idx >= 0 && siblings.length > 1) bar.appendChild(el("span", { class: "rr-deskbar-pos", text: fmtNum(idx + 1) + " of " + fmtNum(siblings.length) + " in this " + (chain.length > 1 ? "box" : "archive") }));
    stage.appendChild(bar);

    var keys = {
      PageUp: function () { if (prev) readingNavigate(prev.uri); },
      PageDown: function () { if (next) readingNavigate(next.uri); }
    };

    if (!node.manifest) {
      right.appendChild(el("div", { class: "rr-sheet rr-notscanned" }, [
        el("strong", { text: "Not scanned" }),
        el("p", { text: "This " + RR_KIND_NAMES[kind] + " hasn’t been digitized. To read it, request it for the IISG reading room in Amsterdam." }),
        native ? el("a", { href: native, target: "_blank", rel: "noopener", text: "Request via the IISG catalogue ↗" }) : null
      ]));
      keys.ArrowRight = keys.PageDown;
      keys.ArrowLeft = keys.PageUp;
      return keys;
    }

    var sheetWrap = el("div", { class: "rr-sheetstack" });
    var sheet = el("button", { type: "button", class: "rr-sheet rr-page" });
    var img = el("img", { alt: "", draggable: "false" });
    sheet.appendChild(img);
    sheetWrap.appendChild(sheet);
    right.appendChild(sheetWrap);
    var pager = el("div", { class: "rr-pager" });
    var prevPage = el("button", { type: "button", class: "rr-btn", "aria-label": "Previous page", text: "‹" });
    var pageNo = el("span", { class: "rr-pageno", "aria-live": "polite", text: "Opening…" });
    var nextPage = el("button", { type: "button", class: "rr-btn", "aria-label": "Next page", text: "›" });
    pager.appendChild(prevPage); pager.appendChild(pageNo); pager.appendChild(nextPage);
    right.appendChild(pager);

    var pages = [], page = 0, thumbs = [];
    // While the manifest loads (or if it can't), the first-page thumbnail.
    if (node.thumb) { img.src = node.thumb; sheet.classList.add("loading"); }

    function show(i, dir) {
      if (!pages.length) return;
      i = Math.max(0, Math.min(pages.length - 1, i));
      if (dir && i !== page) {
        // The page you're leaving slides off the stack.
        var ghost = sheet.cloneNode(true);
        ghost.classList.add("rr-turning", dir > 0 ? "out-left" : "out-right");
        ghost.removeAttribute("id");
        ghost.setAttribute("aria-hidden", "true");
        ghost.tabIndex = -1;
        sheetWrap.appendChild(ghost);
        setTimeout(function () { ghost.remove(); }, 450);
      }
      page = i;
      var p = pages[i];
      var w = sheetWrap.clientWidth || 420;
      sheet.classList.add("loading");
      img.src = p.thumb;
      var big = new Image();
      big.onload = function () { if (pages[page] === p) { img.src = big.src; sheet.classList.remove("loading"); } };
      // A rights-restricted scan can refuse anything bigger than its
      // thumbnail (401): show that unblurred rather than waiting forever.
      big.onerror = function () { if (pages[page] === p) sheet.classList.remove("loading"); };
      big.src = iiifSizedUrl(p, w);
      if (pages[i + 1]) new Image().src = iiifSizedUrl(pages[i + 1], w);
      img.alt = node.label + " — page " + (i + 1) + " of " + pages.length;
      sheet.setAttribute("aria-label", "Page " + (i + 1) + " of " + pages.length + ", open full screen");
      pageNo.textContent = "page " + (i + 1) + " of " + pages.length;
      prevPage.disabled = i === 0;
      nextPage.disabled = i === pages.length - 1 && !next;
      nextPage.setAttribute("aria-label", i === pages.length - 1 && next ? "Next " + RR_KIND_NAMES[next.kind] : "Next page");
      thumbs.forEach(function (t, j) { t.setAttribute("aria-current", j === i ? "true" : "false"); });
      if (thumbs[i]) thumbs[i].scrollIntoView({ block: "nearest", inline: "nearest" });
      sheetWrap.style.setProperty("--stack", Math.min(pages.length - 1 - i, 4));
    }
    function turn(d) {
      if (!pages.length) return;
      if (d > 0 && page === pages.length - 1) { if (next) readingNavigate(next.uri); return; }
      if (d < 0 && page === 0) return;
      show(page + d, d);
    }
    prevPage.addEventListener("click", function () { turn(-1); });
    nextPage.addEventListener("click", function () { turn(1); });
    sheet.addEventListener("click", function () {
      if (!pages.length) return;
      openImageLightbox(pages, page, { label: node.label, uri: node.uri, viewerUrl: null }, function (last) {
        show(last);
        sheet.focus({ preventScroll: true });
      });
    });
    // Swipe on touch screens.
    var touchX = null;
    sheet.addEventListener("pointerdown", function (e) { if (e.pointerType !== "mouse") touchX = e.clientX; });
    sheet.addEventListener("pointerup", function (e) {
      if (touchX === null) return;
      var dx = e.clientX - touchX; touchX = null;
      if (Math.abs(dx) > 40) { e.preventDefault(); turn(dx < 0 ? 1 : -1); }
    });

    var gen = rrGen;
    rrFetchMedia(node.manifest).then(function (media) {
      if (gen !== rrGen) return;
      if (media.sounds.length) {
        // A recording: the tape recorder takes the place of the pages.
        var rec = rrRecorderEl(node, media.sounds, { viewer: node.manifest && isSafeHref(node.manifest) ? UNIVERSAL_VIEWER + node.manifest : null });
        clear(right);
        right.appendChild(rec.el);
        pagesStrip.remove();
        folder.classList.add("is-audio");
        caption.querySelector(".rr-caption-main").textContent = "On your desk: a tape" + (node.ident ? ", inv. no. " + node.ident : "") + " — " + node.label;
        var sub = caption.querySelector(".rr-caption-sub");
        var open = media.sounds.filter(function (snd) { return !snd.restricted; }).length;
        if (sub) sub.textContent = !open ? "Restricted: this recording can only be heard at the IISG."
          : "Space to play or pause, ← → to wind 10 seconds" + (media.sounds.length > 1 ? "; " + media.sounds.length + " sides, in the tape boxes below the deck." : ".");
        Object.keys(rec.keys).forEach(function (k) { keys[k] = rec.keys[k]; });
        return;
      }
      var ps = media.pages;
      if (!ps.length) throw new Error("no pages");
      pages = ps;
      ps.forEach(function (p, i) {
        var t = el("button", { type: "button", class: "rr-pagethumb", role: "listitem", "aria-label": "Page " + (i + 1) });
        var ti = el("img", { src: p.thumb, alt: "", loading: "lazy" });
        ti.onerror = function () { ti.remove(); };
        t.appendChild(ti);
        t.appendChild(el("span", { text: String(i + 1) }));
        t.addEventListener("click", function () { show(i, i > page ? 1 : -1); });
        thumbs.push(t);
        pagesStrip.appendChild(t);
      });
      show(0);
    }).catch(function () {
      if (gen !== rrGen) return;
      sheet.classList.remove("loading");
      pageNo.textContent = node.thumb ? "first page only — the full scan is in the Universal Viewer" : "The scans couldn’t be loaded right now.";
      prevPage.disabled = nextPage.disabled = true;
    });

    keys.ArrowRight = function () { turn(1); };
    keys.ArrowLeft = function () { turn(-1); };
    keys.Home = function () { show(0, -1); };
    keys.End = function () { show(pages.length - 1, 1); };
    return keys;
  }

  // ---- A recording on the desk: a reel-to-reel tape recorder ----
  // For an item whose IIIF manifest holds Sound canvases instead of
  // images (oral-history interviews, recorded meetings: one canvas per
  // tape side, each an audio/mp3 file on access.iisg.amsterdam). The
  // sides are laid out as tape boxes; the one on the deck plays through
  // a plain <audio> element, while the reels turn (faster as a reel
  // empties, as real ones do), the tape winds over from left to right,
  // the counter runs and a VU needle follows the signal. Sides behind
  // IIIF Auth ("Access restricted") show the manifest's own notice
  // rather than a player that can only fail.

  var RR_REEL_MIN = 20, RR_REEL_MAX = 66;

  function rrClock(sec) {
    if (!isFinite(sec) || sec < 0) sec = 0;
    sec = Math.floor(sec);
    var h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, s = sec % 60;
    return (h ? h + ":" + pad2(m) : pad2(m)) + ":" + pad2(s);
  }

  // A VU meter face drawn the way real ones are: one arc around the
  // needle's pivot (below the face, under its little housing), marked
  // -20 … -1 in black and 0 … +3 in red, 0 VU about three quarters of
  // the way across. Positions are fractions of the needle's sweep.
  var RR_VU_PIVOT = [60, 98], RR_VU_R = 66, RR_VU_SWEEP = 46;
  var RR_VU_MARKS = [["20", 0], ["10", 0.17], ["7", 0.28], ["5", 0.38], ["3", 0.51], ["2", 0.59], ["1", 0.67], ["0", 0.76], ["1", 0.84], ["2", 0.92], ["3", 1]];

  function rrVuSvg() {
    var cx = RR_VU_PIVOT[0], cy = RR_VU_PIVOT[1];
    function at(f, r) {
      var a = (-RR_VU_SWEEP + f * 2 * RR_VU_SWEEP) * Math.PI / 180;
      return [cx + r * Math.sin(a), cy - r * Math.cos(a)];
    }
    function arc(f0, f1, r) {
      var p0 = at(f0, r), p1 = at(f1, r);
      return "M" + p0[0].toFixed(2) + " " + p0[1].toFixed(2) + "A" + r + " " + r + " 0 0 1 " + p1[0].toFixed(2) + " " + p1[1].toFixed(2);
    }
    var zero = 0.76, out = [];
    out.push('<path d="' + arc(0, zero, RR_VU_R) + '" class="rr-vu-scale"/>');
    out.push('<path d="' + arc(0.45, zero, RR_VU_R + 1.2) + '" class="rr-vu-scale thick"/>');
    out.push('<path d="' + arc(zero, 1, RR_VU_R + 1.2) + '" class="rr-vu-red"/>');
    RR_VU_MARKS.forEach(function (m) {
      var red = m[1] >= zero, a = at(m[1], RR_VU_R + 0.5), b = at(m[1], RR_VU_R + 6), t = at(m[1], RR_VU_R + 12);
      out.push('<line x1="' + a[0].toFixed(2) + '" y1="' + a[1].toFixed(2) + '" x2="' + b[0].toFixed(2) + '" y2="' + b[1].toFixed(2) + '" class="rr-vu-tick' + (red ? " red" : "") + '"/>');
      out.push('<text x="' + t[0].toFixed(2) + '" y="' + (t[1] + 2.5).toFixed(2) + '" class="rr-vu-num' + (red ? " red" : "") + '">' + m[0] + "</text>");
    });
    var minus = at(-0.06, RR_VU_R + 1), plus = at(1.07, RR_VU_R + 1), dot = at(zero + 0.03, RR_VU_R - 9);
    out.push('<text x="' + minus[0].toFixed(1) + '" y="' + (minus[1] + 2).toFixed(1) + '" class="rr-vu-num">−</text>');
    out.push('<text x="' + plus[0].toFixed(1) + '" y="' + (plus[1] + 2).toFixed(1) + '" class="rr-vu-num red">+</text>');
    out.push('<circle cx="' + dot[0].toFixed(1) + '" cy="' + dot[1].toFixed(1) + '" r="1.6" class="rr-vu-dot"/>');
    out.push('<text x="' + cx + '" y="54" class="rr-vu-label">VU</text>');
    out.push('<line x1="' + cx + '" y1="' + cy + '" x2="' + cx + '" y2="' + (cy - RR_VU_R - 9) + '" class="rr-vu-needle"/>');
    // the needle's pivot housing along the bottom edge
    out.push('<path d="M36 70L42 61H78L84 70Z" class="rr-vu-housing"/>');
    return '<svg viewBox="0 0 120 70">' + out.join("") + "</svg>";
  }

  function rrReelSvg(id) {
    // flange with three cut-outs over the wound tape; hub in the middle
    function pt(a, rr) { var t = a * Math.PI / 180; return (rr * Math.cos(t)).toFixed(1) + " " + (rr * Math.sin(t)).toFixed(1); }
    var cut = "";
    for (var k = 0; k < 3; k++) {
      var a0 = k * 120 - 38, a1 = k * 120 + 38;
      cut += '<path d="M' + pt(a0, 24) + 'L' + pt(a0, 64) + 'A64 64 0 0 1 ' + pt(a1, 64) + 'L' + pt(a1, 24) + 'A24 24 0 0 0 ' + pt(a0, 24) + 'Z" class="rr-reel-cut"/>';
    }
    return '<g class="rr-reel" id="' + id + '">' +
      '<circle r="' + RR_REEL_MAX + '" class="rr-tape-wound"/>' +
      '<g class="rr-reel-spin"><circle r="74" class="rr-reel-flange"/>' + cut +
      '<circle r="15" class="rr-reel-hub"/><path d="M0 -6L5 3H-5Z" class="rr-reel-key"/></g></g>';
  }

  function rrRecorderEl(node, sounds, opts) {
    var root = el("div", { class: "rr-recorder" });
    var deckWrap = el("div", { class: "rr-deck" });
    deckWrap.innerHTML =
      '<svg viewBox="0 0 460 250" role="img" aria-label="Tape recorder">' +
      '<rect x="4" y="4" width="452" height="242" rx="14" class="rr-deck-plate"/>' +
      '<rect x="14" y="14" width="432" height="222" rx="9" class="rr-deck-inset"/>' +
      '<g transform="translate(118 96)">' + rrReelSvg("rr-reel-l") + '</g>' +
      '<g transform="translate(342 96)">' + rrReelSvg("rr-reel-r") + '</g>' +
      '<path class="rr-tape-path" d=""/>' +
      '<circle cx="168" cy="200" r="7" class="rr-roller"/><circle cx="292" cy="200" r="7" class="rr-roller"/>' +
      '<rect x="200" y="196" width="60" height="26" rx="4" class="rr-head"/>' +
      '<rect x="226" y="196" width="8" height="8" class="rr-head-gap"/>' +
      '<text x="230" y="236" class="rr-deck-brand">IISG · 19 cm/s</text>' +
      '</svg>';
    root.appendChild(deckWrap);
    var svg = deckWrap.firstChild;
    var reelL = svg.querySelector("#rr-reel-l"), reelR = svg.querySelector("#rr-reel-r");
    var spinL = reelL.querySelector(".rr-reel-spin"), spinR = reelR.querySelector(".rr-reel-spin");
    var woundL = reelL.querySelector(".rr-tape-wound"), woundR = reelR.querySelector(".rr-tape-wound");
    var tapePath = svg.querySelector(".rr-tape-path");

    // Control panel: counter, VU meter, piano keys, position.
    var panel = el("div", { class: "rr-deck-panel" });
    var counter = el("div", { class: "rr-counter", "aria-live": "off", text: "00:00" });
    var total = el("span", { class: "rr-counter-total", text: "/ 00:00" });
    var vu = el("div", { class: "rr-vu", "aria-hidden": "true" });
    vu.innerHTML = rrVuSvg();
    var needle = vu.querySelector(".rr-vu-needle");
    function key(label, aria, cls) { return el("button", { type: "button", class: "rr-key " + (cls || ""), "aria-label": aria, title: aria, text: label }); }
    var kBack = key("◀◀", "Back 10 seconds (←)");
    var kPlay = key("▶", "Play (space)", "play");
    var kStop = key("■", "Stop");
    var kFwd = key("▶▶", "Forward 10 seconds (→)");
    var keysRow = el("div", { class: "rr-keys" }, [kBack, kPlay, kStop, kFwd]);
    var scrub = el("input", { type: "range", class: "rr-scrub", min: "0", max: "1000", value: "0", "aria-label": "Position on the tape" });
    panel.appendChild(el("div", { class: "rr-counter-wrap" }, [counter, total]));
    panel.appendChild(vu);
    panel.appendChild(keysRow);
    panel.appendChild(scrub);
    root.appendChild(panel);

    var notice = el("div", { class: "rr-restricted", hidden: "" });
    root.appendChild(notice);

    // The sides, as tape boxes.
    var shelf = el("div", { class: "rr-tapeboxes", role: "list", "aria-label": "Tape sides" });
    root.appendChild(shelf);
    var boxes = sounds.map(function (snd, i) {
      var b = el("button", { type: "button", class: "rr-tapebox" + (snd.restricted ? " locked" : ""), role: "listitem" }, [
        el("span", { class: "rr-tapebox-reel", "aria-hidden": "true" }),
        el("span", { class: "rr-tapebox-label" }, [
          el("strong", { text: sounds.length > 1 ? "Side " + (i + 1) : "Tape" }),
          el("span", { text: snd.duration ? rrClock(snd.duration) : "" }),
          snd.restricted ? el("em", { text: "restricted" }) : null
        ])
      ]);
      b.addEventListener("click", function () { load(i, true); });
      shelf.appendChild(b);
      return b;
    });
    if (sounds.length < 2) shelf.hidden = true;

    var audio = new Audio();
    audio.preload = "metadata";
    var cors = true;
    audio.crossOrigin = "anonymous";
    var side = -1, actx = null, analyser = null, buf = null;
    var angleL = 0, angleR = 0, lastT = 0, level = 0, spinBoost = 0;

    function dur() { return isFinite(audio.duration) && audio.duration ? audio.duration : (sounds[side] && sounds[side].duration) || 0; }

    function load(i, autoplay) {
      if (i < 0 || i >= sounds.length) return;
      var snd = sounds[i];
      side = i;
      boxes.forEach(function (b, j) { b.setAttribute("aria-current", j === i ? "true" : "false"); });
      total.textContent = "/ " + rrClock(snd.duration);
      root.classList.toggle("is-locked", !!snd.restricted);
      if (snd.restricted) {
        audio.pause();
        audio.removeAttribute("src");
        clear(notice);
        notice.appendChild(el("strong", { text: snd.failureHeader || "Access restricted" }));
        notice.appendChild(el("p", { text: snd.failureDescription || "This recording can only be listened to at the IISG." }));
        if (opts.viewer) notice.appendChild(el("a", { href: opts.viewer, target: "_blank", rel: "noopener", text: "Try it in the Universal Viewer ↗" }));
        notice.hidden = false;
        [kBack, kPlay, kStop, kFwd, scrub].forEach(function (k) { k.disabled = true; });
        draw(0);
        return;
      }
      notice.hidden = true;
      [kBack, kPlay, kStop, kFwd, scrub].forEach(function (k) { k.disabled = false; });
      audio.src = snd.url;
      draw(0);
      if (autoplay) play();
    }

    function play() {
      if (side < 0 || sounds[side].restricted) return;
      if (cors && !actx && (window.AudioContext || window.webkitAudioContext)) {
        try {
          actx = new (window.AudioContext || window.webkitAudioContext)();
          var src = actx.createMediaElementSource(audio);
          analyser = actx.createAnalyser();
          analyser.fftSize = 512;
          buf = new Uint8Array(analyser.fftSize);
          src.connect(analyser);
          analyser.connect(actx.destination);
        } catch (e) { analyser = null; }
      }
      if (actx && actx.state === "suspended") actx.resume();
      var p = audio.play();
      if (p && p.catch) p.catch(function () { /* blocked or failed: the error handler says so */ });
    }
    function toggle() { if (audio.paused) play(); else audio.pause(); }
    function seek(d) {
      if (!dur()) return;
      audio.currentTime = Math.max(0, Math.min(dur() - 0.25, audio.currentTime + d));
      spinBoost = d > 0 ? 1 : -1;
    }

    kPlay.addEventListener("click", toggle);
    kStop.addEventListener("click", function () { audio.pause(); if (dur()) audio.currentTime = 0; spinBoost = -1; });
    kBack.addEventListener("click", function () { seek(-10); });
    kFwd.addEventListener("click", function () { seek(10); });
    scrub.addEventListener("input", function () { if (dur()) audio.currentTime = dur() * scrub.value / 1000; });

    audio.addEventListener("play", function () { root.classList.add("is-playing"); kPlay.textContent = "❚❚"; kPlay.setAttribute("aria-label", "Pause (space)"); kPlay.title = "Pause (space)"; });
    audio.addEventListener("pause", function () { root.classList.remove("is-playing"); kPlay.textContent = "▶"; kPlay.setAttribute("aria-label", "Play (space)"); kPlay.title = "Play (space)"; });
    audio.addEventListener("ended", function () { if (side < sounds.length - 1 && !sounds[side + 1].restricted) load(side + 1, true); });
    audio.addEventListener("error", function () {
      if (!audio.getAttribute("src")) return;
      // The level meter needs CORS; if that is what failed, play without it.
      if (cors && !actx) {
        cors = false;
        audio.removeAttribute("crossorigin");
        var at = audio.currentTime;
        audio.src = sounds[side].url;
        audio.currentTime = at;
        return;
      }
      clear(notice);
      notice.appendChild(el("strong", { text: "This tape won’t play" }));
      notice.appendChild(el("p", { text: "IISG’s media server didn’t deliver the recording just now." }));
      notice.hidden = false;
    });

    // Tape geometry: what's on each reel follows the position, by area.
    function radii(p) {
      var a = RR_REEL_MIN * RR_REEL_MIN, b = RR_REEL_MAX * RR_REEL_MAX;
      return [Math.sqrt(a + (1 - p) * (b - a)), Math.sqrt(a + p * (b - a))];
    }
    function draw(p) {
      var r = radii(p);
      woundL.setAttribute("r", r[0].toFixed(1));
      woundR.setAttribute("r", r[1].toFixed(1));
      // left reel's underside -> roller -> past the head -> roller -> right reel
      tapePath.setAttribute("d", "M" + (118 - r[0] * 0.5).toFixed(1) + " " + (96 + r[0] * 0.87).toFixed(1) +
        " L161 205 L200 209 L260 209 L299 205 L" + (342 + r[1] * 0.5).toFixed(1) + " " + (96 + r[1] * 0.87).toFixed(1));
      counter.textContent = rrClock(audio.currentTime || 0);
      if (document.activeElement !== scrub) scrub.value = String(Math.round(p * 1000));
    }

    function frame(t) {
      if (!root.isConnected) {
        // Scene left (another item, the box, a record page): stop the tape.
        audio.pause();
        audio.removeAttribute("src");
        if (actx) actx.close();
        return;
      }
      var dt = lastT ? Math.min(0.1, (t - lastT) / 1000) : 0;
      lastT = t;
      var d = dur();
      var p = d ? Math.min(1, (audio.currentTime || 0) / d) : 0;
      var r = radii(p);
      var speed = audio.paused ? 0 : 900;               // tape speed, in SVG units/s
      if (spinBoost) { speed += spinBoost * 9000; spinBoost *= 0.9; if (Math.abs(spinBoost) < 0.02) spinBoost = 0; }
      angleL += dt * speed / r[0] * 57.3 * 0.2;
      angleR += dt * speed / r[1] * 57.3 * 0.2;
      spinL.setAttribute("transform", "rotate(" + angleL.toFixed(1) + ")");
      spinR.setAttribute("transform", "rotate(" + angleR.toFixed(1) + ")");
      draw(p);

      var target = 0;
      if (!audio.paused) {
        if (analyser) {
          analyser.getByteTimeDomainData(buf);
          var sum = 0;
          for (var i = 0; i < buf.length; i++) { var v = (buf[i] - 128) / 128; sum += v * v; }
          target = Math.min(1, Math.sqrt(sum / buf.length) * 4);
        } else {
          target = 0.35 + Math.random() * 0.4; // no CORS, no signal: a believable wobble
        }
      }
      level += (target - level) * (target > level ? 0.5 : 0.12);
      needle.setAttribute("transform", "rotate(" + (-RR_VU_SWEEP + level * 2 * RR_VU_SWEEP).toFixed(1) + " " + RR_VU_PIVOT[0] + " " + RR_VU_PIVOT[1] + ")");
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    var first = 0;
    while (first < sounds.length - 1 && sounds[first].restricted) first++;
    load(first, false);

    return {
      el: root,
      keys: {
        " ": toggle,
        ArrowLeft: function () { seek(-10); },
        ArrowRight: function () { seek(10); },
        Home: function () { if (dur()) audio.currentTime = 0; }
      }
    };
  }

  // ---- Putting a scene together ----

  function renderReading(uri) {
    viewGeneration++;
    var gen = ++rrGen;
    rrKeys = null;
    var cameFrom = rrLastUri;
    rrLastUri = uri;
    var loadingTimer = setTimeout(function () {
      if (gen !== rrGen || location.hash.indexOf("#reading:") !== 0) return;
      clear(mainEl);
      mainEl.appendChild(el("div", { class: "results-heading", text: "Fetching it from the stacks…" }));
    }, 500);

    Promise.all([rrFetchNode(uri), rrFetchChain(uri), rrFetchKids(uri)]).then(function (res) {
      var node = res[0], chain = res[1], kids = res[2];
      var parentUri = chain.length ? chain[chain.length - 1].uri : null;
      var root = chain.length ? { uri: chain[0].uri, label: tidyTitle(chain[0].label) } : { uri: uri, label: node.label };
      // A leaf needs its siblings, for previous/next through the box.
      var sibs = !kids.length && parentUri ? rrFetchKids(parentUri) : Promise.resolve([]);
      return sibs.then(function (siblings) {
        // Superseded by another scene, or left for a record page meanwhile.
        if (gen !== rrGen || location.hash.indexOf("#reading:") !== 0) return;
        clearTimeout(loadingTimer);
        clear(mainEl);
        chain = chain.map(function (c) { return { uri: c.uri, label: tidyTitle(c.label) }; });

        var scene, kind;
        if (!kids.length) {
          var self = siblings.filter(function (s) { return s.uri === uri; })[0];
          kind = self ? self.kind : (rrPhysKind(node.phys) || "folder");
          if (kind === "box") kind = "folder";
          scene = "desk";
        } else if (!chain.length && kids.some(function (k) { return k.kids > 0; })) {
          kind = "collection"; scene = "trolley";
        } else {
          kind = chain.length > 1 ? "bundle" : "box"; scene = "box";
        }

        // Ticked before the notepad is drawn, so its tally counts this one.
        if (scene === "desk") rrMarkHandled(uri);
        var hint = scene === "desk" ? "← →  turn pages\nPgUp PgDn  previous / next\nEsc  put back"
          : scene === "box" ? "← →  other boxes\nEsc  put back" : "Esc  back to the desk";
        var shell = rrShell({ root: root, chain: chain, node: node, kind: kind, keysHint: hint });
        shell.stage.classList.add("scene-" + scene);
        mainEl.appendChild(shell.section);

        var keys = {};
        if (scene === "trolley") rrTrolleyScene(shell.stage, node, kids, rrChildOnPath(uri, cameFrom));
        else if (scene === "box") keys = rrBoxScene(shell.stage, node, kids, chain, rrChildOnPath(uri, cameFrom)) || {};
        else keys = rrDeskScene(shell.stage, node, kind, siblings, chain) || {};
        keys.Escape = function () { rrUp(uri, chain); };
        rrKeys = keys;
        if (window.scrollY > mainEl.offsetTop) window.scrollTo(0, 0);
      });
    }).catch(function () {
      if (gen !== rrGen || location.hash.indexOf("#reading:") !== 0) return;
      clearTimeout(loadingTimer);
      renderError("Couldn’t fetch this from the stacks.", function () { renderReading(uri); });
    });
  }

  // The child of uri that leads down to `from`, when coming back up --
  // so the box or folder you just put back is the one that's marked.
  // Finding-aid IRIs nest by fragment (ARCH00018#1-1-1-4 under #1-1-1),
  // which is all this needs.
  function rrChildOnPath(uri, from) {
    if (!from || from === uri) return null;
    var base = uri.indexOf("#") === -1 ? uri + "#" : uri + "-";
    if (from.indexOf(base) !== 0) return null;
    var rest = from.slice(base.length).split("-");
    return base + rest[0];
  }

  // ---- The request desk (#view:readingroom) ----

  function renderReadingDesk() {
    var gen = ++rrGen;
    rrLastUri = null;
    var shell = rrShell({ root: null, chain: [], node: null });
    shell.stage.classList.add("scene-request");
    mainEl.appendChild(shell.section);
    var stage = shell.stage;
    rrKeys = {};

    stage.appendChild(rrCaption("Welcome to the reading room.", "Fill in a request slip for an archive, or take one of the boxes already waiting on the trolley."));

    var form = el("form", { class: "rr-request", role: "search" });
    form.appendChild(el("div", { class: "rr-request-head" }, [el("strong", { text: "Request slip" }), el("span", { text: "No. " + (1000 + Math.floor(Math.random() * 9000)) })]));
    var label = el("label", { for: "rr-request-input", text: "Archive (name or call number)" });
    var input = el("input", { id: "rr-request-input", type: "text", placeholder: "e.g. Bakunin, Kautsky, ARCH00018", autocomplete: "off", spellcheck: "false" });
    var submit = el("button", { type: "submit", class: "rr-btn primary", text: "Request" });
    var surprise = el("button", { type: "button", class: "rr-btn", text: "Surprise me" });
    form.appendChild(label);
    form.appendChild(el("div", { class: "rr-request-row" }, [input, submit, surprise]));
    var results = el("div", { class: "rr-slips", "aria-live": "polite" });
    form.appendChild(results);
    stage.appendChild(form);

    var trolleySlot = el("div", { class: "rr-waiting" });
    stage.appendChild(trolleySlot);

    var scannedByRoot = {};
    function slipEl(c) {
      var sc = scannedByRoot[c.uri];
      var b = el("button", { type: "button", class: "rr-slipbtn" }, [
        el("span", { class: "rr-slipbtn-no", text: rrCallNumber(c.uri) }),
        el("span", { class: "rr-slipbtn-t", text: c.label }),
        el("span", { class: "rr-slipbtn-m", text: [c.dates, c.phys, sc ? fmtNum(sc) + " scanned" : "not scanned"].filter(Boolean).join(" · ") })
      ]);
      if (sc) b.classList.add("has-scans");
      b.addEventListener("click", function () { readingNavigate(c.uri); });
      return b;
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var term = input.value.trim();
      if (term.length < 2) return;
      clear(results);
      results.appendChild(el("div", { class: "rr-slips-note", text: "The archivist is looking…" }));
      rrSearchCollections(term).then(function (found) {
        if (gen !== rrGen) return;
        clear(results);
        if (!found.length) { results.appendChild(el("div", { class: "rr-slips-note", text: "No archive by that name. Try a person, organisation or call number." })); return; }
        // Scanned ones first: those are the ones you can actually read here.
        found.sort(function (a, b) { return (scannedByRoot[b.uri] || 0) - (scannedByRoot[a.uri] || 0); });
        found.forEach(function (c) { results.appendChild(slipEl(c)); });
      }).catch(function () {
        if (gen !== rrGen) return;
        clear(results);
        results.appendChild(el("div", { class: "rr-slips-note", text: "The request desk can’t be reached right now." }));
      });
    });

    rrFetchDigitizedRoots().then(function (roots) {
      if (gen !== rrGen || !roots.length) return;
      roots.forEach(function (r) { scannedByRoot[r.uri] = r.scanned; });
      surprise.addEventListener("click", function () {
        readingNavigate(roots[Math.floor(Math.random() * roots.length)].uri);
      });
      var pool = roots.slice();
      var picks = [];
      while (picks.length < RR_ON_TROLLEY && pool.length) picks.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
      trolleySlot.appendChild(el("h3", { class: "rr-subhead", text: "Waiting on the trolley" }));
      var boxes = picks.map(function (r, i) {
        var b = rrBoxEl({ uri: r.uri, label: r.label, scanned: r.scanned, kids: 1 }, i, { no: rrCallNumber(r.uri), meta: r.dates || "" });
        b.addEventListener("click", function () { readingNavigate(r.uri); });
        return b;
      });
      trolleySlot.appendChild(rrTrolleyEl(boxes));
    }).catch(function () { surprise.disabled = true; });

    input.focus({ preventScroll: true });
  }

  // ---------- Init ----------

  var initialHash = decodeURIComponent(location.hash.replace(/^#/, ""));
  if (initialHash && /^https?:\/\//i.test(initialHash)) {
    currentUri = initialHash;
    history.replaceState({ uri: initialHash }, "", "#" + encodeURIComponent(initialHash));
    loadEntity(initialHash);
  } else if (initialHash.indexOf("search:") === 0) {
    searchInput.value = initialHash.slice(7);
    runSearch(initialHash.slice(7), { fromHash: true });
  } else if (initialHash.indexOf("reading:") === 0) {
    history.replaceState({ reading: initialHash.slice(8) }, "", "#reading:" + encodeURIComponent(initialHash.slice(8)));
    renderReading(initialHash.slice(8));
  } else if (initialHash.indexOf("view:") === 0) {
    history.replaceState({ view: initialHash.slice(5) }, "", "#" + initialHash);
    renderView(initialHash.slice(5));
  } else {
    // Default landing, no hash at all: the landing page -- see
    // renderLanding().
    renderView("home");
  }
  // Not in the reading room: there the keys turn pages and put things
  // back (and the request desk focuses its own slip), while Esc in the
  // search box would leave for the home page.
  if (!/^(reading:|view:readingroom$)/.test(initialHash)) searchInput.focus({ preventScroll: true });
})();
</script>
</body>
</html>
