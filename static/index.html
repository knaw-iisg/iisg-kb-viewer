  .rr-box-label.small { width: auto; max-width: 70%; margin: 0; }
  .rr-box-label.small .rr-box-title { -webkit-line-clamp: 1; }

  /* folders standing in the box, looked down on: a tab and a top edge each */
  .rr-file {
    position: relative; display: block; width: 100%; text-align: left; cursor: pointer;
    margin-top: 19px; padding: 9px 76px 9px 14px; border: none; border-radius: 2px 2px 0 0;
    background: var(--rr-manila);
    box-shadow: 0 -1px 0 rgba(0, 0, 0, 0.12), 0 -5px 8px -4px rgba(0, 0, 0, 0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    animation: rr-rise 0.4s ease both; animation-delay: calc(0.25s + var(--i) * 22ms);
  }
  .rr-file:hover, .rr-file:focus-visible {
    transform: translateY(-9px); z-index: 2;
    box-shadow: 0 -1px 0 rgba(0, 0, 0, 0.12), 0 10px 14px -4px rgba(0, 0, 0, 0.45);
  }
  .rr-file:focus-visible { outline: 2px solid #f4f7f6; outline-offset: 1px; }
  .rr-tab {
    position: absolute; top: -15px; left: calc(14px + var(--tab) * 31%); height: 16px; min-width: 42px; padding: 0 9px;
    border-radius: 5px 5px 0 0; background: inherit; font-family: var(--font-mono); font-size: 11px; line-height: 17px;
    color: var(--rr-ink-soft); text-align: center;
    box-shadow: 0 -2px 3px -1px rgba(0, 0, 0, 0.18);
  }
  .rr-file-body { display: flex; flex-direction: column; min-width: 0; }
  .rr-file-title { font-size: 14px; line-height: 1.3; color: var(--rr-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rr-file:hover .rr-file-title, .rr-file:focus-visible .rr-file-title { white-space: normal; }
  .rr-file-meta { font-size: 11.5px; color: var(--rr-ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rr-file .rr-scan { right: 10px; top: 10px; }
  .rr-file .rr-tick { right: 52px; top: 4px; }
  .rr-file.kind-letter, .rr-file.kind-photo {
    background: var(--rr-paper); width: 96%; margin-left: 1.5%; border-radius: 0;
    transform: rotate(calc((var(--tab) - 1) * 0.35deg));
  }
  .rr-file.kind-letter .rr-tab, .rr-file.kind-photo .rr-tab { display: none; }
  .rr-file.kind-letter, .rr-file.kind-photo, .rr-file.kind-volume { margin-top: 7px; }
  .rr-file.kind-photo::after {
    content: ""; position: absolute; right: 44px; top: 7px; width: 22px; height: 16px;
    background: linear-gradient(#9aa7ad, #56656c); border: 2px solid #fff; box-shadow: 0 0 0 1px #ccc;
  }
  .rr-file.kind-volume { background: #4d3a33; border-radius: 3px; }
  .rr-file.kind-volume .rr-file-title { color: #e9d9a8; font-family: var(--font-display); }
  .rr-file.kind-volume .rr-file-meta { color: #c7b78f; }
  .rr-file.kind-volume .rr-tab { display: none; }
  .rr-file.kind-bundle { background: var(--rr-bundle); padding-top: 12px; padding-bottom: 12px; }
  .rr-file.kind-bundle .rr-tab { background: #a4b0ba; }
  .rr-file.kind-bundle .rr-file-title { font-weight: 600; }
  .rr-file.kind-bundle .rr-file-meta { color: #2f3a42; }
  .rr-file.kind-box { background: var(--rr-card); padding-top: 14px; padding-bottom: 14px; }
  .rr-file.kind-box .rr-tab { background: var(--rr-label); }
  .rr-string {
    /* the cotton tape a bundle is tied with */
    position: absolute; top: 0; bottom: 0; right: 30%; width: 5px;
    background: repeating-linear-gradient(180deg, #f2ecdc 0 4px, #d8cfb8 4px 6px);
    box-shadow: 0 0 2px rgba(0, 0, 0, 0.3);
  }
  .rr-file.rr-returned { animation: rr-putback 0.6s ease both; outline: 2px dashed rgba(255, 255, 255, 0.85); outline-offset: 2px; }

  /* ---- a folder open on the desk ---- */
  .scene-desk { perspective: 1800px; }
  .rr-openfolder {
    display: grid; grid-template-columns: minmax(200px, 0.8fr) minmax(0, 1.4fr);
    background: var(--rr-manila); border-radius: 4px; padding: 14px;
    box-shadow: 0 16px 26px var(--rr-shadow);
    transform-style: preserve-3d;
  }
  .rr-openfolder.kind-bundle, .rr-openfolder.kind-box { background: var(--rr-bundle); }
  .rr-leaf { min-width: 0; padding: 10px; }
  .rr-leaf-left {
    border-right: 2px solid var(--rr-manila-dark); box-shadow: inset -10px 0 12px -10px rgba(0, 0, 0, 0.35);
    transform-origin: 100% 50%; animation: rr-cover 0.7s cubic-bezier(.2, .7, .3, 1) both;
    display: flex; flex-direction: column; gap: 12px;
  }
  @keyframes rr-cover { from { transform: rotateY(-140deg); opacity: 0.4; } to { transform: none; opacity: 1; } }
  .rr-slip {
    background: var(--rr-paper); padding: 10px 12px; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
    transform: rotate(-0.8deg);
  }
  .rr-slip-head { display: flex; justify-content: space-between; gap: 8px; font-family: var(--font-mono); font-size: 11px; color: var(--rr-ink-soft); border-bottom: 1px solid var(--rr-paper-edge); padding-bottom: 4px; margin-bottom: 6px; }
  .rr-slip-title { font-family: var(--font-mono); font-size: 13.5px; line-height: 1.4; color: var(--rr-ink); overflow-wrap: anywhere; }
  .rr-slip-meta { margin-top: 6px; font-family: var(--font-mono); font-size: 11.5px; color: var(--rr-ink-soft); }
  .rr-slip-links { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; }
  .rr-slip-links a { color: #2d4f7c; }
  .rr-pages {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 6px;
    max-height: 260px; overflow-y: auto; scrollbar-width: thin;
  }
  .rr-pagethumb {
    position: relative; aspect-ratio: 3 / 4; padding: 0; border: none; cursor: pointer; overflow: hidden;
    background: var(--rr-paper); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
  }
  .rr-pagethumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .rr-pagethumb span { position: absolute; right: 2px; bottom: 1px; font-family: var(--font-mono); font-size: 9.5px; background: rgba(255, 255, 255, 0.85); padding: 0 3px; }
  .rr-pagethumb[aria-current="true"] { outline: 3px solid var(--rr-scan); outline-offset: 1px; }

  .rr-leaf-right { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .rr-sheetstack {
    --stack: 0;
    position: relative; width: 100%; display: flex; justify-content: center;
  }
  .rr-sheet {
    position: relative; background: var(--rr-paper); border: none; padding: 8px; cursor: zoom-in;
    box-shadow:
      calc(var(--stack) * 1px) calc(var(--stack) * 1px) 0 var(--rr-paper-edge),
      calc(var(--stack) * 2px) calc(var(--stack) * 2px) 0 var(--rr-paper),
      calc(var(--stack) * 2px) calc(var(--stack) * 2px) 0 1px var(--rr-paper-edge),
      0 10px 18px var(--rr-shadow);
    transform: rotate(0.5deg);
    animation: rr-rise 0.5s ease both;
  }
  .rr-page img { display: block; max-width: 100%; max-height: min(640px, 72vh); min-height: 200px; min-width: 150px; object-fit: contain; transition: filter 0.3s; }
  .rr-page.loading img { filter: blur(3px); }
  .rr-turning { position: absolute; top: 0; pointer-events: none; z-index: 3; }
  .rr-turning.out-left { animation: rr-out-left 0.45s ease-in both; }
  .rr-turning.out-right { animation: rr-out-right 0.45s ease-in both; }
  @keyframes rr-out-left { to { transform: translateX(-70%) rotate(-9deg); opacity: 0; } }
  @keyframes rr-out-right { to { transform: translateX(70%) rotate(9deg); opacity: 0; } }
  .rr-pager { display: flex; align-items: center; gap: 10px; }
  .rr-pageno { font-family: var(--font-hand); font-size: 20px; color: var(--rr-ink); min-width: 110px; text-align: center; }
  .rr-notscanned {
    cursor: default; max-width: 380px; margin: 30px auto; padding: 22px 24px; text-align: left; color: var(--rr-ink);
    background: repeating-linear-gradient(180deg, transparent 0 23px, rgba(70, 110, 160, 0.18) 23px 24px), var(--rr-paper);
  }
  .rr-notscanned strong { font-family: var(--font-display); font-size: 17px; }
  .rr-notscanned p { margin: 8px 0 12px; font-size: 14px; }
  .rr-notscanned a { color: #2d4f7c; font-size: 14px; }

  .rr-deskbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; margin-top: 20px; }
  .rr-deskbar-pos { flex-basis: 100%; text-align: center; color: #eef3f2; font-size: 12.5px; }

  /* ---- a recording: reel-to-reel tape recorder (rrRecorderEl) ---- */
  .rr-openfolder.is-audio { background: #2e383d; }
  .rr-openfolder.is-audio .rr-leaf-left { border-right-color: #1f272b; }
  .rr-openfolder.is-audio .rr-slip-links a { color: #bcd6ea; }
  .rr-recorder {
    --rr-vu-face: linear-gradient(#f5ecd0, #e6d7aa); --rr-vu-inner: rgba(120, 90, 20, 0.35);
    --rr-vu-glow: transparent; --rr-vu-glow-size: 0px;
    position: relative; width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .rr-recorder {
      --rr-vu-face: radial-gradient(ellipse at 50% 85%, #ffd27a, #f0a640 55%, #b8661c);
      --rr-vu-inner: rgba(90, 40, 0, 0.6); --rr-vu-glow: rgba(255, 166, 60, 0.55); --rr-vu-glow-size: 16px;
    }
  }
  :root[data-theme="dark"] .rr-recorder {
    --rr-vu-face: radial-gradient(ellipse at 50% 85%, #ffd27a, #f0a640 55%, #b8661c);
    --rr-vu-inner: rgba(90, 40, 0, 0.6); --rr-vu-glow: rgba(255, 166, 60, 0.55); --rr-vu-glow-size: 16px;
  }
  .rr-deck svg { display: block; width: 100%; height: auto; filter: drop-shadow(0 10px 14px var(--rr-shadow)); }
  .rr-deck-plate { fill: #c9cdd0; stroke: #8e9498; stroke-width: 1.5; }
  .rr-deck-inset { fill: #24282b; }
  .rr-tape-wound { fill: #4b3024; stroke: #2a1a12; stroke-width: 1; }
  .rr-reel-flange { fill: #d5dade; fill-opacity: 0.22; stroke: #e6e9eb; stroke-width: 2.5; }
  .rr-reel-cut { fill: #0c0e10; fill-opacity: 0.35; stroke: #e6e9eb; stroke-opacity: 0.6; stroke-width: 1; }
  .rr-reel-hub { fill: #dfe3e5; stroke: #80878c; stroke-width: 2; }
  .rr-reel-key { fill: #80878c; }
  .rr-tape-path { fill: none; stroke: #4b3024; stroke-width: 2.4; }
  .rr-roller { fill: #c3c8cb; stroke: #6c7378; stroke-width: 2; }
  .rr-head { fill: #a9afb3; stroke: #5f666b; stroke-width: 1.5; }
  .rr-head-gap { fill: #2a2d30; }
  .rr-deck-brand { fill: #8d9397; font-family: var(--font-mono); font-size: 10px; text-anchor: middle; letter-spacing: 0.1em; }

  .rr-deck-panel {
    display: grid; grid-template-columns: auto auto 1fr; grid-template-areas: "counter vu keys" "scrub scrub scrub";
    align-items: center; gap: 10px 14px;
    background: linear-gradient(#d4d8db, #b4b9bd); border-radius: 10px; padding: 12px 14px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6), 0 6px 12px var(--rr-shadow);
  }
  .rr-counter-wrap { grid-area: counter; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
  .rr-counter {
    font-family: var(--font-mono); font-size: 20px; letter-spacing: 0.08em; color: #f2f2f2;
    background: #1d2023; padding: 2px 8px; border-radius: 3px; box-shadow: inset 0 2px 3px #000;
    min-width: 92px; text-align: center;
  }
  .rr-counter-total { font-family: var(--font-mono); font-size: 11px; color: #3b4246; padding-left: 2px; }
  /* VU meter: a cream face by day; at night it's lit from behind, warm
     amber, the way a recorder's meter glows in a dark room */
  .rr-vu {
    grid-area: vu; width: 128px; overflow: hidden; border-radius: 5px;
    border: 3px solid #2a2d30; outline: 1px solid #8e9498;
    background: var(--rr-vu-face); box-shadow: inset 0 0 10px var(--rr-vu-inner), 0 0 var(--rr-vu-glow-size) var(--rr-vu-glow);
  }
  .rr-vu svg { display: block; width: 100%; height: auto; }
  .rr-vu-scale { fill: none; stroke: #1f1c18; stroke-width: 1.2; }
  .rr-vu-scale.thick { stroke-width: 2.6; }
  .rr-vu-red { fill: none; stroke: #c3271c; stroke-width: 2.6; }
  .rr-vu-tick { stroke: #1f1c18; stroke-width: 0.9; }
  .rr-vu-tick.red { stroke: #c3271c; }
  .rr-vu-num { font-family: var(--font-body); font-size: 6.5px; text-anchor: middle; fill: #1f1c18; }
  .rr-vu-num.red { fill: #c3271c; }
  .rr-vu-dot { fill: #c3271c; }
  .rr-vu-label { font-family: var(--font-body); font-weight: 600; font-size: 9px; letter-spacing: 0.08em; text-anchor: middle; fill: #1f1c18; }
  .rr-vu-needle { stroke: #1a1a1a; stroke-width: 0.9; stroke-linecap: round; }
  .rr-vu-housing { fill: #2f2b27; }
  .rr-keys { grid-area: keys; display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
  .rr-key {
    min-width: 46px; height: 38px; border: 1px solid #6e757a; border-radius: 4px 4px 6px 6px; cursor: pointer;
    background: linear-gradient(#f4f5f6, #d2d6d9); color: #2b3034 !important; font-size: 13px !important;
    box-shadow: 0 4px 0 #81888d, 0 5px 6px rgba(0, 0, 0, 0.3); transition: transform 0.06s, box-shadow 0.06s;
  }
  .rr-key:active:not(:disabled), .rr-recorder.is-playing .rr-key.play {
    transform: translateY(3px); box-shadow: 0 1px 0 #81888d, 0 2px 3px rgba(0, 0, 0, 0.3);
  }
  .rr-recorder.is-playing .rr-key.play { background: linear-gradient(#e2f0e2, #b9d6ba); }
  .rr-key:disabled { opacity: 0.45; cursor: default; }
  .rr-scrub { grid-area: scrub; width: 100%; accent-color: #4b3024; }

  .rr-restricted {
    position: absolute; left: 50%; top: 18%; transform: translateX(-50%) rotate(-2deg); width: min(80%, 340px);
    background: var(--rr-paper); color: var(--rr-ink); padding: 12px 16px; border: 2px solid var(--rr-scan);
    box-shadow: 0 8px 16px var(--rr-shadow); text-align: center;
  }
  .rr-restricted strong { font-family: var(--font-display); color: var(--rr-scan); font-size: 16px; letter-spacing: 0.02em; }
  .rr-restricted p { margin: 6px 0 8px; font-size: 13.5px; }
  .rr-restricted a { color: #2d4f7c; font-size: 13px; }
  .rr-recorder.is-locked .rr-deck { filter: grayscale(0.6) brightness(0.85); }

  .rr-tapeboxes { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .rr-tapebox {
    position: relative; width: 92px; height: 86px; border: none; cursor: pointer; padding: 0;
    background: linear-gradient(135deg, #e9eef2, #c9d3db); border-radius: 2px;
    border-top: 6px solid #2f5c8a; box-shadow: 0 4px 8px var(--rr-shadow);
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 2px;
    transition: transform 0.15s;
  }
  .rr-tapebox:hover { transform: translateY(-4px) rotate(-1deg); }
  .rr-tapebox[aria-current="true"] { outline: 3px solid #f4f7f6; outline-offset: 2px; transform: translateY(-4px); }
  .rr-tapebox-reel {
    position: absolute; top: 8px; left: 50%; width: 34px; height: 34px; margin-left: -17px; border-radius: 50%;
    background: radial-gradient(circle, #fff 0 4px, #8a929a 4px 6px, transparent 6px), radial-gradient(circle, #4b3024 0 15px, #2a1a12 15px 17px, transparent 17px);
    opacity: 0.85;
  }
  .rr-tapebox-label { display: flex; flex-direction: column; align-items: center; padding: 0 4px 6px; font-size: 11px !important; color: #23313d; line-height: 1.25; }
  .rr-tapebox-label strong { font-family: var(--font-mono); font-size: 12px; }
  .rr-tapebox-label em { font-style: normal; color: #fff; background: var(--rr-scan); border-radius: 6px; padding: 0 5px; font-size: 9.5px; }
  .rr-tapebox.locked { opacity: 0.8; }

  /* recordings in a box: a tape in its box, standing on edge */
  .rr-file.kind-audio { background: #dfe6ec; border-top: 4px solid #2f5c8a; margin-top: 10px; }
  .rr-file.kind-audio .rr-tab { display: none; }
  .rr-file.kind-audio::after {
    content: ""; position: absolute; right: 44px; top: 50%; width: 20px; height: 20px; margin-top: -10px; border-radius: 50%;
    background: radial-gradient(circle, #fff 0 2px, #4b3024 2px 8px, #2a1a12 8px 9px, transparent 9px);
  }
  @media (max-width: 520px) {
    .rr-deck-panel { grid-template-columns: auto 1fr; grid-template-areas: "counter vu" "keys keys" "scrub scrub"; }
    .rr-keys { justify-content: center; }
    .rr-vu { justify-self: end; }
  }

  /* ---- request desk ---- */
  .rr-request {
    max-width: 640px; background: #fff8e2; color: var(--rr-ink); padding: 16px 18px 18px; border-radius: 2px;
    box-shadow: 0 10px 18px var(--rr-shadow); transform: rotate(-0.4deg);
    border-left: 4px solid #d9b25c;
  }
  .rr-request-head { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px dashed #c9b07a; padding-bottom: 6px; margin-bottom: 10px; }
  .rr-request-head strong { font-family: var(--font-display); font-size: 17px; }
  .rr-request-head span { font-family: var(--font-mono); font-size: 12px; color: var(--rr-ink-soft); }
  .rr-request label { display: block; font-size: 12px; color: var(--rr-ink-soft); margin-bottom: 4px; }
  .rr-request-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .rr-request input {
    flex: 1 1 220px; min-width: 0; font-family: var(--font-hand); font-size: 22px; padding: 2px 6px; color: #23406a;
    background: transparent; border: none; border-bottom: 1.5px solid #8c7a54; outline: none;
  }
  .rr-request input:focus { border-bottom-color: #23406a; }
  .rr-slips { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; max-height: 360px; overflow-y: auto; }
  .rr-slips:empty { display: none; }
  .rr-slips-note { font-size: 13px; color: var(--rr-ink-soft); }
  .rr-slipbtn {
    display: grid; grid-template-columns: 92px 1fr; gap: 0 10px; text-align: left; cursor: pointer;
    background: #fff; border: 1px solid #e6dcc0; border-radius: 2px; padding: 6px 10px;
  }
  .rr-slipbtn:hover { border-color: #8c7a54; }
  .rr-slipbtn-no { grid-row: span 2; font-family: var(--font-mono); font-size: 12px; color: var(--rr-ink-soft); padding-top: 2px; }
  .rr-slipbtn-t { font-weight: 600; font-size: 14px; }
  .rr-slipbtn-m { font-size: 12px; color: var(--rr-ink-soft); }
  .rr-slipbtn.has-scans .rr-slipbtn-no::after { content: " ●"; color: var(--rr-scan); }

  .rr-open-btn {
    margin: 10px 0 2px; background: var(--accent-soft); color: var(--accent-strong); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer;
  }
  .rr-open-btn:hover { border-color: var(--accent); }

  /* A narrow room (by its own width, whatever the rail takes): the card
     and notepad go in a row above the scene, so the trolley and folder
     get the full desk. */
  .rr-room { container-type: inline-size; }
  @container (max-width: 900px) {
    .rr-desk { grid-template-columns: minmax(0, 1fr); padding: 18px 14px 26px; }
    .rr-props { order: -1; flex-direction: row; flex-wrap: wrap; align-items: flex-start; }
    .rr-tent { flex: 0 0 150px; }
    .rr-notepad { flex: 1 1 220px; }
  }
  @media (max-width: 900px) {
    .rr-openfolder { grid-template-columns: minmax(0, 1fr); padding: 8px; }
    .rr-leaf-left { border-right: none; border-bottom: 2px solid var(--rr-manila-dark); box-shadow: none; order: 2; animation: none; }
    .rr-pages { grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); max-height: 150px; }
    .rr-window { height: 96px; }
  }
  @media (max-width: 520px) {
    /* the notepad already shows the full path; the trail stays one line */
    .rr-crumbs { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
    .rr-crumb { flex: none; max-width: 180px; }
    .rr-record-link { flex: none; }
    .rr-trolley { padding: 0 38px 0 0; }
    .rr-trolley-handle { right: 0; width: 44px; height: 92px; }
    .rr-box-title { font-size: 12px; }
    .rr-shelf { padding: 12px 6px 0; gap: 18px 8px; }
    .rr-trolley-base { margin: 0 10px; }
    .rr-file { padding-right: 60px; }
    .rr-caption-main { font-size: 17px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .rr *, .rr *::before, .rr *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <span class="brand-mark" id="brand-home" title="Home">IISG Knowledge Base Explorer</span>
    </div>
    <div class="brand-sub">IISH knowledge graph</div>

    <div class="rail-section" id="rail-views">
      <div class="rail-heading"><span>Views</span></div>
      <ul class="rail-graphs">
        <li><button class="rail-graph-btn" data-view="home"><span>Home</span></button></li>
        <li><button class="rail-graph-btn" data-view="readingroom"><span>Reading room</span></button></li>
        <li><button class="rail-graph-btn" data-view="archive"><span>Archive</span></button></li>
        <li><button class="rail-graph-btn" data-view="books"><span>Books</span></button></li>
        <li><button class="rail-graph-btn" data-view="datasets"><span>Datasets</span></button></li>
        <li><button class="rail-graph-btn" data-view="person"><span>Persons</span></button></li>
        <li><button class="rail-graph-btn" data-view="events"><span>Events@IISG</span></button></li>
      </ul>

      <div class="rail-subdivider"></div>

      <div class="rail-heading"><span>Monitoring</span></div>
      <ul class="rail-graphs">
        <li><button class="rail-graph-btn" data-view="datascience"><span>Graph Runs</span></button></li>
        <li><button class="rail-graph-btn" data-view="growth"><span>Delta</span></button></li>
      </ul>
    </div>

    <div class="rail-section rail-trail" style="flex: 1;">
      <div class="rail-heading"><span>Trail</span></div>
      <ul class="trail-list" id="trail-list"></ul>
    </div>

    <div class="search-box">
      <label for="search-input">Search the graph</label>
      <div class="search-input-wrap">
        <input id="search-input" type="text" placeholder="A person, union, place, book…" autocomplete="off" spellcheck="false" />
        <div class="search-spinner" id="search-spinner"></div>
      </div>
    </div>

    <div class="rail-endpoint" id="rail-endpoint">
      Live SPARQL query against<br />
      <a id="rail-endpoint-link" href="#" target="_blank" rel="noopener"></a>
    </div>
  </aside>

  <main class="main" id="main"></main>
</div>

    { pred: "sdo:includedInDataCatalog", heading: "In catalog", kind: "link" },
    { pred: "sdo:isPartOf", heading: "Part of", kind: "link" },
    { pred: "sdo:inLanguage", heading: "Language", kind: "auto" }

  var FILE_FIELDS = [
    { pred: "sdo:encodingFormat", heading: "Format", kind: "literal" },
    { pred: "sdo:contentSize", heading: "Size", kind: "literal" },
    { pred: "iisgv:checksumAlgorithm", heading: "Checksum algorithm", kind: "literal" },
    { pred: "iisgv:checksumValue", heading: "Checksum", kind: "literal" },
    { pred: "sdo:isPartOf", heading: "Part of dataset", kind: "link" }
  ];

  var CATALOG_FIELDS = [
    { pred: "sdo:publisher", heading: "Publisher", kind: "auto" }
  ];

  var AUTHORITY_FIELDS = [
    { pred: "sdo:alternateName", heading: "Also known as", kind: "literal" },
    { pred: "owl:sameAs", heading: "Same as", kind: "extlink" },
    { pred: "sdo:email", heading: "Email", kind: "literal" },
    { pred: "sdo:telephone", heading: "Telephone", kind: "literal" },
    { pred: "sdo:worksFor", heading: "Works for", kind: "link" }

    // "Part of: X" pill in the header eyebrow instead (see renderRecord),
    // next to the type pills. One line of provenance doesn't need a full
    // hero-grid card of its own.
  ];

  // share the one rdf:type: authorities-etl's meeting-name subject headings
  // (MARC 111 -- alternateName/sameAs, no dates) and events-etl's actual
  // calendar events (startDate/location/image, no alternateName). One field
  // list covering both, same reconciliation as ARCHIVE_FIELDS above -- a
  // row with no data for a given entity is simply skipped.
  var EVENT_FIELDS = [
    { pred: "sdo:startDate", heading: "Start", kind: "literal" },
    { pred: "sdo:endDate", heading: "End", kind: "literal" },
    { pred: "sdo:location", heading: "Location", kind: "link" },
    { pred: "sdo:organizer", heading: "Organizer", kind: "link" },
    { pred: "sdo:inLanguage", heading: "Language", kind: "auto" },
    { pred: "sdo:url", heading: "Event page", kind: "extlink" },
    { pred: "sdo:dateModified", heading: "Last updated", kind: "literal" },
    { pred: "sdo:alternateName", heading: "Also known as", kind: "literal" },
    { pred: "owl:sameAs", heading: "Same as", kind: "extlink" }
  ];

  // orcid-etl: a colleague's publications, sourced live from ORCID.
  var RESEARCH_WORK_FIELDS = [
    { pred: "sdo:creator", heading: "Author", kind: "link" },
    { pred: "sdo:datePublished", heading: "Published", kind: "literal" },
    { pred: "sdo:isPartOf", heading: "In", kind: "link" }
  ];

  var GRANT_FIELDS = [
    { pred: "sdo:fundedItem", heading: "Awarded to", kind: "link" },
    { pred: "sdo:funder", heading: "Funder", kind: "link" },
    { pred: "sdo:identifier", heading: "Grant number", kind: "literal" }
  ];

  var ROLE_FIELDS = [
    { pred: "sdo:roleName", heading: "Role", kind: "literal" },
    { pred: "sdo:worksFor", heading: "Organization", kind: "link" },
    { pred: "sdo:startDate", heading: "Start date", kind: "literal" },
    { pred: "sdo:endDate", heading: "End date", kind: "literal" }
  ];

  var DESC_FIELDS = [
    { pred: "sdo:description", heading: "Description" },
    { pred: "sdo:abstract", heading: "Abstract" },
    { pred: "iisgv:biography", heading: "Biography / history" }
  ];

  var LINKOUT_FIELDS = ["iisgv:nativeViewer", "sdo:contentUrl"];

  // type curie (after PREFIXES normalization) -> view definition.
  // Checked in this order; the first matching type on the entity wins.
  var VIEW_DISPATCH = [
    { type: "sdo:Book", kind: "Book", fields: BOOK_FIELDS },
    { type: "sdo:ImageObject", kind: "Image", fields: BOOK_FIELDS },
    { type: "sdo:AudioObject", kind: "Audio", fields: BOOK_FIELDS },
    { type: "sdo:VideoObject", kind: "Video", fields: BOOK_FIELDS },
    { type: "sdo:MusicRecording", kind: "Music recording", fields: BOOK_FIELDS },
    { type: "sdo:Article", kind: "Article", fields: BOOK_FIELDS },
    { type: "dcmitype:PhysicalObject", kind: "Physical object", fields: BOOK_FIELDS },
    { type: "sdo:ArchiveComponent", kind: "Archive", fields: ARCHIVE_FIELDS },
    { type: "rico:RecordSet", kind: "Archive", fields: ARCHIVE_FIELDS },
    { type: "sdo:DataDownload", kind: "File", fields: FILE_FIELDS, linkOutPrimary: true },
    { type: "sdo:DataCatalog", kind: "Catalog", fields: CATALOG_FIELDS },
    { type: "sdo:Dataset", kind: "Dataset", fields: DATASET_FIELDS },
    { type: "sdo:Person", kind: "Person", fields: AUTHORITY_FIELDS },
    { type: "sdo:Organization", kind: "Organization", fields: AUTHORITY_FIELDS },
    { type: "sdo:Place", kind: "Place", fields: AUTHORITY_FIELDS },
    { type: "sdo:Event", kind: "Event", fields: EVENT_FIELDS },
    { type: "sdo:DefinedTerm", kind: "Term", fields: AUTHORITY_FIELDS },
    { type: "sdo:CreativeWorkSeries", kind: "Series", fields: AUTHORITY_FIELDS },
    { type: "sdo:Periodical", kind: "Periodical", fields: AUTHORITY_FIELDS },
    { type: "sdo:ContactPoint", kind: "Contact", fields: AUTHORITY_FIELDS },
    { type: "sdo:ScholarlyArticle", kind: "Article", fields: RESEARCH_WORK_FIELDS },
    { type: "sdo:Chapter", kind: "Chapter", fields: RESEARCH_WORK_FIELDS },
    { type: "sdo:Report", kind: "Report", fields: RESEARCH_WORK_FIELDS },
    { type: "sdo:Thesis", kind: "Thesis", fields: RESEARCH_WORK_FIELDS },
    { type: "sdo:PresentationDigitalDocument", kind: "Presentation", fields: RESEARCH_WORK_FIELDS },
    { type: "sdo:CreativeWork", kind: "Work", fields: RESEARCH_WORK_FIELDS },
    { type: "sdo:MonetaryGrant", kind: "Grant", fields: GRANT_FIELDS },
    { type: "sdo:OrganizationRole", kind: "Role", fields: ROLE_FIELDS }
  ];

  var TYPE_TO_VIEW = {};
  VIEW_DISPATCH.forEach(function (v) { TYPE_TO_VIEW[v.type] = v; });

  // ---------- SPARQL plumbing ----------

  function sparql(query) {
    return fetch(ENDPOINT, {
      method: "POST",
      headers: {
        "Content-Type": "application/x-www-form-urlencoded",
        "Accept": "application/sparql-results+json"
      },
      body: "query=" + encodeURIComponent(query)
    }).then(function (res) {
      if (!res.ok) return res.text().then(function (t) { throw new Error("Query failed (HTTP " + res.status + "): " + t.slice(0, 200)); });
      return res.json();
    }).then(function (json) {
      return json.results.bindings;
    });
  }

  function escLiteral(s) {
    return String(s).replace(/\\/g, "\\\\").replace(/"/g, '\\"').replace(/[\r\n]/g, " ");
  }

  function iriRef(uri) {
    return "<" + String(uri).replace(/[<>\s"]/g, "") + ">";
  }

  // ---------- Display helpers ----------

  function curie(uri) {
    var bestPrefix = null, bestLen = 0;
    for (var iri in PREFIXES) {
      if (uri.indexOf(iri) === 0 && iri.length > bestLen) { bestPrefix = PREFIXES[iri]; bestLen = iri.length; }
    }
    if (bestPrefix) return bestPrefix + ":" + uri.slice(bestLen);
    return null;
  }

  function shortLabel(uri) {
    var c = curie(uri);
    if (c) return c;
    var m = uri.match(/([^/#]+)\/?$/);
    return m ? decodeURIComponent(m[1]) : uri;
  }

  function isLocalUri(uri) {
    try {
      var host = new URL(uri).host;
      return LOCAL_HOSTS.some(function (h) { return host === h || host.endsWith("." + h); });
    } catch (e) { return true; }
  }

  function isSafeHref(uri) {
    return /^https?:\/\//i.test(uri);
  }

  var XSD_ANYURI = "http://www.w3.org/2001/XMLSchema#anyURI";

  // Several MARC-derived predicates (nativeViewer above all -- 1.3M+ of its
  // 1.33M values) are asserted as xsd:anyURI-typed *literals* rather than
  // real RDF URI nodes, so a plain `o.type === "uri"` check misses almost
  // all of them. Treat any literal that's URI-typed or simply looks like an
  // absolute http(s) URL as a link too, just not a graph node to navigate()
  // into -- there's nothing in this store to browse at that address.
  function literalUrl(o) {
    if (o.type !== "literal") return null;
    if (o.datatype === XSD_ANYURI || isSafeHref(o.value)) return o.value;
    return null;
  }

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === "class") node.className = attrs[k];
      else if (k === "text") node.textContent = attrs[k];
      else node.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(function (c) { if (c) node.appendChild(c); });
    return node;
  }

  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

  // Loads a URL into a detached Image() and only calls onReady if it
  // actually resolves as an image -- used for the person-portrait badges
  // below so a 404/miss never paints a pending or broken-image placeholder
  // into the layout. onReady building the visible <img> from the same URL
  // is effectively instant: the browser already has it cached from this
  // probe request.
  function probeImage(src, onReady) {
    var img = new Image();
    img.onload = onReady;
    img.src = src;
  }

  // Wraps a person-portrait <a> (image + corner badges) with a visible,
  // separately clickable caption underneath it -- the corner badges alone
  // only explain themselves on hover, which isn't obvious as "this photo
  // is a link out to another knowledge graph" at a glance. Both the image
  // and the caption point at the same external record.
  function portraitCardEl(portraitLink, href, sourceName) {
    var card = el("div", { class: "portrait-card" });
    card.appendChild(portraitLink);
    card.appendChild(el("a", {
      class: "portrait-caption",
      href: href,
      target: "_blank",
      rel: "noopener",
      text: sourceName + " ↗"
    }));
    return card;
  }

  // Small inline-SVG badges for the person portrait (see renderRecord) --
  // drawn locally rather than hotlinked image files, consistent with this
  // viewer's no-third-party-hotlinking policy. Not pixel reproductions of
  // the official marks, just recognizable stand-ins: the LOD cloud's
  // three-node glyph for "this is linked RDF data", and a plain "Wd"
  // wordmark in Wikidata's blue for "sourced from Wikidata".
  function rdfIconEl() {
    var span = el("span", {});
    span.innerHTML = '<svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true">' +
      '<circle cx="5" cy="19" r="3" fill="#fff"/>' +
      '<circle cx="19" cy="19" r="3" fill="#fff"/>' +
      '<circle cx="12" cy="5" r="3" fill="#fff"/>' +
      '<path d="M7 17.5 10.5 7.5M17 17.5 13.5 7.5M8 19H16" stroke="#fff" stroke-width="1.6" fill="none"/>' +
      '</svg>';
    return span.firstChild;
  }

  // Wikidata's own mark is three ascending bars (a little bar chart --
  // "data") rather than a letterform; the user asked for that shape with a
  // "W" layered on top rather than the plain wordmark badge this used to be.
  function wikidataIconEl() {
    var span = el("span", {});
    span.innerHTML = '<svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">' +
      '<rect x="2" y="13" width="5" height="9" rx="1" fill="#8dc4e0"/>' +
      '<rect x="9.5" y="8" width="5" height="14" rx="1" fill="#4a8fc2"/>' +
      '<rect x="17" y="2" width="5" height="20" rx="1" fill="#1a5c96"/>' +
      '<text x="12" y="17" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="13" fill="#fff" stroke="#14477a" stroke-width="0.6" paint-order="stroke">W</text>' +
      '</svg>';
    return span.firstChild;
  }

  // RKDartists badge -- see renderRecord's second portrait, sourced via
  // Wikidata's P650 claim (iisgBrowser.py's /api/rkd-artist). RKD's own
  // mark is a wordmark, not a simple glyph; a plain monogram chip is a
  // closer fit for a 20px badge than attempting to shrink that wordmark.
  function rkdIconEl() {
    var span = el("span", {});
    span.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="12" aria-hidden="true">' +
      '<text x="12" y="9" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="8" fill="#fff">RKD</text>' +
      '</svg>';
    return span.firstChild;
  }

  function graphInfo(iri) {
    for (var i = 0; i < GRAPHS.length; i++) if (GRAPHS[i].iri === iri) return GRAPHS[i];
    return { iri: iri, label: shortLabel(iri), sub: "", color: "#758790" };
  }

  function fmtNum(n) { return Number(n).toLocaleString("en-US"); }

  // The "statements" section's incoming column streams in via several
  // parallel, paginated loadGroupPage() calls -- for a heavily-referenced
  // entity (thousands of incoming statements across many predicates) that
  // can keep growing the page for a couple of seconds after it's expanded.
  // A plain scrollIntoView() called once at click time lands wherever the
  // section was at that instant, then gets left behind as more rows stream
  // in above the fold -- confirmed on a real record where the document
  // grew from ~3000px to ~8000px over 2.5s after expanding. This waits for
  // the page to stop growing (two unchanged height checks in a row) before
  // scrolling, instead of guessing a fixed delay.
  function scrollToWhenStable(target, maxWaitMs) {
    var lastHeight = -1, stableCount = 0, start = Date.now();
    function check() {
      var h = document.documentElement.scrollHeight;
      stableCount = h === lastHeight ? stableCount + 1 : 0;
      lastHeight = h;
      if (stableCount >= 2 || Date.now() - start > maxWaitMs) {
        // window.scrollTo with a manually computed target and NO smooth
        // behavior -- confirmed both scrollIntoView (any block value) and
        // scrollTo's smooth-behavior form silently do nothing in some
        // automated/CDP-driven browser contexts; only the plain instant
        // jump reliably moves the scroll position. An instant jump also
        // just guarantees the user actually lands in the right place,
        // which is the actual bug here, not the lack of animation.
        window.scrollTo(0, target.getBoundingClientRect().top + window.scrollY);
      } else {
        setTimeout(check, 150);
      }
    }
    check();
  }

  // The actual cause of hierarchy-tree navigation "feeling like a page
  // reload": clear(mainEl) (inside renderRecord) makes the document
  // briefly shorter than wherever you'd scrolled to -- scrolled deep into
  // a long sibling list, say -- so the browser immediately clamps scrollY
  // toward 0, same as it would if you'd manually scrolled past the end of
  // a page that just got shorter. The new (taller) content streaming back
  // in afterward doesn't undo that clamp; nothing tells it to. This is the
  // same "wait for the height to stop changing" polling scrollToWhenStable
  // already uses above, just restoring a saved position instead of
  // scrolling to a target element.
  function restoreScrollWhenStable(y, maxWaitMs) {
    var lastHeight = -1, stableCount = 0, start = Date.now();
    function check() {
      var h = document.documentElement.scrollHeight;
      stableCount = h === lastHeight ? stableCount + 1 : 0;
      lastHeight = h;
      if (stableCount >= 2 || Date.now() - start > maxWaitMs) {
        window.scrollTo(0, y);
      } else {
        setTimeout(check, 100);
      }
    }
    check();
  }

  // ---------- App state ----------

  var trail = [];
  var currentUri = null;

  // null | "person" | "archive" | "books" -- which "explore" domain the
  // player panel (see playerPanelEl) is currently shuffling/stepping
  // through. Set by the three explore-landing nav buttons (or by clicking
  // Random within the panel itself) and cleared by navigateToView()
  // whenever you head to a non-explore named view.
  var exploreMode = null;

  var mainEl = document.getElementById("main");
  var trailListEl = document.getElementById("trail-list");
  var searchInput = document.getElementById("search-input");
  var searchSpinner = document.getElementById("search-spinner");

  document.getElementById("rail-endpoint-link").textContent = ENDPOINT;
  document.getElementById("rail-endpoint-link").href = ENDPOINT.replace(/^http/, "http") + "/";
  document.getElementById("brand-home").addEventListener("click", function () { navigateHome(); });

  function pushTrail(uri, label) {
    trail = trail.filter(function (t) { return t.uri !== uri; });
    trail.unshift({ uri: uri, label: label });
    if (trail.length > 25) trail.length = 25;
    renderTrail();
  }

  function renderTrail() {
    clear(trailListEl);
    if (!trail.length) {
      trailListEl.appendChild(el("li", { class: "rail-empty", text: "Nothing viewed yet." }));
      return;
    }
    trail.forEach(function (t) {
      var li = document.createElement("li");
      var btn = el("button", {
        class: "trail-item" + (t.uri === currentUri ? " current" : ""),
        text: t.label || shortLabel(t.uri),
        title: t.uri
      });
      btn.addEventListener("click", function () { navigate(t.uri); });
      li.appendChild(btn);
      trailListEl.appendChild(li);
    });
  }

  // opts.preserveScroll: for navigation that's conceptually "stay in this
  // same list/flow, just move to the next item in it" (a hierarchy-tree
  // sibling/ancestor click, Archive's Next walking the finding aid) --
  // not for a deliberate jump to something new and different (Random,
  // search results, an ordinary link), where landing at the top is the
  // expected, correct behavior. Both ends are driven explicitly (not left
  // to however the browser happens to handle the DOM swap) by the same
  // restoreScrollWhenStable settle-then-scroll call below, just aimed at
  // the saved position or at 0.
  function navigate(uri, opts) {
    opts = opts || {};
    if (!/^https?:\/\//i.test(uri)) { renderError("Not a browsable URI: " + uri); return; }
    var targetScrollY = opts.preserveScroll ? window.scrollY : 0;
    currentUri = uri;
    history.pushState({ uri: uri }, "", "#" + encodeURIComponent(uri));
    var result = loadEntity(uri);
    restoreScrollWhenStable(targetScrollY, 1500);
    return result;
  }

  // Named landing pages (sidebar "Views") vs. the entity-URI hash format --
  // kept as a distinct "view:xxx" prefix so syncFromHash can tell them
  // apart from a real record URI without ambiguity.
  var EXPLORE_VIEW_NAMES = { person: true, archive: true, books: true };

  function navigateToView(viewName) {
    currentUri = null;
    searchInput.value = "";
    // Heading to a non-explore named view (Events, Graph Runs, Delta) ends
    // the current explore session; heading to person/archive/books starts
    // (or restarts) one -- renderExploreLanding sets exploreMode itself,
    // via renderPersonLanding/renderArchiveLanding/renderBooksLanding.
    if (!EXPLORE_VIEW_NAMES[viewName]) exploreMode = null;
    history.pushState({ view: viewName }, "", "#view:" + viewName);
    renderTrail();
    renderView(viewName);
  }

  // Bumped on every navigation (named view or entity URI); async callbacks
  // from the Person landing's random pick capture this at start and bail
  // if it's moved on by the time they resolve, instead of clobbering
  // whatever the user navigated to in the meantime.
  var viewGeneration = 0;

  function renderView(viewName) {
    viewGeneration++;
    clear(mainEl);
    if (viewName === "archive") renderArchiveLanding();
    else if (viewName === "books") renderBooksLanding();
    else if (viewName === "events") renderEventsLanding();
    else if (viewName === "datasets") renderDatasetsView();
    else if (viewName === "datascience") renderDataScience();
    else if (viewName === "growth") renderGrowth();
    else if (viewName === "person") renderPersonLanding();
    else if (viewName === "readingroom") renderReadingDesk();
    else renderLanding(); // "home", and the fallback default
  }

  // ---------- Person / Archive / Books: randomly-centered explore landings ----------
  // The default experience for all three (see init, below, and
  // navigateHome()) -- each picks a real starting point by a mode-specific
  // SPARQL sampling query, jumps straight to loadEntity()/renderRecord()
  // for it (no separate flat "browse by type" list to click through
  // first), and sets exploreMode so renderRecord's player panel (see
  // playerPanelEl, below renderRecord) knows what Random/Next should do
  // from here on -- not just on this first landing, but on every record
  // you reach afterward via the panel or by clicking through the page,
  // until you navigate to a different named view.

  var aboutPersonTripleCount = null;

  function fetchAboutPersonTripleCount() {
    if (aboutPersonTripleCount !== null) return Promise.resolve(aboutPersonTripleCount);
    var q = "SELECT (COUNT(*) AS ?n) WHERE {\n" +
      "  { ?w <http://schema.org/about> ?p } UNION { ?w <https://schema.org/about> ?p }\n" +
      "  ?p a <https://schema.org/Person> .\n" +
      "}";
    return sparql(q).then(function (rows) {
      aboutPersonTripleCount = rows.length ? parseInt(rows[0].n.value, 10) : 50000;
      return aboutPersonTripleCount;
    }).catch(function () { return 50000; });
  }

  function fetchRandomPersonCandidate() {
    return fetchAboutPersonTripleCount().then(function (total) {
      var offset = Math.floor(Math.random() * Math.max(total - 1, 1));
      // No GROUP BY, deliberately: this samples raw (work, person) rows,
      // not distinct persons, so someone asserted as sdo:about on many
      // works is proportionally more likely to come up -- a cheap stand-in
      // for "pick someone well-connected" without a separate degree
      // computation. Each row already resolves to at most one ?lbl via
      // COALESCE, so no aggregate is needed to make this valid SPARQL.
      var q = "SELECT ?p ?lbl WHERE {\n" +
        "  { ?w <http://schema.org/about> ?p } UNION { ?w <https://schema.org/about> ?p }\n" +
        "  ?p a <https://schema.org/Person> .\n" +
        "  OPTIONAL { ?p <http://schema.org/name> ?n1 }\n" +
        "  OPTIONAL { ?p <https://schema.org/name> ?n2 }\n" +
        "  BIND(COALESCE(?n1, ?n2) AS ?lbl)\n" +
        "} LIMIT 1 OFFSET " + offset;
      return sparql(q);
    }).then(function (rows) {
      if (!rows.length) return null;
      return { uri: rows[0].p.value, label: rows[0].lbl ? rows[0].lbl.value : shortLabel(rows[0].p.value) };
    }).catch(function () { return null; });
  }

  // Scoped to the findingaid-etl graph specifically (not archive-etl's own
  // flat, single-level MARC records) and required to have a parent --
  // findingaid-etl's full EAD hierarchy is the richer, more explorable of
  // the two pipelines asserting sdo:ArchiveComponent (siblings, children,
  // a real breadcrumb; archive-etl's records have none of that), and
  // requiring a parent keeps the landing off of bare top-level/orphan
  // nodes with nothing around them yet to explore.
  var archiveWithParentCount = null;

  function fetchArchiveWithParentCount() {
    if (archiveWithParentCount !== null) return Promise.resolve(archiveWithParentCount);
    var q = "SELECT (COUNT(*) AS ?n) WHERE {\n" +
      "  GRAPH <https://iisg.amsterdam/graph/findingaid> {\n" +
      "    ?c a <https://schema.org/ArchiveComponent> .\n" +
      "    { ?c <http://schema.org/isPartOf> ?p } UNION { ?c <https://schema.org/isPartOf> ?p }\n" +
      "  }\n" +
      "}";
    return sparql(q).then(function (rows) {
      archiveWithParentCount = rows.length ? parseInt(rows[0].n.value, 10) : 10000;
      return archiveWithParentCount;
    }).catch(function () { return 10000; });
  }

  function fetchRandomArchiveCandidate() {
    return fetchArchiveWithParentCount().then(function (total) {
      var offset = Math.floor(Math.random() * Math.max(total - 1, 1));
      var q = "SELECT ?c ?lbl WHERE {\n" +
        "  GRAPH <https://iisg.amsterdam/graph/findingaid> {\n" +
        "    ?c a <https://schema.org/ArchiveComponent> .\n" +
        "    { ?c <http://schema.org/isPartOf> ?p } UNION { ?c <https://schema.org/isPartOf> ?p }\n" +
        "    OPTIONAL { ?c <http://schema.org/name> ?n1 }\n" +
        "    OPTIONAL { ?c <https://schema.org/name> ?n2 }\n" +
        "    BIND(COALESCE(?n1, ?n2) AS ?lbl)\n" +
        "  }\n" +
        "} LIMIT 1 OFFSET " + offset;
      return sparql(q);
    }).then(function (rows) {
      if (!rows.length) return null;
      return { uri: rows[0].c.value, label: rows[0].lbl ? rows[0].lbl.value : shortLabel(rows[0].c.value) };
    }).catch(function () { return null; });
  }

  // Requires both a name and a creator so the landing never lands on a
  // bare catalog stub -- not weighted toward "well-connected" like Person,
  // since a book's connections (creator, subject) are already front and
  // center on its own record page.
  var bookWithCreatorCount = null;

  function fetchBookWithCreatorCount() {
    if (bookWithCreatorCount !== null) return Promise.resolve(bookWithCreatorCount);
    var q = "SELECT (COUNT(*) AS ?n) WHERE {\n" +
      "  ?b a <https://schema.org/Book> .\n" +
      "  OPTIONAL { ?b <http://schema.org/name> ?n1 }\n" +
      "  OPTIONAL { ?b <https://schema.org/name> ?n2 }\n" +
      "  BIND(COALESCE(?n1, ?n2) AS ?lbl)\n" +
      "  FILTER(BOUND(?lbl))\n" +
      "  { ?b <http://schema.org/creator> ?c1 } UNION { ?b <https://schema.org/creator> ?c2 }\n" +
      "}";
    return sparql(q).then(function (rows) {
      bookWithCreatorCount = rows.length ? parseInt(rows[0].n.value, 10) : 100000;
      return bookWithCreatorCount;
    }).catch(function () { return 100000; });
  }

  function fetchRandomBookCandidate() {
    return fetchBookWithCreatorCount().then(function (total) {
      var offset = Math.floor(Math.random() * Math.max(total - 1, 1));
      var q = "SELECT ?b ?lbl WHERE {\n" +
        "  ?b a <https://schema.org/Book> .\n" +
        "  OPTIONAL { ?b <http://schema.org/name> ?n1 }\n" +
        "  OPTIONAL { ?b <https://schema.org/name> ?n2 }\n" +
        "  BIND(COALESCE(?n1, ?n2) AS ?lbl)\n" +
        "  FILTER(BOUND(?lbl))\n" +
        "  { ?b <http://schema.org/creator> ?c1 } UNION { ?b <https://schema.org/creator> ?c2 }\n" +
        "} LIMIT 1 OFFSET " + offset;
      return sparql(q);
    }).then(function (rows) {
      if (!rows.length) return null;
      return { uri: rows[0].b.value, label: rows[0].lbl ? rows[0].lbl.value : shortLabel(rows[0].b.value) };
    }).catch(function () { return null; });
  }

  function renderExploreLanding(mode, candidateFetcher) {
    var gen = viewGeneration;
    clear(mainEl);
    exploreMode = mode;
    mainEl.appendChild(el("div", { class: "results-heading", text: "Finding something to explore…" }));
    candidateFetcher().then(function (candidate) {
      if (gen !== viewGeneration) return;
      if (!candidate) {
        clear(mainEl);
        renderError("Couldn’t find a starting point.", function () { renderExploreLanding(mode, candidateFetcher); });
        return;
      }
      currentUri = candidate.uri;
      history.replaceState({ uri: candidate.uri }, "", "#" + encodeURIComponent(candidate.uri));
      loadEntity(candidate.uri);
    });
  }

  function renderPersonLanding() { renderExploreLanding("person", fetchRandomPersonCandidate); }
  function renderArchiveLanding() { renderExploreLanding("archive", fetchRandomArchiveCandidate); }
  function renderBooksLanding() { renderExploreLanding("books", fetchRandomBookCandidate); }

  // ---------- Events view: image-forward showcase, not a plain list ----------
  // sdo:Event is also asserted by authorities-etl's meeting-name headings
  // (see EVENT_FIELDS above) -- scoped to events-etl's own named graph so
  // this only ever shows real calendar events (the ones with a startDate
  // and usually a poster image), not those unrelated subject headings.
  // Only ~170 of them, so one query fetches everything; no COUNT+LIMIT/
  // OFFSET paging like browseType's huge single-type lists need.
  function fmtEventDate(iso) {
    if (!iso) return null;
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
  }

  function renderEventsLanding() {
    currentUri = null;
    renderTrail();
    clear(mainEl);
    mainEl.appendChild(el("div", { class: "results-heading", text: "Loading events…" }));
    var q = "PREFIX schema: <https://schema.org/>\n" +
      "SELECT ?e (SAMPLE(?nm) AS ?name) (SAMPLE(?start) AS ?startDate) (SAMPLE(?url) AS ?imgUrl) WHERE {\n" +
      "  GRAPH <https://iisg.amsterdam/graph/events> { ?e a schema:Event }\n" +
      "  OPTIONAL { ?e schema:name ?nm }\n" +
      "  OPTIONAL { ?e schema:startDate ?start }\n" +
      "  OPTIONAL { ?e schema:image ?img . ?img schema:contentUrl ?url }\n" +
      "} GROUP BY ?e ORDER BY DESC(?startDate)";
    sparql(q).then(function (rows) {
      var items = rows.map(function (r) {
        return {
          uri: r.e.value,
          label: r.name ? r.name.value : shortLabel(r.e.value),
          startDate: r.startDate ? r.startDate.value : null,
          imgUrl: r.imgUrl && isLocalUri(r.imgUrl.value) ? r.imgUrl.value : null
        };
      });
      renderEventsGrid(items);
    }).catch(function (err) {
      clear(mainEl);
      renderError("Couldn’t load events: " + err.message, renderEventsLanding);
    });
  }

  function renderEventsGrid(items) {
    clear(mainEl);
    if (!items.length) {
      mainEl.appendChild(el("div", { class: "results-heading", text: "Events — no results" }));
      return;
    }
    mainEl.appendChild(el("div", { class: "results-heading", text: "Events — " + fmtNum(items.length) + " total" }));
    var grid = el("div", { class: "event-grid" });
    mainEl.appendChild(grid);
    var shown = 0;

    function renderPage() {
      items.slice(shown, shown + PAGE_SIZE).forEach(function (it) {
        var card = el("button", { class: "event-card" });
        if (it.imgUrl) {
          var img = el("img", { class: "event-card-img", src: it.imgUrl, alt: it.label, loading: "lazy" });
          img.onerror = function () { img.remove(); };
          card.appendChild(img);
        }
        var body = el("div", { class: "event-card-body" });
        body.appendChild(el("div", { class: "event-card-title", text: it.label }));
        var dateText = fmtEventDate(it.startDate);
        if (dateText) body.appendChild(el("div", { class: "event-card-date", text: dateText }));
        card.appendChild(body);
        card.addEventListener("click", function () { navigate(it.uri, { label: it.label }); });
        grid.appendChild(card);
      });
      shown += PAGE_SIZE;
      var oldPager = mainEl.querySelector(".pager-row");
      if (oldPager) oldPager.parentNode.removeChild(oldPager);
      if (shown < items.length) {
        var pager = el("div", { class: "pager-row" });
        var btn = el("button", { class: "pager-btn", text: "Show " + Math.min(PAGE_SIZE, items.length - shown) + " more" });
        btn.addEventListener("click", renderPage);
        pager.appendChild(btn);
        mainEl.appendChild(pager);
      }
    }
    renderPage();
  }

  // ---------- Datasets view (view:datasets) ----------
  // dataverse-etl's ~400 research datasets on one page, laid out along
  // DCAT-AP-NL 3.0 (Geonovum, 2025): its 8 mandatory Dataset properties
  // up front on every card, plus a panel counting how many datasets the
  // graph actually describes each one for. dataverse-etl writes schema.org,
  // so each DCAT property is matched to its schema.org counterpart below;
  // where there is none (theme), the gap is shown, never filled in.
  var DATAVERSE_GRAPH = "https://iisg.amsterdam/graph/dataverse";
  var DCAT_SPEC_URL = "https://docs.geostandaarden.nl/dcat/dcat-ap-nl30/";

  // key: the field on a fetchDatasets() item; pred/kind: how the dataset
  // record page renders it (see renderDcatDatasetFacts).
  var DCAT_DATASET_MANDATORY = [
    { label: "Title", dcat: "dct:title", sdo: "sdo:name", key: "name", shownElsewhere: true },
    { label: "Description", dcat: "dct:description", sdo: "sdo:description", key: "description", shownElsewhere: true },
    { label: "Identifier", dcat: "dct:identifier", sdo: "sdo:identifier", key: "identifier", pred: "sdo:identifier", kind: "auto", display: doiLabel },
    { label: "Publisher", dcat: "dct:publisher", sdo: "sdo:publisher", key: "publisher", pred: "sdo:publisher", kind: "link" },
    { label: "Contact point", dcat: "dcat:contactPoint", sdo: "sdo:contactPoint", key: "contact", pred: "sdo:contactPoint", kind: "link" },
    { label: "Creator", dcat: "dct:creator", sdo: "sdo:creator", key: "creators", pred: "sdo:creator", kind: "link" },
    { label: "Theme", dcat: "dcat:theme", sdo: null, key: null, pred: null,
      note: "No counterpart in the data. DCAT-AP-NL wants a term from the EU data-theme vocabulary; Dataverse’s subjects (“Social Sciences”, …) are the nearest thing." },
    { label: "Access rights", dcat: "dct:accessRights", sdo: "sdo:isAccessibleForFree", key: "free", pred: "sdo:isAccessibleForFree", kind: "literal", partial: true,
      note: "Only as schema:isAccessibleForFree, and only where it is false." }
  ];

  var DCAT_DATASET_RECOMMENDED = [
    { label: "Keyword", dcat: "dcat:keyword", sdo: "sdo:keywords", key: "keywords", pred: "sdo:keywords", kind: "literal" },
    { label: "Landing page", dcat: "dcat:landingPage", sdo: "iisgv:nativeViewer", key: "landing", pred: "iisgv:nativeViewer", kind: "auto", display: doiLabel },
    { label: "Geographical coverage", dcat: "dct:spatial", sdo: "sdo:spatialCoverage", key: "places", pred: "sdo:spatialCoverage", kind: "link" },
    { label: "Temporal coverage", dcat: "dct:temporal", sdo: "sdo:temporalCoverage", key: "temporal", pred: "sdo:temporalCoverage", kind: "literal" },
    { label: "Language", dcat: "dct:language", sdo: "sdo:inLanguage", key: "languages", pred: "sdo:inLanguage", kind: "auto" },
    { label: "Licence", dcat: "dct:license", sdo: "sdo:license", key: "license", pred: "sdo:license", kind: "auto", display: licenceLabel,
      note: "DCAT-AP-NL puts the licence on each distribution (mandatory there); Dataverse gives one per dataset." }
  ];

  // Dataverse's fixed subject list -- mixed into sdo:keywords by
  // dataverse-etl, pulled back out here as the closest thing to a theme.
  var DATAVERSE_SUBJECTS = [
    "Agricultural Sciences", "Arts and Humanities", "Astronomy and Astrophysics",
    "Business and Management", "Chemistry", "Computer and Information Science",
    "Earth and Environmental Sciences", "Engineering", "Law", "Mathematical Sciences",
    "Medicine, Health and Life Sciences", "Physics", "Social Sciences", "Other"
  ];

  var LICENCE_LABELS = {
    "https://creativecommons.org/publicdomain/zero/1.0/": "CC0 1.0",
    "https://creativecommons.org/licenses/by/4.0/": "CC BY 4.0",
    "https://creativecommons.org/licenses/by-sa/4.0/": "CC BY-SA 4.0",
    "https://creativecommons.org/licenses/by-nc/4.0/": "CC BY-NC 4.0",
    "https://creativecommons.org/licenses/by-nc-sa/4.0/": "CC BY-NC-SA 4.0",
    "https://creativecommons.org/licenses/by-nc-nd/4.0/": "CC BY-NC-ND 4.0",
    "https://creativecommons.org/licenses/by-nd/4.0/": "CC BY-ND 4.0"
  };
  function licenceLabel(uri) { return LICENCE_LABELS[uri] || shortLabel(uri); }
  function doiLabel(uri) { return /doi\.org\//.test(uri) ? uri.replace(/^https?:\/\/(dx\.)?doi\.org\//, "doi:") : shortLabel(uri); }

  var DS_PAGE = 40;
  var datasetsCache = null;

  // Every dataset in one query (~0.5s, ~400 rows): multi-valued fields come
  // back GROUP_CONCAT'ed with unit/record separators, split again here.
  function fetchDatasets() {
    if (datasetsCache) return Promise.resolve(datasetsCache);
    var US = "\\u001f", RS = "\\u001e";
    var q = "PREFIX schema: <https://schema.org/>\n" +
      "PREFIX iisgv: <https://iisg.amsterdam/vocab/>\n" +
      "SELECT ?d (SAMPLE(?n) AS ?name) (SAMPLE(?desc) AS ?description) (SAMPLE(?id) AS ?identifier)\n" +
      "  (SAMPLE(?pubName) AS ?publisher) (SAMPLE(?cpName) AS ?contact) (SAMPLE(?lic) AS ?license)\n" +
      "  (SAMPLE(?dp) AS ?published) (SAMPLE(?dc) AS ?created) (SAMPLE(?tc) AS ?temporal)\n" +
      "  (SAMPLE(?lp) AS ?landing) (SAMPLE(?free0) AS ?free)\n" +
      "  (GROUP_CONCAT(DISTINCT ?crName; separator=\"" + US + "\") AS ?creators)\n" +
      "  (GROUP_CONCAT(DISTINCT ?kw; separator=\"" + US + "\") AS ?keywords)\n" +
      "  (GROUP_CONCAT(DISTINCT CONCAT(STR(?cat), \"" + RS + "\", ?catName); separator=\"" + US + "\") AS ?catalogs)\n" +
      "  (GROUP_CONCAT(DISTINCT ?placeName; separator=\"" + US + "\") AS ?places)\n" +
      "  (GROUP_CONCAT(DISTINCT STR(?lang); separator=\"" + US + "\") AS ?languages)\n" +
      "WHERE { GRAPH " + iriRef(DATAVERSE_GRAPH) + " {\n" +
      "  ?d a schema:Dataset ; schema:name ?n .\n" +
      "  OPTIONAL { ?d schema:description ?desc }\n" +
      "  OPTIONAL { ?d schema:identifier ?id }\n" +
      "  OPTIONAL { ?d schema:publisher ?pub . ?pub schema:name ?pubName }\n" +
      "  OPTIONAL { ?d schema:contactPoint ?cp . ?cp schema:name ?cpName }\n" +
      "  OPTIONAL { ?d schema:license ?lic }\n" +
      "  OPTIONAL { ?d schema:datePublished ?dp }\n" +
      "  OPTIONAL { ?d schema:dateCreated ?dc }\n" +
      "  OPTIONAL { ?d schema:temporalCoverage ?tc }\n" +
      "  OPTIONAL { ?d iisgv:nativeViewer ?lp }\n" +
      "  OPTIONAL { ?d schema:isAccessibleForFree ?free0 }\n" +
      "  OPTIONAL { ?d schema:creator ?cr . ?cr schema:name ?crName }\n" +
      "  OPTIONAL { ?d schema:keywords ?kw }\n" +
      "  OPTIONAL { ?d schema:includedInDataCatalog ?cat . ?cat schema:name ?catName }\n" +
      "  OPTIONAL { ?d schema:spatialCoverage ?pl . ?pl schema:name ?placeName }\n" +
      "  OPTIONAL { ?d schema:inLanguage ?lang }\n" +
      "} } GROUP BY ?d";
    var filesQ = "PREFIX schema: <https://schema.org/>\n" +
      "SELECT ?d (COUNT(?f) AS ?files) WHERE { GRAPH " + iriRef(DATAVERSE_GRAPH) + " { ?d a schema:Dataset ; schema:distribution ?f } } GROUP BY ?d";
    return Promise.all([sparql(q), sparql(filesQ).catch(function () { return []; })]).then(function (res) {
      var files = {};
      res[1].forEach(function (r) { files[r.d.value] = parseInt(r.files.value, 10); });
      // Deduplicated again here: the same name with two language tags is
      // two distinct values to GROUP_CONCAT(DISTINCT ...).
      var split = function (r, k) {
        var seen = {};
        return (r[k] && r[k].value ? r[k].value.split("\u001f") : []).filter(function (x) {
          if (!x || seen[x]) return false;
          seen[x] = true;
          return true;
        });
      };
      var v = function (r, k) { return r[k] ? r[k].value : null; };
      datasetsCache = res[0].map(function (r) {
        var subjects = [], keywords = [];
        split(r, "keywords").forEach(function (k) {
          if (DATAVERSE_SUBJECTS.indexOf(k) !== -1) { subjects.push(k); return; }
          // Some keyword values arrive as one comma-joined string.
          k.split(/\s*,\s*/).forEach(function (part) { if (part && keywords.indexOf(part) === -1) keywords.push(part); });
        });
        return {
          uri: r.d.value,
          name: tidyTitle(v(r, "name")),
          description: (v(r, "description") || "").replace(/<br\s*\/?>/gi, " ").replace(/<\/?[a-z][^>]*>/gi, ""),
          identifier: v(r, "identifier"),
          publisher: v(r, "publisher"),
          contact: v(r, "contact"),
          license: v(r, "license"),
          published: v(r, "published"),
          created: v(r, "created"),
          temporal: v(r, "temporal"),
          landing: v(r, "landing"),
          free: v(r, "free"),
          creators: split(r, "creators").map(tidyName).filter(function (c, i, a) { return a.indexOf(c) === i; }),
          subjects: subjects,
          keywords: keywords,
          catalogs: split(r, "catalogs").map(function (c) { var p = c.split("\u001e"); return { uri: p[0], name: p[1] }; }),
          places: split(r, "places"),
          languages: split(r, "languages"),
          files: files[r.d.value] || 0
        };
      });
      return datasetsCache;
    });
  }

  function hasDcatValue(ds, key) {
    if (!key) return false;
    var val = ds[key];
    return Array.isArray(val) ? val.length > 0 : !!val;
  }

  function dcatCoverageRow(def, datasets) {
    var n = def.key === "keywords"
      ? datasets.filter(function (d) { return d.keywords.length || d.subjects.length; }).length
      : datasets.filter(function (d) { return hasDcatValue(d, def.key); }).length;
    var total = datasets.length;
    var cls = n === 0 ? "none" : (n < total || def.partial ? "partial" : "full");
    var bar = el("span", {});
    bar.style.width = (total ? Math.round(100 * n / total) : 0) + "%";
    return el("div", { class: "dcat-row " + cls, title: def.note || "" }, [
      el("span", { class: "k", text: def.label }),
      el("span", { class: "n", text: fmtNum(n) + " / " + fmtNum(total) }),
      el("span", { class: "dcat-bar" }, [bar]),
      el("span", { class: "map", text: def.dcat + "  ←  " + (def.sdo || "not in the data") })
    ]);
  }

  function dcatPanelEl(datasets) {
    var panel = el("div", { class: "dcat-panel" });
    panel.appendChild(el("h2", { text: "DCAT-AP-NL 3.0 · mandatory properties" }));
    var intro = el("p", {});
    intro.appendChild(document.createTextNode("How many datasets the graph describes each mandatory property of the Dutch "));
    intro.appendChild(el("a", { href: DCAT_SPEC_URL, target: "_blank", rel: "noopener", text: "DCAT application profile" }));
    intro.appendChild(document.createTextNode(" for, matched to the schema.org dataverse-etl writes. Hover a row for notes."));
    panel.appendChild(intro);
    var rows = el("div", { class: "dcat-rows" });
    DCAT_DATASET_MANDATORY.forEach(function (def) { rows.appendChild(dcatCoverageRow(def, datasets)); });
    panel.appendChild(rows);
    var more = el("details", {}, [el("summary", { text: "Recommended properties" })]);
    var rec = el("div", { class: "dcat-rows" });
    DCAT_DATASET_RECOMMENDED.forEach(function (def) { rec.appendChild(dcatCoverageRow(def, datasets)); });
    more.appendChild(rec);
    panel.appendChild(more);
    return panel;
  }

  function datasetCardEl(ds) {
    var card = el("article", { class: "ds-card", style: "--card-color: " + graphInfo(DATAVERSE_GRAPH).color });
    var title = el("button", { class: "ttl", type: "button", text: ds.name });
    title.addEventListener("click", function () { navigate(ds.uri); });
    card.appendChild(title);

    var meta = [];
    if (ds.creators.length) meta.push(ds.creators.slice(0, 3).join("; ") + (ds.creators.length > 3 ? " et al." : ""));
    if (ds.publisher) meta.push(ds.publisher);
    var date = ds.published || ds.created;
    if (date) meta.push(date.slice(0, 4));
    if (ds.files) meta.push(fmtNum(ds.files) + (ds.files === 1 ? " file" : " files"));
    card.appendChild(el("div", { class: "meta", text: meta.join(" · ") }));
    if (ds.description) card.appendChild(el("p", { class: "desc", text: ds.description }));

    var chips = el("div", { class: "ds-chips" });
    ds.subjects.forEach(function (s) { chips.appendChild(el("span", { class: "ds-chip subject", text: s })); });
    ds.keywords.slice(0, 5).forEach(function (k) { chips.appendChild(el("span", { class: "ds-chip", text: k })); });
    ds.places.slice(0, 3).forEach(function (p) { chips.appendChild(el("span", { class: "ds-chip", text: "○ " + p })); });
    if (ds.temporal) chips.appendChild(el("span", { class: "ds-chip", text: ds.temporal.replace("/", "–") }));
    if (chips.childNodes.length) card.appendChild(chips);

    var foot = el("div", { class: "ds-foot" });
    if (ds.license) foot.appendChild(el("span", { class: "ds-licence", text: licenceLabel(ds.license) }));
    if (ds.free === "false") foot.appendChild(el("span", { class: "media-note", text: "Restricted access" }));
    if (ds.identifier && isSafeHref(ds.identifier)) {
      foot.appendChild(el("a", { href: ds.identifier, target: "_blank", rel: "noopener", text: ds.identifier.replace(/^https?:\/\/(dx\.)?doi\.org\//, "doi:") }));
    }
    if (ds.contact) foot.appendChild(el("span", { text: "Contact: " + ds.contact }));
    card.appendChild(foot);
    return card;
  }

  function optionEl(value, text) { var o = el("option", { value: value, text: text }); return o; }

  // Distinct values of one facet, most frequent first, as <option>s.
  function facetSelect(label, datasets, valuesOf, display) {
    var counts = {};
    datasets.forEach(function (d) { valuesOf(d).forEach(function (v) { counts[v] = (counts[v] || 0) + 1; }); });
    var sel = el("select", { "aria-label": label });
    sel.appendChild(optionEl("", label + ": all"));
    Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a] || (a < b ? -1 : 1); }).forEach(function (v) {
      sel.appendChild(optionEl(v, (display ? display(v) : v) + " (" + counts[v] + ")"));
    });
    return sel;
  }

  function renderDatasetsView() {
    currentUri = null;
    renderTrail();
    clear(mainEl);
    var gen = viewGeneration;
    var wrap = el("div", { class: "ds-view" });
    wrap.appendChild(el("p", { class: "landing-eyebrow", text: "dataverse-etl · research datasets" }));
    wrap.appendChild(el("h1", { text: "Datasets" }));
    var lead = el("p", { class: "ds-lead", text: "Loading datasets…" });
    wrap.appendChild(lead);
    mainEl.appendChild(wrap);

    fetchDatasets().then(function (all) {
      if (gen !== viewGeneration) return;
      // A catalog every dataset is in (the Dataverse root collection)
      // can't narrow anything down -- left out of the catalog filter.
      var catCounts = {}, catNames = {};
      all.forEach(function (d) { d.catalogs.forEach(function (c) { catCounts[c.uri] = (catCounts[c.uri] || 0) + 1; catNames[c.uri] = c.name; }); });
      var catalogsOf = function (d) { return d.catalogs.map(function (c) { return c.uri; }).filter(function (u) { return catCounts[u] < all.length; }); };
      var catalogTotal = Object.keys(catCounts).filter(function (u) { return catCounts[u] < all.length; }).length;

      lead.textContent = fmtNum(all.length) + " research datasets from the IISG’s Dataverse, in " + fmtNum(catalogTotal) +
        " catalogs. Each card leads with the properties DCAT-AP-NL 3.0 makes mandatory: title, description, creator, publisher, identifier and contact point.";
      wrap.appendChild(dcatPanelEl(all));

      var text = el("input", { type: "search", placeholder: "Filter by title, description, creator, keyword…", "aria-label": "Filter datasets" });
      var catSel = facetSelect("Catalog", all, catalogsOf, function (u) { return catNames[u]; });
      var subjSel = facetSelect("Subject", all, function (d) { return d.subjects; });
      var placeSel = facetSelect("Place", all, function (d) { return d.places; });
      var licSel = facetSelect("Licence", all, function (d) { return d.license ? [d.license] : []; }, licenceLabel);
      var sortSel = el("select", { "aria-label": "Sort" }, [
        optionEl("newest", "Newest first"), optionEl("oldest", "Oldest first"), optionEl("title", "Title A–Z"), optionEl("files", "Most files")
      ]);
      var randomBtn = el("button", { class: "landing-btn ghost", type: "button", text: "Random dataset" });
      wrap.appendChild(el("div", { class: "ds-toolbar" }, [text, catSel, subjSel, placeSel, licSel, sortSel, randomBtn]));
      var count = el("div", { class: "ds-count", "aria-live": "polite" });
      var list = el("div", { class: "ds-list" });
      var moreWrap = el("div", { class: "ds-more" });
      wrap.appendChild(count);
      wrap.appendChild(list);
      wrap.appendChild(moreWrap);

      var shown = DS_PAGE, matches = [];
      function haystack(d) {
        if (!d._hay) d._hay = [d.name, d.description, d.creators.join(" "), d.keywords.join(" "), d.subjects.join(" "), d.places.join(" "), d.publisher || ""].join(" ").toLowerCase();
        return d._hay;
      }
      function apply(resetPage) {
        if (resetPage) shown = DS_PAGE;
        var t = text.value.trim().toLowerCase();
        matches = all.filter(function (d) {
          if (t && haystack(d).indexOf(t) === -1) return false;
          if (catSel.value && catalogsOf(d).indexOf(catSel.value) === -1) return false;
          if (subjSel.value && d.subjects.indexOf(subjSel.value) === -1) return false;
          if (placeSel.value && d.places.indexOf(placeSel.value) === -1) return false;
          if (licSel.value && d.license !== licSel.value) return false;
          return true;
        });
        var dateOf = function (d) { return d.published || d.created || ""; };
        var sorters = {
          newest: function (a, b) { return dateOf(b) < dateOf(a) ? -1 : dateOf(b) > dateOf(a) ? 1 : 0; },
          oldest: function (a, b) { return dateOf(a) < dateOf(b) ? -1 : dateOf(a) > dateOf(b) ? 1 : 0; },
          title: function (a, b) { return a.name.localeCompare(b.name); },
          files: function (a, b) { return b.files - a.files; }
        };
        matches.sort(sorters[sortSel.value]);
        clear(list);
        matches.slice(0, shown).forEach(function (d) { list.appendChild(datasetCardEl(d)); });
        clear(count);
        var filtered = matches.length !== all.length;
        count.appendChild(document.createTextNode(fmtNum(matches.length) + (filtered ? " of " + fmtNum(all.length) : "") + " datasets"));
        if (filtered) {
          count.appendChild(document.createTextNode(" · "));
          var reset = el("button", { type: "button", text: "clear filters" });
          reset.addEventListener("click", function () {
            text.value = ""; catSel.value = ""; subjSel.value = ""; placeSel.value = ""; licSel.value = "";
            apply(true);
          });
          count.appendChild(reset);
        }
        clear(moreWrap);
        if (matches.length > shown) {
          var more = el("button", { class: "landing-btn ghost", type: "button", text: "Show " + fmtNum(Math.min(DS_PAGE, matches.length - shown)) + " more" });
          more.addEventListener("click", function () { shown += DS_PAGE; apply(false); });
          moreWrap.appendChild(more);
        }
      }
      var typing = null;
      text.addEventListener("input", function () { clearTimeout(typing); typing = setTimeout(function () { apply(true); }, 150); });
      [catSel, subjSel, placeSel, licSel, sortSel].forEach(function (s) { s.addEventListener("change", function () { apply(true); }); });
      randomBtn.addEventListener("click", function () {
        var pool = matches.length ? matches : all;
        navigate(pool[Math.floor(Math.random() * pool.length)].uri);
      });
      apply(true);
    }).catch(function (err) {
      if (gen !== viewGeneration) return;
      clear(mainEl);
      renderError("Couldn’t load datasets: " + err.message, renderDatasetsView);
    });
  }

  // Dataset record page: the hero facts regrouped by DCAT-AP-NL 3.0
  // obligation -- Mandatory (missing ones shown as such, dashed), then
  // Recommended (only what's there), then whatever else DATASET_FIELDS
  // covers. Title and description stay where every view puts them (the
  // header and the text blocks below).
  function renderDcatDatasetFacts(outByPred) {
    var box = el("div", {});
    var used = {};
    function group(def, rows) {
      var g = null;
      if (rows && rows.length && def.display) {
        // External URLs (DOI, licence) read better as "doi:10.…" or
        // "CC BY 4.0" than as the generic last-path-segment label.
        g = el("div", { class: "hero-group" }, [el("h3", { text: def.label })]);
        rows.forEach(function (r) {
          var url = r.o.type === "uri" ? r.o.value : literalUrl(r.o);
          var val = el("div", { class: "hero-fact-val" });
          if (url && isSafeHref(url)) val.appendChild(el("a", { href: url, target: "_blank", rel: "noopener", text: def.display(url) + " \u2197" }));
          else val.textContent = r.o.value;
          g.appendChild(val);
        });
      } else if (rows && rows.length) {
        g = renderHeroGroup({ heading: def.label, kind: def.kind }, rows);
      }
      if (!g) {
        g = el("div", { class: "hero-group missing", title: def.note || "" }, [
          el("h3", { text: def.label }),
          el("div", { class: "hero-fact-val", text: "Not in the data" })
        ]);
      }
      g.querySelector("h3").appendChild(el("span", { class: "dcat-pred", text: def.dcat }));
      return g;
    }

    box.appendChild(el("div", { class: "dcat-group-heading" }, [
      document.createTextNode("DCAT-AP-NL 3.0 · Mandatory"),
      el("span", { text: "title and description shown above and below" })
    ]));
    var mand = el("div", { class: "hero-grid" });
    DCAT_DATASET_MANDATORY.forEach(function (def) {
      if (def.shownElsewhere) return;
      if (def.pred) used[def.pred] = true;
      mand.appendChild(group(def, def.pred ? outByPred[def.pred] : null));
    });
    box.appendChild(mand);

    var rec = el("div", { class: "hero-grid" });
    DCAT_DATASET_RECOMMENDED.forEach(function (def) {
      used[def.pred] = true;
      var rows = outByPred[def.pred];
      if (rows && rows.length) rec.appendChild(group(def, rows));
    });
    if (rec.childNodes.length) {
      box.appendChild(el("div", { class: "dcat-group-heading", text: "DCAT-AP-NL 3.0 · Recommended" }));
      box.appendChild(rec);
    }

    var other = el("div", { class: "hero-grid" });
    DATASET_FIELDS.forEach(function (f) {
      if (used[f.pred]) return;
      var rows = outByPred[f.pred];
      if (rows && rows.length) other.appendChild(renderHeroGroup(f, rows));
    });
    if (other.childNodes.length) {
      box.appendChild(el("div", { class: "dcat-group-heading", text: "Other" }));
      box.appendChild(other);
    }
    return box;
  }

  // ---------- Landing page (view:home) ----------
  // What a first-time visitor sees on the bare site: what the Knowledge
  // Base is, where to start, what links outward (Wikidata, RKD), the
  // monitoring views, and where to query the data directly. Live numbers
  // come from the last nightly run (fetchRunHistory) -- one small JSON
  // fetch, no SPARQL -- so the page is instant even on a cold store.
  var LANDING_EXPLORE = [
    { view: "archive", title: "Archives", desc: "Archival collections and their finding aids, from fonds down to single files.", graph: "https://iisg.amsterdam/graph/archive" },
    { view: "books", title: "Books & serials", desc: "The library catalogue: books, periodicals, posters, audio and video.", graph: "https://iisg.amsterdam/graph/biblio" },
    { view: "person", title: "Persons & organizations", desc: "Who created, is depicted in, or is written about in the collections.", graph: "https://iisg.amsterdam/graph/authority" },
    { view: "events", title: "Events@IISG", desc: "Talks, exhibitions and conferences at the institute, newest first.", graph: "https://iisg.amsterdam/graph/events" }
  ];

  var LANDING_LINKS = [
    { href: "https://kg.zijdeman.nl", title: "Query the Knowledge Graph", desc: "SPARQL against the QLever store, with autocompletion.", url: "kg.zijdeman.nl" },
    { href: "https://graphs.zijdeman.nl", title: "APIs", desc: "Programmatic access to the named graphs.", url: "graphs.zijdeman.nl" },
    { href: "https://github.com/knaw-iisg/", title: "Source code", desc: "All pipelines and this viewer, MIT licensed.", url: "github.com/knaw-iisg" }
  ];

  function landingSectionEl(heading) {
    var s = el("div", { class: "dash-section" });

    return s;
  }

  function landingStatEl(n, label) {

      el("span", { class: "n", text: n }),
      el("span", { class: "lbl", text: label })
    ]);
  }

  // Ready-to-run examples for the QLever UI at kg.zijdeman.nl, whose
  // ?query= parameter prefills its editor.
  var QLEVER_UI = "https://kg.zijdeman.nl/iisg-kg";
  var LANDING_QUERIES = [
    {
      title: "How big is each graph?",
      desc: "Triples per named graph — one graph per source pipeline.",
      query: "SELECT ?graph (COUNT(*) AS ?triples) WHERE {\n  GRAPH ?graph { ?s ?p ?o }\n}\nGROUP BY ?graph\nORDER BY DESC(?triples)"
    },
    {

      desc: "Persons who are the subject of the most works in the collections.",
      query: "PREFIX sdo: <https://schema.org/>\nSELECT ?person (SAMPLE(?n) AS ?name) (COUNT(DISTINCT ?work) AS ?works) WHERE {\n  ?work sdo:about ?person .\n  ?person a sdo:Person .\n  OPTIONAL { ?person sdo:name ?n }\n}\nGROUP BY ?person\nORDER BY DESC(?works)\nLIMIT 50"
    },
    {
      title: "IISG persons on Wikidata",
      desc: "Our authority records linked to a Wikidata item via the identity graph.",
      query: "PREFIX sdo: <https://schema.org/>\nSELECT ?person (SAMPLE(?n) AS ?name) ?wikidata WHERE {\n  GRAPH <https://iisg.amsterdam/graph/identity> {\n    ?person sdo:sameAs ?hub .\n    ?hub sdo:sameAs ?wikidata .\n    FILTER(STRSTARTS(STR(?wikidata), \"https://www.wikidata.org/\"))\n  }\n  ?person a sdo:Person .\n  OPTIONAL { ?person sdo:name ?n }\n}\nGROUP BY ?person ?wikidata\nLIMIT 100"
    },
    {
      title: "Archives updated most recently",
      desc: "Archival collections, newest description first.",
      query: "PREFIX sdo: <https://schema.org/>\nSELECT ?archive ?name ?updated WHERE {\n  GRAPH <https://iisg.amsterdam/graph/archive> {\n    ?archive sdo:sdDatePublished ?updated .\n    OPTIONAL { ?archive sdo:name ?name }\n  }\n}\nORDER BY DESC(?updated)\nLIMIT 25"
    }
  ];

  function exampleQueryEl(q) {
    var card = el("div", { class: "landing-query" });
    card.appendChild(el("div", { class: "t", text: q.title }));
    card.appendChild(el("div", { class: "d", text: q.desc }));
    var details = el("details");
    details.appendChild(el("summary", { text: "Show SPARQL" }));
    details.appendChild(el("pre", { text: q.query }));

    card.appendChild(el("a", {
      class: "landing-btn ghost",

    }));
    return card;
